name: velvet-librarian

services:
  ollama-librarian:
    image: ${STORAGE_LIBRARIAN_OLLAMA_IMAGE:-ollama/ollama:0.32.3}
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: ${STORAGE_LIBRARIAN_OLLAMA_KEEP_ALIVE:-5m}
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    volumes:
      - librarian-ollama:/root/.ollama
      - ./Modelfile.text:/bootstrap/Modelfile.text:ro
      - ./Modelfile.vision:/bootstrap/Modelfile.vision:ro
    tmpfs:
      - /tmp:size=256m,mode=1777
    mem_limit: ${STORAGE_LIBRARIAN_OLLAMA_MEMORY_LIMIT:-14g}
    cpus: ${STORAGE_LIBRARIAN_OLLAMA_CPU_LIMIT:-6.0}
    pids_limit: 256
    shm_size: 1g
    healthcheck:
      test:
        - CMD
        - ollama
        - list
      interval: 20s
      timeout: 10s
      retries: 12
      start_period: 60s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - velvet-backend

  librarian-hermes:
    image: ${HERMES_IMAGE:-nousresearch/hermes-agent@sha256:f7b35053268f532f98955195c909f15a230470fbcbdacaa9fdecb95707dad04a}
    restart: unless-stopped
    command: ["gateway", "run"]
    depends_on:
      ollama-librarian:
        condition: service_healthy
    env_file:
      - ${HERMES_ENV_FILE:-/srv/velvet/.env.hermes}
    environment:
      TELEGRAM_BOT_TOKEN: ""
      TELEGRAM_ALLOWED_USERS: ""
      GH_TOKEN: ""
      OPENAI_API_KEY: ollama
      OPENAI_BASE_URL: ${STORAGE_LIBRARIAN_OLLAMA_BASE_URL:-http://ollama-librarian:11434}/v1
      OPENROUTER_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      GOOGLE_API_KEY: ""
      GEMINI_API_KEY: ""
      XAI_API_KEY: ""
      TOGETHER_API_KEY: ""
      FIREWORKS_API_KEY: ""
      NOUS_API_KEY: ""
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: 0.0.0.0
      API_SERVER_PORT: "8642"
      API_SERVER_KEY: ${STORAGE_LIBRARIAN_HERMES_API_KEY:?STORAGE_LIBRARIAN_HERMES_API_KEY must be set}
      API_SERVER_MODEL_NAME: velvet-librarian
      API_SERVER_CORS_ORIGINS: ""
      HERMES_DASHBOARD: "0"
      HERMES_MAX_ITERATIONS: "3"
      HERMES_YOLO_MODE: "0"
      HERMES_ACCEPT_HOOKS: "0"
      HERMES_API_TIMEOUT: ${STORAGE_LIBRARIAN_RUN_TIMEOUT_SECONDS:-180}
    volumes:
      - ${VELVET_DATA_DIR:-/srv/velvet/data}/hermes-librarian:/opt/data
    tmpfs:
      - /tmp:size=128m,mode=1777
    mem_limit: ${STORAGE_LIBRARIAN_HERMES_MEMORY_LIMIT:-2g}
    cpus: ${STORAGE_LIBRARIAN_HERMES_CPU_LIMIT:-1.0}
    pids_limit: 128
    shm_size: 512m
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8642/health', timeout=3).read()
      interval: 20s
      timeout: 5s
      retries: 4
      start_period: 60s
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    networks:
      - velvet-backend

  arthur-storage-gateway:
    image: ${VELVET_IMAGE:-velvet-bot:local}
    profiles: ["arthur"]
    restart: unless-stopped
    init: true
    user: "10001:10001"
    command: ["python", "scripts/run_arthur_storage_gateway.py"]
    environment:
      BOT_TOKEN: ${BOT_TOKEN:-}
      DATABASE_URL: ${DATABASE_URL:-}
      ARTHUR_STORAGE_GATEWAY_API_KEY: ${ARTHUR_STORAGE_GATEWAY_API_KEY:-}
      ARTHUR_STORAGE_GATEWAY_HOST: 0.0.0.0
      ARTHUR_STORAGE_GATEWAY_PORT: "8786"
      STORAGE_LIBRARIAN_MAX_OBJECT_BYTES: ${STORAGE_LIBRARIAN_MAX_OBJECT_BYTES:-16777216}
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8786/health', timeout=3).read()
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 30s
    stop_grace_period: 30s
    mem_limit: ${ARTHUR_STORAGE_GATEWAY_MEMORY_LIMIT:-512m}
    cpus: ${ARTHUR_STORAGE_GATEWAY_CPU_LIMIT:-0.5}
    pids_limit: 128
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - velvet-backend

  arthur:
    image: ${VELVET_IMAGE:-velvet-bot:local}
    profiles: ["arthur"]
    restart: unless-stopped
    init: true
    user: "10001:10001"
    command: ["python", "scripts/run_arthur_librarian.py"]
    depends_on:
      ollama-librarian:
        condition: service_healthy
      librarian-hermes:
        condition: service_healthy
      arthur-storage-gateway:
        condition: service_healthy
    environment:
      ARTHUR_BOT_TOKEN: ${ARTHUR_BOT_TOKEN:-}
      ARTHUR_ALLOWED_USER_IDS: ${ARTHUR_ALLOWED_USER_IDS:-}
      ARTHUR_ALLOWED_USERNAMES: ${ARTHUR_ALLOWED_USERNAMES:-}
      ARTHUR_DATA_DIR: /app/runtime/arthur
      ARTHUR_HEARTBEAT_PATH: /tmp/arthur-heartbeat
      ARTHUR_REPORT_CHAT_ID: ${ARTHUR_REPORT_CHAT_ID:-}
      ARTHUR_REPORT_THREAD_ID: ${ARTHUR_REPORT_THREAD_ID:-}
      ARTHUR_STORAGE_GATEWAY_BASE_URL: http://arthur-storage-gateway:8786
      ARTHUR_STORAGE_GATEWAY_API_KEY: ${ARTHUR_STORAGE_GATEWAY_API_KEY:-}
      DATABASE_URL: ${DATABASE_URL:-}
      STORAGE_LIBRARIAN_ENABLED: ${STORAGE_LIBRARIAN_ENABLED:-false}
      STORAGE_LIBRARIAN_AUTO_ENQUEUE: "false"
      STORAGE_LIBRARIAN_HERMES_BASE_URL: http://librarian-hermes:8642
      STORAGE_LIBRARIAN_HERMES_API_KEY: ${STORAGE_LIBRARIAN_HERMES_API_KEY:-}
      STORAGE_LIBRARIAN_OLLAMA_BASE_URL: http://ollama-librarian:11434
      STORAGE_LIBRARIAN_TEXT_MODEL: ${STORAGE_LIBRARIAN_TEXT_MODEL:-velvet-librarian-text:v1}
      STORAGE_LIBRARIAN_TEXT_CONTEXT_LENGTH: ${STORAGE_LIBRARIAN_TEXT_CONTEXT_LENGTH:-8192}
      STORAGE_LIBRARIAN_TEXT_MAX_OUTPUT_TOKENS: ${STORAGE_LIBRARIAN_TEXT_MAX_OUTPUT_TOKENS:-384}
      STORAGE_LIBRARIAN_OLLAMA_KEEP_ALIVE: ${STORAGE_LIBRARIAN_OLLAMA_KEEP_ALIVE:-5m}
      STORAGE_LIBRARIAN_RUN_TIMEOUT_SECONDS: ${STORAGE_LIBRARIAN_RUN_TIMEOUT_SECONDS:-180}
      STORAGE_LIBRARIAN_MAX_OBJECT_BYTES: ${STORAGE_LIBRARIAN_MAX_OBJECT_BYTES:-16777216}
      STORAGE_LIBRARIAN_MAX_TEXT_CHARS: ${STORAGE_LIBRARIAN_MAX_TEXT_CHARS:-120000}
      STORAGE_LIBRARIAN_MAX_ZIP_ENTRIES: ${STORAGE_LIBRARIAN_MAX_ZIP_ENTRIES:-100}
      STORAGE_LIBRARIAN_MAX_ATTEMPTS: ${STORAGE_LIBRARIAN_MAX_ATTEMPTS:-3}
      STORAGE_LIBRARIAN_ANALYZER_VERSION: ${STORAGE_LIBRARIAN_ANALYZER_VERSION:-velvet-librarian:qwen3-4b-text:v4}
      STORAGE_LIBRARIAN_ALLOWED_KINDS: ${STORAGE_LIBRARIAN_ALLOWED_KINDS:-diagnostics,codex,rework,inbox,exports,releases}
    volumes:
      - ${VELVET_DATA_DIR:-/srv/velvet/data}/arthur:/app/runtime/arthur
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import os,time; p='/tmp/arthur-heartbeat'; raise SystemExit(0 if os.path.exists(p) and time.time()-os.path.getmtime(p)<90 else 1)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    stop_grace_period: 45s
    mem_limit: ${ARTHUR_MEMORY_LIMIT:-768m}
    cpus: ${ARTHUR_CPU_LIMIT:-1.0}
    pids_limit: 192
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - velvet-backend

volumes:
  librarian-ollama:
    name: ${STORAGE_LIBRARIAN_OLLAMA_VOLUME:-velvet_librarian_ollama}

networks:
  velvet-backend:
    external: true
    name: velvet_backend
