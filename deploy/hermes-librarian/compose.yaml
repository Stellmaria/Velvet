name: velvet-librarian

services:
  ollama-librarian:
    image: ${STORAGE_LIBRARIAN_OLLAMA_IMAGE:-ollama/ollama:0.32.3}
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: ${STORAGE_LIBRARIAN_OLLAMA_KEEP_ALIVE:-30m}
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    volumes:
      - librarian-ollama:/root/.ollama
      - ./Modelfile:/bootstrap/Modelfile:ro
    tmpfs:
      - /tmp:size=256m,mode=1777
    mem_limit: ${STORAGE_LIBRARIAN_OLLAMA_MEMORY_LIMIT:-14g}
    cpus: ${STORAGE_LIBRARIAN_OLLAMA_CPU_LIMIT:-6.0}
    pids_limit: 256
    shm_size: 1g
    healthcheck:
      test:
        - CMD
        - ollama
        - list
      interval: 20s
      timeout: 10s
      retries: 12
      start_period: 60s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - velvet-backend

  librarian-hermes:
    image: ${HERMES_IMAGE:-nousresearch/hermes-agent@sha256:f7b35053268f532f98955195c909f15a230470fbcbdacaa9fdecb95707dad04a}
    restart: unless-stopped
    command: ["gateway", "run"]
    depends_on:
      ollama-librarian:
        condition: service_healthy
    env_file:
      - ${HERMES_ENV_FILE:-/srv/velvet/.env.hermes}
    environment:
      TELEGRAM_BOT_TOKEN: ""
      TELEGRAM_ALLOWED_USERS: ""
      GH_TOKEN: ""
      OPENAI_API_KEY: ollama
      OPENAI_BASE_URL: ${STORAGE_LIBRARIAN_LOCAL_BASE_URL:-http://ollama-librarian:11434/v1}
      OPENROUTER_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      GOOGLE_API_KEY: ""
      GEMINI_API_KEY: ""
      XAI_API_KEY: ""
      TOGETHER_API_KEY: ""
      FIREWORKS_API_KEY: ""
      NOUS_API_KEY: ""
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: 0.0.0.0
      API_SERVER_PORT: "8642"
      API_SERVER_KEY: ${STORAGE_LIBRARIAN_HERMES_API_KEY:?STORAGE_LIBRARIAN_HERMES_API_KEY must be set}
      API_SERVER_MODEL_NAME: velvet-librarian
      API_SERVER_CORS_ORIGINS: ""
      HERMES_DASHBOARD: "0"
      HERMES_MAX_ITERATIONS: "3"
      HERMES_YOLO_MODE: "0"
      HERMES_ACCEPT_HOOKS: "0"
      HERMES_API_TIMEOUT: ${STORAGE_LIBRARIAN_RUN_TIMEOUT_SECONDS:-900}
    volumes:
      - ${VELVET_DATA_DIR:-/srv/velvet/data}/hermes-librarian:/opt/data
    tmpfs:
      - /tmp:size=128m,mode=1777
    mem_limit: ${STORAGE_LIBRARIAN_HERMES_MEMORY_LIMIT:-2g}
    cpus: ${STORAGE_LIBRARIAN_HERMES_CPU_LIMIT:-1.0}
    pids_limit: 128
    shm_size: 512m
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8642/health', timeout=3).read()
      interval: 20s
      timeout: 5s
      retries: 4
      start_period: 60s
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    networks:
      - velvet-backend

volumes:
  librarian-ollama:
    name: ${STORAGE_LIBRARIAN_OLLAMA_VOLUME:-velvet_librarian_ollama}

networks:
  velvet-backend:
    external: true
    name: velvet_backend
