name: hermes-coders

x-hermes-coder: &hermes-coder
  build:
    context: .
    dockerfile: Dockerfile.coder
  restart: unless-stopped
  command: ["gateway", "run"]
  working_dir: /workspace
  environment:
    HERMES_UID: ${HERMES_UID:-10000}
    HERMES_GID: ${HERMES_GID:-10000}
    HERMES_WRITE_SAFE_ROOT: /workspace
    API_SERVER_ENABLED: "true"
    API_SERVER_HOST: 0.0.0.0
    API_SERVER_PORT: "8642"
    API_SERVER_CORS_ORIGINS: ""
    HERMES_DASHBOARD: "0"
  tmpfs:
    - /tmp:size=512m,mode=1777
  mem_limit: ${HERMES_CODER_MEMORY_LIMIT:-4g}
  cpus: ${HERMES_CODER_CPU_LIMIT:-2.0}
  pids_limit: 256
  shm_size: 1gb
  cap_drop:
    - ALL
  cap_add:
    - CHOWN
    - DAC_OVERRIDE
    - FOWNER
    - SETGID
    - SETUID
  security_opt:
    - no-new-privileges:true
  healthcheck:
    test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8642/health', timeout=3).read()
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 60s

x-codex-runner: &codex-runner
  build:
    context: .
    dockerfile: Dockerfile.coder
  restart: unless-stopped
  command: ["python", "/app/codex_routed_runner.py"]
  working_dir: /opt/codex-runs
  user: "${HERMES_UID:-10000}:${HERMES_GID:-10000}"
  environment:
    HOME: /opt/codex
    CODEX_HOME: /opt/codex
    CODEX_WORKSPACE: /workspace-base
    CODEX_WORKSPACE_BASE: /workspace-base
    CODEX_ISOLATED_WORKSPACE_ROOT: /opt/codex-runs/workspaces
    CODEX_RUN_ROOT: /opt/codex-runs
    CODEX_RUNNER_HOST: 0.0.0.0
    CODEX_RUNNER_PORT: "8642"
    CODEX_DEFAULT_MODEL: gpt-5.6-terra
    CODEX_ALLOWED_MODELS: gpt-5.6-luna,gpt-5.6-terra,gpt-5.6-sol
    CODEX_RUN_TIMEOUT_SECONDS: ${CODEX_RUN_TIMEOUT_SECONDS:-7200}
  read_only: true
  tmpfs:
    - /tmp:size=1g,mode=1777
  mem_limit: ${CODEX_RUNNER_MEMORY_LIMIT:-6g}
  cpus: ${CODEX_RUNNER_CPU_LIMIT:-3.0}
  pids_limit: 512
  shm_size: 1gb
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  healthcheck:
    test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8642/health', timeout=3).read()
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 30s

x-db-proxy: &db-proxy
  build:
    context: .
    dockerfile: Dockerfile.db-proxy
  restart: unless-stopped
  environment:
    DB_PROXY_UPSTREAM_HOST: postgres
    DB_PROXY_UPSTREAM_PORT: "5432"
    DB_PROXY_LISTEN_PORT: "5432"
  read_only: true
  tmpfs:
    - /tmp:size=16m,mode=1777
  mem_limit: 64m
  cpus: 0.20
  pids_limit: 64
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

services:
  velvet-db-proxy:
    <<: *db-proxy
    image: velvet-hermes-db-proxy-velvet:local
    profiles: ["velvet"]
    networks:
      velvet-production: {}
      velvet-db:
        aliases:
          - postgres

  hermes-chat-velvet:
    <<: *hermes-coder
    image: velvet-hermes-chat-velvet:local
    profiles: ["velvet"]
    env_file:
      - ${HERMES_CODERS_ROOT:-/srv/hermes-coders}/secrets/velvet.env
      - ${HERMES_CODERS_ROOT:-/srv/hermes-coders}/secrets/velvet-db.env
    volumes:
      - ${HERMES_CODERS_ROOT:-/srv/hermes-coders}/data/velvet:/opt/data
      - ${HERMES_CODERS_ROOT:-/srv/hermes-coders}/workspaces/velvet:/workspace
    depends_on:
      velvet-db-proxy:
        condition: service_healthy
    networks:
      - egress
      - velvet-db
      - agent-control

  hermes-coder-velvet:
    <<: *codex-runner
    image: velvet-codex-coder-velvet:local
    profiles: ["velvet"]
    env_file:
      - ${HERMES_CODERS_ROOT:-/srv/hermes-coders}/secrets/velvet.env
    volumes:
      - ${HERMES_CODERS_ROOT:-/srv/hermes-coders}/codex/velvet:/opt/codex
      - ${HERMES_CODERS_ROOT:-/srv/hermes-coders}/codex-runs/velvet:/opt/codex-runs
      - ${HERMES_CODERS_ROOT:-/srv/hermes-coders}/workspaces/velvet-codex:/workspace-base:ro
    networks:
      - egress
      - agent-control

  max-db-proxy:
    <<: *db-proxy
    image: velvet-hermes-db-proxy-max:local
    profiles: ["max"]
    networks:
      max-production: {}
      max-db:
        aliases:
          - postgres

  hermes-chat-max:
    <<: *hermes-coder
    image: velvet-hermes-chat-max:local
    profiles: ["max"]
    env_file:
      - ${HERMES_CODERS_ROOT:-/srv/hermes-coders}/secrets/max.env
      - ${HERMES_CODERS_ROOT:-/srv/hermes-coders}/secrets/max-db.env
    volumes:
      - ${HERMES_CODERS_ROOT:-/srv/hermes-coders}/data/max:/opt/data
      - ${HERMES_CODERS_ROOT:-/srv/hermes-coders}/workspaces/max:/workspace
    depends_on:
      max-db-proxy:
        condition: service_healthy
    networks:
      - egress
      - max-db
      - agent-control

  hermes-coder-max:
    <<: *codex-runner
    image: velvet-codex-coder-max:local
    profiles: ["max"]
    env_file:
      - ${HERMES_CODERS_ROOT:-/srv/hermes-coders}/secrets/max.env
    volumes:
      - ${HERMES_CODERS_ROOT:-/srv/hermes-coders}/codex/max:/opt/codex
      - ${HERMES_CODERS_ROOT:-/srv/hermes-coders}/codex-runs/max:/opt/codex-runs
      - ${HERMES_CODERS_ROOT:-/srv/hermes-coders}/workspaces/max-codex:/workspace-base:ro
    networks:
      - egress
      - agent-control

networks:
  egress:
    driver: bridge
  velvet-db:
    driver: bridge
    internal: true
  max-db:
    driver: bridge
    internal: true
  agent-control:
    external: true
    name: ${HERMES_AGENT_CONTROL_NETWORK:-hermes-agent-control}
  velvet-production:
    external: true
    name: velvet_backend
  max-production:
    external: true
    name: romaticclub_default
