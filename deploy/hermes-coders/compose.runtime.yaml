services:
  hermes-chat-velvet:
    environment:
      GIT_CONFIG_GLOBAL: /opt/data/.gitconfig
      HERMES_CODEX_DELEGATE_URL: http://hermes-coder-router:8878
      HERMES_CODEX_DELEGATE_PROJECT: velvet
    volumes:
      - ./codex_delegate.py:/app/codex_delegate.py:ro

  hermes-chat-max:
    environment:
      GIT_CONFIG_GLOBAL: /opt/data/.gitconfig
      HERMES_CODEX_DELEGATE_URL: http://hermes-coder-router:8878
      HERMES_CODEX_DELEGATE_PROJECT: max
    volumes:
      - ./codex_delegate.py:/app/codex_delegate.py:ro

  hermes-coder-velvet:
    entrypoint:
      - python
      - /app/codex_context_launcher_runner.py
    command: []
    group_add:
      - "${HERMES_SANDBOX_GID:?HERMES_SANDBOX_GID is required}"
    environment:
      PYTHONPATH: /app
      HERMES_CODER_PROJECT: velvet
      CODEX_EXECUTION_BACKEND: launcher
      HERMES_SANDBOX_LAUNCHER_SOCKET: /run/hermes-sandbox/launcher.sock
      CODEX_PROVIDER_FALLBACK_ENABLED: "true"
      # Actual order is selected from immutable requested_tier.
      CODEX_PROVIDER_FALLBACK_MODELS: gpt-5.4-mini,gpt-5.6-terra,gpt-5.6-luna
      CODEX_PRIMARY_COOLDOWN_SECONDS: "1800"
      # One persistent dynamic flag gates every primary Codex attempt. A quiet
      # live quota refresh runs independently every five hours and also at the
      # provider's reported recovery timestamp.
      CODEX_AVAILABILITY_REFRESH_SECONDS: "18000"
      CODEX_IMAGE_BYESU_FALLBACK_ENABLED: "${CODEX_IMAGE_BYESU_FALLBACK_ENABLED:-false}"
      CODEX_IMAGE_BYESU_BASE_URL: "${CODEX_IMAGE_BYESU_BASE_URL:-https://byesu.com/v1}"
      CODEX_IMAGE_BYESU_TIMEOUT_SECONDS: "${CODEX_IMAGE_BYESU_TIMEOUT_SECONDS:-600}"
      # Secret interpolation is supplied only by compose_image_runtime_env.py;
      # chat/max services never declare or receive this credential.
      BYESU_MEDIA_GEN_API_KEY: "${BYESU_MEDIA_GEN_API_KEY:-}"
    volumes:
      - ./codex_runner.py:/app/codex_runner.py:ro
      - ./codex_routed_runner.py:/app/codex_routed_runner.py:ro
      - ./codex_first_runner.py:/app/codex_first_runner.py:ro
      - ./codex_first_safe_runner.py:/app/codex_first_safe_runner.py:ro
      - ./codex_provider_chain_runner.py:/app/codex_provider_chain_runner.py:ro
      - ./codex_tier_runner.py:/app/codex_tier_runner.py:ro
      - ./codex_launcher_runner.py:/app/codex_launcher_runner.py:ro
      - ./codex_availability.py:/app/codex_availability.py:ro
      - ./codex_availability_ctl.py:/app/codex_availability_ctl.py:ro
      - ./codex_image_runner.py:/app/codex_image_runner.py:ro
      - ./byesu_image_fallback.py:/app/byesu_image_fallback.py:ro
      - ./byesu_image_routing_policy.py:/app/byesu_image_routing_policy.py:ro
      - ./codex_image_limit_preflight.py:/app/codex_image_limit_preflight.py:ro
      - ./codex_image_high_res_export.py:/app/codex_image_high_res_export.py:ro
      - ./codex_context_launcher_runner.py:/app/codex_context_launcher_runner.py:ro
      - ./sandbox_launcher_client.py:/app/sandbox_launcher_client.py:ro
      - /run/hermes-sandbox/launcher.sock:/run/hermes-sandbox/launcher.sock

  hermes-coder-max:
    entrypoint:
      - python
      - /app/codex_context_launcher_runner.py
    command: []
    group_add:
      - "${HERMES_SANDBOX_GID:?HERMES_SANDBOX_GID is required}"
    environment:
      PYTHONPATH: /app
      HERMES_CODER_PROJECT: max
      CODEX_EXECUTION_BACKEND: launcher
      HERMES_SANDBOX_LAUNCHER_SOCKET: /run/hermes-sandbox/launcher.sock
      CODEX_PROVIDER_FALLBACK_ENABLED: "true"
      # Actual order is selected from immutable requested_tier.
      CODEX_PROVIDER_FALLBACK_MODELS: gpt-5.4-mini,gpt-5.6-terra,gpt-5.6-luna
      CODEX_PRIMARY_COOLDOWN_SECONDS: "1800"
      CODEX_AVAILABILITY_REFRESH_SECONDS: "18000"
      # Max imports shared image modules but has neither image provider fallback
      # nor Media Gen credential.
      CODEX_IMAGE_BYESU_FALLBACK_ENABLED: "false"
    volumes:
      - ./codex_runner.py:/app/codex_runner.py:ro
      - ./codex_routed_runner.py:/app/codex_routed_runner.py:ro
      - ./codex_first_runner.py:/app/codex_first_runner.py:ro
      - ./codex_first_safe_runner.py:/app/codex_first_safe_runner.py:ro
      - ./codex_provider_chain_runner.py:/app/codex_provider_chain_runner.py:ro
      - ./codex_tier_runner.py:/app/codex_tier_runner.py:ro
      - ./codex_launcher_runner.py:/app/codex_launcher_runner.py:ro
      - ./codex_availability.py:/app/codex_availability.py:ro
      - ./codex_availability_ctl.py:/app/codex_availability_ctl.py:ro
      - ./codex_image_runner.py:/app/codex_image_runner.py:ro
      - ./byesu_image_fallback.py:/app/byesu_image_fallback.py:ro
      - ./byesu_image_routing_policy.py:/app/byesu_image_routing_policy.py:ro
      - ./codex_image_limit_preflight.py:/app/codex_image_limit_preflight.py:ro
      - ./codex_image_high_res_export.py:/app/codex_image_high_res_export.py:ro
      - ./codex_context_launcher_runner.py:/app/codex_context_launcher_runner.py:ro
      - ./sandbox_launcher_client.py:/app/sandbox_launcher_client.py:ro
      - /run/hermes-sandbox/launcher.sock:/run/hermes-sandbox/launcher.sock
