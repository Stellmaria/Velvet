name: production VL benchmark

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type BENCHMARK to run one bounded LOCAL_MAIN benchmark on production"
        required: true
        type: string
      source_commit:
        description: "Exact 40-character main commit that must already be deployed on production"
        required: true
        type: string
      image_name:
        description: "Closed-set image basename from <VELVET_DATA_DIR>/runtime/vision-benchmark/"
        required: true
        type: string
      output_cap:
        description: "Maximum completion tokens for this run"
        required: true
        default: "512"
        type: choice
        options:
          - "384"
          - "512"
          - "768"
      rounds:
        description: "Sequential samples; keep 1 for the first production smoke"
        required: true
        default: "1"
        type: choice
        options:
          - "1"
          - "3"
          - "5"
      cold_unload:
        description: "Unload LOCAL_MAIN once before sample 1 to measure a cold start"
        required: true
        default: false
        type: boolean

concurrency:
  group: velvet-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  benchmark-local-main:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'BENCHMARK'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    steps:
      - name: Validate immutable benchmark request
        shell: bash
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          IMAGE_NAME: ${{ inputs.image_name }}
          OUTPUT_CAP: ${{ inputs.output_cap }}
          ROUNDS: ${{ inputs.rounds }}
        run: |
          set -Eeuo pipefail
          source_commit="${SOURCE_COMMIT,,}"
          if [[ ! "$source_commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "source_commit must be an exact 40-character SHA" >&2
            exit 2
          fi
          if [[ "$source_commit" != "${GITHUB_SHA,,}" ]]; then
            echo "source_commit must equal the main commit executing this workflow" >&2
            exit 2
          fi
          if [[ ! "$IMAGE_NAME" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*\.(jpg|jpeg|png|webp)$ ]]; then
            echo "image_name must be a single JPEG/PNG/WebP basename" >&2
            exit 2
          fi
          case "$OUTPUT_CAP" in
            384|512|768) ;;
            *) echo "unsupported output cap" >&2; exit 2 ;;
          esac
          case "$ROUNDS" in
            1|3|5) ;;
            *) echo "unsupported rounds value" >&2; exit 2 ;;
          esac

      - name: Validate production SSH secrets
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"

      - name: Configure SSH
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Run bounded LOCAL_MAIN benchmark
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_APP_DIR: ${{ secrets.DEPLOY_APP_DIR }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          IMAGE_NAME: ${{ inputs.image_name }}
          OUTPUT_CAP: ${{ inputs.output_cap }}
          ROUNDS: ${{ inputs.rounds }}
          COLD_UNLOAD: ${{ inputs.cold_unload }}
        run: |
          set -Eeuo pipefail
          port="${DEPLOY_PORT:-22}"
          app_dir="${DEPLOY_APP_DIR:-/srv/velvet}"
          printf -v remote_command \
            'APP_DIR=%q SOURCE_COMMIT=%q IMAGE_NAME=%q OUTPUT_CAP=%q ROUNDS=%q COLD_UNLOAD=%q bash -s' \
            "$app_dir" "$SOURCE_COMMIT" "$IMAGE_NAME" "$OUTPUT_CAP" "$ROUNDS" "$COLD_UNLOAD"
          ssh -p "$port" -o BatchMode=yes -o IdentitiesOnly=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" "$remote_command" > benchmark.json <<'REMOTE'
          set -Eeuo pipefail
          cd "$APP_DIR"

          branch="$(git symbolic-ref --short HEAD 2>/dev/null || true)"
          head="$(git rev-parse HEAD)"
          dirty="$(git status --porcelain --untracked-files=no)"
          test "$branch" = main
          test "$head" = "$SOURCE_COMMIT"
          test -z "$dirty"

          data_dir="$(python3 - <<'PY'
          from pathlib import Path

          required = {
              "AI_QUALITY_ENABLED": "false",
              "AI_VISION_QUEUE_ENABLED": "false",
              "AI_VISION_CLOUD_PRO_ENABLED": "false",
              "AI_VISION_LOCAL_UNCENSORED_ENABLED": "false",
              "AI_VISION_MODEL": "qwen3.5:9b",
              "AI_VISION_FLASH_MODEL": "qwen3.5:9b",
              "VISION_MODEL": "qwen3.5:9b",
              "VISION_MODEL_EXPECTED_DIGEST": "6488c96fa5fa",
              "VISION_MAX_CONCURRENCY": "1",
              "VISION_REQUEST_TIMEOUT_SECONDS": "300",
          }
          values: dict[str, str] = {}
          path = Path(".env.server")
          if not path.is_file() or path.is_symlink():
              raise SystemExit("production .env.server is missing or unsafe")
          for raw in path.read_text(encoding="utf-8").splitlines():
              line = raw.strip()
              if not line or line.startswith("#") or "=" not in line:
                  continue
              key, value = line.split("=", 1)
              values[key.strip()] = value.strip().strip('"').strip("'")
          for key, expected in required.items():
              actual = values.get(key, "")
              if key.endswith("_ENABLED") or key.endswith("QUEUE_ENABLED"):
                  matches = actual.casefold() == expected
              else:
                  matches = actual == expected
              if not matches:
                  raise SystemExit(f"production VL benchmark gate mismatch: {key}")
          print(values.get("VELVET_DATA_DIR") or "/srv/velvet/data")
          PY
          )"

          case "$IMAGE_NAME" in
            *[!A-Za-z0-9._-]*|.*|*/*) echo "unsafe image basename" >&2; exit 2 ;;
          esac
          case "${IMAGE_NAME,,}" in
            *.jpg|*.jpeg|*.png|*.webp) ;;
            *) echo "unsupported benchmark image extension" >&2; exit 2 ;;
          esac
          image_dir="$data_dir/runtime/vision-benchmark"
          image_path="$image_dir/$IMAGE_NAME"
          test -d "$image_dir"
          test ! -L "$image_dir"
          test -f "$image_path"
          test ! -L "$image_path"

          compose=(docker compose --env-file .env.server -f docker-compose.server.yml --profile vision)
          bot_id="$("${compose[@]}" ps -q bot)"
          runtime_id="$("${compose[@]}" ps -q vision-runtime)"
          gateway_id="$("${compose[@]}" ps -q vision-gateway)"
          test -n "$bot_id"
          test -n "$runtime_id"
          test -n "$gateway_id"
          test "$(docker inspect -f '{{.State.Running}}' "$bot_id")" = true
          test "$(docker inspect -f '{{.State.Running}}' "$runtime_id")" = true
          test "$(docker inspect -f '{{.State.Running}}' "$gateway_id")" = true

          cold_args=()
          if [[ "$COLD_UNLOAD" == true ]]; then
            cold_args+=(--cold-unload)
          fi
          python3 scripts/benchmark_vision_gateway.py \
            --endpoint http://vision-gateway:8080 \
            --request-container "$bot_id" \
            --docker-container "$runtime_id" \
            --image "$image_path" \
            --model qwen3.5:9b \
            --expected-digest 6488c96fa5fa \
            --max-output-tokens "$OUTPUT_CAP" \
            --rounds "$ROUNDS" \
            --timeout 300 \
            "${cold_args[@]}"
          REMOTE

      - name: Validate and summarize benchmark artifact
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("benchmark.json")
          payload = json.loads(path.read_text(encoding="utf-8"))
          if payload.get("model") != "qwen3.5:9b":
              raise SystemExit("unexpected benchmark model")
          digest = str(payload.get("digest") or "")
          if not digest.startswith("6488c96fa5fa"):
              raise SystemExit("unexpected benchmark model digest")
          if payload.get("max_output_tokens") not in {384, 512, 768}:
              raise SystemExit("unexpected output cap")
          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          fields = (
              "cold_latency_seconds",
              "warm_p50_seconds",
              "warm_p95_seconds",
              "success_rate",
              "failure_rate",
              "schema_validity_rate",
              "median_tokens_per_second_estimate",
              "peak_runtime_memory_bytes",
              "peak_runtime_cpu_percent",
              "peak_host_swap_used_bytes",
          )
          lines = ["## Production LOCAL_MAIN benchmark", "", f"- model: `{payload['model']}`", f"- digest: `{digest}`", f"- output cap: `{payload['max_output_tokens']}`"]
          for field in fields:
              lines.append(f"- {field}: `{payload.get(field)}`")
          summary.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Upload benchmark scorecard
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-vl-benchmark-${{ inputs.output_cap }}-${{ github.sha }}
          path: benchmark.json
          if-no-files-found: error
          retention-days: 14
