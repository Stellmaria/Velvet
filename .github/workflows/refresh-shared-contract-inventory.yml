name: temporary shared contract inventory refresh

on:
  push:
    branches:
      - agent/shared-helper-safe-edit-family

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message, '[inventory-refresh]') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/shared-helper-safe-edit-family
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Generate versioned inventory
        run: |
          python scripts/inventory_telegram_helpers.py \
            --write-json docs/shared_contract_inventory.json \
            --write-markdown docs/shared_contract_inventory.md \
            --check

      - name: Commit generated files
        run: |
          if git diff --quiet -- docs/shared_contract_inventory.json docs/shared_contract_inventory.md; then
            echo 'Inventory is already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/shared_contract_inventory.json docs/shared_contract_inventory.md
          git commit -m 'P3: refresh shared contract inventory [inventory-refresh]'
          git push origin HEAD:agent/shared-helper-safe-edit-family
