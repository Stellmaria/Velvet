name: sync GPT Image canonical ISO date

on:
  push:
    branches:
      - feat/gpt-image-2-codex

permissions:
  contents: write

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, '[canonical-date-synced]') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/gpt-image-2-codex
          fetch-depth: 0
          persist-credentials: true

      - name: Add ISO date marker
        run: |
          python - <<'PY'
          from pathlib import Path

          anchor = "## Срез feature-ветки GPT Image 2 от 5 августа 2026 года\n"
          dated = anchor + "\nДата среза: `2026-08-05`.\n"
          for name in (
              "docs/development_status.md",
              "docs/project_memory.md",
              "docs/ARCHITECTURE_AUDIT.md",
          ):
              path = Path(name)
              text = path.read_text(encoding="utf-8")
              if "Дата среза: `2026-08-05`." in text:
                  continue
              if text.count(anchor) != 1:
                  raise SystemExit(f"GPT Image architecture section missing in {name}")
              path.write_text(text.replace(anchor, dated), encoding="utf-8")
          PY

      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/sync-gpt-image-canonical-date.yml
          git config user.name "Velvet Docs Bot"
          git config user.email "velvet-docs@users.noreply.github.com"
          git add docs/development_status.md \
                  docs/project_memory.md \
                  docs/ARCHITECTURE_AUDIT.md \
                  .github/workflows/sync-gpt-image-canonical-date.yml
          git commit -m "docs: sync GPT Image ISO date [canonical-date-synced]"
          git push origin HEAD:feat/gpt-image-2-codex
