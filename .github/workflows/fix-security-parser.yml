name: fix security parser

on:
  push:
    branches:
      - security/supply-chain-gates-512
    paths:
      - ".github/workflows/fix-security-parser.yml"

permissions:
  contents: write

jobs:
  patch-parser:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: security/supply-chain-gates-512

      - name: Accept YAML list marker before uses
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/security_gate.py")
          source = path.read_text(encoding="utf-8")
          old = r'r"^\s*uses:\s*(?P<value>[^#\s]+)(?:\s+#\s*(?P<comment>.+))?\s*$"'
          new = r'r"^\s*(?:-\s*)?uses:\s*(?P<value>[^#\s]+)(?:\s+#\s*(?P<comment>.+))?\s*$"'
          if old not in source:
              raise SystemExit("Expected ACTION_USE_RE pattern was not found")
          path.write_text(source.replace(old, new, 1), encoding="utf-8")
          PY
          python -m unittest tests.test_security_gate_contract.SecurityGateContractTests.test_floating_action_tag_is_rejected -v
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/security_gate.py
          git commit -m "security: parse YAML list action references"
          git push origin HEAD:security/supply-chain-gates-512
