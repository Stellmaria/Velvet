name: Sync PR 663 canonical docs

on:
  push:
    branches:
      - feat/byesu-image-fallback-quality
    paths:
      - .github/workflows/sync-663-canonical-docs.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'

      - name: Refresh Telegram navigation inventory
        run: python scripts/telegram_navigation_inventory.py --root velvet_bot --markdown docs/generated/telegram_navigation_inventory.md

      - name: Append current architecture slice to canonical docs
        run: |
          python - <<'PY'
          from pathlib import Path

          start = '<!-- pr-663-byesu-image-quality-architecture-slice -->'
          end = '<!-- /pr-663-byesu-image-quality-architecture-slice -->'
          block = f'''\n\n{start}\n## Срез Byesu GPT Image quality PR #663 от 7 августа 2026 года\n\nТекущий воспроизводимый архитектурный срез после синхронизации с retirement #457:\n\n- package production modules: **656**;\n- inventoried functions: **3830**;\n- registered transitional private accesses: **180**;\n- blocking known contracts: **0**;\n- #457 уже объединён в `main`; live provider и Telegram acceptance для нового GPT Image маршрута остаются отдельными эксплуатационными проверками.\n{end}\n'''

          for name in (
              'docs/development_status.md',
              'docs/project_memory.md',
              'docs/ARCHITECTURE_AUDIT.md',
          ):
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              has_start = start in text
              has_end = end in text
              if has_start != has_end:
                  raise SystemExit(f'broken PR 663 architecture marker in {name}')
              if not has_start:
                  text = text.rstrip() + block
                  path.write_text(text, encoding='utf-8')
          PY

      - name: Verify focused contracts
        run: |
          python -m unittest tests.test_telegram_navigation_inventory
          python -m unittest tests.test_canonical_docs_sync
          python -m unittest tests.test_hermes_router_recovery
          python scripts/check_project_notes.py --base-ref origin/main

      - name: Commit synchronized docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/generated/telegram_navigation_inventory.md \
            docs/development_status.md \
            docs/project_memory.md \
            docs/ARCHITECTURE_AUDIT.md
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No canonical doc changes to commit"
            exit 0
          fi
          git commit -m "docs: sync GPT Image quality architecture slice"
          git push origin HEAD:feat/byesu-image-fallback-quality
