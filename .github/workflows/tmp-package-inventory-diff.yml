name: temporary package inventory refresh

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  refresh:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Regenerate architecture inventory
        run: python scripts/inventory_package_architecture_fast.py --write
      - name: Commit refreshed inventory
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- docs/package_architecture_inventory.json docs/package_architecture_inventory.md
          if git diff --cached --quiet; then
            echo "Inventory is already current"
            exit 0
          fi
          git commit -m "chore: refresh package architecture inventory"
          git push origin "HEAD:${HEAD_BRANCH}"
