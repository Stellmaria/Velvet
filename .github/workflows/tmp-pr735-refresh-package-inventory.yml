name: tmp pr735 refresh package inventory

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  refresh:
    if: github.event.pull_request.number == 735
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Regenerate package architecture inventory
        run: >-
          python scripts/inventory_package_architecture.py
          --label p1-package-architecture-baseline
          --write

      - name: Verify generated scope
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git status --porcelain | sed 's/^...//')
          printf 'generated changes:\n'
          printf '%s\n' "${changed[@]}"
          for path in "${changed[@]}"; do
            case "$path" in
              docs/package_architecture_inventory.json|docs/package_architecture_inventory.md) ;;
              *) echo "unexpected generated path: $path" >&2; exit 1 ;;
            esac
          done
          test "${#changed[@]}" -eq 2

      - name: Commit generated inventory to PR branch
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha }}"
          actual="$(git ls-remote origin refs/heads/fix/krita-local-server-wake | awk '{print $1}')"
          test "$actual" = "$expected" || {
            echo "branch moved: expected=$expected actual=$actual" >&2
            exit 1
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- docs/package_architecture_inventory.json docs/package_architecture_inventory.md
          git commit -m "Refresh package architecture inventory"
          git push origin HEAD:refs/heads/fix/krita-local-server-wake
