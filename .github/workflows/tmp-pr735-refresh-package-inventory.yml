name: tmp pr735 refresh package inventory

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  refresh:
    if: github.event.pull_request.number == 735
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Regenerate package architecture inventory
        run: >-
          python scripts/inventory_package_architecture.py
          --label p1-package-architecture-baseline
          --write

      - name: Upload generated inventory
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr735-package-inventory
          path: |
            docs/package_architecture_inventory.json
            docs/package_architecture_inventory.md
          if-no-files-found: error
          retention-days: 1
