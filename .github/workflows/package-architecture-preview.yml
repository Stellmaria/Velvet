name: package architecture preview

on:
  pull_request:
    paths:
      - velvet_bot/app/__init__.py
      - velvet_bot/app/composition.py
      - scripts/inventory_package_architecture.py
      - tests/test_application_composition.py
      - tests/test_package_architecture_inventory.py
      - .github/workflows/package-architecture-preview.yml

permissions:
  contents: write

concurrency:
  group: package-architecture-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Teach inventory about explicit composition
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          scanner_path = Path("scripts/inventory_package_architecture.py")
          source = scanner_path.read_text(encoding="utf-8")
          start = source.index("def _installer_graph(")
          end = source.index("\ndef _shared_fingerprint", start)
          replacement = '''def _installer_graph(modules: list[dict[str, Any]]) -> list[dict[str, Any]]:
              by_module = {str(row["module"]): row for row in modules}

              def graph_row(
                  *,
                  order: int,
                  line: int,
                  call: str,
                  origin: str,
              ) -> dict[str, Any]:
                  owner_module = origin.rsplit(".", 1)[0] if "." in origin else origin
                  owner_row = by_module.get(owner_module, {})
                  return {
                      "order": order,
                      "line": line,
                      "call": call,
                      "origin": origin,
                      "owner_module": owner_module,
                      "patched_symbols": list(
                          owner_row.get("foreign_assignment_targets", [])
                      ),
                  }

              composition = by_module.get("velvet_bot.app.composition")
              if composition is not None:
                  path = ROOT / str(composition["path"])
                  tree = ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
                  aliases, _ = _imports(
                      tree,
                      "velvet_bot.app.composition",
                      is_package=False,
                  )
                  functions = {
                      node.name: node
                      for node in tree.body
                      if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
                  }
                  wrapper_origins: dict[str, str] = {}
                  for name, function in functions.items():
                      if not name.startswith("_install_"):
                          continue
                      installer_calls = [
                          node
                          for node in ast.walk(function)
                          if isinstance(node, ast.Call)
                          and _dotted(node.func).split(".")[-1].startswith("install_")
                      ]
                      if len(installer_calls) != 1:
                          continue
                      local = _dotted(installer_calls[0].func)
                      wrapper_origins[name] = aliases.get(local, local)

                  def declared_stages(function_name: str) -> list[dict[str, Any]]:
                      function = functions.get(function_name)
                      if function is None:
                          return []
                      stages: list[dict[str, Any]] = []
                      for node in ast.walk(function):
                          if not isinstance(node, ast.Call):
                              continue
                          if _dotted(node.func).split(".")[-1] != "CompositionStage":
                              continue
                          if len(node.args) < 2:
                              continue
                          label = node.args[0]
                          if not isinstance(label, ast.Constant) or not isinstance(
                              label.value, str
                          ):
                              continue
                          installer = _dotted(node.args[1])
                          origin = wrapper_origins.get(
                              installer,
                              aliases.get(installer, installer),
                          )
                          stages.append(
                              {
                                  "line": int(node.lineno),
                                  "call": label.value,
                                  "origin": origin,
                              }
                          )
                      return sorted(stages, key=lambda row: int(row["line"]))

                  declared = [
                      *declared_stages("build_application_composition"),
                      *declared_stages("_build_feature_stages"),
                  ]
                  if declared:
                      return [
                          graph_row(
                              order=index,
                              line=int(item["line"]),
                              call=str(item["call"]),
                              origin=str(item["origin"]),
                          )
                          for index, item in enumerate(declared, start=1)
                      ]

              app_init = by_module.get("velvet_bot.app")
              if app_init is None:
                  return []
              path = ROOT / str(app_init["path"])
              tree = ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
              aliases, _ = _imports(tree, "velvet_bot.app", is_package=True)
              graph: list[dict[str, Any]] = []
              for call in sorted(
                  app_init["install_calls"],
                  key=lambda row: int(row["line"]),
              ):
                  local = str(call["call"]).split(".")[0]
                  origin = aliases.get(local, local)
                  graph.append(
                      graph_row(
                          order=len(graph) + 1,
                          line=int(call["line"]),
                          call=str(call["call"]),
                          origin=origin,
                      )
                  )
              return graph
          '''
          replacement = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in replacement.splitlines()
          ) + "\n"
          scanner_path.write_text(
              source[:start] + replacement + source[end:],
              encoding="utf-8",
          )

          test_path = Path("tests/test_package_architecture_inventory.py")
          test_source = test_path.read_text(encoding="utf-8")
          replacements = {
              'self.assertEqual(604, self.inventory["production_module_count"])':
                  'self.assertEqual(605, self.inventory["production_module_count"])',
              'self.assertEqual(128_870, self.inventory["production_loc"])':
                  'self.assertEqual(129_015, self.inventory["production_loc"])',
              'self.assertEqual(518, self.inventory["violation_count"])':
                  'self.assertEqual(516, self.inventory["violation_count"])',
              'Production modules: **604**': 'Production modules: **605**',
              'Registered package violations: **518**':
                  'Registered package violations: **516**',
              'Registered exemptions: **518**':
                  'Registered exemptions: **516**',
          }
          for old, new in replacements.items():
              if old not in test_source:
                  raise SystemExit(f"Expected package-test token is missing: {old}")
              test_source = test_source.replace(old, new)
          test_path.write_text(test_source, encoding="utf-8")
          PY

      - name: Build reviewed package architecture baseline
        run: |
          python scripts/inventory_package_architecture.py \
            --write \
            --bootstrap-exemptions \
            --label p1-package-architecture-baseline
          python scripts/inventory_package_architecture.py \
            --check \
            --label p1-package-architecture-baseline
          python -m unittest \
            tests.test_application_composition \
            tests.test_package_architecture_inventory -v

      - name: Validate exact branch head and commit generated baseline
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote --heads origin "refs/heads/${HEAD_BRANCH}" | awk '{print $1}')"
          if [[ "$remote_head" != "$EXPECTED_HEAD_SHA" ]]; then
            echo "PR head moved: expected $EXPECTED_HEAD_SHA, actual $remote_head"
            exit 1
          fi

          rm .github/workflows/package-architecture-preview.yml
          git add \
            scripts/inventory_package_architecture.py \
            tests/test_package_architecture_inventory.py \
            docs/package_architecture_inventory.json \
            docs/package_architecture_inventory.md \
            docs/package_architecture_exemptions.json \
            .github/workflows/package-architecture-preview.yml
          git diff --cached --check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit \
            -m "Teach architecture inventory explicit composition" \
            -m "Source head: ${EXPECTED_HEAD_SHA}" \
            -m "Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          result="$(git rev-parse HEAD)"
          git push origin "HEAD:refs/heads/${HEAD_BRANCH}"

          {
            echo "## Explicit composition inventory"
            echo
            echo "- Source head: \`$EXPECTED_HEAD_SHA\`"
            echo "- Result commit: \`$result\`"
            echo "- Startup stages: 27"
            echo "- Push: regular fast-forward push, no force"
            echo "- Temporary workflow: removed in result commit"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload generated evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: explicit-composition-inventory-${{ github.run_id }}
          path: |
            docs/package_architecture_inventory.json
            docs/package_architecture_inventory.md
            docs/package_architecture_exemptions.json
          if-no-files-found: warn
          retention-days: 7
