name: refresh pr486 package inventory

on:
  push:
    branches:
      - agent/server-self-restart

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/server-self-restart

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Regenerate package architecture snapshots
        run: >-
          python scripts/inventory_package_architecture.py
          --write
          --label p1-package-architecture-baseline

      - name: Commit regenerated snapshots
        shell: bash
        run: |
          if git diff --quiet -- docs/package_architecture_inventory.json docs/package_architecture_inventory.md; then
            echo 'Package architecture snapshots are already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/package_architecture_inventory.json docs/package_architecture_inventory.md
          git commit -m 'docs: refresh package architecture inventory'
          git push origin HEAD:agent/server-self-restart
