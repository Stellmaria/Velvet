name: sync librarian afk merge inventories

on:
  push:
    branches:
      - feat/storage-librarian-afk-guardrails

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/storage-librarian-afk-guardrails
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Generate from exact PR merge tree
        run: |
          git fetch origin +refs/pull/549/merge:refs/remotes/origin/pr-549-merge
          git worktree add --detach /tmp/velvet-pr-merge refs/remotes/origin/pr-549-merge
          cd /tmp/velvet-pr-merge
          python scripts/inventory_package_architecture.py \
            --write \
            --bootstrap-exemptions \
            --label p1-package-architecture-baseline
          python scripts/update_p2_stability_inventory.py \
            --label storage-librarian-afk-guardrails \
            --schema-version 78
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          data = json.loads(Path('docs/package_architecture_inventory.json').read_text(encoding='utf-8'))
          path = Path('tests/test_package_architecture_inventory.py')
          text = path.read_text(encoding='utf-8')
          keys = (
              'production_module_count',
              'production_loc',
              'root_module_count',
              'router_count',
              'repository_module_count',
              'violation_count',
          )
          for key in keys:
              pattern = rf'self\.assertEqual\(\d[\d_]*, self\.inventory\["{key}"\]\)'
              replacement = f'self.assertEqual({int(data[key]):_}, self.inventory["{key}"])'
              text, count = re.subn(pattern, replacement, text, count=1)
              if count != 1:
                  raise SystemExit(f'expected one assertion for {key}, found {count}')
          pattern = r'self\.assertEqual\(\d[\d_]*, len\(self\.inventory\["installer_graph"\]\)\)'
          replacement = (
              f'self.assertEqual({len(data["installer_graph"]):_}, '
              'len(self.inventory["installer_graph"]))'
          )
          text, count = re.subn(pattern, replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'expected one installer assertion, found {count}')
          path.write_text(text, encoding='utf-8')
          PY
          python scripts/inventory_package_architecture.py \
            --check \
            --label p1-package-architecture-baseline
      - name: Copy generated contracts to feature branch
        run: |
          cp /tmp/velvet-pr-merge/docs/package_architecture_inventory.json docs/
          cp /tmp/velvet-pr-merge/docs/package_architecture_inventory.md docs/
          cp /tmp/velvet-pr-merge/docs/package_architecture_exemptions.json docs/
          cp /tmp/velvet-pr-merge/docs/p2_stability_inventory.json docs/
          cp /tmp/velvet-pr-merge/docs/p2_stability_inventory.md docs/
          cp /tmp/velvet-pr-merge/tests/test_package_architecture_inventory.py tests/
          git worktree remove --force /tmp/velvet-pr-merge
      - name: Commit contracts without temporary workflow
        run: |
          rm .github/workflows/sync-librarian-afk-main.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- \
            docs/package_architecture_inventory.json \
            docs/package_architecture_inventory.md \
            docs/package_architecture_exemptions.json \
            docs/p2_stability_inventory.json \
            docs/p2_stability_inventory.md \
            tests/test_package_architecture_inventory.py \
            .github/workflows/sync-librarian-afk-main.yml
          git diff --cached --quiet || git commit -m 'chore: sync AFK PR merge inventories'
          git push origin HEAD:feat/storage-librarian-afk-guardrails
