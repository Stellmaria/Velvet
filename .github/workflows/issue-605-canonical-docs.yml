name: Sync issue 605 canonical architecture docs

on:
  push:
    branches:
      - feat/issue-605-error-incident-batching-v2

permissions:
  contents: write

concurrency:
  group: issue-605-canonical-docs
  cancel-in-progress: false

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/issue-605-error-incident-batching-v2
          fetch-depth: 0

      - name: Append reproducible issue 605 slice
        run: |
          cat > /tmp/issue-605-canonical-slice.md <<'EOF'

<!-- issue-605-error-center-batching-architecture-slice -->
## Срез Error Incident Center batching от 6 августа 2026 года

Дата среза: `2026-08-05`.

Контракт стабильного релиза: `v1.3.0`.

Воспроизводимый package/shared-contract baseline implementation-среза #605:

- package production modules: **659**;
- package production LOC: **145345**;
- inventoried functions: **3860**;
- registered transitional private accesses: **184**;
- blocking known contracts: **0**;
- exact / normalized / semantic duplicate groups: **68 / 98 / 9**;
- registered package architecture fingerprints: **537**;
- целевая консолидация media delivery и переходных persistence/composition boundaries остаётся в **#457** и **#455**.

Этот срез подтверждает только code/CI scope #605. Production storm acceptance, `pg_stat_statements`, WAL/IO, latency и Telegram rate требуют live-доступа и не закрываются зелёным CI. Обязательства #409/#410/#412/#438 и временные `meow_*` compatibility layers остаются открытыми.
<!-- /issue-605-error-center-batching-architecture-slice -->
EOF

          for document in \
            docs/development_status.md \
            docs/project_memory.md \
            docs/ARCHITECTURE_AUDIT.md
          do
            if grep -q '<!-- issue-605-error-center-batching-architecture-slice -->' "$document"; then
              echo "slice already present in $document" >&2
              exit 1
            fi
            cat /tmp/issue-605-canonical-slice.md >> "$document"
          done

          rm .github/workflows/issue-605-canonical-docs.yml

      - name: Verify canonical docs contract
        run: |
          python -m unittest tests.test_canonical_docs_sync -v
          test ! -e .github/workflows/issue-605-canonical-docs.yml
          git diff --check

      - name: Commit canonical documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: sync issue 605 canonical architecture slice"
          git push origin HEAD:feat/issue-605-error-incident-batching-v2
