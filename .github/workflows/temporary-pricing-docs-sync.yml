name: temporary pricing docs sync

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  sync:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/owner-cost-only-and-image-pricing'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Synchronize canonical inventory snapshot
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          block = """

          ## Актуализация inventory после pricing-среза 1 августа 2026

          Воспроизводимый shared-contract срез после добавления закрытого pricing UI:

          - production Python files: **639**;
          - inventoried functions: **3660**;
          - registered transitional private accesses: **186**;
          - blocking known private contracts: **0**;
          - целевая консолидация временных delivery/UI layers остаётся в **#457**.
          """.strip()
          marker = "## Актуализация inventory после pricing-среза 1 августа 2026"
          for name in (
              "docs/development_status.md",
              "docs/project_memory.md",
              "docs/ARCHITECTURE_AUDIT.md",
          ):
              path = Path(name)
              text = path.read_text(encoding="utf-8").rstrip()
              if marker not in text:
                  text += "\n\n" + block
              path.write_text(text + "\n", encoding="utf-8")
          PY

      - name: Commit docs and remove workflow
        shell: bash
        run: |
          rm -f .github/workflows/temporary-pricing-docs-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            .github/workflows/temporary-pricing-docs-sync.yml \
            docs/development_status.md \
            docs/project_memory.md \
            docs/ARCHITECTURE_AUDIT.md
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Canonical docs are already synchronized"
            exit 1
          fi
          git commit -m "Синхронизировать canonical pricing inventory"
          git push origin HEAD:fix/owner-cost-only-and-image-pricing
