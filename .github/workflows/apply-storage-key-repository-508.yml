name: apply storage key repository 508

on:
  push:
    branches:
      - security/backup-keyring-508
    paths:
      - ".github/workflows/apply-storage-key-repository-508.yml"

permissions:
  contents: write

concurrency:
  group: apply-storage-key-repository-508
  cancel-in-progress: false

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: security/backup-keyring-508

      - name: Move key query out of presentation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("velvet_bot/presentation/telegram/storage_center.py")
          source = path.read_text(encoding="utf-8")
          import_anchor = (
              "from velvet_bot.domains.telegram_storage.files import storage_message_link\n"
          )
          import_replacement = import_anchor + (
              "from velvet_bot.domains.telegram_storage.key_repository import "
              "TelegramStorageKeyRepository\n"
          )
          if import_anchor not in source:
              raise SystemExit("storage center import anchor not found")
          source = source.replace(import_anchor, import_replacement, 1)
          old = '''    settings = TelegramStorageSettings.from_env()
    async with database.acquire() as connection:
        rows = await connection.fetch(
            """
            SELECT id, encryption_version,
                   manifest ->> 'encryption_key_id' AS encryption_key_id
            FROM telegram_storage_objects
            WHERE storage_kind = 'backups'
              AND encrypted = TRUE
            ORDER BY id DESC
            LIMIT 500
            """
        )
    missing: list[str] = []
    legacy = 0
    for row in rows:
        key_id = row["encryption_key_id"]
        if key_id is None:
            legacy += 1
        label = str(key_id) if key_id is not None else "<legacy-v1>"
        selected = str(key_id) if key_id is not None else None
        if not settings.encryption_keyring.has_key(selected):
            missing.append(f"#{int(row['id'])}:{label}")
'''
          new = '''    settings = TelegramStorageSettings.from_env()
    rows = await TelegramStorageKeyRepository(database).list_backup_key_references()
    missing: list[str] = []
    legacy = 0
    for row in rows:
        key_id = row.encryption_key_id
        if key_id is None:
            legacy += 1
        label = key_id if key_id is not None else "<legacy-v1>"
        if not settings.encryption_keyring.has_key(key_id):
            missing.append(f"#{row.object_id}:{label}")
'''
          if old not in source:
              raise SystemExit("storage key handler block not found")
          path.write_text(source.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Verify architecture and focused tests
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q velvet_bot tests scripts
          python scripts/ci_preflight.py
          python -m unittest \
            tests/test_storage_encryption_keyring.py \
            tests/test_telegram_storage_center.py -v

      - name: Commit persistence boundary
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- velvet_bot/presentation/telegram/storage_center.py
          git commit -m "refactor: keep backup key inventory in persistence"
          git push origin HEAD:security/backup-keyring-508
