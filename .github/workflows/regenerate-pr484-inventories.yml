name: regenerate PR 484 inventories

on:
  workflow_dispatch:
  push:
    branches:
      - agent/photo-model-input-modes

permissions:
  contents: write

concurrency:
  group: regenerate-pr484-inventories
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: velvet_test
          POSTGRES_USER: velvet
          POSTGRES_PASSWORD: velvet_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U velvet -d velvet_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://velvet:velvet_test_password@localhost:5432/velvet_test
      TARGET_BRANCH: agent/photo-model-input-modes
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: agent/photo-model-input-modes
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Regenerate exact merged inventories
        run: |
          python scripts/inventory_package_architecture.py \
            --label p1-package-architecture-baseline \
            --write \
            --bootstrap-exemptions
          python scripts/telegram_navigation_inventory.py \
            --root velvet_bot \
            --markdown docs/generated/telegram_navigation_inventory.md

      - name: Remove temporary machinery
        run: |
          git rm \
            .github/workflows/regenerate-pr484-inventories.yml \
            tests/test_000_pr484_inventory_capture.py

      - name: Run complete test suite
        shell: bash
        run: |
          set +e
          python -m unittest discover -s tests -v > pr484-final-test-output.txt 2>&1
          status=$?
          cat pr484-final-test-output.txt
          exit "$status"

      - name: Commit and push exact result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/package_architecture_inventory.json \
            docs/package_architecture_inventory.md \
            docs/package_architecture_exemptions.json \
            docs/generated/telegram_navigation_inventory.md
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No inventory cleanup changes were produced."
            exit 1
          fi
          git commit -m "Regenerate inventories after composition merge"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"

      - name: Upload final test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr484-final-test-output
          path: pr484-final-test-output.txt
          if-no-files-found: warn
          retention-days: 7
