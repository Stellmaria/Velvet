name: Sync PR 667 with current main

on:
  push:
    branches:
      - ops/arthur-prod-rollout-20260806
    paths:
      - .github/workflows/sync-667-main.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout rollout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Merge current main
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags origin main
          git merge --no-ff origin/main -m "Merge main into ops/arthur-prod-rollout-20260806"
          test -z "$(git diff --name-only --diff-filter=U)"
          git diff --check HEAD^ HEAD
          git push origin HEAD:ops/arthur-prod-rollout-20260806
