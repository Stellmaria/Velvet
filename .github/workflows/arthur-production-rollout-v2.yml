name: arthur production rollout v2

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/arthur-production-rollout-v2.yml

concurrency:
  group: velvet-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-and-reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    environment: production
    env:
      SOURCE_COMMIT: e6571062af2c963297c17f94685490fa054c90ca
      IMAGE_DIGEST: ghcr.io/stellmaria/velvet@sha256:517165ef91701ec7138ddb11a0138e6a2375d22a3a7683737b15ef7ea46c98d0
      ROLLOUT_REVISION: repair-index-activate-reconcile
    steps:
      - name: Checkout rollout payload
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify immutable target and prepare credentials
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          ARTHUR_BOT_TOKEN: ${{ secrets.ARTHUR_BOT_TOKEN }}
          ARTHUR_ALLOWED_USER_IDS: ${{ secrets.ARTHUR_ALLOWED_USER_IDS }}
          ARTHUR_ALLOWED_USERNAMES: ${{ secrets.ARTHUR_ALLOWED_USERNAMES }}
          ARTHUR_STORAGE_GATEWAY_API_KEY: ${{ secrets.ARTHUR_STORAGE_GATEWAY_API_KEY }}
        run: |
          set -Eeuo pipefail
          current_main="$(git ls-remote https://github.com/Stellmaria/Velvet.git refs/heads/main | awk '{print $1}')"
          test "$current_main" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$SOURCE_COMMIT" "$GITHUB_SHA"
          [[ "$IMAGE_DIGEST" =~ ^ghcr\.io/stellmaria/velvet@sha256:[0-9a-f]{64}$ ]]
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          test -n "$ARTHUR_BOT_TOKEN"
          test ${#ARTHUR_STORAGE_GATEWAY_API_KEY} -ge 24
          if [[ -z "$ARTHUR_ALLOWED_USER_IDS" && -z "$ARTHUR_ALLOWED_USERNAMES" ]]; then
            echo "Arthur owner allowlist is missing" >&2
            exit 2
          fi

          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          payload="$(mktemp)"
          trap 'rm -f "$payload"' EXIT
          python3 - "$payload" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          names = (
              "ARTHUR_BOT_TOKEN",
              "ARTHUR_ALLOWED_USER_IDS",
              "ARTHUR_ALLOWED_USERNAMES",
              "ARTHUR_STORAGE_GATEWAY_API_KEY",
          )
          values = {name: os.environ.get(name, "") for name in names}
          for name, value in values.items():
              if "\n" in value or "\x00" in value:
                  raise SystemExit(f"{name} contains an invalid character")
          path = Path(sys.argv[1])
          path.write_text(json.dumps(values), encoding="utf-8")
          path.chmod(0o600)
          PY

          port="${DEPLOY_PORT:-22}"
          remote_payload="/tmp/velvet-arthur-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          scp -P "$port" -o BatchMode=yes -o IdentitiesOnly=yes \
            "$payload" "$DEPLOY_USER@$DEPLOY_HOST:$remote_payload"
          echo "REMOTE_PAYLOAD=$remote_payload" >> "$GITHUB_ENV"

      - name: Repair checkout and legacy backup ownership contracts
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_APP_DIR: ${{ secrets.DEPLOY_APP_DIR }}
        run: |
          set -Eeuo pipefail
          port="${DEPLOY_PORT:-22}"
          app_dir="${DEPLOY_APP_DIR:-/srv/velvet}"
          printf -v remote_command \
            'APP_DIR=%q IMAGE_DIGEST=%q REMOTE_PAYLOAD=%q bash -s' \
            "$app_dir" "$IMAGE_DIGEST" "$REMOTE_PAYLOAD"
          ssh -p "$port" -o BatchMode=yes -o IdentitiesOnly=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" "$remote_command" <<'REMOTE'
          set -Eeuo pipefail
          cd "$APP_DIR"
          test -d "$APP_DIR"
          test ! -L "$APP_DIR"
          test -d "$APP_DIR/.git"
          test ! -L "$APP_DIR/.git"

          deploy_uid="$(id -u)"
          deploy_gid="$(id -g)"
          test "$(stat -c '%u' "$APP_DIR")" = "$deploy_uid"
          test "$(stat -c '%g' "$APP_DIR")" = "$deploy_gid"

          git_index="$APP_DIR/.git/index"
          test -f "$git_index"
          test ! -L "$git_index"
          index_uid="$(stat -c '%u' "$git_index")"
          index_gid="$(stat -c '%g' "$git_index")"
          if [[ "$index_uid" != "$deploy_uid" || "$index_gid" != "$deploy_gid" ]]; then
            docker run --rm -i \
              --network none \
              --user 0:0 \
              --cap-drop ALL \
              --cap-add CHOWN \
              --security-opt no-new-privileges \
              --env TARGET_UID="$deploy_uid" \
              --env TARGET_GID="$deploy_gid" \
              --mount "type=bind,src=$APP_DIR/.git,dst=/repair" \
              "$IMAGE_DIGEST" \
              python - <<'PY'
          import os
          import stat

          target_uid = int(os.environ["TARGET_UID"])
          target_gid = int(os.environ["TARGET_GID"])
          path = "/repair/index"
          value = os.lstat(path)
          if not stat.S_ISREG(value.st_mode):
              raise SystemExit("Git index is not a regular file")
          os.chown(path, target_uid, target_gid, follow_symlinks=False)
          print("Production Git index ownership repaired without changing mode.")
          PY
          fi
          test "$(stat -c '%u:%g' "$git_index")" = "$deploy_uid:$deploy_gid"
          test -r "$git_index"
          test -w "$git_index"
          test "$(git symbolic-ref --short HEAD)" = main
          test -z "$(GIT_OPTIONAL_LOCKS=0 git status --porcelain --untracked-files=all)"
          echo "Initial production checkout: $(git rev-parse HEAD)"

          find /tmp -maxdepth 1 -type f -user "$(id -u)" \
            -name 'velvet-arthur-*.json' ! -path "$REMOTE_PAYLOAD" -delete

          data_dir="$(python3 - .env.server <<'PY'
          from pathlib import Path
          import sys
          from scripts.server_preflight import parse_env_file

          env = parse_env_file(Path(sys.argv[1]))
          value = env.get("VELVET_DATA_DIR", "").strip()
          if not value:
              raise SystemExit("VELVET_DATA_DIR is missing")
          print(value)
          PY
          )"
          backup_root="$data_dir/backups"
          test -d "$backup_root"
          test ! -L "$backup_root"

          docker run --rm -i \
            --network none \
            --user 0:0 \
            --cap-drop ALL \
            --cap-add CHOWN \
            --cap-add FOWNER \
            --cap-add DAC_OVERRIDE \
            --security-opt no-new-privileges \
            --env TARGET_UID="$deploy_uid" \
            --env TARGET_GID="$deploy_gid" \
            --mount "type=bind,src=$backup_root,dst=/repair" \
            "$IMAGE_DIGEST" \
            python - <<'PY'
          import os
          from pathlib import Path

          root = Path("/repair")
          target_uid = int(os.environ["TARGET_UID"])
          target_gid = int(os.environ["TARGET_GID"])
          repaired = 0
          for entry in os.scandir(root):
              if not entry.is_file(follow_symlinks=False):
                  continue
              if not (entry.name.endswith(".dump") or entry.name.endswith(".dump.json")):
                  continue
              stat = entry.stat(follow_symlinks=False)
              if (
                  stat.st_uid != target_uid
                  or stat.st_gid != target_gid
                  or (stat.st_mode & 0o777) != 0o644
              ):
                  os.chown(entry.path, target_uid, target_gid, follow_symlinks=False)
                  os.chmod(entry.path, 0o644, follow_symlinks=False)
                  repaired += 1
          print(f"Legacy backup ownership repair complete: files={repaired}")
          PY

          while IFS= read -r -d '' candidate; do
            test "$(stat -c '%u:%g:%a' "$candidate")" = "$deploy_uid:$deploy_gid:644"
          done < <(
            find "$backup_root" -maxdepth 1 -type f \
              \( -name '*.dump' -o -name '*.dump.json' \) \
              -print0
          )
          REMOTE

      - name: Deploy verified app image and reconcile Arthur
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_APP_DIR: ${{ secrets.DEPLOY_APP_DIR }}
        run: |
          set -Eeuo pipefail
          port="${DEPLOY_PORT:-22}"
          app_dir="${DEPLOY_APP_DIR:-/srv/velvet}"
          remote_script="/tmp/velvet-arthur-rollout-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.sh"
          echo "REMOTE_SCRIPT=$remote_script" >> "$GITHUB_ENV"

          printf -v install_command 'umask 077; cat > %q; chmod 700 %q' \
            "$remote_script" "$remote_script"
          ssh -p "$port" -o BatchMode=yes -o IdentitiesOnly=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" "$install_command" \
            < .github/ops/arthur-production-rollout.sh

          printf -v remote_command \
            'SOURCE_COMMIT=%q CHECKOUT_COMMIT=%q IMAGE_DIGEST=%q APP_DIR=%q SECRET_FILE=%q bash %q </dev/null' \
            "$SOURCE_COMMIT" "$GITHUB_SHA" "$IMAGE_DIGEST" "$app_dir" "$REMOTE_PAYLOAD" "$remote_script"
          ssh -p "$port" -o BatchMode=yes -o IdentitiesOnly=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" "$remote_command"

      - name: Remove transferred rollout payloads
        if: ${{ always() && (env.REMOTE_PAYLOAD != '' || env.REMOTE_SCRIPT != '') }}
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -Eeuo pipefail
          port="${DEPLOY_PORT:-22}"
          payload="${REMOTE_PAYLOAD:-/tmp/velvet-arthur-no-payload}"
          script="${REMOTE_SCRIPT:-/tmp/velvet-arthur-no-script}"
          printf -v remote_command 'rm -f -- %q %q' "$payload" "$script"
          ssh -p "$port" -o BatchMode=yes -o IdentitiesOnly=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" "$remote_command"
