name: Temporary pricing finalizer

on:
  push:
    branches:
      - agent/individual-markup-vl-pricing

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[pricing-finalize]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Regenerate package architecture contracts
        shell: bash
        run: |
          python scripts/inventory_package_architecture.py \
            --write \
            --bootstrap-exemptions \
            --label p1-package-architecture-baseline

      - name: Commit finalized contracts
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/package_architecture_inventory.json \
            docs/package_architecture_inventory.md \
            docs/package_architecture_exemptions.json
          if git diff --cached --quiet; then
            echo "Architecture contracts are already current."
            exit 0
          fi
          git commit -m "Завершить контракты политики цен [pricing-finalize]"
          git push origin HEAD:agent/individual-markup-vl-pricing
