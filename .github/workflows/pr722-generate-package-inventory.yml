name: pr722 finalize package inventory

on:
  push:
    branches:
      - fix/storage-librarian-scheduler-lifecycle

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.head_commit.message == 'Finalize PR 722 generated architecture baseline'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/storage-librarian-scheduler-lifecycle
      - name: Regenerate reviewed baseline and self-clean
        run: |
          set -euo pipefail
          python scripts/inventory_package_architecture.py \
            --write \
            --label p1-package-architecture-baseline
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_package_architecture_inventory.py')
          text = path.read_text(encoding='utf-8')
          old = 'self.assertEqual(144196, self.inventory["production_loc"])'
          new = 'self.assertEqual(144224, self.inventory["production_loc"])'
          if text.count(old) != 1:
              raise SystemExit('expected exactly one package LOC assertion to update')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git rm -- .github/workflows/pr722-generate-package-inventory.yml
          git add -- \
            docs/package_architecture_inventory.json \
            docs/package_architecture_inventory.md \
            tests/test_package_architecture_inventory.py
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh architecture baseline for Librarian lifecycle'
          git push origin HEAD:fix/storage-librarian-scheduler-lifecycle
