name: sync GPT Image canonical docs

on:
  push:
    branches:
      - feat/gpt-image-2-codex

permissions:
  contents: write

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, '[canonical-docs-synced]') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/gpt-image-2-codex
          fetch-depth: 0
          persist-credentials: true

      - name: Append reproducible GPT Image architecture slice
        run: |
          python - <<'PY'
          from pathlib import Path

          marker = "<!-- gpt-image-2-pr-645-architecture-slice -->"
          block = """

          <!-- gpt-image-2-pr-645-architecture-slice -->
          ## Срез feature-ветки GPT Image 2 от 5 августа 2026 года

          Этот блок фиксирует воспроизводимые числа PR #645 и не означает production rollout или закрытие переходного долга:

          - package production modules: **651**;
          - inventoried functions: **3748**;
          - registered transitional private accesses: **170**;
          - blocking known private contracts: **0**;
          - целевая консолидация delivery и provider-routing слоёв остаётся в **#457** и **#459**.
          <!-- /gpt-image-2-pr-645-architecture-slice -->
          """.strip("\n")
          for name in (
              "docs/development_status.md",
              "docs/project_memory.md",
              "docs/ARCHITECTURE_AUDIT.md",
          ):
              path = Path(name)
              text = path.read_text(encoding="utf-8").rstrip()
              if marker in text:
                  continue
              path.write_text(text + "\n\n" + block + "\n", encoding="utf-8")
          PY

      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/sync-gpt-image-canonical-docs.yml
          git config user.name "Velvet Docs Bot"
          git config user.email "velvet-docs@users.noreply.github.com"
          git add docs/development_status.md \
                  docs/project_memory.md \
                  docs/ARCHITECTURE_AUDIT.md \
                  .github/workflows/sync-gpt-image-canonical-docs.yml
          git commit -m "docs: sync GPT Image architecture slice [canonical-docs-synced]"
          git push origin HEAD:feat/gpt-image-2-codex
