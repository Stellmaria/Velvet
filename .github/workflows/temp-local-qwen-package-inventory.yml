name: temp local qwen package inventory

on:
  push:
    branches:
      - agent/storage-librarian-local-qwen

permissions:
  contents: write

jobs:
  inventory:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/storage-librarian-local-qwen
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Generate package architecture inventory
        run: |
          python scripts/inventory_package_architecture.py \
            --label working-tree \
            --write
      - name: Commit generated inventory
        run: |
          if git diff --quiet -- \
            docs/package_architecture_inventory.json \
            docs/package_architecture_inventory.md
          then
            echo 'Inventory already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            docs/package_architecture_inventory.json \
            docs/package_architecture_inventory.md
          git commit -m 'Синхронизировать package inventory с CI'
          git push origin HEAD:agent/storage-librarian-local-qwen
