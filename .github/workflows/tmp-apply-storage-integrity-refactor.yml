name: temporary storage integrity refactor

on:
  push:
    branches:
      - fix/storage-topic-integrity

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - name: Apply bounded refactor and refresh inventories
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import json
          import re
          from pathlib import Path

          root = Path('.')

          def replace_method(path: Path, name: str, replacement: str) -> None:
              text = path.read_text(encoding='utf-8')
              pattern = re.compile(
                  rf'^    (?:async )?def {re.escape(name)}\(.*?(?=^    (?:async )?def |^__all__ =)',
                  re.MULTILINE | re.DOTALL,
              )
              match = pattern.search(text)
              if not match:
                  raise SystemExit(f'method not found: {path}:{name}')
              path.write_text(text[:match.start()] + replacement.rstrip() + '\n\n' + text[match.end():], encoding='utf-8')

          service = root / 'velvet_bot/domains/telegram_storage/service.py'
          replace_method(service, '_migrate_backups', '''    async def _migrate_backups(self, summary: MigrationSummary) -> None:
              items = await self.repository.list_backup_backfill(self.settings.backup_dir)
              backup_stage = self.settings.staging_dir / "backups"
              backup_stage.mkdir(parents=True, exist_ok=True)
              for item in items:
                  self._record_discovered(summary, "backups")
                  token = safe_token(f"{item.run_id or 'raw'}-{item.file_name}")
                  zip_path = backup_stage / f"{token}.zip"
                  encrypted_path = backup_stage / f"{token}.velvet.enc"
                  verify_path = backup_stage / f"{token}.verify.zip"
                  manifest_path = item.path.with_suffix(item.path.suffix + ".json")
                  try:
                      source_digest = item.sha256 or await asyncio.to_thread(
                          sha256_file,
                          item.path,
                      )
                      logical_key = f"backup:{item.run_id or item.file_name}:{source_digest}"
                      existing = await self.repository.get_existing("backups", logical_key, None)
                      if existing is not None:
                          summary.skipped_files += 1
                          summary.bump("backups", "skipped")
                          if item.run_id is not None:
                              await self.repository.mark_backup_offloaded(item.run_id, existing.object_id)
                          if self.settings.delete_after_upload:
                              result = await asyncio.to_thread(
                                  remove_paths,
                                  tuple(path for path in (item.path, manifest_path) if path.exists()),
                                  policy=self.settings.deletion_policy_for("backups"),
                              )
                              summary.deleted_files += result.deleted_count
                              summary.freed_bytes += result.freed_bytes
                              summary.bump("backups", "deleted", result.deleted_count)
                              if result.complete and result.deleted_count:
                                  await self.repository.mark_local_deleted(existing.object_id)
                          continue
                      files = {item.file_name: item.path}
                      if manifest_path.is_file():
                          files[manifest_path.name] = manifest_path
                      text_entries = {
                          "storage-manifest.json": json.dumps(
                              {
                                  "backup_run_id": item.run_id,
                                  "backup_kind": item.backup_kind,
                                  "schema_version": item.schema_version,
                                  "source_sha256": source_digest,
                                  "validation": item.validation,
                                  "encryption_key_id": self.settings.encryption_key_id,
                                  "encryption_version": "AES-256-GCM+scrypt:v2",
                                  "packed_at": datetime.now(UTC).isoformat(),
                              },
                              ensure_ascii=False,
                              indent=2,
                          )
                      }
                      await asyncio.to_thread(
                          build_zip,
                          zip_path,
                          files=files,
                          text_entries=text_entries,
                      )
                      zip_digest = await asyncio.to_thread(sha256_file, zip_path)
                      await asyncio.to_thread(
                          encrypt_file,
                          zip_path,
                          encrypted_path,
                          self.settings.encryption_keyring,
                      )
                      await asyncio.to_thread(
                          decrypt_file,
                          encrypted_path,
                          verify_path,
                          self.settings.encryption_keyring,
                      )
                      if await asyncio.to_thread(sha256_file, verify_path) != zip_digest:
                          raise ValueError("Проверка расшифровки backup не совпала с исходным ZIP.")
                      verify_path.unlink(missing_ok=True)

                      candidate = StorageCandidate(
                          kind="backups",
                          path=encrypted_path,
                          logical_key=logical_key,
                          original_name=encrypted_path.name,
                          source_path=str(item.path),
                          mime_type="application/octet-stream",
                          encrypted=True,
                          delete_paths=tuple(
                              path
                              for path in (item.path, manifest_path, zip_path, encrypted_path)
                              if path.exists()
                          ),
                          metadata={
                              "backup_run_id": item.run_id,
                              "backup_kind": item.backup_kind,
                              "schema_version": item.schema_version,
                              "source_sha256": source_digest,
                              "zip_sha256": zip_digest,
                              "encryption_key_id": self.settings.encryption_key_id,
                          },
                      )
                      stored = await self.uploader.upload(
                          candidate,
                          manifest=candidate.metadata,
                          encryption_version="AES-256-GCM+scrypt:v2",
                      )
                      stored_object, deleted, freed, duplicate = stored
                      if duplicate:
                          summary.skipped_files += 1
                          summary.bump("backups", "skipped")
                      else:
                          summary.stored_files += 1
                          summary.bump("backups", "stored")
                      summary.deleted_files += deleted
                      summary.freed_bytes += freed
                      summary.bump("backups", "deleted", deleted)
                      if item.run_id is not None:
                          await self.repository.mark_backup_offloaded(item.run_id, stored_object.object_id)
                  except Exception as error:  # p2-approved-boundary: isolate-telegram-storage-operation
                      remove_paths((zip_path, encrypted_path, verify_path))
                      self._record_failure(summary, "backups", item.file_name, error)
          ''')

          replace_method(service, '_snapshot_rework', '''    async def _snapshot_rework(self, summary: MigrationSummary) -> None:
              rows = await self.repository.rework_snapshot()
              if not rows:
                  return
              content_hash = hashlib.sha256(
                  json.dumps(rows, ensure_ascii=False, sort_keys=True).encode("utf-8")
              ).hexdigest()
              logical_key = f"rework:snapshot:{content_hash}"
              if await self.repository.get_existing("rework", logical_key, None) is not None:
                  self._record_discovered(summary, "rework")
                  summary.skipped_files += 1
                  summary.bump("rework", "skipped")
                  return
              snapshot = self.settings.staging_dir / "rework" / (
                  f"rework-{datetime.now(UTC).strftime('%Y%m%dT%H%M%SZ')}-{content_hash[:12]}.json"
              )
              await asyncio.to_thread(
                  write_json,
                  snapshot,
                  {
                      "generated_at": datetime.now(UTC).isoformat(),
                      "count": len(rows),
                      "items": rows,
                  },
              )
              candidate = StorageCandidate(
                  kind="rework",
                  path=snapshot,
                  logical_key=logical_key,
                  original_name=snapshot.name,
                  source_path="postgresql:media_rework_items",
                  mime_type="application/json",
                  delete_paths=(snapshot,),
                  metadata={"item_count": len(rows), "content_sha256": content_hash},
              )
              await self._upload_candidate(summary, candidate)
          ''')

          repository = root / 'velvet_bot/domains/telegram_storage/repository.py'
          text = repository.read_text(encoding='utf-8')
          text = text.replace('        sha256: str,\n    ) -> StoredObject | None:', '        sha256: str | None,\n    ) -> StoredObject | None:', 1)
          old = '''                WHERE storage_kind = $1::VARCHAR
                  AND logical_key = $2::TEXT
                  AND sha256 = $3::CHAR(64)
                """,'''
          new = '''                WHERE storage_kind = $1::VARCHAR
                  AND logical_key = $2::TEXT
                  AND ($3::CHAR(64) IS NULL OR sha256 = $3::CHAR(64))
                ORDER BY migrated_at DESC, id DESC
                LIMIT 1
                """,'''
          if old not in text:
              raise SystemExit('repository get_existing query pattern not found')
          repository.write_text(text.replace(old, new, 1), encoding='utf-8')

          backup_repo = root / 'velvet_bot/domains/telegram_storage/backup_repository.py'
          text = backup_repo.read_text(encoding='utf-8')
          text = re.sub(
              r'\n    async def latest_object_id_by_logical_key\(.*?(?=\n    async def list_backup_backfill)',
              '\n',
              text,
              flags=re.DOTALL,
          )
          backup_repo.write_text(text, encoding='utf-8')

          init_path = root / 'velvet_bot/domains/telegram_storage/__init__.py'
          text = init_path.read_text(encoding='utf-8').replace(
              'from velvet_bot.domains.telegram_storage.integrity_service import (  # noqa: E402\n    TelegramStorageMigrationService,\n)',
              'from velvet_bot.domains.telegram_storage.service import (  # noqa: E402\n    TelegramStorageMigrationService,\n)',
          )
          init_path.write_text(text, encoding='utf-8')
          (root / 'velvet_bot/domains/telegram_storage/integrity_service.py').unlink()

          arthur = root / 'velvet_bot/core/config/arthur.py'
          text = arthur.read_text(encoding='utf-8')
          text = re.sub(r'\n_DEFAULT_REPORT_CHAT_ID.*?\ndef _required', '\n\ndef _required', text, flags=re.DOTALL)
          text = re.sub(r'\n\ndef _report_destination\(\).*?(?=\n\n@dataclass)', '', text, flags=re.DOTALL)
          text = text.replace(
              '        report_chat_id, report_thread_id = _report_destination()\n',
              '        report_chat_id = (_parse_optional_int("ARTHUR_REPORT_CHAT_ID") or _parse_optional_int("TELEGRAM_STORAGE_CHAT_ID") or -1004459280894)\n'
              '        report_thread_id = (_parse_optional_int("ARTHUR_REPORT_THREAD_ID") or _parse_optional_int("STORAGE_THREAD_ANALYSIS") or 2478)\n',
          )
          arthur.write_text(text, encoding='utf-8')

          tests = root / 'tests/test_storage_topic_integrity.py'
          text = tests.read_text(encoding='utf-8')
          text = text.replace(
              'latest_object_id_by_logical_key=AsyncMock(return_value=3596),',
              'get_existing=AsyncMock(return_value=SimpleNamespace(object_id=3596)),',
          ).replace(
              'service.repository.latest_object_id_by_logical_key.assert_awaited_once()',
              'service.repository.get_existing.assert_awaited_once_with("backups", "backup:42:' + 'a' * 64 + '", None)',
          ).replace(
              'latest_object_id_by_logical_key=AsyncMock(return_value=3597),',
              'get_existing=AsyncMock(return_value=SimpleNamespace(object_id=3597)),',
          ).replace(
              'service.repository.latest_object_id_by_logical_key.assert_awaited_once()',
              'service.repository.get_existing.assert_awaited_once()',
          )
          tests.write_text(text, encoding='utf-8')
          PY

          python scripts/inventory_package_architecture_fast.py --label p1-package-architecture-baseline --write

          python - <<'PY'
          import json
          import re
          import subprocess
          import sys
          from pathlib import Path

          p2 = json.loads(Path('docs/p2_stability_inventory.json').read_text(encoding='utf-8'))
          subprocess.run([
              sys.executable,
              'scripts/update_p2_stability_inventory.py',
              '--label', str(p2['generated_from_commit']),
              '--schema-version', str(p2['schema_version']),
          ], check=True)

          package = json.loads(Path('docs/package_architecture_inventory.json').read_text(encoding='utf-8'))
          if package['production_module_count'] != 656:
              raise SystemExit(f"unexpected module count: {package['production_module_count']}")
          test_path = Path('tests/test_package_architecture_inventory.py')
          text = test_path.read_text(encoding='utf-8')
          text = re.sub(r'self\.assertEqual\(\d+, self\.inventory\["production_loc"\]\)', f'self.assertEqual({package["production_loc"]}, self.inventory["production_loc"])', text)
          text = re.sub(r'self\.assertEqual\(\d+, self\.inventory\["violation_count"\]\)', f'self.assertEqual({package["violation_count"]}, self.inventory["violation_count"])', text)
          text = re.sub(r'Production LOC: \*\*\d+\*\*', f'Production LOC: **{package["production_loc"]}**', text)
          test_path.write_text(text, encoding='utf-8')
          print(json.dumps({
              'production_module_count': package['production_module_count'],
              'production_loc': package['production_loc'],
              'violation_count': package['violation_count'],
              'repository_module_count': package['repository_module_count'],
          }, indent=2))
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add velvet_bot docs/package_architecture_inventory.json docs/package_architecture_inventory.md docs/p2_stability_inventory.json docs/p2_stability_inventory.md tests/test_storage_topic_integrity.py tests/test_package_architecture_inventory.py
          git commit -m "Refine Telegram storage integrity fix in existing boundaries"
          git push origin HEAD:"$GITHUB_REF_NAME"
