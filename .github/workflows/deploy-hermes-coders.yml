name: deploy Hermes coders

on:
  push:
    branches:
      - "release/hermes-coders-*"
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type DEPLOY_HERMES to release the current main commit"
        required: true
        type: string
      source_commit:
        description: "Exact 40-character current main commit"
        required: true
        type: string

concurrency:
  group: velvet-hermes-coder-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name == 'push' || inputs.confirmation == 'DEPLOY_HERMES'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: Checkout exact release ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate exact current main release
        id: release
        shell: bash
        env:
          MANUAL_SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          source_commit="${GITHUB_SHA,,}"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            source_commit="${MANUAL_SOURCE_COMMIT,,}"
            if [[ ! "$source_commit" =~ ^[0-9a-f]{40}$ ]]; then
              echo "source_commit must be an exact 40-character SHA" >&2
              exit 2
            fi
            if [[ "$source_commit" != "${GITHUB_SHA,,}" ]]; then
              echo "Manual release must execute from the exact requested main commit" >&2
              exit 2
            fi
          else
            expected_ref="refs/heads/release/hermes-coders-${source_commit}"
            if [[ "$GITHUB_REF" != "$expected_ref" ]]; then
              echo "Release branch must be named release/hermes-coders-<exact SHA>" >&2
              exit 2
            fi
          fi
          git fetch --no-tags origin main
          main_sha="$(git rev-parse origin/main)"
          if [[ "$source_commit" != "${main_sha,,}" ]]; then
            echo "Hermes release must point to the current main commit" >&2
            exit 2
          fi
          printf 'source_commit=%s\n' "$source_commit" >> "$GITHUB_OUTPUT"

      - name: Validate deployment secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Release exact Hermes sandbox and coder runtime
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          SOURCE_COMMIT: ${{ steps.release.outputs.source_commit }}
        run: |
          set -euo pipefail
          port="${DEPLOY_PORT:-22}"
          ssh -p "$port" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            bash -s -- "$SOURCE_COMMIT" <<'REMOTE'
          set -Eeuo pipefail

          target_sha="$1"
          release_runner=/usr/local/sbin/hermes-coders-release

          if [[ ! "$target_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Remote release target must be an exact SHA." >&2
            exit 2
          fi
          test -x "$release_runner"
          test "$(stat -c '%U:%G:%a' "$release_runner")" = "root:root:755"

          sudo -n "$release_runner" "$target_sha"
          REMOTE
