name: temporary finalize storage integrity refactor

on:
  push:
    branches:
      - fix/storage-topic-integrity

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - name: Apply minimal source refactor and refresh inventories
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import re
          from pathlib import Path

          root = Path('.')

          def insert_after_match(text: str, pattern: re.Pattern[str], rows: list[tuple[int, str]]) -> str:
              match = pattern.search(text)
              if match is None:
                  raise SystemExit(f'anchor not found: {pattern.pattern}')
              indent = match.group('indent')
              block = ''.join(indent + (' ' * (level * 4)) + code + '\n' for level, code in rows)
              return text[:match.end()] + block + text[match.end():]

          service = root / 'velvet_bot/domains/telegram_storage/service.py'
          text = service.read_text(encoding='utf-8')
          backup_pattern = re.compile(
              r'(?P<indent> +)source_digest = item\.sha256 or await asyncio\.to_thread\(\n'
              r'(?P=indent)    sha256_file,\n'
              r'(?P=indent)    item\.path,\n'
              r'(?P=indent)\)\n'
          )
          text = insert_after_match(text, backup_pattern, [
              (0, 'logical_key = f"backup:{item.run_id or item.file_name}:{source_digest}"'),
              (0, 'existing = await self.repository.get_existing("backups", logical_key, None)'),
              (0, 'if existing is not None:'),
              (1, 'summary.skipped_files += 1'),
              (1, 'summary.bump("backups", "skipped")'),
              (1, 'if item.run_id is not None:'),
              (2, 'await self.repository.mark_backup_offloaded(item.run_id, existing.object_id)'),
              (1, 'if self.settings.delete_after_upload:'),
              (2, 'result = await asyncio.to_thread('),
              (3, 'remove_paths,'),
              (3, 'tuple(path for path in (item.path, manifest_path) if path.exists()),'),
              (3, 'policy=self.settings.deletion_policy_for("backups"),'),
              (2, ')'),
              (2, 'summary.deleted_files += result.deleted_count'),
              (2, 'summary.freed_bytes += result.freed_bytes'),
              (2, 'summary.bump("backups", "deleted", result.deleted_count)'),
              (2, 'if result.complete and result.deleted_count:'),
              (3, 'await self.repository.mark_local_deleted(existing.object_id)'),
              (1, 'continue'),
          ])
          old_backup_key = '                    logical_key=f"backup:{item.run_id or item.file_name}:{source_digest}",'
          if text.count(old_backup_key) != 1:
              raise SystemExit(f'backup key count={text.count(old_backup_key)}')
          text = text.replace(old_backup_key, '                    logical_key=logical_key,', 1)

          rework_pattern = re.compile(
              r'(?P<indent> +)content_hash = hashlib\.sha256\(\n'
              r'(?P=indent)    json\.dumps\(rows, ensure_ascii=False, sort_keys=True\)\.encode\("utf-8"\)\n'
              r'(?P=indent)\)\.hexdigest\(\)\n'
          )
          text = insert_after_match(text, rework_pattern, [
              (0, 'logical_key = f"rework:snapshot:{content_hash}"'),
              (0, 'if await self.repository.get_existing("rework", logical_key, None) is not None:'),
              (1, 'self._record_discovered(summary, "rework")'),
              (1, 'summary.skipped_files += 1'),
              (1, 'summary.bump("rework", "skipped")'),
              (1, 'return'),
          ])
          old_rework_key = '            logical_key=f"rework:snapshot:{content_hash}",'
          if text.count(old_rework_key) != 1:
              raise SystemExit(f'rework key count={text.count(old_rework_key)}')
          text = text.replace(old_rework_key, '            logical_key=logical_key,', 1)
          service.write_text(text, encoding='utf-8')

          repository = root / 'velvet_bot/domains/telegram_storage/repository.py'
          text = repository.read_text(encoding='utf-8')
          signature = '        sha256: str,\n    ) -> StoredObject | None:'
          if text.count(signature) != 1:
              raise SystemExit(f'get_existing signature count={text.count(signature)}')
          text = text.replace(signature, '        sha256: str | None,\n    ) -> StoredObject | None:', 1)
          sha_clause = '                  AND sha256 = $3::CHAR(64)\n'
          if text.count(sha_clause) != 1:
              raise SystemExit(f'get_existing sha clause count={text.count(sha_clause)}')
          text = text.replace(
              sha_clause,
              '                  AND ($3::CHAR(64) IS NULL OR sha256 = $3::CHAR(64))\n'
              '                ORDER BY migrated_at DESC, id DESC\n'
              '                LIMIT 1\n',
              1,
          )
          repository.write_text(text, encoding='utf-8')

          backup_repo = root / 'velvet_bot/domains/telegram_storage/backup_repository.py'
          text = backup_repo.read_text(encoding='utf-8')
          text, count = re.subn(
              r'\n    async def latest_object_id_by_logical_key\(.*?(?=\n    async def list_backup_backfill)',
              '\n',
              text,
              count=1,
              flags=re.DOTALL,
          )
          if count != 1:
              raise SystemExit(f'backup repository cleanup count={count}')
          backup_repo.write_text(text, encoding='utf-8')

          init_path = root / 'velvet_bot/domains/telegram_storage/__init__.py'
          text = init_path.read_text(encoding='utf-8')
          old_import = 'from velvet_bot.domains.telegram_storage.integrity_service import (  # noqa: E402\n    TelegramStorageMigrationService,\n)'
          if text.count(old_import) != 1:
              raise SystemExit(f'integrity import count={text.count(old_import)}')
          text = text.replace(
              old_import,
              'from velvet_bot.domains.telegram_storage.service import (  # noqa: E402\n    TelegramStorageMigrationService,\n)',
              1,
          )
          init_path.write_text(text, encoding='utf-8')
          (root / 'velvet_bot/domains/telegram_storage/integrity_service.py').unlink()

          arthur = root / 'velvet_bot/core/config/arthur.py'
          text = arthur.read_text(encoding='utf-8')
          text, constants = re.subn(
              r'\n_DEFAULT_REPORT_CHAT_ID = -1004459280894\n_DEFAULT_REPORT_THREAD_ID = 2478\n',
              '\n',
              text,
              count=1,
          )
          text, helper = re.subn(
              r'\n\ndef _report_destination\(\) -> tuple\[int, int\]:.*?(?=\n\n@dataclass)',
              '',
              text,
              count=1,
              flags=re.DOTALL,
          )
          call = '        report_chat_id, report_thread_id = _report_destination()\n'
          if constants != 1 or helper != 1 or text.count(call) != 1:
              raise SystemExit(f'arthur cleanup constants={constants} helper={helper} call={text.count(call)}')
          text = text.replace(
              call,
              '        report_chat_id = (\n'
              '            _parse_optional_int("ARTHUR_REPORT_CHAT_ID")\n'
              '            or _parse_optional_int("TELEGRAM_STORAGE_CHAT_ID")\n'
              '            or -1004459280894\n'
              '        )\n'
              '        report_thread_id = (\n'
              '            _parse_optional_int("ARTHUR_REPORT_THREAD_ID")\n'
              '            or _parse_optional_int("STORAGE_THREAD_ANALYSIS")\n'
              '            or 2478\n'
              '        )\n',
              1,
          )
          arthur.write_text(text, encoding='utf-8')

          tests = root / 'tests/test_storage_topic_integrity.py'
          text = tests.read_text(encoding='utf-8')
          text = text.replace(
              'latest_object_id_by_logical_key=AsyncMock(return_value=3596),',
              'get_existing=AsyncMock(return_value=SimpleNamespace(object_id=3596)),',
          ).replace(
              'service.repository.latest_object_id_by_logical_key.assert_awaited_once()',
              'service.repository.get_existing.assert_awaited_once_with(\n'
              '                "backups",\n'
              '                "backup:42:' + ('a' * 64) + '",\n'
              '                None,\n'
              '            )',
              1,
          ).replace(
              'latest_object_id_by_logical_key=AsyncMock(return_value=3597),',
              'get_existing=AsyncMock(return_value=SimpleNamespace(object_id=3597)),',
          ).replace(
              'service.repository.latest_object_id_by_logical_key.assert_awaited_once()',
              'service.repository.get_existing.assert_awaited_once()',
              1,
          )
          tests.write_text(text, encoding='utf-8')
          PY

          python -m py_compile \
            velvet_bot/domains/telegram_storage/service.py \
            velvet_bot/domains/telegram_storage/repository.py \
            velvet_bot/domains/telegram_storage/backup_repository.py \
            velvet_bot/domains/telegram_storage/__init__.py \
            velvet_bot/core/config/arthur.py \
            tests/test_storage_topic_integrity.py

          python scripts/inventory_package_architecture_fast.py \
            --label p1-package-architecture-baseline --write

          python - <<'PY'
          import json
          import re
          import subprocess
          import sys
          from pathlib import Path

          p2_path = Path('docs/p2_stability_inventory.json')
          p2 = json.loads(p2_path.read_text(encoding='utf-8'))
          subprocess.run([
              sys.executable,
              'scripts/update_p2_stability_inventory.py',
              '--label', str(p2['generated_from_commit']),
              '--schema-version', str(p2['schema_version']),
          ], check=True)

          package = json.loads(Path('docs/package_architecture_inventory.json').read_text(encoding='utf-8'))
          shared = package['shared_contract_summary']
          expected = {
              'production_module_count': 656,
              'function_count': 3830,
              'violation_count': 523,
              'repository_module_count': 46,
          }
          actual = {
              'production_module_count': package['production_module_count'],
              'function_count': shared['function_count'],
              'violation_count': package['violation_count'],
              'repository_module_count': package['repository_module_count'],
          }
          if actual != expected:
              raise SystemExit(f'architecture contract drift: expected={expected} actual={actual}')

          test_path = Path('tests/test_package_architecture_inventory.py')
          text = test_path.read_text(encoding='utf-8')
          text = re.sub(
              r'self\.assertEqual\(\d+, self\.inventory\["production_loc"\]\)',
              f'self.assertEqual({package["production_loc"]}, self.inventory["production_loc"])',
              text,
          )
          text = re.sub(
              r'Production LOC: \*\*\d+\*\*',
              f'Production LOC: **{package["production_loc"]}**',
              text,
          )
          test_path.write_text(text, encoding='utf-8')
          print(json.dumps({**actual, 'production_loc': package['production_loc']}, indent=2))
          PY

          python -m unittest \
            tests.test_storage_topic_integrity \
            tests.test_package_architecture_inventory \
            tests.test_p2l_discussion_middleware_boundary

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add velvet_bot docs/package_architecture_inventory.json docs/package_architecture_inventory.md docs/p2_stability_inventory.json docs/p2_stability_inventory.md tests/test_storage_topic_integrity.py tests/test_package_architecture_inventory.py
          git commit -m "Refine Telegram storage integrity fix in existing boundaries"
          git push origin HEAD:"$GITHUB_REF_NAME"
