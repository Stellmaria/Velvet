name: sync pr 596 with main

on:
  push:
    branches:
      - fix/593-fail-closed-kael-coder-delegation
    paths:
      - ".github/workflows/sync-pr-596.yml"

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/593-fail-closed-kael-coder-delegation
          fetch-depth: 0
          persist-credentials: true

      - name: Merge current main and remove helper
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags origin main

          set +e
          git merge --no-ff --no-commit origin/main
          merge_status=$?
          set -e

          mapfile -t unresolved < <(git diff --name-only --diff-filter=U)
          if (( ${#unresolved[@]} > 1 )); then
            printf 'Unexpected merge conflicts:\n%s\n' "${unresolved[*]}" >&2
            exit 1
          fi
          if (( ${#unresolved[@]} == 1 )) && [[ "${unresolved[0]}" != "tests/test_ci_changed_surfaces.py" ]]; then
            printf 'Unexpected merge conflict: %s\n' "${unresolved[0]}" >&2
            exit 1
          fi
          if (( merge_status != 0 )) && (( ${#unresolved[@]} == 0 )); then
            echo "Merge failed without an expected resolvable conflict." >&2
            exit 1
          fi

          if (( ${#unresolved[@]} == 1 )); then
            git checkout --ours tests/test_ci_changed_surfaces.py
          fi

          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_ci_changed_surfaces.py")
          text = path.read_text(encoding="utf-8")
          old = '''    def test_project_notes_avoids_full_history_and_obsolete_runs(self) -> None:
                  source = NOTES_WORKFLOW.read_text(encoding="utf-8")
                  self.assertIn("cancel-in-progress: true", source)
                  self.assertIn("fetch-depth: 2", source)
                  self.assertNotIn("fetch-depth: 0", source)
                  self.assertNotIn("actions/setup-python", source)
                  self.assertNotIn("git fetch", source)
          '''
          new = '''    def test_project_notes_fetches_exact_base_without_obsolete_setup(self) -> None:
                  source = NOTES_WORKFLOW.read_text(encoding="utf-8")
                  self.assertIn("cancel-in-progress: true", source)
                  self.assertIn("fetch-depth: 0", source)
                  self.assertNotIn("fetch-depth: 2", source)
                  self.assertNotIn("actions/setup-python", source)
                  self.assertNotIn("git fetch", source)
                  self.assertIn("github.event.pull_request.base.sha", source)
          '''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit("project notes test block did not match either known version")
          path.write_text(text, encoding="utf-8")
          PY

          git add tests/test_ci_changed_surfaces.py
          git rm .github/workflows/sync-pr-596.yml
          git diff --check
          git commit -m "Merge main into fix/593 before final review"
          git push origin HEAD:fix/593-fail-closed-kael-coder-delegation
