name: refresh GPT Image final baselines

on:
  push:
    branches:
      - feat/gpt-image-2-codex

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message, '[gpt-image-baselines-refreshed]') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/gpt-image-2-codex
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"

      - name: Apply reviewed boundary and startup baseline
        run: |
          python - <<'PY'
          from pathlib import Path

          worker = Path("velvet_bot/domains/codex_image.py")
          text = worker.read_text(encoding="utf-8")
          old = "        except Exception as error:\n            await self._queue.fail("
          new = (
              "        except Exception as error:  "
              "# p2-approved-boundary: isolate-codex-image-task-failure\n"
              "            await self._queue.fail("
          )
          if text.count(old) != 1:
              raise SystemExit("unexpected Codex image broad-catch contract")
          worker.write_text(text.replace(old, new), encoding="utf-8")

          test = Path("tests/test_application_composition.py")
          text = test.read_text(encoding="utf-8")
          old = (
              '    "install_krita_remote_worker",\n'
              '    "install_auf_branding",\n'
          )
          new = (
              '    "install_krita_remote_worker",\n'
              '    "install_auf_gpt_image_2",\n'
              '    "install_auf_branding",\n'
          )
          if text.count(old) != 1:
              raise SystemExit("unexpected startup stage baseline")
          text = text.replace(old, new)
          if text.count("self.assertEqual(22, len(composition.feature_stage_names))") != 1:
              raise SystemExit("unexpected feature stage count baseline")
          text = text.replace(
              "self.assertEqual(22, len(composition.feature_stage_names))",
              "self.assertEqual(23, len(composition.feature_stage_names))",
          )
          test.write_text(text, encoding="utf-8")
          PY

      - name: Refresh P2 stability inventory
        run: |
          python scripts/update_p2_stability_inventory.py \
            --label gpt-image-2-codex-plus \
            --schema-version 80

      - name: Refresh package architecture inventory
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts import inventory_package_architecture as inventory

          data = inventory.build_inventory(label="working-tree")
          exemptions_path = Path("docs/package_architecture_exemptions.json")
          previous = json.loads(exemptions_path.read_text(encoding="utf-8"))
          observed = {str(row["id"]): row for row in data["violations"]}
          previous_rows = {
              str(row["id"]): row
              for row in previous.get("exceptions", [])
              if str(row.get("id", "")) in observed
          }
          consumers = inventory._reverse_consumers(list(data["modules"]))
          rows = [
              previous_rows.get(row_id)
              or inventory._suggest_exception(violation, consumers)
              for row_id, violation in sorted(observed.items())
          ]
          exemptions = {
              **previous,
              "generated_from": "working-tree",
              "shared_private_access_sha256": data["shared_contract_summary"]["private_access_sha256"],
              "root_module_sha256": data["root_module_sha256"],
              "exceptions": rows,
          }
          Path("docs/package_architecture_inventory.json").write_text(
              json.dumps(data, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          exemptions_path.write_text(
              json.dumps(exemptions, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          Path("docs/package_architecture_inventory.md").write_text(
              inventory.render_markdown(data, exemptions),
              encoding="utf-8",
          )
          errors = inventory.validate(data, exemptions)
          if errors:
              raise SystemExit("\n".join(errors))
          PY

      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/refresh-gpt-image-final-baselines.yml
          git config user.name "Velvet Architecture Bot"
          git config user.email "velvet-architecture@users.noreply.github.com"
          git add velvet_bot/domains/codex_image.py \
                  tests/test_application_composition.py \
                  docs/p2_stability_inventory.json \
                  docs/p2_stability_inventory.md \
                  docs/package_architecture_inventory.json \
                  docs/package_architecture_inventory.md \
                  docs/package_architecture_exemptions.json \
                  .github/workflows/refresh-gpt-image-final-baselines.yml
          git commit -m "chore: refresh GPT Image stability baselines [gpt-image-baselines-refreshed]"
          git push origin HEAD:feat/gpt-image-2-codex
