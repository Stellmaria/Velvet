name: Issue 457 canonical docs sync

on:
  push:
    branches:
      - feat/457-retire-legacy-delivery-installers

permissions:
  contents: write

jobs:
  sync-docs:
    if: contains(github.event.head_commit.message, 'trigger issue 457 docs sync')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Synchronize canonical issue 457 block
        run: python scripts/issue_457_doc_sync.py

      - name: Validate canonical docs and delivery contracts
        run: |
          python -m unittest \
            tests.test_canonical_docs_sync \
            tests.test_durable_media_delivery \
            tests.test_media_delivery_telegram \
            tests.test_media_delivery_ui_install
          python scripts/ci_preflight.py
          git diff --check

      - name: Commit synchronized docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git commit -m "docs: synchronize issue 457 canonical baseline"
          git push origin HEAD:feat/457-retire-legacy-delivery-installers
