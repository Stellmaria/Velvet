name: Temporary final Auf router refactor

on:
  push:
    branches:
      - agent/final-auf-router-layer

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/final-auf-router-layer
          fetch-depth: 0

      - name: Move generation routers to canonical Auf paths
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          root = Path('.')
          router_dir = root / 'velvet_bot/presentation/telegram/routers'
          workflow = root / '.github/workflows/temporary-final-auf-router-refactor.yml'

          symbol_replacements = [
              ('MeowVideoCallback', 'AufVideoCallback'),
              ('MeowVideoForm', 'AufVideoForm'),
              ('MeowRuntimeCallback', 'AufRuntimeCallback'),
              ('MeowRuntimeForm', 'AufRuntimeForm'),
              ('MeowCallback', 'AufCallback'),
              ('MeowForm', 'AufForm'),
              ('_MeowScopedAccessPolicy', '_AufScopedAccessPolicy'),
              ('handle_meow_', 'handle_auf_'),
              ('build_meow_', 'build_auf_'),
              ('install_meow_', 'install_auf_'),
              ('meow_runtime_service', 'auf_runtime_service'),
              ('meow_workspace_id', 'auf_workspace_id'),
              ('meow_runtime_workspace_id', 'auf_runtime_workspace_id'),
              ('meow_runtime_limit_target', 'auf_runtime_limit_target'),
              ('meow_video_', 'auf_video_'),
              ('meow_request_', 'auf_request_'),
          ]

          def transform_symbols(text: str) -> str:
              text = text.replace('workspace_meow', 'workspace_auf')
              for old, new in symbol_replacements:
                  text = text.replace(old, new)
              return text

          # Copy every active generation router to its canonical Auf path.
          source_paths = sorted(router_dir.glob('workspace_meow*.py'))
          source_paths = [
              path for path in source_paths
              if path.name != 'workspace_meow_wallet.py'
          ]
          canonical_paths: list[Path] = []
          for source in source_paths:
              target = source.with_name(source.name.replace('workspace_meow', 'workspace_auf'))
              text = transform_symbols(source.read_text(encoding='utf-8'))
              # Canonical callbacks produce new protocol prefixes.
              text = text.replace('prefix="meow"', 'prefix="auf"')
              text = text.replace('prefix="meowv"', 'prefix="aufv"')
              canonical_paths.append(target)
              target.write_text(text, encoding='utf-8')

          main_router = router_dir / 'workspace_auf.py'
          text = main_router.read_text(encoding='utf-8')
          callback_marker = dedent('''
              class AufCallback(CallbackData, prefix="auf"):
                  action: str
                  workspace_id: int = 0
                  value: str = ""
                  item_id: int = 0
                  offset: int = 0
          ''').strip()
          legacy_callback = dedent('''

              class LegacyMeowCallback(CallbackData, prefix="meow"):
                  """Parse callback payloads emitted before the Auf protocol migration."""

                  action: str
                  workspace_id: int = 0
                  value: str = ""
                  item_id: int = 0
                  offset: int = 0
          ''').rstrip()
          if 'class LegacyMeowCallback' not in text:
              text = text.replace(callback_marker, callback_marker + legacy_callback)

          form_marker = dedent('''
              class AufForm(StatesGroup):
                  choosing_input = State()
                  waiting_photo = State()
                  waiting_prompt = State()
                  choosing_settings = State()
                  reviewing = State()
          ''').strip()
          legacy_form = dedent('''

              class LegacyMeowForm(StatesGroup):
                  """Recognize in-progress forms created before the Auf state migration."""

                  choosing_input = State()
                  waiting_photo = State()
                  waiting_prompt = State()
                  choosing_settings = State()
                  reviewing = State()
          ''').rstrip()
          if 'class LegacyMeowForm' not in text:
              text = text.replace(form_marker, form_marker + legacy_form)
          main_router.write_text(text, encoding='utf-8')

          video_router = router_dir / 'workspace_auf_video.py'
          text = video_router.read_text(encoding='utf-8')
          video_callback_marker = dedent('''
              class AufVideoCallback(CallbackData, prefix="aufv"):
                  action: str
                  workspace_id: int = 0
                  value: str = ""
                  item_id: int = 0
                  offset: int = 0
          ''').strip()
          legacy_video_callback = dedent('''

              class LegacyMeowVideoCallback(CallbackData, prefix="meowv"):
                  """Parse video callbacks emitted before the Auf protocol migration."""

                  action: str
                  workspace_id: int = 0
                  value: str = ""
                  item_id: int = 0
                  offset: int = 0
          ''').rstrip()
          if 'class LegacyMeowVideoCallback' not in text:
              text = text.replace(
                  video_callback_marker,
                  video_callback_marker + legacy_video_callback,
              )

          video_form_marker = dedent('''
              class AufVideoForm(StatesGroup):
                  choosing_reference = State()
                  waiting_reference = State()
                  waiting_prompt = State()
                  choosing_settings = State()
                  reviewing = State()
          ''').strip()
          legacy_video_form = dedent('''

              class LegacyMeowVideoForm(StatesGroup):
                  """Recognize video forms created before the Auf state migration."""

                  choosing_reference = State()
                  waiting_reference = State()
                  waiting_prompt = State()
                  choosing_settings = State()
                  reviewing = State()
          ''').rstrip()
          if 'class LegacyMeowVideoForm' not in text:
              text = text.replace(
                  video_form_marker,
                  video_form_marker + legacy_video_form,
              )
          video_router.write_text(text, encoding='utf-8')

          # Transform active Python imports and names, excluding compatibility shims.
          excluded = set(source_paths) | {router_dir / 'workspace_meow_wallet.py'}
          for base in (root / 'velvet_bot', root / 'tests'):
              for path in base.rglob('*.py'):
                  if path in excluded:
                      continue
                  original = path.read_text(encoding='utf-8')
                  updated = transform_symbols(original)
                  if updated != original:
                      path.write_text(updated, encoding='utf-8')

          controller = root / 'velvet_bot/presentation/telegram/workspace_home_controller.py'
          text = controller.read_text(encoding='utf-8')
          text = text.replace(
              'from aiogram import F, Router',
              'from aiogram import F, Router\nfrom aiogram.filters import or_f',
          )
          text = text.replace(
              '    AufCallback,\n    AufForm,',
              '    AufCallback,\n    AufForm,\n    LegacyMeowCallback,\n    LegacyMeowForm,',
          )
          text = text.replace(
              '    AufVideoCallback,\n    AufVideoForm,',
              '    AufVideoCallback,\n    AufVideoForm,\n    LegacyMeowVideoCallback,\n    LegacyMeowVideoForm,',
          )
          helper_marker = 'router = Router(name=__name__)\n'
          helper = dedent('''

              def _auf_callback_filter(rule=None):
                  return or_f(
                      AufCallback.filter(rule),
                      LegacyMeowCallback.filter(rule),
                  )


              def _auf_video_callback_filter(rule=None):
                  return or_f(
                      AufVideoCallback.filter(rule),
                      LegacyMeowVideoCallback.filter(rule),
                  )
          ''').rstrip() + '\n'
          if 'def _auf_callback_filter' not in text:
              text = text.replace(helper_marker, helper_marker + helper)
          text = text.replace('AufCallback.filter(', '_auf_callback_filter(')
          text = text.replace('AufVideoCallback.filter(', '_auf_video_callback_filter(')
          text = text.replace(
              'WorkspaceCallback.filter(F.action == "auf")',
              'WorkspaceCallback.filter(F.action.in_({"auf", "meow"}))',
          )
          text = text.replace(
              'callback_data: AufCallback,',
              'callback_data: AufCallback | LegacyMeowCallback,',
          )
          text = text.replace(
              'callback_data: AufVideoCallback,',
              'callback_data: AufVideoCallback | LegacyMeowVideoCallback,',
          )
          controller.write_text(text, encoding='utf-8')

          runtime_init = root / 'velvet_bot/domains/auf_runtime/__init__.py'
          text = runtime_init.read_text(encoding='utf-8')
          text = text.replace(
              'AUF_WORKSPACE_ACTION = "meow"',
              'AUF_WORKSPACE_ACTION = "auf"\nLEGACY_AUF_WORKSPACE_ACTION = "meow"',
          )
          text = text.replace(
              '    "AUF_WORKSPACE_ACTION",',
              '    "AUF_WORKSPACE_ACTION",\n    "LEGACY_AUF_WORKSPACE_ACTION",',
          )
          runtime_init.write_text(text, encoding='utf-8')

          ui_install = root / 'velvet_bot/app/auf_workspace_ui_install.py'
          text = ui_install.read_text(encoding='utf-8')
          old = 'for prefix in ("meow:", "mrt:", "meowv|"):'
          new = 'for prefix in ("auf:", "meow:", "mrt:", "aufv|", "meowv|"):'
          text = text.replace(old, new)
          ui_install.write_text(text, encoding='utf-8')

          # Compatibility modules retain historical imports but no implementation.
          def write_shim(source: Path, canonical: Path) -> None:
              module_name = canonical.stem
              content = dedent(f'''
                  """Compatibility module for the retired {source.stem} path."""

                  from velvet_bot.presentation.telegram.routers import {module_name} as _canonical
                  from velvet_bot.presentation.telegram.routers.{module_name} import *  # noqa: F403

                  def __getattr__(name: str):
                      direct = getattr(_canonical, name, None)
                      if direct is not None:
                          return direct
                      mapped = name.replace("Meow", "Auf").replace("meow", "auf")
                      return getattr(_canonical, mapped)
              ''').lstrip()
              if source.name == 'workspace_meow.py':
                  content += dedent('''

                      MeowCallback = _canonical.LegacyMeowCallback
                      MeowForm = _canonical.LegacyMeowForm
                  ''')
              elif source.name == 'workspace_meow_video.py':
                  content += dedent('''

                      MeowVideoCallback = _canonical.LegacyMeowVideoCallback
                      MeowVideoForm = _canonical.LegacyMeowVideoForm
                  ''')
              source.write_text(content, encoding='utf-8')

          for source, canonical in zip(source_paths, canonical_paths):
              write_shim(source, canonical)

          boundary = root / 'tests/test_auf_router_brand_boundary.py'
          boundary.write_text(dedent('''
              from __future__ import annotations
              from pathlib import Path

              ROOT = Path(__file__).resolve().parents[1]
              ROUTERS = ROOT / "velvet_bot/presentation/telegram/routers"

              def _read(path: Path) -> str:
                  return path.read_text(encoding="utf-8")

              def test_canonical_auf_routers_do_not_import_retired_paths() -> None:
                  for path in ROUTERS.glob("workspace_auf*.py"):
                      source = _read(path)
                      assert "workspace_meow" not in source, path
                      assert "class Meow" not in source, path

              def test_retired_generation_routers_are_only_compatibility_modules() -> None:
                  for path in ROUTERS.glob("workspace_meow*.py"):
                      if path.name == "workspace_meow_wallet.py":
                          continue
                      source = _read(path)
                      assert "Compatibility module" in source, path
                      assert len(source.splitlines()) <= 24, path

              def test_new_callback_protocol_is_auf_and_legacy_is_read_only() -> None:
                  photo = _read(ROUTERS / "workspace_auf.py")
                  video = _read(ROUTERS / "workspace_auf_video.py")
                  controller = _read(
                      ROOT / "velvet_bot/presentation/telegram/workspace_home_controller.py"
                  )
                  assert 'class AufCallback(CallbackData, prefix="auf")' in photo
                  assert 'class LegacyMeowCallback(CallbackData, prefix="meow")' in photo
                  assert 'class AufVideoCallback(CallbackData, prefix="aufv")' in video
                  assert 'class LegacyMeowVideoCallback(CallbackData, prefix="meowv")' in video
                  assert "_auf_callback_filter" in controller
                  assert 'F.action.in_({"auf", "meow"})' in controller

              def test_new_workspace_buttons_use_auf_action() -> None:
                  source = _read(ROOT / "velvet_bot/domains/auf_runtime/__init__.py")
                  assert 'AUF_WORKSPACE_ACTION = "auf"' in source
                  assert 'LEGACY_AUF_WORKSPACE_ACTION = "meow"' in source
          ''').lstrip(), encoding='utf-8')

          worklog = root / 'docs/worklog/2026-07-30-auf-router-protocol-migration.md'
          worklog.write_text(dedent('''
              # 2026-07-30 — перенос Telegram router-протокола в Ауф

              - Дата: 2026-07-30
              - ID: `auf-router-protocol-migration`
              - Линия/фаза: AI media generation / Telegram protocol cleanup
              - Статус: `завершено`
              - Ветка: `agent/final-auf-router-layer`
              - Базовый commit: `28025c2b65b6aa70baf9c22d840ceab5b0394b1e`

              ## Перед началом

              ### Цель
              Перенести активные generation-router файлы, callback classes и новые callback payload с Meow на Ауф, сохранив чтение уже отправленных Telegram-кнопок.

              ### Исходный контекст
              Runtime и wallet уже находились в canonical `auf_*` domains, но production controller продолжал импортировать `workspace_meow*`, создавать `meow:`/`meowv|` payload и использовать классы `MeowCallback`/`MeowForm`.

              ### Планируемый объём
              - создать canonical `workspace_auf*` routers;
              - выпускать новые callback payload с `auf:` и `aufv|`;
              - принимать старые payload через legacy parsers;
              - перевести production imports и tests;
              - оставить retired files короткими compatibility modules;
              - синхронизировать generated inventories.

              ### Критерии готовности
              - production imports используют `workspace_auf*`;
              - новые кнопки используют Auf callback classes;
              - старые callback payload продолжают маршрутизироваться;
              - retired router files не содержат реализации;
              - полный CI проходит.

              ### Риски и ограничения
              Старые FSM-сессии могут потребовать повторного входа в незавершённый сценарий после deploy. SQL/module storage migration выполняется отдельной фазой и не смешивается с Telegram protocol change.

              ## После завершения

              ### Фактически сделано
              - реальные photo/video/root/runtime/balance routers перенесены в `workspace_auf*`;
              - controller и tests переключены на canonical symbols;
              - новые callback prefixes: `auf:` и `aufv|`;
              - legacy parsers принимают `meow:` и `meowv|`;
              - новое workspace action: `auf`, legacy action `meow` продолжает приниматься;
              - access-policy allowlist содержит новые и старые prefixes;
              - retired router files сведены к compatibility delegation;
              - добавлен архитектурный contract для router boundary.

              ### Миграции и совместимость
              PostgreSQL schema и module key не менялись. Старые Telegram callback payload принимаются через `LegacyMeowCallback` и `LegacyMeowVideoCallback`.

              ### Проверки
              Generated architecture, P2 stability и Telegram navigation inventories пересобираются после миграции; полный CI запускается на итоговом head.

              ### PR и commit
              PR и итоговый commit фиксируются после зелёного CI.

              ### Незавершённое
              - SQL table/module-key migration с `meow_*` на `auf_*`;
              - удаление legacy callback parsers после окончания переходного периода;
              - явная миграция незавершённых FSM-сессий, если production storage сохраняет их между deploy.

              ### Следующий шаг
              Получить зелёный CI, слить router migration, затем отдельным PR переименовать persistent SQL/module identifiers с транзакционной data migration.
          ''').lstrip(), encoding='utf-8')

          workflow.unlink()
          PY

          python scripts/inventory_architecture_layout.py \
            --write \
            --label p3d-analytics-alias-retirement
          python scripts/update_p2_stability_inventory.py \
            --label p2-auf-router-protocol-migration \
            --schema-version 66
          python scripts/telegram_navigation_inventory.py \
            --root velvet_bot \
            --markdown docs/generated/telegram_navigation_inventory.md

      - name: Commit canonical Auf routers and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Перенести Telegram routers и callbacks в Ауф"
          git push origin HEAD:agent/final-auf-router-layer
