name: pr722 refresh integrated inventory

on:
  push:
    branches:
      - fix/storage-librarian-scheduler-lifecycle

permissions:
  contents: write

jobs:
  refresh:
    if: github.event.head_commit.message == 'Refresh PR 722 integrated architecture inventory'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/storage-librarian-scheduler-lifecycle
      - name: Refresh and self-clean
        run: |
          set -euo pipefail
          cp docs/package_architecture_inventory.json /tmp/before.json
          python scripts/inventory_package_architecture.py \
            --write \
            --label p1-package-architecture-baseline
          python - <<'PY'
          import json
          from pathlib import Path
          before = json.loads(Path('/tmp/before.json').read_text())
          after = json.loads(Path('docs/package_architecture_inventory.json').read_text())
          for key in sorted(set(before) | set(after)):
              if before.get(key) != after.get(key) and key != 'modules':
                  print('changed top-level:', key)
          print('production_loc=', after['production_loc'])
          print('violation_count=', after['violation_count'])
          PY
          git rm -- .github/workflows/pr722-refresh-integrated-inventory.yml
          git add -- docs/package_architecture_inventory.json docs/package_architecture_inventory.md
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh integrated architecture inventory'
          git push origin HEAD:fix/storage-librarian-scheduler-lifecycle
