name: project notes contract

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  notes:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Skip worklog validation for Dependabot
        if: github.actor == 'dependabot[bot]'
        run: echo "Dependabot dependency updates do not require a project worklog."

      - name: Checkout
        if: github.actor != 'dependabot[bot]'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Long-lived PRs may retain a base SHA older than the latest main tip.
          # The validator needs that exact commit for its symmetric diff.
          fetch-depth: 0
          persist-credentials: false

      - name: Validate project memory and worklog
        if: github.actor != 'dependabot[bot]'
        run: >-
          python scripts/check_project_notes.py
          --base-ref "${{ github.event.pull_request.base.sha }}"
