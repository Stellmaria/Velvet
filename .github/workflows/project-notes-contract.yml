name: project notes contract

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-personal-quality-route:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TEST_DATABASE_URL: postgresql://velvet:velvet_test_password@localhost:5432/velvet_test
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: feature/provider-neutral-personal-quality-563

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.13'

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v7.2.1
        with:
          version: '0.11.16'
          enable-cache: true
          cache-dependency-glob: requirements.lock
          save-cache: false

      - name: Start PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          sudo systemctl start postgresql.service
          sudo -u postgres psql --set=ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'velvet') THEN
              CREATE ROLE velvet LOGIN SUPERUSER PASSWORD 'velvet_test_password';
            ELSE
              ALTER ROLE velvet WITH LOGIN SUPERUSER PASSWORD 'velvet_test_password';
            END IF;
          END
          $$;
          SELECT 'CREATE DATABASE velvet_test OWNER velvet'
          WHERE NOT EXISTS (
            SELECT 1 FROM pg_database WHERE datname = 'velvet_test'
          )\gexec
          ALTER DATABASE velvet_test OWNER TO velvet;
          SQL
          pg_isready -h localhost -p 5432 -U velvet -d velvet_test

      - name: Apply and verify bounded patch
        shell: bash
        run: |
          set -euo pipefail
          uv pip install --system --require-hashes -r requirements.lock
          python scripts/_patch_personal_quality_route_563.py
          python -m compileall -q main.py velvet_bot scripts tests
          python -m unittest \
            tests.test_workspace_personal_quality_route \
            tests.test_workspace_qwen_product \
            tests.test_vision_cascade_router -v

      - name: Commit verified patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            velvet_bot/ai_quality.py \
            velvet_bot/app/workers.py \
            velvet_bot/domains/vision_routing/client.py \
            velvet_bot/domains/vision_routing/factory.py \
            velvet_bot/domains/vision_routing/models.py \
            velvet_bot/domains/vision_routing/service.py \
            velvet_bot/domains/workspaces/qwen_repository.py \
            velvet_bot/services/workspace_qwen_quality.py
          git commit -m "feat: route personal quality through shared vision cascade"
          git push origin HEAD:feature/provider-neutral-personal-quality-563

  notes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.13'

      - name: Fetch base branch
        run: git fetch --no-tags origin "${{ github.base_ref }}"

      - name: Validate project memory and worklog
        run: python scripts/check_project_notes.py --base-ref "origin/${{ github.base_ref }}"
