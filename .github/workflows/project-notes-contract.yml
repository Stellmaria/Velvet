name: project notes contract

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  refresh-personal-quality-evidence:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TEST_DATABASE_URL: postgresql://velvet:velvet_test_password@localhost:5432/velvet_test
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: feature/provider-neutral-personal-quality-563

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.13'

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v7.2.1
        with:
          version: '0.11.16'
          enable-cache: true
          cache-dependency-glob: requirements.lock
          save-cache: false

      - name: Start PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          sudo systemctl start postgresql.service
          sudo -u postgres psql --set=ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'velvet') THEN
              CREATE ROLE velvet LOGIN SUPERUSER PASSWORD 'velvet_test_password';
            ELSE
              ALTER ROLE velvet WITH LOGIN SUPERUSER PASSWORD 'velvet_test_password';
            END IF;
          END
          $$;
          SELECT 'CREATE DATABASE velvet_test OWNER velvet'
          WHERE NOT EXISTS (
            SELECT 1 FROM pg_database WHERE datname = 'velvet_test'
          )\gexec
          ALTER DATABASE velvet_test OWNER TO velvet;
          SQL
          pg_isready -h localhost -p 5432 -U velvet -d velvet_test

      - name: Refresh and verify canonical evidence
        shell: bash
        run: |
          set -euo pipefail
          uv pip install --system --require-hashes -r requirements.lock
          python scripts/_refresh_personal_quality_evidence_563.py
          python -m compileall -q main.py velvet_bot scripts tests
          python scripts/inventory_repository_layout.py \
            --check \
            --label p3e-repository-layout-complete
          python scripts/inventory_package_architecture.py \
            --check \
            --label p1-package-architecture-baseline
          python -m unittest \
            tests.test_local_vision_provider_contract \
            tests.test_workspace_personal_quality_route \
            tests.test_workspace_qwen_product \
            tests.test_vision_cascade_router \
            tests.test_p3e_repository_layout_inventory \
            tests.test_package_architecture_inventory -v
          python scripts/ci_preflight.py

      - name: Commit verified evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            docs/package_architecture_exemptions.json \
            docs/package_architecture_inventory.json \
            docs/package_architecture_inventory.md \
            docs/repository_layout_inventory.json \
            docs/repository_layout_inventory.md \
            tests/test_package_architecture_inventory.py \
            tests/test_p3e_repository_layout_inventory.py
          if git diff --cached --quiet; then
            echo "Canonical evidence is already current."
            exit 0
          fi
          git commit -m "docs: refresh personal quality architecture evidence"
          git push origin HEAD:feature/provider-neutral-personal-quality-563

  notes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.13'

      - name: Fetch base branch
        run: git fetch --no-tags origin "${{ github.base_ref }}"

      - name: Validate project memory and worklog
        run: python scripts/check_project_notes.py --base-ref "origin/${{ github.base_ref }}"
