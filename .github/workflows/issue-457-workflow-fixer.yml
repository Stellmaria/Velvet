name: Fix issue 457 maintenance workflow

on:
  push:
    branches:
      - feat/457-retire-legacy-delivery-installers

permissions:
  contents: write

jobs:
  fix-workflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Relax exact replacement guard for staged duplicates
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/issue-457-branch-maintenance.yml')
          content = path.read_text(encoding='utf-8')
          old = """              if count != 1:\n                  raise SystemExit(f'{path}: expected one replacement, found {count}: {old[:80]!r}')\n"""
          new = """              if count < 1:\n                  raise SystemExit(f'{path}: expected a replacement, found {count}: {old[:80]!r}')\n"""
          if content.count(old) != 1:
              raise SystemExit('maintenance guard not found exactly once')
          path.write_text(content.replace(old, new, 1), encoding='utf-8')
          Path('.github/workflows/issue-457-workflow-fixer.yml').unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ci: fix issue 457 maintenance guard"
          git push origin HEAD:feat/457-retire-legacy-delivery-installers
