name: pr528 sync current main

on:
  push:
    branches:
      - agent/fix-media-result-auto-delivery

permissions:
  contents: write

jobs:
  sync-generate-and-commit:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-media-result-auto-delivery
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Merge current main safely
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-commit --no-ff origin/main || true

          conflicts="$(git diff --name-only --diff-filter=U)"
          for path in \
            docs/package_architecture_inventory.json \
            docs/package_architecture_inventory.md \
            docs/package_architecture_exemptions.json \
            tests/test_package_architecture_inventory.py; do
            if printf '%s\n' "$conflicts" | grep -Fxq "$path"; then
              git checkout --theirs -- "$path"
              git add "$path"
            fi
          done

          remaining="$(git diff --name-only --diff-filter=U)"
          if [ -n "$remaining" ]; then
            printf 'Unresolved merge conflicts:\n%s\n' "$remaining" >&2
            exit 1
          fi
          git add -A
          if git rev-parse -q --verify MERGE_HEAD >/dev/null; then
            git commit -m "Синхронизировать доставку результата с текущим main"
          fi
      - name: Generate combined package architecture baseline
        run: >-
          python scripts/inventory_package_architecture.py
          --write
          --bootstrap-exemptions
          --label p1-package-architecture-baseline
      - name: Update exact architecture and worklog expectations
        run: |
          python - <<'PY'
          import json
          import re
          import subprocess
          from pathlib import Path

          inventory = json.loads(
              Path("docs/package_architecture_inventory.json").read_text(encoding="utf-8")
          )
          loc = int(inventory["production_loc"])
          path = Path("tests/test_package_architecture_inventory.py")
          text = path.read_text(encoding="utf-8")
          text = re.sub(
              r'self\.assertEqual\(\d[\d_]*, self\.inventory\["production_loc"\]\)',
              f'self.assertEqual({loc:_}, self.inventory["production_loc"])',
              text,
          )
          text = re.sub(
              r'self\.assertIn\("Production LOC: \*\*\d+\*\*", self\.markdown\)',
              f'self.assertIn("Production LOC: **{loc}**", self.markdown)',
              text,
          )
          path.write_text(text, encoding="utf-8")

          main_sha = subprocess.check_output(
              ["git", "rev-parse", "origin/main"], text=True
          ).strip()
          worklog = Path("docs/worklog/2026-08-01-media-result-auto-delivery.md")
          worklog_text = worklog.read_text(encoding="utf-8")
          worklog_text = re.sub(
              r'- Базовый commit: `[^`]+`',
              f'- Базовый commit: `{main_sha}`',
              worklog_text,
              count=1,
          )
          worklog.write_text(worklog_text, encoding="utf-8")
          PY
      - name: Remove temporary workflow
        run: rm .github/workflows/pr528-sync-main.yml
      - name: Commit final synchronized branch
        run: |
          git add docs/package_architecture_inventory.json \
            docs/package_architecture_inventory.md \
            docs/package_architecture_exemptions.json \
            docs/worklog/2026-08-01-media-result-auto-delivery.md \
            tests/test_package_architecture_inventory.py \
            .github/workflows/pr528-sync-main.yml
          git commit -m "Обновить combined architecture baseline доставки"
          git push origin HEAD:agent/fix-media-result-auto-delivery
