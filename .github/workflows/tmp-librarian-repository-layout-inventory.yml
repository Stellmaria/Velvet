name: tmp-librarian-repository-layout-inventory

on:
  push:
    branches:
      - fix/storage-librarian-stale-running-recovery

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Generate repository layout inventory
        run: >-
          python scripts/inventory_repository_layout.py
          --write
          --label "p3e-repository-layout-complete"

      - name: Commit generated inventory and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/repository_layout_inventory.json docs/repository_layout_inventory.md
          git rm .github/workflows/tmp-librarian-repository-layout-inventory.yml
          git commit -m "Regenerate repository layout inventory"
          git push origin HEAD:fix/storage-librarian-stale-running-recovery
