name: PR 523 merge probe

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - agent/issue-511-media-delivery-boundaries

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/issue-511-media-delivery-boundaries
          fetch-depth: 0
      - name: Probe merge with current main
        shell: bash
        run: |
          set -u
          git fetch origin main
          set +e
          git merge --no-commit --no-ff origin/main
          merge_rc=$?
          set -e
          echo "merge_rc=$merge_rc"
          echo "conflicts_begin"
          git diff --name-only --diff-filter=U | sort
          echo "conflicts_end"
          echo "status_begin"
          git status --short
          echo "status_end"
          git merge --abort >/dev/null 2>&1 || true
          exit 0
