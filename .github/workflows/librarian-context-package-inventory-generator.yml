name: Temporary package inventory trusted generator

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  refresh-package-inventory:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'fix/librarian-context-budget'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up CI Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"

      - name: Regenerate package architecture snapshots
        run: >-
          python scripts/inventory_package_architecture.py
          --write
          --label p1-package-architecture-baseline

      - name: Sync generated LOC contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          inventory = json.loads(
              Path("docs/package_architecture_inventory.json").read_text(encoding="utf-8")
          )
          loc = int(inventory["production_loc"])
          path = Path("tests/test_package_architecture_inventory.py")
          text = path.read_text(encoding="utf-8")
          text, count_code = re.subn(
              r'self\.assertEqual\(\d+, self\.inventory\["production_loc"\]\)',
              f'self.assertEqual({loc}, self.inventory["production_loc"])',
              text,
              count=1,
          )
          text, count_md = re.subn(
              r'self\.assertIn\("Production LOC: \*\*\d+\*\*", self\.markdown\)',
              f'self.assertIn("Production LOC: **{loc}**", self.markdown)',
              text,
              count=1,
          )
          if count_code != 1 or count_md != 1:
              raise SystemExit("Could not update package inventory LOC contract exactly once")
          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit generated snapshots only
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- \
            docs/package_architecture_inventory.json \
            docs/package_architecture_inventory.md \
            tests/test_package_architecture_inventory.py; then
            echo "Package architecture snapshots are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/package_architecture_inventory.json \
            docs/package_architecture_inventory.md \
            tests/test_package_architecture_inventory.py
          git commit -m "Refresh package architecture inventory"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
