name: Rebase and apply issue 605 batching

on:
  push:
    branches:
      - feat/issue-605-error-incident-batching-v2

permissions:
  contents: write

concurrency:
  group: issue-605-rebase-apply
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout fresh feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/issue-605-error-incident-batching-v2
          fetch-depth: 0

      - name: Restore reviewed issue artifacts
        run: |
          git fetch origin feat/issue-605-error-incident-batching
          git show c32cc638158c27cd83fbb0c035e0d3af47b9869e:scripts/apply_issue_605.py > scripts/apply_issue_605.py
          git show origin/feat/issue-605-error-incident-batching:tests/test_error_incident_aggregation.py > tests/test_error_incident_aggregation.py
          git show origin/feat/issue-605-error-incident-batching:docs/worklog/2026-08-06-error-incident-write-amplification-605.md > docs/worklog/2026-08-06-error-incident-write-amplification-605.md

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply batching and regenerate current baselines
        run: python scripts/apply_issue_605.py

      - name: Verify transformed source
        run: |
          python -m py_compile velvet_bot/error_center.py
          test ! -e scripts/apply_issue_605.py
          test ! -e .github/workflows/issue-605-apply.yml
          git diff --check

      - name: Commit rebased implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: batch repeated error incidents (#605)"
          git push origin HEAD:feat/issue-605-error-incident-batching-v2
