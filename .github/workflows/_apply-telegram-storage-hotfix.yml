name: Apply Telegram storage hotfix

on:
  push:
    branches:
      - fix/telegram-storage-permission-noise

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Apply source and regression tests
        shell: bash
        env:
          TEST_B64: 
          WORKLOG_B64: 
        run: |
          python - <<'PY'
          import base64
          import os
          from pathlib import Path

          source = Path("velvet_bot/domains/telegram_storage/deletion.py")
          text = source.read_text(encoding="utf-8")
          old = "\n".join(
              (
                  "    logger.info(",
                  '        "telegram_storage_deletion_result "',
                  '        "policy=%s dry_run=%s planned=%s deleted=%s issues=%s freed_bytes=%s",',
                  "        result.policy_name,",
                  "        result.dry_run,",
                  "        len(result.planned),",
                  "        result.deleted_count,",
                  "        len(result.issues),",
                  "        result.freed_bytes,",
                  "    )",
                  "",
              )
          )
          new = "\n".join(
              (
                  "    level = (",
                  "        logging.INFO",
                  "        if result.planned",
                  "        or result.deleted_paths",
                  "        or result.issues",
                  "        or result.freed_bytes",
                  "        else logging.DEBUG",
                  "    )",
                  "    logger.log(",
                  "        level,",
                  '        "telegram_storage_deletion_result "',
                  '        "policy=%s dry_run=%s planned=%s deleted=%s issues=%s freed_bytes=%s",',
                  "        result.policy_name,",
                  "        result.dry_run,",
                  "        len(result.planned),",
                  "        result.deleted_count,",
                  "        len(result.issues),",
                  "        result.freed_bytes,",
                  "    )",
                  "",
              )
          )
          if old not in text:
              raise SystemExit("deletion audit block not found")
          source.write_text(text.replace(old, new, 1), encoding="utf-8")
          Path("tests/test_telegram_storage_permission_noise.py").write_bytes(
              base64.b64decode(os.environ["TEST_B64"])
          )
          Path("docs/worklog/2026-08-05-telegram-storage-permission-noise.md").write_bytes(
              base64.b64decode(os.environ["WORKLOG_B64"])
          )
          PY

      - name: Commit hotfix and remove helper workflow
        shell: bash
        run: |
          rm .github/workflows/_apply-telegram-storage-hotfix.yml
          rm -f .github/hotfix-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- velvet_bot/domains/telegram_storage/deletion.py tests/test_telegram_storage_permission_noise.py docs/worklog/2026-08-05-telegram-storage-permission-noise.md .github/workflows/_apply-telegram-storage-hotfix.yml .github/hotfix-trigger
          git commit -m "Fix Telegram storage permission isolation logging"
          git push origin HEAD:fix/telegram-storage-permission-noise
