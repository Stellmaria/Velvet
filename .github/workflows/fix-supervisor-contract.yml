name: fix supervisor deploy contract

on:
  push:
    branches:
      - security/supply-chain-gates-512
    paths:
      - ".github/workflows/fix-supervisor-contract.yml"

permissions:
  contents: write

jobs:
  patch-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: security/supply-chain-gates-512

      - name: Require digest-based bot deployment
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_server_supervisor_contract.py")
          source = path.read_text(encoding="utf-8")
          old = '        self.assertIn("build --pull bot supervisor-proxy", self.deploy)\n'
          new = '''        self.assertIn('"${compose[@]}" build --pull supervisor-proxy', self.deploy)
        self.assertIn('IMAGE_OVERRIDE="${VELVET_DEPLOY_IMAGE:-}"', self.deploy)
        self.assertIn('docker pull "$IMAGE_OVERRIDE"', self.deploy)
        self.assertIn("org.opencontainers.image.revision", self.deploy)
        self.assertIn("Running image mismatch", self.deploy)
'''
          if old not in source:
              raise SystemExit("Expected legacy deploy assertion was not found")
          path.write_text(source.replace(old, new, 1), encoding="utf-8")
          PY
          python -m unittest tests.test_server_supervisor_contract.ServerSupervisorContractTests.test_deploy_preserves_backup_gate_and_supports_verified_rollback -v
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_server_supervisor_contract.py
          git commit -m "test: require digest-based supervisor deployment"
          git push origin HEAD:security/supply-chain-gates-512
