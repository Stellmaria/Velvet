name: branch protection contract

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  checks: read

concurrency:
  group: branch-protection-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  docker-build-contract:
    name: docker-build-contract
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify conditional Docker build
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          GH_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import fnmatch
          import json
          import os
          import subprocess
          import time
          import urllib.request

          patterns = (
              "Dockerfile",
              "Dockerfile.krita-server",
              "Dockerfile.server-supervisor-proxy",
              "Dockerfile.vision-gateway",
              "Dockerfile.vision-runtime",
              ".dockerignore",
              "docker-compose.yml",
              "docker-compose.server.yml",
              ".env.example",
              ".env.server.example",
              ".env.hermes.example",
              ".env.vision-local.example",
              "deploy/**",
              "tools/krita/**",
              "vision_gateway/**",
              "requirements.txt",
              "requirements.lock",
              "requirements.vision-gateway.txt",
              "main.py",
              "velvet_bot/**",
              "scripts/container_healthcheck.py",
              "scripts/hermes_incident_monitor.py",
              "scripts/krita_server_healthcheck.py",
              "scripts/server_supervisor.py",
              "scripts/server_supervisor_proxy.py",
              "scripts/vision_runtime_entrypoint.sh",
              "scripts/vision_model_loader.sh",
              "scripts/benchmark_vision_gateway.py",
              ".github/workflows/docker-build.yml",
              ".github/workflows/deploy-production.yml",
          )

          def git_output(*args: str) -> list[str]:
              result = subprocess.run(
                  ("git", *args),
                  check=True,
                  text=True,
                  stdout=subprocess.PIPE,
              )
              return [line for line in result.stdout.splitlines() if line]

          event_name = os.environ["EVENT_NAME"]
          if event_name == "workflow_dispatch":
              changed = ["Dockerfile"]
          elif event_name == "pull_request":
              base_ref = os.environ["BASE_REF"]
              subprocess.run(
                  ("git", "fetch", "--no-tags", "origin", base_ref),
                  check=True,
              )
              changed = git_output(
                  "diff",
                  "--name-only",
                  f"origin/{base_ref}...HEAD",
              )
          else:
              before_sha = os.environ.get("BEFORE_SHA", "")
              if before_sha and set(before_sha) != {"0"}:
                  changed = git_output(
                      "diff",
                      "--name-only",
                      f"{before_sha}...HEAD",
                  )
              else:
                  changed = git_output("show", "--pretty=", "--name-only", "HEAD")

          relevant = sorted(
              path
              for path in changed
              if any(fnmatch.fnmatch(path, pattern) for pattern in patterns)
          )
          if not relevant:
              print("Docker build is not required for this change set.")
              raise SystemExit(0)

          print("Docker build is required for:")
          for path in relevant:
              print(f"- {path}")

          url = (
              f"https://api.github.com/repos/{os.environ['REPOSITORY']}"
              f"/commits/{os.environ['GH_SHA']}/check-runs?per_page=100"
          )
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "velvet-docker-build-contract",
          }
          deadline = time.monotonic() + 40 * 60
          poll_interval_seconds = 5
          while time.monotonic() < deadline:
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=20) as response:
                  payload = json.load(response)
              matches = [
                  item
                  for item in payload.get("check_runs", [])
                  if item.get("name") == "build"
              ]
              if not matches:
                  print("Waiting for docker build check to appear...")
                  time.sleep(poll_interval_seconds)
                  continue

              check = max(matches, key=lambda item: int(item.get("id", 0)))
              status = check.get("status")
              conclusion = check.get("conclusion")
              print(f"Docker build status={status} conclusion={conclusion}")
              if status != "completed":
                  time.sleep(poll_interval_seconds)
                  continue
              if conclusion != "success":
                  raise SystemExit(
                      f"Docker build did not succeed: {conclusion or 'unknown'}"
                  )
              print("Conditional Docker build verified.")
              raise SystemExit(0)

          raise SystemExit("Timed out waiting for conditional Docker build")
          PY

  branch-protection-contract:
    name: branch-protection-contract
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify main required checks
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          expected = {
              "unit-tests",
              "mypy-bounded",
              "notes",
              "docker-build-contract",
              "codeql-python",
              "codeql-actions",
              "supply-chain-contract",
              "static-security",
              "image-security",
              "branch-protection-contract",
          }
          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['REPOSITORY']}/branches/main",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "velvet-branch-protection-contract",
              },
          )
          with urllib.request.urlopen(request, timeout=20) as response:
              branch = json.load(response)

          if not branch.get("protected"):
              raise SystemExit("main is not protected")

          status_checks = branch.get("protection", {}).get("required_status_checks") or {}
          contexts = set(status_checks.get("contexts") or [])
          contexts.update(
              check["context"]
              for check in status_checks.get("checks") or []
              if isinstance(check, dict) and check.get("context")
          )
          missing = sorted(expected - contexts)
          if missing:
              raise SystemExit(
                  "main is missing required checks: " + ", ".join(missing)
              )

          print("main required checks verified:", ", ".join(sorted(expected)))
          PY
