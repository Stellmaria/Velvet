name: temporary package inventory diff

on:
  push:
    branches:
      - fix/storage-topic-integrity

permissions:
  contents: read

jobs:
  diff:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Show generated inventory diff
        shell: bash
        run: |
          set -euo pipefail
          python scripts/inventory_package_architecture.py --label p1-package-architecture-baseline --write
          git diff -- docs/package_architecture_inventory.json docs/package_architecture_inventory.md | head -n 300 || true
