name: temporary finalize storage architecture baseline

on:
  push:
    branches:
      - agent/issue-507-storage-deletion-policy

permissions:
  contents: write

concurrency:
  group: temporary-storage-baseline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/issue-507-storage-deletion-policy
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"

      - name: Regenerate, sync and self-remove
        shell: bash
        run: |
          set -euo pipefail
          python scripts/inventory_package_architecture.py \
            --write \
            --label p1-package-architecture-baseline
          python - <<'PY'
          from __future__ import annotations

          import json
          import re
          from pathlib import Path

          inventory = json.loads(
              Path("docs/package_architecture_inventory.json").read_text(encoding="utf-8")
          )
          path = Path("tests/test_package_architecture_inventory.py")
          text = path.read_text(encoding="utf-8")
          replacements = (
              (
                  r'self\.assertEqual\(\d+, self\.inventory\["production_module_count"\]\)',
                  f'self.assertEqual({inventory["production_module_count"]}, self.inventory["production_module_count"])',
              ),
              (
                  r'self\.assertEqual\([\d_]+, self\.inventory\["production_loc"\]\)',
                  f'self.assertEqual({inventory["production_loc"]:_}, self.inventory["production_loc"])',
              ),
              (
                  r'self\.assertEqual\(\d+, shared\["production_python_files"\]\)',
                  f'self.assertEqual({inventory["shared_contract_summary"]["production_python_files"]}, shared["production_python_files"])',
              ),
              (
                  r'self\.assertEqual\([\d_]+, shared\["function_count"\]\)',
                  f'self.assertEqual({inventory["shared_contract_summary"]["function_count"]:_}, shared["function_count"])',
              ),
              (
                  r'self\.assertIn\("Production modules: \*\*\d+\*\*", self\.markdown\)',
                  f'self.assertIn("Production modules: **{inventory["production_module_count"]}**", self.markdown)',
              ),
              (
                  r'self\.assertIn\("Production LOC: \*\*\d+\*\*", self\.markdown\)',
                  f'self.assertIn("Production LOC: **{inventory["production_loc"]}**", self.markdown)',
              ),
          )
          for pattern, replacement in replacements:
              text, count = re.subn(pattern, replacement, text, count=1)
              if count != 1:
                  raise SystemExit(f"Could not update expected baseline: {pattern}")
          path.write_text(text, encoding="utf-8")
          PY
          rm .github/workflows/temporary-finalize-storage-inventory.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/package_architecture_inventory.json \
            docs/package_architecture_inventory.md \
            tests/test_package_architecture_inventory.py \
            .github/workflows/temporary-finalize-storage-inventory.yml
          git commit -m "Финализировать Storage architecture baseline"
          git push origin HEAD:agent/issue-507-storage-deletion-policy
