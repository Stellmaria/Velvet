name: sync GPT Image canonical release marker

on:
  push:
    branches:
      - feat/gpt-image-2-codex

permissions:
  contents: write

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, '[release-marker-synced]') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/gpt-image-2-codex
          fetch-depth: 0
          persist-credentials: true

      - name: Add canonical release marker
        run: |
          python - <<'PY'
          from pathlib import Path

          anchor = "Дата среза: `2026-08-05`.\n"
          release = anchor + "\nКонтракт стабильного релиза: `v1.3.0`.\n"
          for name in (
              "docs/development_status.md",
              "docs/project_memory.md",
              "docs/ARCHITECTURE_AUDIT.md",
          ):
              path = Path(name)
              text = path.read_text(encoding="utf-8")
              if "Контракт стабильного релиза: `v1.3.0`." in text:
                  continue
              if text.count(anchor) != 1:
                  raise SystemExit(f"GPT Image ISO date marker missing in {name}")
              path.write_text(text.replace(anchor, release), encoding="utf-8")
          PY

      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/sync-gpt-image-release-marker.yml
          git config user.name "Velvet Docs Bot"
          git config user.email "velvet-docs@users.noreply.github.com"
          git add docs/development_status.md \
                  docs/project_memory.md \
                  docs/ARCHITECTURE_AUDIT.md \
                  .github/workflows/sync-gpt-image-release-marker.yml
          git commit -m "docs: sync canonical v1.3.0 marker [release-marker-synced]"
          git push origin HEAD:feat/gpt-image-2-codex
