name: temporary apply generated dependency locks

on:
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Download canonical locks from failed supply-chain run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/generated-locks
          gh run download 30754178052 \
            --repo "${{ github.repository }}" \
            --name generated-locks-d366de2c99cd8b81e7f625f0239a0c29e180981a \
            --dir /tmp/generated-locks
          cp /tmp/generated-locks/requirements.lock requirements.lock
          cp /tmp/generated-locks/requirements-dev.lock requirements-dev.lock

      - name: Commit exact resolver output
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- requirements.lock requirements-dev.lock
          if git diff --cached --quiet; then
            echo "Canonical locks are already current"
            exit 0
          fi
          git commit -m "deps(python): apply canonical resolver locks"
          git push origin "HEAD:${HEAD_BRANCH}"
