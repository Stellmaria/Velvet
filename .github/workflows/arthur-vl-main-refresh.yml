name: arthur vl main refresh

on:
  push:
    branches:
      - fix/arthur-archive-vl-gate-main-20260808
    paths:
      - .github/workflows/arthur-vl-main-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout fresh main branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/arthur-archive-vl-gate-main-20260808
          fetch-depth: 0

      - name: Squash final preflight tree onto current main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin fix/arthur-archive-vl-gate-20260808
          git merge --squash --no-commit origin/fix/arthur-archive-vl-gate-20260808
          rm .github/workflows/arthur-vl-main-refresh.yml

      - name: Commit clean integration tree
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git commit -m "Integrate Arthur archive control with automatic VL priority"
          git push origin HEAD:fix/arthur-archive-vl-gate-main-20260808
