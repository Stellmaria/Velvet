name: tmp storage librarian length retry validation

on:
  push:
    branches:
      - fix/storage-librarian-length-retry

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.16"
          enable-cache: true
          cache-dependency-glob: requirements.lock
          save-cache: false

      - name: Install dependencies from hash lock
        run: uv pip install --system --require-hashes -r requirements.lock

      - name: Refactor bounded Ollama response step
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("velvet_bot/infrastructure/ai/storage_librarian_ollama.py")
          text = path.read_text(encoding="utf-8")

          start_marker = "                        async with session.post(\n"
          end_marker = "                        payload = raw_payload\n"
          if text.count(start_marker) != 1 or text.count(end_marker) != 1:
              raise SystemExit("Ollama response markers changed")
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          replacement = (
              "                        raw_payload = await _post_analysis_json(\n"
              "                            session,\n"
              "                            url=self._settings.ollama_base_url + \"/api/chat\",\n"
              "                            request=request,\n"
              "                        )\n"
          )
          text = text[:start] + replacement + text[end:]

          class_marker = "\n\nclass OllamaStorageAnalysisClient:\n"
          if text.count(class_marker) != 1:
              raise SystemExit("Ollama client class marker changed")
          helper = (
              "\n\nasync def _post_analysis_json(\n"
              "    session: _SessionProtocol,\n"
              "    *,\n"
              "    url: str,\n"
              "    request: dict[str, object],\n"
              ") -> dict[object, object]:\n"
              "    async with session.post(url, json=request) as response:\n"
              "        if response.status < 200 or response.status >= 300:\n"
              "            error_type = (\n"
              "                StorageLibrarianError\n"
              "                if response.status in {408, 429} or response.status >= 500\n"
              "                else TerminalStorageLibrarianError\n"
              "            )\n"
              "            raise error_type(f\"Ollama analysis HTTP {response.status}.\")\n"
              "        try:\n"
              "            raw_payload = await response.json(content_type=None)\n"
              "        except (json.JSONDecodeError, ValueError, TypeError) as error:\n"
              "            raise _terminal(\n"
              "                \"Ollama analysis вернул malformed HTTP JSON.\"\n"
              "            ) from error\n"
              "    if not isinstance(raw_payload, dict):\n"
              "        raise _terminal(\"Ollama analysis вернул malformed response.\")\n"
              "    return raw_payload\n"
          )
          text = text.replace(class_marker, helper + class_marker, 1)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Compile and run Storage Librarian regressions
        run: |
          python -m compileall -q velvet_bot tests
          python -m unittest -v \
            tests.test_storage_librarian_length_retry \
            tests.test_storage_librarian_ollama

      - name: Regenerate package architecture inventory
        run: >-
          python scripts/inventory_package_architecture.py
          --label p1-package-architecture-baseline
          --write

      - name: Refresh pinned production LOC contract
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          import re
          from pathlib import Path

          inventory = json.loads(
              Path("docs/package_architecture_inventory.json").read_text(encoding="utf-8")
          )
          loc = int(inventory["production_loc"])
          path = Path("tests/test_package_architecture_inventory.py")
          text = path.read_text(encoding="utf-8")
          updated, count = re.subn(
              r'(self\.assertEqual\()\d+(, self\.inventory\["production_loc"\]\))',
              rf'\g<1>{loc}\g<2>',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit("Unable to refresh production_loc contract")
          path.write_text(updated, encoding="utf-8")
          print(f"production_loc={loc}")
          PY

      - name: Verify architecture contract
        run: python -m unittest -v tests.test_package_architecture_inventory

      - name: Verify generated scope
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git status --porcelain | sed 's/^...//')
          printf 'validated changes:\n'
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 4
          for path in "${changed[@]}"; do
            case "$path" in
              velvet_bot/infrastructure/ai/storage_librarian_ollama.py|docs/package_architecture_inventory.json|docs/package_architecture_inventory.md|tests/test_package_architecture_inventory.py) ;;
              *) echo "unexpected validation path: $path" >&2; exit 1 ;;
            esac
          done

      - name: Commit validated refactor and canonical baseline
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.sha }}"
          actual="$(git ls-remote origin refs/heads/fix/storage-librarian-length-retry | awk '{print $1}')"
          test "$actual" = "$expected" || {
            echo "branch moved: expected=$expected actual=$actual" >&2
            exit 1
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            velvet_bot/infrastructure/ai/storage_librarian_ollama.py \
            docs/package_architecture_inventory.json \
            docs/package_architecture_inventory.md \
            tests/test_package_architecture_inventory.py
          git commit -m "Refactor bounded Ollama retry path"
          git push origin HEAD:refs/heads/fix/storage-librarian-length-retry
