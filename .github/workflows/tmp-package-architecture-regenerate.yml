name: temporary package architecture regenerate

on:
  push:
    branches:
      - fix-byesu-key-balance

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
          check-latest: false

      - name: Regenerate package architecture inventory
        run: >-
          python scripts/inventory_package_architecture.py
          --write
          --label p1-package-architecture-baseline

      - name: Commit generated inventory
        shell: bash
        run: |
          set -euo pipefail
          git add -- \
            docs/package_architecture_inventory.json \
            docs/package_architecture_inventory.md
          if git diff --cached --quiet; then
            echo "Inventory is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh Python 3.13 package inventory"
          git push origin HEAD:fix-byesu-key-balance
