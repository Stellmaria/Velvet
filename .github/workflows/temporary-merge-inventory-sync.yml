name: temporary merge inventory sync

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  sync:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/owner-cost-only-and-image-pricing'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout PR merge ref
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Generate inventory from exact CI merge tree
        shell: bash
        run: |
          python scripts/inventory_package_architecture.py \
            --write \
            --bootstrap-exemptions
          python scripts/inventory_package_architecture.py --check
          mkdir -p /tmp/velvet-package-inventory
          cp docs/package_architecture_inventory.json /tmp/velvet-package-inventory/
          cp docs/package_architecture_inventory.md /tmp/velvet-package-inventory/
          cp docs/package_architecture_exemptions.json /tmp/velvet-package-inventory/

      - name: Apply generated files to feature branch
        shell: bash
        run: |
          git fetch origin \
            fix/owner-cost-only-and-image-pricing:refs/remotes/origin/fix/owner-cost-only-and-image-pricing
          git checkout -B fix/owner-cost-only-and-image-pricing \
            refs/remotes/origin/fix/owner-cost-only-and-image-pricing
          cp /tmp/velvet-package-inventory/package_architecture_inventory.json docs/
          cp /tmp/velvet-package-inventory/package_architecture_inventory.md docs/
          cp /tmp/velvet-package-inventory/package_architecture_exemptions.json docs/
          rm -f .github/workflows/temporary-merge-inventory-sync.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            .github/workflows/temporary-merge-inventory-sync.yml \
            docs/package_architecture_inventory.json \
            docs/package_architecture_inventory.md \
            docs/package_architecture_exemptions.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Merge-tree inventory already matches branch"
            exit 1
          fi
          git commit -m "Синхронизировать inventory с PR merge tree"
          git push origin HEAD:fix/owner-cost-only-and-image-pricing
