name: one-shot sync server restart

on:
  push:
    branches:
      - agent/server-self-restart

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: one-shot-sync-server-restart
  cancel-in-progress: true

jobs:
  sync-test-push:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: velvet_test
          POSTGRES_USER: velvet
          POSTGRES_PASSWORD: velvet_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U velvet -d velvet_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://velvet:velvet_test_password@localhost:5432/velvet_test
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/server-self-restart
          fetch-depth: 0

      - name: Merge current main and resolve generated inventory
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e
          if [ "$merge_status" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            unexpected="$(printf '%s\n' "$conflicts" | grep -v -E '^docs/package_architecture_inventory\.(json|md)$' || true)"
            if [ -n "$unexpected" ]; then
              printf 'Unexpected merge conflicts:\n%s\n' "$unexpected" >&2
              exit 1
            fi
            git checkout --theirs docs/package_architecture_inventory.json
            git checkout --theirs docs/package_architecture_inventory.md
            git add docs/package_architecture_inventory.json docs/package_architecture_inventory.md
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Refresh generated architecture inventory
        run: |
          python scripts/inventory_package_architecture.py --label p1-package-architecture-baseline --write
          python scripts/inventory_package_architecture.py --label p1-package-architecture-baseline --check

      - name: Remove one-shot workflow from resulting branch
        run: rm .github/workflows/one-shot-sync-server-restart.yml

      - name: Run type check
        run: python -m mypy

      - name: Run full unit suite
        run: python -m unittest discover -s tests -v

      - name: Build production image
        run: docker build -t velvet-pr486-final .

      - name: Commit tested merge and push
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git commit -m "Merge main and refresh server restart inventory"
          git push origin HEAD:agent/server-self-restart

      - name: Report successful gate
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment 486 --repo Stellmaria/Velvet --body "✅ One-shot branch gate passed: current main merged, architecture inventory regenerated, mypy, full unit suite and Docker build completed. The tested branch head was pushed."

      - name: Report failed gate
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment 486 --repo Stellmaria/Velvet --body "❌ One-shot branch gate failed. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
