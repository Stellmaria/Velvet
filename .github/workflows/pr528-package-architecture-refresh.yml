name: pr528 package architecture refresh

on:
  push:
    branches:
      - agent/fix-media-result-auto-delivery

permissions:
  contents: write

jobs:
  generate-and-commit:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-media-result-auto-delivery
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Generate package architecture baseline
        run: >-
          python scripts/inventory_package_architecture.py
          --write
          --bootstrap-exemptions
          --label p1-package-architecture-baseline
      - name: Update exact architecture expectations
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_package_architecture_inventory.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              "self.assertEqual(135_087, self.inventory[\"production_loc\"])",
              "self.assertEqual(135_100, self.inventory[\"production_loc\"])",
          )
          text = text.replace(
              'self.assertIn("Production LOC: **135087**", self.markdown)',
              'self.assertIn("Production LOC: **135100**", self.markdown)',
          )
          path.write_text(text, encoding="utf-8")
          PY
      - name: Remove temporary workflow
        run: rm .github/workflows/pr528-package-architecture-refresh.yml
      - name: Commit generated baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/package_architecture_inventory.json \
            docs/package_architecture_inventory.md \
            docs/package_architecture_exemptions.json \
            tests/test_package_architecture_inventory.py \
            .github/workflows/pr528-package-architecture-refresh.yml
          git commit -m "Обновить architecture baseline доставки результата"
          git push origin HEAD:agent/fix-media-result-auto-delivery
