name: issue 603 bootstrap v2

on:
  push:
    branches:
      - feat/603-adaptive-ai-queue-wakeup
    paths:
      - .github/workflows/issue-603-bootstrap-v2.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: issue-603-bootstrap-v2
  cancel-in-progress: false

jobs:
  materialize:
    if: github.repository == 'Stellmaria/Velvet' && github.ref_name == 'feat/603-adaptive-ai-queue-wakeup'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact feature head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/603-adaptive-ai-queue-wakeup
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'

      - name: Materialize reviewed source tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git ls-tree -r --name-only HEAD .issue-603-bootstrap | sort > /tmp/bootstrap-paths

          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          parts = sorted(Path('.issue-603-bootstrap').glob('hex-*'))
          if [part.name for part in parts] != [f'hex-{index:02d}' for index in range(13)]:
              raise SystemExit('unexpected hex part set')
          payload = bytes.fromhex(''.join(part.read_text(encoding='utf-8').strip() for part in parts))
          digest = sha256(payload).hexdigest()
          expected = '3ef346ea4e52dea0743016a30b0b9ed30828ed68f47022d2e2ab6b49091581df'
          if digest != expected:
              raise SystemExit(f'payload checksum mismatch: {digest}')
          Path('/tmp/issue-603-payload.tgz').write_bytes(payload)
          PY

          tar -xzf /tmp/issue-603-payload.tgz
          rm -f .github/workflows/issue-603-bootstrap.yml
          rm -f .github/workflows/issue-603-bootstrap-v2.yml
          rm -rf .issue-603-bootstrap

          python - <<'PY'
          from pathlib import Path

          path = Path('docs/package_architecture_exemptions.json')
          text = path.read_text(encoding='utf-8')
          replacements = {
              'monolithic-function:velvet_bot/app/workers.py:0d9b13fd50600afb':
                  'monolithic-function:velvet_bot/app/workers.py:85726d0fcd082e22',
              'typing-any-usage:velvet_bot/workers/manager.py:fc0ce05c34c12991':
                  'typing-any-usage:velvet_bot/workers/manager.py:a90fff492f411429',
          }
          for old, new in replacements.items():
              if text.count(old) != 1 or new in text:
                  raise SystemExit(f'unexpected exemption state: {old}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY

          python scripts/inventory_architecture_layout.py --write --label issue-603
          python scripts/inventory_architecture_layout.py --check --label issue-603
          python scripts/inventory_repository_layout.py --write --label issue-603
          python scripts/inventory_repository_layout.py --check --label issue-603
          python scripts/shared_contract_inventory.py \
            --write-json docs/shared_contract_inventory.json \
            --write-markdown docs/shared_contract_inventory.md \
            --check
          python scripts/inventory_package_architecture.py --write --label issue-603
          python scripts/inventory_package_architecture.py --check --label issue-603
          python scripts/update_p2_stability_inventory.py --label issue-603 --schema-version 79
          python -m compileall -q velvet_bot tests/test_ai_queue_adaptive_wakeup.py

          git add -- \
            .github/workflows/issue-603-bootstrap.yml \
            .github/workflows/issue-603-bootstrap-v2.yml \
            .issue-603-bootstrap \
            docs/architecture_layout_inventory.json \
            docs/architecture_layout_inventory.md \
            docs/package_architecture_exemptions.json \
            docs/package_architecture_inventory.json \
            docs/package_architecture_inventory.md \
            docs/p2_stability_inventory.json \
            docs/p2_stability_inventory.md \
            docs/repository_layout_inventory.json \
            docs/repository_layout_inventory.md \
            docs/shared_contract_inventory.json \
            docs/shared_contract_inventory.md \
            docs/worklog/2026-08-05-adaptive-ai-queue-wakeup.md \
            tests/test_ai_queue_adaptive_wakeup.py \
            velvet_bot/app/workers.py \
            velvet_bot/domains/ai_usage/factory.py \
            velvet_bot/domains/ai_usage/task_service.py \
            velvet_bot/domains/vision_batches/worker.py \
            velvet_bot/infrastructure/postgres/ai_task_wakeup_repository.py \
            velvet_bot/services/system_health.py \
            velvet_bot/workers/__init__.py \
            velvet_bot/workers/adaptive.py \
            velvet_bot/workers/manager.py

          cat > /tmp/product-paths <<'EOF'
          docs/architecture_layout_inventory.json
          docs/architecture_layout_inventory.md
          docs/package_architecture_exemptions.json
          docs/package_architecture_inventory.json
          docs/package_architecture_inventory.md
          docs/p2_stability_inventory.json
          docs/p2_stability_inventory.md
          docs/repository_layout_inventory.json
          docs/repository_layout_inventory.md
          docs/shared_contract_inventory.json
          docs/shared_contract_inventory.md
          docs/worklog/2026-08-05-adaptive-ai-queue-wakeup.md
          tests/test_ai_queue_adaptive_wakeup.py
          velvet_bot/app/workers.py
          velvet_bot/domains/ai_usage/factory.py
          velvet_bot/domains/ai_usage/task_service.py
          velvet_bot/domains/vision_batches/worker.py
          velvet_bot/infrastructure/postgres/ai_task_wakeup_repository.py
          velvet_bot/services/system_health.py
          velvet_bot/workers/__init__.py
          velvet_bot/workers/adaptive.py
          velvet_bot/workers/manager.py
          EOF
          sed -i 's/^          //' /tmp/product-paths
          {
            echo .github/workflows/issue-603-bootstrap.yml
            echo .github/workflows/issue-603-bootstrap-v2.yml
            cat /tmp/bootstrap-paths
            cat /tmp/product-paths
          } | sort -u > /tmp/allowed-paths
          git diff --cached --name-only | sort > /tmp/actual-paths
          test -z "$(comm -23 /tmp/actual-paths /tmp/allowed-paths)"
          test -z "$(comm -23 /tmp/product-paths /tmp/actual-paths)"
          while IFS= read -r path; do grep -Fxq "$path" /tmp/actual-paths; done < /tmp/bootstrap-paths
          grep -Fxq .github/workflows/issue-603-bootstrap.yml /tmp/actual-paths
          grep -Fxq .github/workflows/issue-603-bootstrap-v2.yml /tmp/actual-paths
          git diff --cached --check
          test -z "$(git diff --name-only)"

          git config user.name 'Stellmaria'
          git config user.email 'aam.cheshire@gmail.com'
          git commit -m 'Add adaptive AI queue backoff and PostgreSQL wake-up for #603'
          git push origin HEAD:feat/603-adaptive-ai-queue-wakeup
