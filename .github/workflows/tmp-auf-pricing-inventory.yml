name: temporary AUF pricing inventory refresh

on:
  push:
    branches:
      - feat/auf-pricing-economy-hardening

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/auf-pricing-economy-hardening
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'

      - name: Patch pricing and refresh canonical architecture inventory
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import json
          import subprocess
          import sys
          from pathlib import Path

          pricing_path = Path('velvet_bot/domains/auf_wallet/pricing.py')
          source = pricing_path.read_text(encoding='utf-8')
          start_marker = (
              '        async with self._database.acquire() as connection:\n'
              '            minimum_markup = await connection.fetchval('
          )
          end_marker = (
              '            minimum_normalized = '
              '_validate_markup_percent(Decimal(minimum_markup))\n'
          )
          start = source.find(start_marker)
          if start < 0:
              raise SystemExit('set_user_markup start marker not found')
          end = source.find(end_marker, start)
          if end < 0:
              raise SystemExit('set_user_markup end marker not found')
          end += len(end_marker)
          replacement = (
              '        async with self._database.acquire() as connection:\n'
              '            current_policy = await _load_user_markup_policy(\n'
              '                connection, int(user_id)\n'
              '            )\n'
              '            minimum_normalized = '
              'current_policy.minimum_user_markup_percent\n'
          )
          pricing_path.write_text(
              source[:start] + replacement + source[end:],
              encoding='utf-8',
          )

          inventory_path = Path('docs/package_architecture_inventory.json')
          current_inventory = json.loads(inventory_path.read_text(encoding='utf-8'))
          label = str(current_inventory.get('generated_from') or 'working-tree')

          sys.path.insert(0, str(Path.cwd()))
          from scripts.inventory_package_architecture import build_inventory

          data = build_inventory(label=label)
          prefix = 'sql-outside-persistence:velvet_bot/domains/auf_wallet/pricing.py:'
          matches = [
              str(row['id'])
              for row in data['violations']
              if str(row['id']).startswith(prefix)
          ]
          if len(matches) != 1:
              raise SystemExit(f'expected one pricing SQL violation, got {matches!r}')

          exemptions_path = Path('docs/package_architecture_exemptions.json')
          exemptions = json.loads(exemptions_path.read_text(encoding='utf-8'))
          changed = 0
          for row in exemptions.get('exceptions', []):
              if str(row.get('id', '')).startswith(prefix):
                  row['id'] = matches[0]
                  changed += 1
          if changed != 1:
              raise SystemExit(f'expected one pricing exemption, changed {changed}')
          exemptions_path.write_text(
              json.dumps(exemptions, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )

          subprocess.run(
              [
                  sys.executable,
                  'scripts/inventory_package_architecture.py',
                  '--label',
                  label,
                  '--write',
              ],
              check=True,
          )
          subprocess.run(
              [
                  sys.executable,
                  'scripts/inventory_package_architecture.py',
                  '--label',
                  label,
                  '--check',
              ],
              check=True,
          )
          PY

      - name: Restore workflow files and publish refresh
        shell: bash
        run: |
          set -euo pipefail
          git show origin/main:.github/workflows/tests.yml > .github/workflows/tests.yml
          git rm .github/workflows/tmp-auf-pricing-inventory.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/tests.yml \
            velvet_bot/domains/auf_wallet/pricing.py \
            docs/package_architecture_exemptions.json \
            docs/package_architecture_inventory.json \
            docs/package_architecture_inventory.md
          git commit -m "chore: refresh AUF pricing architecture inventory"
          git push origin HEAD:feat/auf-pricing-economy-hardening
