name: reconcile production Librarian

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type RECONCILE_LIBRARIAN to reconcile Arthur Librarian on production"
        required: true
        type: string
      source_commit:
        description: "Exact deployed application source commit recorded in image provenance"
        required: true
        type: string
      image_digest:
        description: "Verified GHCR image reference: ghcr.io/stellmaria/velvet@sha256:<64 hex>"
        required: true
        type: string

concurrency:
  group: velvet-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  reconcile-librarian:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'RECONCILE_LIBRARIAN'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    steps:
      - name: Validate immutable reconcile request
        shell: bash
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          IMAGE_DIGEST: ${{ inputs.image_digest }}
        run: |
          set -Eeuo pipefail
          source_commit="${SOURCE_COMMIT,,}"
          image_digest="${IMAGE_DIGEST,,}"
          if [[ ! "$source_commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "source_commit must be an exact 40-character SHA" >&2
            exit 2
          fi
          if [[ ! "$image_digest" =~ ^ghcr\.io/stellmaria/velvet@sha256:[0-9a-f]{64}$ ]]; then
            echo "image_digest must be the immutable Velvet GHCR reference" >&2
            exit 2
          fi

      - name: Validate required production secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Reconcile Arthur Librarian to verified image
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_APP_DIR: ${{ secrets.DEPLOY_APP_DIR }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          IMAGE_DIGEST: ${{ inputs.image_digest }}
          CHECKOUT_COMMIT: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          port="${DEPLOY_PORT:-22}"
          app_dir="${DEPLOY_APP_DIR:-/srv/velvet}"
          printf -v remote_command \
            'APP_DIR=%q SOURCE_COMMIT=%q IMAGE_DIGEST=%q CHECKOUT_COMMIT=%q bash -s' \
            "$app_dir" "$SOURCE_COMMIT" "$IMAGE_DIGEST" "$CHECKOUT_COMMIT"
          ssh -p "$port" -o BatchMode=yes -o IdentitiesOnly=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" "$remote_command" <<'REMOTE'
          set -Eeuo pipefail
          cd "$APP_DIR"

          test -d "$APP_DIR/.git"
          test ! -L "$APP_DIR/.git"
          test "$(git symbolic-ref --short HEAD)" = main
          current_head="$(git rev-parse HEAD)"
          test -z "$(GIT_OPTIONAL_LOCKS=0 git status --porcelain --untracked-files=all)"

          git fetch --no-tags --prune origin main
          test "$(git rev-parse refs/remotes/origin/main)" = "$CHECKOUT_COMMIT"
          git cat-file -e "${SOURCE_COMMIT}^{commit}"
          git merge-base --is-ancestor "$SOURCE_COMMIT" "$CHECKOUT_COMMIT"

          case "$current_head" in
            "$SOURCE_COMMIT"|"$CHECKOUT_COMMIT") ;;
            *)
              echo "Production checkout is neither the deployed source nor current main: $current_head" >&2
              exit 3
              ;;
          esac

          unsafe_path=""
          while IFS= read -r changed_path; do
            case "$changed_path" in
              .github/*|docs/*|tests/*) ;;
              *) unsafe_path="$changed_path"; break ;;
            esac
          done < <(git diff --name-only "$SOURCE_COMMIT..$CHECKOUT_COMMIT")
          if [[ -n "$unsafe_path" ]]; then
            echo "Current main contains a runtime/deploy change after the verified application source: $unsafe_path" >&2
            echo "Run the normal verified production deploy before Librarian reconcile." >&2
            exit 4
          fi
          echo "Verified control-plane-only checkout drift from application source to current main."

          env_file="$APP_DIR/.env.server"
          test -f "$env_file"
          test ! -L "$env_file"

          server_compose=(
            docker compose
            --env-file "$env_file"
            -f "$APP_DIR/docker-compose.server.yml"
          )
          bot_cid="$("${server_compose[@]}" ps -q bot)"
          test -n "$bot_cid"
          bot_state="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$bot_cid")"
          test "$bot_state" = healthy
          test "$(docker inspect --format '{{.Config.Image}}' "$bot_cid")" = "$IMAGE_DIGEST"
          expected_image_id="$(docker image inspect "$IMAGE_DIGEST" --format '{{.Id}}')"
          test "$expected_image_id" = "$(docker inspect --format '{{.Image}}' "$bot_cid")"
          image_revision="$(docker image inspect "$IMAGE_DIGEST" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')"
          test "${image_revision,,}" = "${SOURCE_COMMIT,,}"
          echo "Verified healthy production bot on requested immutable application image."

          if [[ "$current_head" != "$CHECKOUT_COMMIT" ]]; then
            (
              umask 022
              git reset --hard "$CHECKOUT_COMMIT"
            )
          fi
          test "$(git rev-parse HEAD)" = "$CHECKOUT_COMMIT"
          test "$(git rev-parse refs/remotes/origin/main)" = "$CHECKOUT_COMMIT"
          test -z "$(GIT_OPTIONAL_LOCKS=0 git status --porcelain --untracked-files=all)"

          python3 - "$env_file" "$IMAGE_DIGEST" <<'PY'
          from __future__ import annotations

          import os
          import tempfile
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          expected_image = sys.argv[2]
          raw_lines = path.read_text(encoding="utf-8-sig").splitlines()
          values: dict[str, str] = {}
          for raw in raw_lines:
              line = raw.strip()
              if not line or line.startswith("#") or "=" not in line:
                  continue
              key, value = line.split("=", 1)
              values[key.strip()] = value.strip().strip('"').strip("'")

          auto_enqueue = values.get("STORAGE_LIBRARIAN_AUTO_ENQUEUE", "false").casefold()
          if auto_enqueue != "false":
              raise SystemExit("STORAGE_LIBRARIAN_AUTO_ENQUEUE must remain false")

          result: list[str] = []
          replaced = False
          for raw in raw_lines:
              if "=" in raw and raw.split("=", 1)[0].strip() == "VELVET_IMAGE":
                  if not replaced:
                      result.append(f"VELVET_IMAGE={expected_image}")
                      replaced = True
                  continue
              result.append(raw)
          if not replaced:
              if result and result[-1].strip():
                  result.append("")
              result.append(f"VELVET_IMAGE={expected_image}")

          payload = "\n".join(result).rstrip() + "\n"
          fd, temporary = tempfile.mkstemp(prefix=".env.server.", dir=path.parent)
          try:
              with os.fdopen(fd, "w", encoding="utf-8") as handle:
                  handle.write(payload)
                  handle.flush()
                  os.fsync(handle.fileno())
              os.chmod(temporary, 0o600)
              os.replace(temporary, path)
          finally:
              if os.path.exists(temporary):
                  os.unlink(temporary)
          print("Persisted verified VELVET_IMAGE; automatic enqueue remains disabled.")
          PY

          deploy_uid="$(id -u)"
          deploy_gid="$(id -g)"
          git_index="$APP_DIR/.git/index"
          reconcile_started=0

          repair_git_index() {
            test -f "$git_index"
            test ! -L "$git_index"
            if [[ "$(stat -c '%u:%g' "$git_index")" != "$deploy_uid:$deploy_gid" ]]; then
              docker run --rm -i \
                --network none \
                --user 0:0 \
                --cap-drop ALL \
                --cap-add CHOWN \
                --security-opt no-new-privileges \
                --env TARGET_UID="$deploy_uid" \
                --env TARGET_GID="$deploy_gid" \
                --mount "type=bind,src=$APP_DIR/.git,dst=/repair" \
                "$IMAGE_DIGEST" \
                python - <<'PY'
          import os
          import stat

          path = "/repair/index"
          value = os.lstat(path)
          if not stat.S_ISREG(value.st_mode):
              raise SystemExit("Git index is not a regular file")
          os.chown(
              path,
              int(os.environ["TARGET_UID"]),
              int(os.environ["TARGET_GID"]),
              follow_symlinks=False,
          )
          PY
            fi
            test "$(stat -c '%u:%g' "$git_index")" = "$deploy_uid:$deploy_gid"
            test -r "$git_index"
            test -w "$git_index"
          }

          on_exit() {
            rc=$?
            trap - EXIT
            if (( reconcile_started )); then
              repair_git_index || rc=1
            fi
            exit "$rc"
          }
          trap on_exit EXIT

          docker exec velvet-hermes-1 test -x /opt/data/tools/reconcilectl.py
          submit_json="$(docker exec velvet-hermes-1 \
            python /opt/data/tools/reconcilectl.py submit librarian)"
          printf '%s\n' "$submit_json"
          task_id="$(python3 -c '
          import json, sys
          payload = json.load(sys.stdin)
          if payload.get("ok") is not True or not payload.get("task_id"):
              raise SystemExit("librarian reconcile was not accepted")
          print(payload["task_id"])
          ' <<<"$submit_json")"
          reconcile_started=1

          wait_json="$(docker exec velvet-hermes-1 \
            python /opt/data/tools/reconcilectl.py wait "$task_id" --interval 5)"
          printf '%s\n' "$wait_json"

          repair_git_index
          reconcile_started=0
          python3 -c '
          import json, sys
          payload = json.load(sys.stdin)
          if payload.get("ok") is not True or payload.get("status") != "completed":
              raise SystemExit("librarian reconcile did not complete successfully")
          ' <<<"$wait_json"

          test "$(git rev-parse HEAD)" = "$CHECKOUT_COMMIT"
          test "$(git rev-parse refs/remotes/origin/main)" = "$CHECKOUT_COMMIT"
          test -z "$(GIT_OPTIONAL_LOCKS=0 git status --porcelain --untracked-files=all)"

          compose=(
            docker compose
            --env-file "$env_file"
            -f "$APP_DIR/deploy/hermes-librarian/compose.yaml"
            --profile arthur
          )
          for service in ollama-librarian librarian-hermes arthur-storage-gateway arthur; do
            cid="$("${compose[@]}" ps -q "$service")"
            test -n "$cid"
            state="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$cid")"
            test "$state" = healthy
            ports="$(docker inspect --format '{{json .NetworkSettings.Ports}}' "$cid")"
            python3 -c '
          import json, sys
          ports = json.loads(sys.stdin.read()) or {}
          if any(value for value in ports.values()):
              raise SystemExit("unexpected published port")
          ' <<<"$ports"
            case "$service" in
              arthur-storage-gateway|arthur)
                test "$(docker inspect --format '{{.Config.Image}}' "$cid")" = "$IMAGE_DIGEST"
                test "$(docker inspect --format '{{.Image}}' "$cid")" = "$expected_image_id"
                ;;
            esac
          done

          "${compose[@]}" exec -T arthur python - <<'PY'
          import os
          from pathlib import Path

          from velvet_bot.domains.telegram_storage.librarian_models import (
              StorageLibrarianSettings,
          )

          if os.getenv("STORAGE_LIBRARIAN_AUTO_ENQUEUE", "").strip().casefold() != "false":
              raise SystemExit("Arthur automatic enqueue is not disabled")
          if not Path("/tmp/arthur-heartbeat").exists():
              raise SystemExit("Arthur heartbeat is missing")
          settings = StorageLibrarianSettings.from_env()
          if settings.text_context_length != 8192:
              raise SystemExit(f"unexpected text context length: {settings.text_context_length}")
          if settings.text_max_output_tokens != 384:
              raise SystemExit(f"unexpected text output budget: {settings.text_max_output_tokens}")
          if settings.max_text_chars != 11_520:
              raise SystemExit(f"unexpected effective text source limit: {settings.max_text_chars}")
          configured = os.getenv("STORAGE_LIBRARIAN_MAX_TEXT_CHARS", "").strip() or "<derived>"
          print(
              "Arthur Librarian budget verified: "
              f"configured_max_text_chars={configured} effective_max_text_chars={settings.max_text_chars}"
          )
          PY

          "${compose[@]}" exec -T ollama-librarian \
            ollama show velvet-librarian-text:v1 >/dev/null
          test "$(stat -c '%u:%g' "$git_index")" = "$deploy_uid:$deploy_gid"
          test -z "$(GIT_OPTIONAL_LOCKS=0 git status --porcelain --untracked-files=all)"
          echo "Production Librarian reconcile verified: app=$SOURCE_COMMIT checkout=$CHECKOUT_COMMIT task=$task_id image=$IMAGE_DIGEST"
          REMOTE
