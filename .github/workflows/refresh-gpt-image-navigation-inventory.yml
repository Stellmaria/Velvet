name: refresh GPT Image navigation inventory

on:
  push:
    branches:
      - feat/gpt-image-2-codex

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message, '[navigation-inventory-refreshed]') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/gpt-image-2-codex
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"

      - name: Refresh Telegram navigation inventory
        run: |
          python scripts/telegram_navigation_inventory.py \
            --root velvet_bot \
            --markdown docs/generated/telegram_navigation_inventory.md
          python scripts/telegram_navigation_inventory.py \
            --root velvet_bot \
            --check

      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/refresh-gpt-image-navigation-inventory.yml
          git config user.name "Velvet Navigation Bot"
          git config user.email "velvet-navigation@users.noreply.github.com"
          git add docs/generated/telegram_navigation_inventory.md \
                  .github/workflows/refresh-gpt-image-navigation-inventory.yml
          git commit -m "chore: refresh Telegram navigation inventory [navigation-inventory-refreshed]"
          git push origin HEAD:feat/gpt-image-2-codex
