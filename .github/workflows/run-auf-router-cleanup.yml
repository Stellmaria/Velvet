name: Patch Auf workspace module UI

on:
  pull_request:
    branches:
      - agent/auf-router-cleanup-runner

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/auf-persistent-identifiers
          fetch-depth: 0

      - name: Add Auf labels without replacing existing UI builders
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('velvet_bot/workspace_ui.py')
          source = path.read_text(encoding='utf-8')
          label_anchor = '    "team": "👤 Команда",\n}'
          help_anchor = '    "team": "Добавление редакторов, проверяющих и администраторов вашего пространства.",\n}'
          if '    "auf": "🐺 Ауф",' not in source:
              source = source.replace(
                  label_anchor,
                  '    "team": "👤 Команда",\n    "auf": "🐺 Ауф",\n}',
              )
          if '    "auf": "Генерация и оживление изображений' not in source:
              source = source.replace(
                  help_anchor,
                  '    "team": "Добавление редакторов, проверяющих и администраторов вашего пространства.",\n'
                  '    "auf": "Генерация и оживление изображений, управление балансом и задачами Ауф внутри пространства.",\n}',
              )
          if 'def build_modules_keyboard' not in source:
              raise SystemExit('full workspace UI was not restored')
          if 'text="ℹ️"' not in source:
              raise SystemExit('workspace help buttons were lost')
          path.write_text(source, encoding='utf-8')
          PY

          python scripts/telegram_navigation_inventory.py \
            --root velvet_bot \
            --markdown docs/generated/telegram_navigation_inventory.md
          python -m compileall -q velvet_bot tests

      - name: Commit targeted UI patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Добавить модуль Ауф в полный workspace UI"
          git push origin HEAD:agent/auf-persistent-identifiers
