name: Run Auf router cleanup

on:
  pull_request:
    branches:
      - agent/auf-router-cleanup-runner

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/final-auf-router-layer
          fetch-depth: 0

      - name: Audit retired brand in canonical code
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          roots = (
              Path('velvet_bot/presentation/telegram/routers'),
              Path('velvet_bot/app'),
              Path('velvet_bot/domains/auf_runtime'),
              Path('velvet_bot/domains/auf_wallet'),
          )
          needles = ('Meow', 'meow_', 'Мяу', 'мяу')
          found = 0
          for root in roots:
              for path in sorted(root.glob('*.py')):
                  if root.name == 'routers' and not path.name.startswith('workspace_auf'):
                      continue
                  if root.name == 'app' and not path.name.startswith('auf_'):
                      continue
                  for number, line in enumerate(path.read_text(encoding='utf-8').splitlines(), 1):
                      if any(needle in line for needle in needles):
                          print(f'{path}:{number}:{line}')
                          found += 1
          print(f'AUDIT_TOTAL={found}')
          raise SystemExit(1)
          PY
