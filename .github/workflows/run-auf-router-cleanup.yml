name: Run Auf router cleanup

on:
  pull_request:
    branches:
      - agent/auf-router-cleanup-runner

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/final-auf-router-layer
          fetch-depth: 0

      - name: Audit retired brand in canonical code
        shell: bash
        run: |
          set +e
          rg -n --glob 'workspace_auf*.py' --glob 'auf_*.py' --glob '*.py' \
            '(Meow|meow_|Мяу|мяу)' \
            velvet_bot/presentation/telegram/routers \
            velvet_bot/app \
            velvet_bot/domains/auf_runtime \
            velvet_bot/domains/auf_wallet
          exit 1
