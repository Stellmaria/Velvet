name: Run Auf router cleanup

on:
  pull_request:
    branches:
      - agent/auf-router-cleanup-runner

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/final-auf-router-layer
          fetch-depth: 0

      - name: Repair core state dual-read
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          core_path = Path('velvet_bot/presentation/telegram/routers/workspace_auf.py')
          core = core_path.read_text(encoding='utf-8')
          helper = dedent('''

              def _state_value(data: Mapping[str, object], key: str) -> object:
                  if key in data:
                      return data[key]
                  return data.get(key.replace("auf_", "meow_", 1))
          ''').rstrip()
          if 'def _state_value' not in core:
              core = core.replace(
                  '\n\nasync def _session_data(',
                  helper + '\n\nasync def _session_data(',
              )
          core = core.replace(
              '_optional_int(data.get("auf_workspace_id"))',
              '_optional_int(_state_value(data, "auf_workspace_id"))',
          )
          if 'def _state_value' not in core:
              raise SystemExit('core state helper was not inserted')
          if '_state_value(data, "auf_workspace_id")' not in core:
              raise SystemExit('workspace id dual-read was not installed')
          core_path.write_text(core, encoding='utf-8')

          installer_path = Path('velvet_bot/app/auf_photo_ui_install.py')
          installer = installer_path.read_text(encoding='utf-8').replace(
              'photo_router._model((await state.get_data()).get("meow_model"))',
              'photo_router._model(_state_value(await state.get_data(), "auf_model"))',
          )
          installer_path.write_text(installer, encoding='utf-8')

          test_path = Path('tests/test_auf_router_brand_boundary.py')
          test = test_path.read_text(encoding='utf-8')
          marker = 'def test_core_router_defines_and_uses_state_dual_read() -> None:'
          if marker not in test:
              test += dedent('''


                  def test_core_router_defines_and_uses_state_dual_read() -> None:
                      core = _read(ROUTERS / "workspace_auf.py")
                      assert "def _state_value(" in core
                      assert '_state_value(data, "auf_workspace_id")' in core
                      assert '_state_value(data, "auf_input_mode")' in core
                      assert '_state_value(data, "auf_prompt")' in core
                      assert '_state_value(data, "auf_references")' in core
              ''')
          test_path.write_text(test, encoding='utf-8')
          PY

          python scripts/inventory_architecture_layout.py \
            --write \
            --label p3d-analytics-alias-retirement
          python scripts/update_p2_stability_inventory.py \
            --label p2-auf-router-protocol-migration \
            --schema-version 70
          python scripts/telegram_navigation_inventory.py \
            --root velvet_bot \
            --markdown docs/generated/telegram_navigation_inventory.md
          python -m compileall -q velvet_bot tests

      - name: Commit core dual-read repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Исправить core dual-read Ауф"
          git push origin HEAD:agent/final-auf-router-layer
