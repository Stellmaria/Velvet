name: Run Auf router cleanup

on:
  pull_request:
    branches:
      - agent/auf-router-cleanup-runner

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/final-auf-router-layer
          fetch-depth: 0

      - name: Fix final Auf contract failures
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          video_path = Path(
              'velvet_bot/presentation/telegram/routers/workspace_auf_video_simple.py'
          )
          video = video_path.read_text(encoding='utf-8')
          video = video.replace(
              '    _callback as video_callback,\n',
              '    _callback as video_callback,\n'
              '    _format_rub,\n'
              '    _format_usd,\n',
          )
          video = video.replace('legacy._format_usd', '_format_usd')
          video = video.replace('legacy._format_rub', '_format_rub')
          if 'legacy._format_' in video:
              raise SystemExit('legacy money formatter reference remains')
          video_path.write_text(video, encoding='utf-8')

          migration_test = Path('tests/test_meow_video_generation.py')
          source = migration_test.read_text(encoding='utf-8').replace(
              'migrations/917_auf_video_templates.sql',
              'migrations/917_meow_video_templates.sql',
          )
          migration_test.write_text(source, encoding='utf-8')

          ratio_test = Path('tests/test_photo_ratio_callback.py')
          source = ratio_test.read_text(encoding='utf-8')
          source = source.replace(
              'from velvet_bot.presentation.telegram.routers.workspace_meow import MeowCallback',
              'from velvet_bot.presentation.telegram.routers.workspace_auf import AufCallback',
          )
          source = source.replace('MeowCallback.unpack', 'AufCallback.unpack')
          ratio_test.write_text(source, encoding='utf-8')

          balance_test = Path('tests/test_kie_runtime_balance.py')
          source = balance_test.read_text(encoding='utf-8').replace(
              '["Обновить баланс", "↩️ Мяу"]',
              '["Обновить баланс", "↩️ Ауф"]',
          )
          balance_test.write_text(source, encoding='utf-8')
          PY

          python -m unittest \
            tests.test_meow_video_generation \
            tests.test_photo_ratio_callback \
            tests.test_kie_runtime_balance -q
          python -m compileall -q velvet_bot tests

      - name: Commit final contract repairs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Исправить финальные контракты Ауф"
          git push origin HEAD:agent/final-auf-router-layer
