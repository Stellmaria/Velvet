name: arthur inventory finalizer

on:
  pull_request:
    paths:
      - ".github/workflows/arthur-inventory-finalizer.yml"

permissions:
  contents: write

jobs:
  finalize:
    if: >-
      github.repository == 'Stellmaria/Velvet' &&
      github.event.pull_request.head.ref == 'tmp/arthur-inventory-finalizer' &&
      github.event.pull_request.user.login == 'Stellmaria'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout clean Arthur PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/arthur-librarian-phase1
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
          check-latest: false

      - name: Align package baseline and regenerate canonical inventories
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/test_package_architecture_inventory.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('141_659', '141_744')
          text = text.replace('Production LOC: **141659**', 'Production LOC: **141744**')
          path.write_text(text, encoding='utf-8')
          PY
          python scripts/inventory_package_architecture.py \
            --write \
            --label p1-package-architecture-baseline
          python scripts/update_p2_stability_inventory.py \
            --label arthur-librarian-phase1 \
            --schema-version 78
          python - <<'PY'
          from pathlib import Path
          from scripts.inventory_repository_layout import build_inventory, render_markdown
          import json

          root = Path('.')
          inventory = build_inventory(label='p3e-repository-layout-complete')
          (root / 'docs/repository_layout_inventory.json').write_text(
              json.dumps(inventory, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          (root / 'docs/repository_layout_inventory.md').write_text(
              render_markdown(inventory),
              encoding='utf-8',
          )
          PY

      - name: Commit exact baseline and inventories to Arthur branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tests/test_package_architecture_inventory.py \
            docs/package_architecture_inventory.json \
            docs/package_architecture_inventory.md \
            docs/p2_stability_inventory.json \
            docs/p2_stability_inventory.md \
            docs/repository_layout_inventory.json \
            docs/repository_layout_inventory.md
          if git diff --cached --quiet; then
            echo "Canonical baseline already matches clean target tree."
            exit 0
          fi
          git commit -m "docs: align Arthur package architecture baseline"
          git push origin HEAD:fix/arthur-librarian-phase1
