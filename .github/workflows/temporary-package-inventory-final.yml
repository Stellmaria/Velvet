name: temporary final package inventory

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  sync:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/owner-cost-only-and-image-pricing'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Regenerate canonical package inventory
        shell: bash
        run: |
          python scripts/inventory_package_architecture.py \
            --write \
            --bootstrap-exemptions
          python scripts/inventory_package_architecture.py --check
          python -m compileall -q velvet_bot tests

      - name: Commit inventory as final branch head
        shell: bash
        run: |
          rm -f .github/workflows/temporary-package-inventory-final.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            .github/workflows/temporary-package-inventory-final.yml \
            docs/package_architecture_exemptions.json \
            docs/package_architecture_inventory.json \
            docs/package_architecture_inventory.md
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Inventory is already canonical"
            exit 1
          fi
          git commit -m "Финально синхронизировать package inventory"
          git push origin HEAD:fix/owner-cost-only-and-image-pricing
