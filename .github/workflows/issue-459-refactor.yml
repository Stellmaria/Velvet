name: Issue 459 canonical provider refactor

on:
  pull_request:
    paths:
      - ".github/workflows/issue-459-refactor.yml"

permissions:
  contents: write

concurrency:
  group: issue-459-refactor-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.repository == 'Stellmaria/Velvet' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/459-canonical-provider-adapters'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/459-canonical-provider-adapters
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Apply canonical provider refactor
        run: python tools/issue_459_refactor_loader.py

      - name: Regenerate architecture inventories
        shell: bash
        run: |
          python scripts/inventory_architecture_layout.py --write --label issue-459-provider-adapters
          python scripts/inventory_telegram_helpers.py --write --label issue-459-provider-adapters
          python - <<'PY'
          import json
          import sys
          from pathlib import Path
          root = Path.cwd()
          sys.path.insert(0, str(root / "scripts"))
          from inventory_repository_layout import build_inventory, render_markdown
          data = build_inventory(label="issue-459-provider-adapters")
          (root / "docs/repository_layout_inventory.json").write_text(
              json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )
          (root / "docs/repository_layout_inventory.md").write_text(
              render_markdown(data), encoding="utf-8"
          )
          PY
          python scripts/inventory_package_architecture.py \
            --write \
            --bootstrap-exemptions \
            --label issue-459-provider-adapters

      - name: Synchronize inventory assertions
        shell: bash
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          inventory = json.loads(Path("docs/package_architecture_inventory.json").read_text(encoding="utf-8"))
          shared = inventory["shared_contract_summary"]
          test_path = Path("tests/test_package_architecture_inventory.py")
          text = test_path.read_text(encoding="utf-8")

          def sub(pattern: str, replacement: str) -> None:
              global text
              text, count = re.subn(pattern, replacement, text, count=1)
              if count != 1:
                  raise RuntimeError(f"Could not update baseline assertion: {pattern}")

          sub(r'self\.assertEqual\(\d+, self\.inventory\["production_module_count"\]\)',
              f'self.assertEqual({inventory["production_module_count"]}, self.inventory["production_module_count"])')
          sub(r'self\.assertEqual\([\d_]+, self\.inventory\["production_loc"\]\)',
              f'self.assertEqual({inventory["production_loc"]:_}, self.inventory["production_loc"])')
          sub(r'self\.assertEqual\(\d+, len\(self\.inventory\["installer_graph"\]\)\)',
              f'self.assertEqual({len(inventory["installer_graph"])}, len(self.inventory["installer_graph"]))')
          sub(r'self\.assertEqual\(\d+, self\.inventory\["violation_count"\]\)',
              f'self.assertEqual({inventory["violation_count"]}, self.inventory["violation_count"])')
          sub(r'self\.assertEqual\(\d+, shared\["production_python_files"\]\)',
              f'self.assertEqual({shared["production_python_files"]}, shared["production_python_files"])')
          sub(r'self\.assertEqual\([\d_]+, shared\["function_count"\]\)',
              f'self.assertEqual({shared["function_count"]:_}, shared["function_count"])')
          sub(r'self\.assertEqual\(\d+, shared\["private_contract_access_count"\]\)',
              f'self.assertEqual({shared["private_contract_access_count"]}, shared["private_contract_access_count"])')
          sub(r'self\.assertEqual\(\d+, shared\["exact_duplicate_group_count"\]\)',
              f'self.assertEqual({shared["exact_duplicate_group_count"]}, shared["exact_duplicate_group_count"])')
          sub(r'self\.assertEqual\(\d+, shared\["normalized_duplicate_group_count"\]\)',
              f'self.assertEqual({shared["normalized_duplicate_group_count"]}, shared["normalized_duplicate_group_count"])')
          sub(r'list\(range\(1, \d+\)\)', f'list(range(1, {len(inventory["installer_graph"]) + 1}))')
          sub(r'Production modules: \*\*\d+\*\*', f'Production modules: **{inventory["production_module_count"]}**')
          sub(r'Production LOC: \*\*\d+\*\*', f'Production LOC: **{inventory["production_loc"]}**')
          sub(r'Startup installer stages: \*\*\d+\*\*', f'Startup installer stages: **{len(inventory["installer_graph"])}**')
          sub(r'Registered package violations: \*\*\d+\*\*', f'Registered package violations: **{inventory["violation_count"]}**')
          sub(r'Registered exemptions: \*\*\d+\*\*', f'Registered exemptions: **{inventory["violation_count"]}**')
          test_path.write_text(text, encoding="utf-8")
          PY

      - name: Install locked dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements.lock

      - name: Validate focused provider surface
        shell: bash
        run: |
          python -m compileall -q main.py velvet_bot scripts tests
          python -m unittest -v \
            tests.test_ai_model_routing \
            tests.test_grs_media_provider \
            tests.test_grs_async_friendly_progress \
            tests.test_grs_violation_retry_balance \
            tests.test_kie_media_provider \
            tests.test_kie_economy_campaign \
            tests.test_media_provider_adapters \
            tests.test_application_composition \
            tests.test_package_architecture_inventory
          git diff --check

      - name: Remove one-time refactor machinery
        shell: bash
        run: |
          rm -f .github/workflows/issue-459-refactor.yml
          rm -f tools/issue_459_refactor_loader.py
          rm -f tools/issue_459_payload_*.txt

      - name: Commit canonical implementation
        shell: bash
        run: |
          git config user.name "ChatGPT Codex Connector"
          git config user.email "chatgpt-codex-connector@users.noreply.github.com"
          git add -A
          test -n "$(git status --porcelain)"
          git commit -m "Canonicalize media provider adapters"
          git push origin HEAD:fix/459-canonical-provider-adapters
