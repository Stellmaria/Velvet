name: tmp codex rate limit probe

on:
  push:
    branches:
      - fix/codex-rate-limit-probe

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/codex-rate-limit-probe
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Fix temporary template quoting
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/tmp_patch_codex_rate_limits.py')
          source = path.read_text(encoding='utf-8')
          source = source.replace(
              "_FAKE_CODEX = r'''#!/usr/bin/env python3",
              '_FAKE_CODEX = r"""#!/usr/bin/env python3',
              1,
          )
          source = source.replace(
              "        os.write(sys.stdout.fileno(), payload.encode())\n'''\n\n\nclass CodexRateLimitProbeTests",
              '        os.write(sys.stdout.fileno(), payload.encode())\n"""\n\n\nclass CodexRateLimitProbeTests',
              1,
          )
          path.write_text(source, encoding='utf-8')
          PY

      - name: Apply focused repair
        run: python .github/scripts/tmp_patch_codex_rate_limits.py

      - name: Normalize generated text files
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('deploy/hermes-coders/README.md')
          path.write_text(path.read_text(encoding='utf-8').rstrip() + '\n', encoding='utf-8')
          PY

      - name: Check patch hygiene
        run: |
          git diff --check
          git status --short

      - name: Run focused regression
        run: python -m unittest tests.test_codex_runner_rate_limits

      - name: Compile changed Python
        run: >-
          python -m compileall -q
          deploy/hermes-coders/codex_runner.py
          tests/test_codex_runner_rate_limits.py

      - name: Remove temporary automation
        run: |
          git rm -f -- .github/scripts/tmp_patch_codex_rate_limits.py
          git rm -- .github/workflows/tmp-codex-rate-limit-probe.yml

      - name: Stage exact product scope
        run: |
          git add -- deploy/hermes-coders/codex_runner.py
          git add -- deploy/hermes-coders/README.md
          git add -- tests/test_codex_runner_rate_limits.py
          git add -- docs/worklog/2026-08-06-codex-rate-limit-probe.md
          git diff --cached --check
          git diff --cached --stat

      - name: Commit and push repair
        run: |
          git config user.name "Velvet Automation"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Fix Codex subscription rate-limit probe"
          git push origin HEAD:fix/codex-rate-limit-probe
