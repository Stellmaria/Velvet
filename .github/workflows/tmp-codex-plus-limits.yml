name: temporary Codex Plus limits patch

on:
  push:
    branches:
      - feat-codex-plus-rate-limits

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat-codex-plus-rate-limits
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Apply implementation and inventories
        shell: bash
        run: |
          gzip -dc .github/tmp/apply_codex_plus_limits.py.gz > /tmp/apply_codex_plus_limits.py
          python3 /tmp/apply_codex_plus_limits.py
          python3 -m py_compile \
            deploy/hermes-coders/codex_runner.py \
            deploy/hermes-operator/coder_router.py \
            velvet_bot/presentation/telegram/routers/workspace_auf_provider_balances.py \
            tests/test_codex_subscription_rate_limits.py
          git diff --check
      - name: Commit generated implementation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            .env.server.example \
            deploy/hermes-coders/codex_runner.py \
            deploy/hermes-operator/coder_router.py \
            deploy/hermes-orchestration/install.sh \
            velvet_bot/presentation/telegram/routers/workspace_auf_provider_balances.py \
            tests/test_codex_subscription_rate_limits.py \
            docs/worklog/2026-08-05-codex-plus-rate-limits.md \
            docs/package_architecture_inventory.json \
            docs/package_architecture_inventory.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'feat: show Codex ChatGPT subscription limits'
          git push origin HEAD:feat-codex-plus-rate-limits
