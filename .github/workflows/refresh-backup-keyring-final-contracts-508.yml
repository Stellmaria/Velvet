name: refresh backup keyring final contracts 508

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: refresh-backup-keyring-final-contracts-508
  cancel-in-progress: false

jobs:
  refresh-and-verify:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: security/backup-keyring-508

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v7.2.1
        with:
          version: "0.11.16"
          enable-cache: true
          cache-dependency-glob: requirements.lock
          save-cache: false

      - name: Refresh final contracts
        shell: bash
        run: |
          set -euo pipefail
          uv pip install --system --require-hashes -r requirements.lock
          python - <<'PY'
          from pathlib import Path

          preflight = Path("tests/test_server_local_vision_contract.py")
          source = preflight.read_text(encoding="utf-8")
          anchor = '        "STORAGE_ENCRYPTION_SECRET": "storage_secret_12345678901234567890",\n'
          addition = anchor + '        "STORAGE_ENCRYPTION_ACTIVE_KEY_ID": "test-active-v2",\n'
          if "STORAGE_ENCRYPTION_ACTIVE_KEY_ID" not in source:
              if anchor not in source:
                  raise SystemExit("Local vision storage fixture anchor not found")
              source = source.replace(anchor, addition, 1)
              preflight.write_text(source, encoding="utf-8")

          owner_help = Path(
              "velvet_bot/presentation/telegram/routers/"
              "core_operations_controllers/owner_help.py"
          )
          source = owner_help.read_text(encoding="utf-8")
          anchor = '            ("storage_center", "алиас Telegram Storage Center"),\n'
          addition = anchor + (
              '            ("storage_keys", '
              '"показать active и historical key IDs без key material"),\n'
          )
          if '("storage_keys",' not in source:
              if anchor not in source:
                  raise SystemExit("Owner help storage anchor not found")
              source = source.replace(anchor, addition, 1)
              owner_help.write_text(source, encoding="utf-8")
          PY
          python scripts/inventory_repository_layout.py \
            --write \
            --label p3e-repository-layout-complete
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          inventory = json.loads(
              Path("docs/repository_layout_inventory.json").read_text(encoding="utf-8")
          )
          path = Path("tests/test_p3e_repository_layout_inventory.py")
          source = path.read_text(encoding="utf-8")
          replacements = {
              r'self\.assertEqual\([0-9_]+, inventory\["repository_module_count"\]\)': (
                  f'self.assertEqual({inventory["repository_module_count"]:_}, '
                  'inventory["repository_module_count"])'
              ),
              r'self\.assertEqual\([0-9_]+, inventory\["layout_counts"\]\["domain"\]\)': (
                  f'self.assertEqual({inventory["layout_counts"]["domain"]:_}, '
                  'inventory["layout_counts"]["domain"])'
              ),
          }
          for pattern, replacement in replacements.items():
              source, count = re.subn(pattern, replacement, source, count=1)
              if count != 1:
                  raise SystemExit(f"Repository assertion not found: {pattern}")
          path.write_text(source, encoding="utf-8")

          audit = Path("docs/ARCHITECTURE_AUDIT.md")
          source = audit.read_text(encoding="utf-8")
          audit_replacements = {
              r"- repository modules: \*\*[0-9_ ]+\*\*;": (
                  f'- repository modules: **{inventory["repository_module_count"]}**;'
              ),
              r"- domain repositories: \*\*[0-9_ ]+\*\*;": (
                  f'- domain repositories: **{inventory["layout_counts"]["domain"]}**;'
              ),
          }
          for pattern, replacement in audit_replacements.items():
              source, count = re.subn(pattern, replacement, source, count=1)
              if count != 1:
                  raise SystemExit(f"Architecture audit count not found: {pattern}")
          source = re.sub(
              r"(domain modules и )[0-9_ ]+( repositories)",
              rf'\g<1>{inventory["layout_counts"]["domain"]}\g<2>',
              source,
              count=1,
          )
          audit.write_text(source, encoding="utf-8")
          PY
          python scripts/inventory_repository_layout.py \
            --check \
            --label p3e-repository-layout-complete
          python -m unittest \
            tests.test_p3e_repository_layout_inventory \
            tests.test_server_local_vision_contract \
            tests.test_owner_help \
            tests.test_canonical_docs_sync -v
          python scripts/ci_preflight.py

      - name: Commit final contracts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            docs/ARCHITECTURE_AUDIT.md \
            docs/repository_layout_inventory.json \
            docs/repository_layout_inventory.md \
            tests/test_p3e_repository_layout_inventory.py \
            tests/test_server_local_vision_contract.py \
            velvet_bot/presentation/telegram/routers/core_operations_controllers/owner_help.py
          if git diff --cached --quiet; then
            echo "Final contracts are already current."
            exit 0
          fi
          git commit -m "test: refresh backup keyring repository contracts"
          git push origin HEAD:security/backup-keyring-508
