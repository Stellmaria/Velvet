name: temporary sync Kael entity inventory

on:
  push:
    branches:
      - agent/kael-librarian-personas

permissions:
  contents: write

jobs:
  sync:
    if: github.event.head_commit.message != 'Синхронизировать inventory сущностей Каэля'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/kael-librarian-personas
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Generate package architecture inventory
        run: |
          python scripts/inventory_package_architecture.py \
            --write \
            --label p1-package-architecture-baseline

      - name: Synchronize canonical LOC contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          inventory = json.loads(
              Path('docs/package_architecture_inventory.json').read_text(encoding='utf-8')
          )
          loc = int(inventory['production_loc'])
          underscored = f'{loc:_}'
          spaced = f'{loc:,}'.replace(',', ' ')

          test_path = Path('tests/test_package_architecture_inventory.py')
          test_text = test_path.read_text(encoding='utf-8')
          test_text, count = re.subn(
              r'self\.assertEqual\([\d_]+, self\.inventory\["production_loc"\]\)',
              f'self.assertEqual({underscored}, self.inventory["production_loc"])',
              test_text,
              count=1,
          )
          if count != 1:
              raise SystemExit('Could not update production_loc test contract')
          test_path.write_text(test_text, encoding='utf-8')

          for filename in ('docs/development_status.md', 'docs/ARCHITECTURE_AUDIT.md'):
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              text, count = re.subn(
                  r'(production LOC:\s*\*\*)[\d ]+(\*\*)',
                  rf'\g<1>{spaced}\g<2>',
                  text,
              )
              if count < 1:
                  raise SystemExit(f'Could not update LOC in {filename}')
              path.write_text(text, encoding='utf-8')
          PY

      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/tmp-sync-kael-inventory.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            docs/package_architecture_inventory.json \
            docs/package_architecture_inventory.md \
            docs/development_status.md \
            docs/ARCHITECTURE_AUDIT.md \
            tests/test_package_architecture_inventory.py \
            .github/workflows/tmp-sync-kael-inventory.yml
          git commit -m 'Синхронизировать inventory сущностей Каэля'
          git push origin HEAD:agent/kael-librarian-personas
