name: Temporary fix Auf router protocol

on:
  push:
    branches:
      - agent/final-auf-router-layer

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/final-auf-router-layer
          fetch-depth: 0

      - name: Repair explicit legacy protocol boundary
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent
          import re

          root = Path('.')
          routers = root / 'velvet_bot/presentation/telegram/routers'
          workflow = root / '.github/workflows/temporary-fix-auf-router-protocol.yml'

          legacy = routers / 'workspace_auf_legacy.py'
          legacy.write_text(dedent('''
              """Read-only compatibility definitions for pre-Auf Telegram payloads and FSM states."""

              from aiogram.filters.callback_data import CallbackData
              from aiogram.fsm.state import State, StatesGroup


              class LegacyMeowCallback(CallbackData, prefix="meow"):
                  action: str
                  workspace_id: int = 0
                  value: str = ""
                  item_id: int = 0
                  offset: int = 0


              class LegacyMeowVideoCallback(CallbackData, prefix="meowv"):
                  action: str
                  workspace_id: int = 0
                  value: str = ""
                  item_id: int = 0
                  offset: int = 0


              class MeowForm(StatesGroup):
                  """Exact state names used by photo flows before the Auf migration."""

                  collecting_references = State()
                  waiting_prompt = State()
                  reviewing_request = State()
                  choosing_model = State()
                  choosing_quality = State()


              class MeowVideoForm(StatesGroup):
                  """Exact state names used by video flows before the Auf migration."""

                  choosing_reference = State()
                  waiting_reference = State()
                  waiting_prompt = State()
                  choosing_settings = State()
                  reviewing = State()


              class MeowRuntimeForm(StatesGroup):
                  """Exact state name used by runtime-limit input before the Auf migration."""

                  waiting_limit = State()


              __all__ = (
                  "LegacyMeowCallback",
                  "LegacyMeowVideoCallback",
                  "MeowForm",
                  "MeowRuntimeForm",
                  "MeowVideoForm",
              )
          ''').lstrip(), encoding='utf-8')

          photo = routers / 'workspace_auf.py'
          text = photo.read_text(encoding='utf-8')
          text = re.sub(
              r'\nclass Legacy(?:Auf|Meow)Callback\(CallbackData, prefix="meow"\):.*?\n\n(?=class AufForm)',
              '\n\n',
              text,
              flags=re.S,
          )
          photo.write_text(text, encoding='utf-8')

          video = routers / 'workspace_auf_video.py'
          text = video.read_text(encoding='utf-8')
          text = re.sub(
              r'\nclass Legacy(?:Auf|Meow)VideoCallback\(CallbackData, prefix="meowv"\):.*?\n\n(?=class AufVideoForm)',
              '\n\n',
              text,
              flags=re.S,
          )
          text = re.sub(
              r'\nclass Legacy(?:Auf|Meow)VideoForm\(StatesGroup\):.*?\n\n(?=def _callback)',
              '\n\n',
              text,
              flags=re.S,
          )
          video.write_text(text, encoding='utf-8')

          (routers / 'workspace_meow.py').write_text(dedent('''
              """Compatibility module for the retired workspace_meow path."""

              from velvet_bot.presentation.telegram.routers import workspace_auf as _canonical
              from velvet_bot.presentation.telegram.routers.workspace_auf import *  # noqa: F403
              from velvet_bot.presentation.telegram.routers.workspace_auf_legacy import (
                  LegacyMeowCallback as MeowCallback,
                  MeowForm,
              )


              def __getattr__(name: str):
                  direct = getattr(_canonical, name, None)
                  if direct is not None:
                      return direct
                  mapped = name.replace("Meow", "Auf").replace("meow", "auf")
                  return getattr(_canonical, mapped)
          ''').lstrip(), encoding='utf-8')

          (routers / 'workspace_meow_video.py').write_text(dedent('''
              """Compatibility module for the retired workspace_meow_video path."""

              from velvet_bot.presentation.telegram.routers import workspace_auf_video as _canonical
              from velvet_bot.presentation.telegram.routers.workspace_auf_video import *  # noqa: F403
              from velvet_bot.presentation.telegram.routers.workspace_auf_legacy import (
                  LegacyMeowVideoCallback as MeowVideoCallback,
                  MeowVideoForm,
              )


              def __getattr__(name: str):
                  direct = getattr(_canonical, name, None)
                  if direct is not None:
                      return direct
                  mapped = name.replace("Meow", "Auf").replace("meow", "auf")
                  return getattr(_canonical, mapped)
          ''').lstrip(), encoding='utf-8')

          (routers / 'workspace_meow_runtime.py').write_text(dedent('''
              """Compatibility module for the retired workspace_meow_runtime path."""

              from velvet_bot.presentation.telegram.routers import workspace_auf_runtime as _canonical
              from velvet_bot.presentation.telegram.routers.workspace_auf_runtime import *  # noqa: F403
              from velvet_bot.presentation.telegram.routers.workspace_auf_legacy import MeowRuntimeForm

              MeowRuntimeCallback = _canonical.AufRuntimeCallback


              def __getattr__(name: str):
                  direct = getattr(_canonical, name, None)
                  if direct is not None:
                      return direct
                  mapped = name.replace("Meow", "Auf").replace("meow", "auf")
                  return getattr(_canonical, mapped)
          ''').lstrip(), encoding='utf-8')

          runtime = routers / 'workspace_auf_runtime.py'
          text = runtime.read_text(encoding='utf-8')
          text = text.replace(
              '\n# Compatibility aliases for imports from stacked branches.\nAufRuntimeCallback = AufRuntimeCallback\nAufRuntimeForm = AufRuntimeForm\n',
              '\n',
          )
          runtime.write_text(text, encoding='utf-8')

          simple = routers / 'workspace_auf_video_simple.py'
          text = simple.read_text(encoding='utf-8')
          text = text.replace(
              'from velvet_bot.presentation.telegram.routers import workspace_auf_video as legacy\n',
              'from velvet_bot.presentation.telegram.routers.workspace_auf_video import (\n    AufVideoCallback,\n    AufVideoForm,\n)\n',
          )
          text = text.replace('\nAufVideoCallback = legacy.AufVideoCallback\nAufVideoForm = legacy.AufVideoForm\n', '\n')
          text = text.replace('legacy._callback(', 'video_callback(')
          if 'video_callback(' in text and 'video_callback =' not in text:
              marker = 'from velvet_bot.presentation.telegram.routers.workspace_auf_video import (\n    AufVideoCallback,\n    AufVideoForm,\n)\n'
              replacement = marker.replace('    AufVideoForm,\n', '    AufVideoForm,\n    _callback as video_callback,\n')
              text = text.replace(marker, replacement)
          simple.write_text(text, encoding='utf-8')

          controller = root / 'velvet_bot/presentation/telegram/workspace_home_controller.py'
          text = controller.read_text(encoding='utf-8')
          text = text.replace('    LegacyMeowCallback,\n    LegacyMeowForm,\n', '')
          text = text.replace('    LegacyMeowVideoCallback,\n    LegacyMeowVideoForm,\n', '')
          legacy_import = dedent('''
              from velvet_bot.presentation.telegram.routers.workspace_auf_legacy import (
                  LegacyMeowCallback,
                  LegacyMeowVideoCallback,
                  MeowForm,
                  MeowRuntimeForm,
                  MeowVideoForm,
              )
          ''')
          marker = 'from velvet_bot.presentation.telegram.routers.workspace_auf_grs import ('
          if 'workspace_auf_legacy import' not in text:
              text = text.replace(marker, legacy_import + marker)

          direct_replacements = {
              '    handle_auf_prompt as handle_legacy_meow_prompt,\n': '    handle_auf_prompt,\n',
              '    handle_auf_reference_message as handle_legacy_meow_reference_message,\n': '    handle_auf_reference_message,\n',
              '    handle_auf_reference_text as handle_legacy_meow_reference_text,\n': '    handle_auf_reference_text,\n',
              '    handle_auf_action as handle_legacy_meow_action,\n': '    handle_auf_action,\n',
              '    handle_auf_video_action as handle_legacy_auf_video_action,\n': '    handle_auf_video_action,\n',
              '    handle_auf_video_entry as handle_legacy_auf_video_entry,\n': '    handle_auf_video_entry,\n',
              '    handle_auf_video_prompt as handle_legacy_auf_video_prompt,\n': '    handle_auf_video_prompt,\n',
              '    handle_auf_video_reference_message as handle_legacy_auf_video_reference_message,\n': '    handle_auf_video_reference_message,\n',
          }
          for old, new in direct_replacements.items():
              text = text.replace(old, new)
          for old, new in (
              ('handle_legacy_meow_prompt', 'handle_auf_prompt'),
              ('handle_legacy_meow_reference_message', 'handle_auf_reference_message'),
              ('handle_legacy_meow_reference_text', 'handle_auf_reference_text'),
              ('handle_legacy_meow_action', 'handle_auf_action'),
              ('handle_legacy_auf_video_action', 'handle_auf_video_action'),
              ('handle_legacy_auf_video_entry', 'handle_auf_video_entry'),
              ('handle_legacy_auf_video_prompt', 'handle_auf_video_prompt'),
              ('handle_legacy_auf_video_reference_message', 'handle_auf_video_reference_message'),
              ('_require_meow_callback', '_require_auf_callback'),
              ('_require_meow_message', '_require_auf_message'),
              ('handle_scoped_meow_action', 'handle_scoped_auf_action'),
              ('handle_scoped_meow_prompt', 'handle_scoped_auf_prompt'),
              ('handle_scoped_meow_reference_message', 'handle_scoped_auf_reference_message'),
              ('handle_scoped_meow_reference_text', 'handle_scoped_auf_reference_text'),
          ):
              text = text.replace(old, new)
          text = text.replace(
              '    """Permit one already-authorized Meow handler without widening global access."""',
              '    """Permit one already-authorized Auf handler without widening global access."""',
          )
          text = text.replace(
              '    """Register canonical home plus module-scoped photo and video Meow flows."""',
              '    """Register canonical home plus module-scoped photo and video Auf flows."""',
          )
          text = text.replace(
              'workspace_id = int(data.get(workspace_key) or 0)',
              'legacy_key = workspace_key.replace("auf", "meow", 1)\n    workspace_id = int(data.get(workspace_key) or data.get(legacy_key) or 0)',
          )
          text = text.replace(
              'setattr(AufVideoCallback, "__separator__", "|")',
              'setattr(AufVideoCallback, "__separator__", "|")\nsetattr(LegacyMeowVideoCallback, "__separator__", "|")',
          )
          helper = dedent('''

              def _auf_callback_filter(rule=None):
                  return or_f(
                      AufCallback.filter(rule),
                      LegacyMeowCallback.filter(rule),
                  )


              def _auf_video_callback_filter(rule=None):
                  return or_f(
                      AufVideoCallback.filter(rule),
                      LegacyMeowVideoCallback.filter(rule),
                  )
          ''').rstrip()
          if 'def _auf_callback_filter' not in text:
              anchor = 'setattr(LegacyMeowVideoCallback, "__separator__", "|")'
              text = text.replace(anchor, anchor + helper)
          text = text.replace(
              'WorkspaceCallback.filter(F.action == "meow")',
              'WorkspaceCallback.filter(F.action.in_({"auf", "meow"}))',
          )
          text = text.replace(
              '        AufRuntimeForm.waiting_limit,',
              '        or_f(AufRuntimeForm.waiting_limit, MeowRuntimeForm.waiting_limit),',
          )
          text = text.replace(
              '        AufVideoForm.waiting_reference,',
              '        or_f(AufVideoForm.waiting_reference, MeowVideoForm.waiting_reference),',
          )
          text = text.replace(
              '        AufVideoForm.waiting_prompt,',
              '        or_f(AufVideoForm.waiting_prompt, MeowVideoForm.waiting_prompt),',
          )
          text = text.replace(
              '        AufForm.collecting_references,',
              '        or_f(AufForm.collecting_references, MeowForm.collecting_references),',
          )
          text = text.replace(
              '        AufForm.waiting_prompt,',
              '        or_f(AufForm.waiting_prompt, MeowForm.waiting_prompt),',
          )
          controller.write_text(text, encoding='utf-8')

          boundary = root / 'tests/test_auf_router_brand_boundary.py'
          boundary.write_text(dedent('''
              from __future__ import annotations
              from pathlib import Path

              ROOT = Path(__file__).resolve().parents[1]
              ROUTERS = ROOT / "velvet_bot/presentation/telegram/routers"


              def _read(path: Path) -> str:
                  return path.read_text(encoding="utf-8")


              def test_canonical_auf_routers_do_not_import_retired_paths() -> None:
                  for path in ROUTERS.glob("workspace_auf*.py"):
                      if path.name == "workspace_auf_legacy.py":
                          continue
                      source = _read(path)
                      assert "workspace_meow" not in source, path
                      assert "class Meow" not in source, path


              def test_retired_generation_routers_are_only_compatibility_modules() -> None:
                  for path in ROUTERS.glob("workspace_meow*.py"):
                      if path.name == "workspace_meow_wallet.py":
                          continue
                      source = _read(path)
                      assert "Compatibility module" in source, path
                      assert len(source.splitlines()) <= 24, path


              def test_new_callback_protocol_is_auf_and_legacy_is_read_only() -> None:
                  photo = _read(ROUTERS / "workspace_auf.py")
                  video = _read(ROUTERS / "workspace_auf_video.py")
                  legacy = _read(ROUTERS / "workspace_auf_legacy.py")
                  controller = _read(
                      ROOT / "velvet_bot/presentation/telegram/workspace_home_controller.py"
                  )
                  assert 'class AufCallback(CallbackData, prefix="auf")' in photo
                  assert 'class AufVideoCallback(CallbackData, prefix="aufv")' in video
                  assert 'class LegacyMeowCallback(CallbackData, prefix="meow")' in legacy
                  assert 'class LegacyMeowVideoCallback(CallbackData, prefix="meowv")' in legacy
                  assert 'class MeowForm(StatesGroup)' in legacy
                  assert "_auf_callback_filter" in controller
                  assert 'F.action.in_({"auf", "meow"})' in controller
                  assert "MeowRuntimeForm.waiting_limit" in controller


              def test_new_workspace_buttons_use_auf_action() -> None:
                  source = _read(ROOT / "velvet_bot/domains/auf_runtime/__init__.py")
                  assert 'AUF_WORKSPACE_ACTION = "auf"' in source
                  assert 'LEGACY_AUF_WORKSPACE_ACTION = "meow"' in source
          ''').lstrip(), encoding='utf-8')

          workflow.unlink()
          PY

          python scripts/inventory_architecture_layout.py \
            --write \
            --label p3d-analytics-alias-retirement
          python scripts/update_p2_stability_inventory.py \
            --label p2-auf-router-protocol-migration \
            --schema-version 67
          python scripts/telegram_navigation_inventory.py \
            --root velvet_bot \
            --markdown docs/generated/telegram_navigation_inventory.md

      - name: Commit repaired compatibility boundary
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Исправить dual-read Telegram-протокол Ауф"
          git push origin HEAD:agent/final-auf-router-layer
