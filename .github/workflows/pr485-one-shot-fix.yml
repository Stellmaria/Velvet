name: PR 485 one-shot fix

on:
  push:
    branches:
      - agent/fix-server-deployment-portability

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-server-deployment-portability

      - name: Apply focused fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          kie_path = Path("velvet_bot/core/config/kie.py")
          kie = kie_path.read_text(encoding="utf-8")

          current_decimals = '''    usd_to_rub = _env_decimal("KIE_USD_TO_RUB", "0")
    credit_usd = _env_decimal("KIE_CREDIT_USD", "0.005")
    credit_byn = _env_decimal("KIE_CREDIT_BYN", "0.019")
'''
          portable_decimals = '''    usd_to_rub = _parse_non_negative_decimal(
        os.getenv("KIE_USD_TO_RUB", "").strip() or "0",
        variable_name="KIE_USD_TO_RUB",
    )
    credit_usd = _parse_non_negative_decimal(
        os.getenv("KIE_CREDIT_USD", "").strip() or "0.005",
        variable_name="KIE_CREDIT_USD",
    )
    credit_byn = _parse_non_negative_decimal(
        os.getenv("KIE_CREDIT_BYN", "").strip() or "0.019",
        variable_name="KIE_CREDIT_BYN",
    )
'''
          if kie.count(current_decimals) != 1:
              raise SystemExit("Expected decimal settings block was not found exactly once")
          kie = kie.replace(current_decimals, portable_decimals, 1)

          current_helper = '''def _env_decimal(variable_name: str, default: str) -> Decimal:
    value = os.getenv(variable_name, "").strip() or default
    return _parse_non_negative_decimal(value, variable_name=variable_name)
'''
          portable_helper = '''def _env_decimal(variable_name: str, default: str) -> Decimal:
    return _parse_non_negative_decimal(
        os.getenv(variable_name, "").strip() or default,
        variable_name=variable_name,
    )
'''
          if kie.count(current_helper) != 1:
              raise SystemExit("Expected decimal helper was not found exactly once")
          kie = kie.replace(current_helper, portable_helper, 1)
          kie_path.write_text(kie, encoding="utf-8")

          smoke_path = Path("tests/test_server_smoke.py")
          smoke = smoke_path.read_text(encoding="utf-8")
          old_assertion = '        self.assertIn("rp_sessions", CRITICAL_TABLES)\n'
          new_assertion = '        self.assertIn("roleplay_sessions", CRITICAL_TABLES)\n'
          if smoke.count(old_assertion) != 1:
              raise SystemExit("Expected roleplay table assertion was not found exactly once")
          smoke_path.write_text(
              smoke.replace(old_assertion, new_assertion, 1),
              encoding="utf-8",
          )
          PY

      - name: Validate focused fixes
        shell: bash
        run: |
          python -m py_compile velvet_bot/core/config/kie.py tests/test_server_smoke.py
          python -m unittest discover -s tests -p 'test_server_smoke.py' -v
          python scripts/inventory_package_architecture.py \
            --check \
            --label p1-package-architecture-baseline

      - name: Commit verified fixes and remove helper workflow
        shell: bash
        run: |
          rm -f .github/workflows/pr485-one-shot-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add velvet_bot/core/config/kie.py tests/test_server_smoke.py \
            .github/workflows/pr485-one-shot-fix.yml
          git commit -m "Fix deployment portability CI contracts"
          git push origin HEAD:agent/fix-server-deployment-portability
