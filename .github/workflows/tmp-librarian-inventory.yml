name: temporary librarian inventory generator

on:
  push:
    branches:
      - fix/librarian-reconcile-tmp
    paths:
      - .github/workflows/tmp-librarian-inventory.yml

permissions:
  contents: write

jobs:
  generate-and-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/librarian-reconcile-tmp
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6.0.0
        with:
          python-version: "3.13"

      - name: Generate synchronized inventory
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/inventory_package_architecture.py \
            --write \
            --label p1-package-architecture-baseline
          python - <<'PY'
          from pathlib import Path
          path = Path("tests/test_package_architecture_inventory.py")
          text = path.read_text(encoding="utf-8")
          old = "self.assertEqual(144156, self.inventory[\"production_loc\"])"
          new = "self.assertEqual(144196, self.inventory[\"production_loc\"])"
          if old not in text:
              raise SystemExit("expected production_loc baseline not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Remove temporary workflow and commit generated files
        shell: bash
        run: |
          set -Eeuo pipefail
          git rm .github/workflows/tmp-librarian-inventory.yml
          git add \
            docs/package_architecture_inventory.json \
            docs/package_architecture_inventory.md \
            tests/test_package_architecture_inventory.py
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Synchronize Librarian architecture inventory"
          git push origin HEAD:fix/librarian-reconcile-tmp
