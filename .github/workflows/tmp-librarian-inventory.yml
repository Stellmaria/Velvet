name: temporary librarian inventory generator

on:
  push:
    branches:
      - fix/librarian-reconcile-tmp
    paths:
      - .github/workflows/tmp-librarian-inventory.yml

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6.0.0
        with:
          python-version: "3.13"

      - name: Generate package architecture inventory
        run: >-
          python scripts/inventory_package_architecture.py
          --write
          --label p1-package-architecture-baseline

      - name: Upload generated inventory
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v6.0.0
        with:
          name: librarian-package-architecture-inventory
          path: |
            docs/package_architecture_inventory.json
            docs/package_architecture_inventory.md
          if-no-files-found: error
          retention-days: 1
