name: tmp PR 493 finalize current main

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Regenerate architecture baseline
        run: |
          python scripts/inventory_package_architecture.py \
            --write \
            --bootstrap-exemptions \
            --label p1-package-architecture-baseline
      - name: Update exact contracts and worklog
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          data = json.loads(
              Path("docs/package_architecture_inventory.json").read_text(
                  encoding="utf-8"
              )
          )
          modules = int(data["production_module_count"])
          loc = int(data["production_loc"])
          violations = int(data["violation_count"])

          test_path = Path("tests/test_package_architecture_inventory.py")
          text = test_path.read_text(encoding="utf-8")
          patterns = (
              (
                  r'self\.assertEqual\(\d+, self\.inventory\["production_module_count"\]\)',
                  f'self.assertEqual({modules}, self.inventory["production_module_count"])',
              ),
              (
                  r'self\.assertEqual\([\d_]+, self\.inventory\["production_loc"\]\)',
                  f'self.assertEqual({loc:_}, self.inventory["production_loc"])',
              ),
              (
                  r'self\.assertEqual\(\d+, self\.inventory\["violation_count"\]\)',
                  f'self.assertEqual({violations}, self.inventory["violation_count"])',
              ),
              (
                  r'Production modules: \*\*\d+\*\*',
                  f'Production modules: **{modules}**',
              ),
              (
                  r'Production LOC: \*\*\d+\*\*',
                  f'Production LOC: **{loc}**',
              ),
              (
                  r'Registered package violations: \*\*\d+\*\*',
                  f'Registered package violations: **{violations}**',
              ),
              (
                  r'Registered exemptions: \*\*\d+\*\*',
                  f'Registered exemptions: **{violations}**',
              ),
          )
          for pattern, replacement in patterns:
              text, count = re.subn(pattern, replacement, text, count=1)
              if count != 1:
                  raise SystemExit(f"contract replacement failed: {pattern}")
          test_path.write_text(text, encoding="utf-8")

          worklog_path = Path(
              "docs/worklog/2026-07-31-owner-cost-public-attempt-privacy.md"
          )
          worklog = worklog_path.read_text(encoding="utf-8")
          worklog = re.sub(
              r"(?m)^- Базовый commit: [0-9a-f]{40}$",
              "- Базовый commit: 6b9c9d0ced4c386c7844775699fcb7f7199477d0",
              worklog,
              count=1,
          )
          worklog = re.sub(
              r"Generated architecture inventory и exemptions пересобраны: .*? Итоговый CI",
              (
                  "Generated architecture inventory и exemptions пересобраны: "
                  f"{modules} production-модулей, {loc} LOC и {violations} "
                  "зарегистрированных архитектурных исключений. Итоговый CI"
              ),
              worklog,
              count=1,
          )
          worklog = re.sub(
              r"(?m)^- актуальная база: `[0-9a-f]{40}`;$",
              "- актуальная база: `6b9c9d0ced4c386c7844775699fcb7f7199477d0`;",
              worklog,
              count=1,
          )
          worklog_path.write_text(worklog, encoding="utf-8")
          PY
      - name: Commit generated baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/package_architecture_inventory.json \
            docs/package_architecture_inventory.md \
            docs/package_architecture_exemptions.json \
            docs/worklog/2026-07-31-owner-cost-public-attempt-privacy.md \
            tests/test_package_architecture_inventory.py
          git diff --cached --check
          git commit -m "fix: refresh PR 493 baseline on current main"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
