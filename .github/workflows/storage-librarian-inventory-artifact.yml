name: storage librarian inventory artifact

on:
  push:
    branches:
      - agent/storage-librarian
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Generate inventories
        run: |
          python scripts/inventory_package_architecture.py \
            --label storage-librarian \
            --write
          python scripts/inventory_repository_layout.py \
            --label storage-librarian \
            --write

      - name: Upload inventories
        uses: actions/upload-artifact@v4
        with:
          name: storage-librarian-inventories
          path: |
            docs/package_architecture_inventory.json
            docs/package_architecture_inventory.md
            docs/repository_layout_inventory.json
            docs/repository_layout_inventory.md
          if-no-files-found: error
          retention-days: 1
