name: storage librarian inventory artifact

on:
  push:
    branches:
      - agent/storage-librarian

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/storage-librarian

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Generate inventories
        run: |
          python scripts/inventory_package_architecture.py \
            --label storage-librarian \
            --write
          python scripts/inventory_repository_layout.py \
            --label storage-librarian \
            --write
          python scripts/update_p2_stability_inventory.py \
            --label storage-librarian \
            --schema-version 76

      - name: Commit generated inventories
        run: |
          if git diff --quiet -- \
            docs/package_architecture_inventory.json \
            docs/package_architecture_inventory.md \
            docs/repository_layout_inventory.json \
            docs/repository_layout_inventory.md \
            docs/p2_stability_inventory.json \
            docs/p2_stability_inventory.md
          then
            echo "Inventories already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            docs/package_architecture_inventory.json \
            docs/package_architecture_inventory.md \
            docs/repository_layout_inventory.json \
            docs/repository_layout_inventory.md \
            docs/p2_stability_inventory.json \
            docs/p2_stability_inventory.md
          git commit -m "Обновить архитектурные inventory Storage Librarian"
          git push origin HEAD:agent/storage-librarian
