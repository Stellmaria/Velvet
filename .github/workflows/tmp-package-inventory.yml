name: temp package inventory

on:
  push:
    branches:
      - fix/vl-quality-worker-gate

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Generate package inventory
        run: python scripts/inventory_package_architecture.py --write --label p1-package-architecture-baseline
      - name: Upload generated inventory
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: package-inventory
          path: |
            docs/package_architecture_inventory.json
            docs/package_architecture_inventory.md
          retention-days: 1
