name: publish verified vision gateway image

on:
  push:
    branches:
      - main
    paths:
      - "vision_gateway/**"
      - "Dockerfile.vision-gateway"
      - "requirements.vision-gateway.txt"
      - ".github/workflows/publish-vision-gateway-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-verified-vision-gateway-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_REPOSITORY: ghcr.io/stellmaria/velvet-vision-gateway

jobs:
  build-scan-publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build revision-labelled vision gateway image
        shell: bash
        run: |
          set -Eeuo pipefail
          docker build \
            --file Dockerfile.vision-gateway \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.component=vision-gateway" \
            --tag "${IMAGE_REPOSITORY}:${GITHUB_SHA}" .

      - name: Block high and critical findings before publish
        uses: aquasecurity/trivy-action@c07df6fec6fa692e6fd1200d50aaa1fdd66f03c8 # 0.35.0
        with:
          image-ref: ghcr.io/stellmaria/velvet-vision-gateway:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Generate CycloneDX SBOM before publish
        uses: aquasecurity/trivy-action@c07df6fec6fa692e6fd1200d50aaa1fdd66f03c8 # 0.35.0
        with:
          image-ref: ghcr.io/stellmaria/velvet-vision-gateway:${{ github.sha }}
          format: cyclonedx
          output: published-vision-gateway-sbom.cdx.json
          exit-code: "0"

      - name: Authenticate to GHCR
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Publish scanned image and record immutable digest
        shell: bash
        run: |
          set -Eeuo pipefail
          tag="${IMAGE_REPOSITORY}:${GITHUB_SHA}"
          docker push "$tag"
          digest_ref="$(docker image inspect "$tag" --format '{{index .RepoDigests 0}}')"
          if [[ ! "$digest_ref" =~ ^ghcr\.io/stellmaria/velvet-vision-gateway@sha256:[0-9a-f]{64}$ ]]; then
            echo "Registry did not return an immutable vision gateway digest: $digest_ref" >&2
            exit 1
          fi
          revision="$(docker image inspect "$digest_ref" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')"
          component="$(docker image inspect "$digest_ref" --format '{{index .Config.Labels "org.opencontainers.image.component"}}')"
          if [[ "$revision" != "$GITHUB_SHA" ]]; then
            echo "Published vision gateway revision mismatch: $revision" >&2
            exit 1
          fi
          if [[ "$component" != "vision-gateway" ]]; then
            echo "Published image component label mismatch: $component" >&2
            exit 1
          fi
          requirements_digest="$(sha256sum requirements.vision-gateway.txt | awk '{print $1}')"
          export DIGEST_REF="$digest_ref" REQUIREMENTS_DIGEST="$requirements_digest"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          metadata = {
              "component": "vision-gateway",
              "source_commit": os.environ["GITHUB_SHA"],
              "image_digest": os.environ["DIGEST_REF"],
              "requirements_sha256": os.environ["REQUIREMENTS_DIGEST"],
              "repository": os.environ["GITHUB_REPOSITORY"],
              "workflow_run": (
                  f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}"
                  f"/actions/runs/{os.environ['GITHUB_RUN_ID']}"
              ),
          }
          Path("published-vision-gateway-metadata.json").write_text(
              json.dumps(metadata, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          cat published-vision-gateway-metadata.json
          echo "### Published vision gateway image" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Digest: \`$digest_ref\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload publish evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: published-vision-gateway-${{ github.sha }}
          path: |
            published-vision-gateway-sbom.cdx.json
            published-vision-gateway-metadata.json
          if-no-files-found: error
          retention-days: 30
