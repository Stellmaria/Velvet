name: Temporary Codex recovery canonical sync

on:
  push:
    branches:
      - feat/codex-recovery-notification

permissions:
  contents: write

concurrency:
  group: tmp-codex-recovery-canonical-sync
  cancel-in-progress: false

jobs:
  refresh:
    if: >-
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/codex-recovery-notification
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'

      - name: Refresh canonical generated artifacts and docs
        shell: bash
        run: |
          set -Eeuo pipefail

          python scripts/inventory_package_architecture_fast.py \
            --write \
            --label p1-package-architecture-baseline

          python scripts/telegram_navigation_inventory.py \
            --root velvet_bot \
            --markdown docs/generated/telegram_navigation_inventory.md \
            --check

          python - <<'PY'
          import json
          import re
          from pathlib import Path

          inventory = json.loads(
              Path('docs/package_architecture_inventory.json').read_text(encoding='utf-8')
          )
          production_files = int(inventory['production_module_count'])
          production_loc = int(inventory['production_loc'])

          test_path = Path('tests/test_package_architecture_inventory.py')
          test_text = test_path.read_text(encoding='utf-8')
          test_text, files_updates = re.subn(
              r'self\.assertEqual\(\d+, self\.inventory\["production_module_count"\]\)',
              f'self.assertEqual({production_files}, self.inventory["production_module_count"])',
              test_text,
              count=1,
          )
          test_text, loc_updates = re.subn(
              r'self\.assertEqual\(\d+, self\.inventory\["production_loc"\]\)',
              f'self.assertEqual({production_loc}, self.inventory["production_loc"])',
              test_text,
              count=1,
          )
          if files_updates != 1 or loc_updates != 1:
              raise SystemExit(
                  f'baseline assertions update mismatch: files={files_updates} loc={loc_updates}'
              )
          test_path.write_text(test_text, encoding='utf-8')

          marker = '<!-- codex-recovery-notification-architecture-slice -->'
          end_marker = '<!-- /codex-recovery-notification-architecture-slice -->'
          slice_text = f'''{marker}
## Срез Codex recovery notification от 8 августа 2026 года

Воспроизводимый repository baseline после добавления persistent-deduplicated recovery notification:

- package production modules: **{production_files}**;
- package production LOC: **{production_loc}**;
- Codex availability/routing authority и пятичасовой probe cadence не менялись;
- Telegram transport использует существующий main Velvet bot/application path;
- production rollout и live canary остаются отдельной эксплуатационной проверкой.
{end_marker}'''
          slice_pattern = re.compile(
              re.escape(marker) + r'.*?' + re.escape(end_marker),
              re.DOTALL,
          )
          for filename in (
              'docs/development_status.md',
              'docs/project_memory.md',
              'docs/ARCHITECTURE_AUDIT.md',
          ):
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              if slice_pattern.search(text):
                  text = slice_pattern.sub(slice_text, text, count=1)
              else:
                  text = text.rstrip() + '\n\n' + slice_text + '\n'
              path.write_text(text, encoding='utf-8')

          worklog_path = Path('docs/worklog/2026-08-08-codex-recovery-notification.md')
          worklog = worklog_path.read_text(encoding='utf-8')
          note_marker = '<!-- canonical-baseline-sync -->'
          note = (
              f'{note_marker}\n'
              f'- Final canonical inventory sync: **{production_files}** production modules, '
              f'**{production_loc}** production LOC; package label '
              '`p1-package-architecture-baseline`; Telegram navigation inventory refreshed.'
          )
          note_pattern = re.compile(
              re.escape(note_marker) + r'\n- Final canonical inventory sync:.*?(?=\n(?:#|<!--)|\Z)',
              re.DOTALL,
          )
          if note_pattern.search(worklog):
              worklog = note_pattern.sub(note, worklog, count=1)
          else:
              worklog = worklog.rstrip() + '\n\n' + note + '\n'
          worklog_path.write_text(worklog, encoding='utf-8')
          PY

          python scripts/inventory_package_architecture_fast.py \
            --check \
            --label p1-package-architecture-baseline

          python -m unittest \
            tests.test_package_architecture_inventory \
            tests.test_canonical_docs_sync \
            -v

      - name: Commit canonical sync and remove helper workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/tmp-codex-recovery-canonical-sync.yml
          git add \
            docs/package_architecture_inventory.json \
            docs/package_architecture_inventory.md \
            docs/generated/telegram_navigation_inventory.md \
            docs/development_status.md \
            docs/project_memory.md \
            docs/ARCHITECTURE_AUDIT.md \
            tests/test_package_architecture_inventory.py \
            docs/worklog/2026-08-08-codex-recovery-notification.md
          git diff --cached --check
          git commit -m 'chore: refresh Codex recovery baseline after main sync'
          git push origin HEAD:feat/codex-recovery-notification
