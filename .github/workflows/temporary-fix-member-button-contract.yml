name: Temporary fix member button contract

on:
  push:
    branches:
      - agent/final-auf-wallet-layer

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/final-auf-wallet-layer
      - name: Fix exact reviewer button label
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_personal_archive_full_button_audit.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('"🗂 Другие пространства"', '"↩️ Другие пространства"')
          path.write_text(text, encoding='utf-8')
          Path('.github/workflows/temporary-fix-member-button-contract.yml').unlink()
          PY
      - name: Commit exact contract fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Исправить точную подпись кнопки пространств"
          git push origin HEAD:agent/final-auf-wallet-layer
