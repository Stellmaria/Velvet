name: pr722 finalize current main baseline

on:
  push:
    branches:
      - fix/storage-librarian-scheduler-lifecycle

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.head_commit.message == 'Finalize PR 722 baseline with CI Python'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/storage-librarian-scheduler-lifecycle
      - name: Set up CI Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
          check-latest: false
      - name: Generate combined architecture baseline and self-clean
        run: |
          set -euo pipefail
          python --version
          python scripts/inventory_package_architecture.py \
            --write \
            --label p1-package-architecture-baseline
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          inventory = json.loads(
              Path('docs/package_architecture_inventory.json').read_text(encoding='utf-8')
          )
          loc = int(inventory['production_loc'])
          violations = int(inventory['violation_count'])
          print('production_loc=', loc)
          print('violation_count=', violations)

          path = Path('tests/test_package_architecture_inventory.py')
          text = path.read_text(encoding='utf-8')
          pattern = r'self\.assertEqual\(\d+, self\.inventory\["production_loc"\]\)'
          replacement = f'self.assertEqual({loc}, self.inventory["production_loc"])'
          updated, count = re.subn(pattern, replacement, text, count=1)
          if count != 1:
              raise SystemExit('expected exactly one production_loc assertion')
          path.write_text(updated, encoding='utf-8')
          PY
          git rm -- .github/workflows/pr722-finalize-current-main.yml
          git add -- \
            docs/package_architecture_inventory.json \
            docs/package_architecture_inventory.md \
            tests/test_package_architecture_inventory.py
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh Librarian baseline with CI Python'
          git push origin HEAD:fix/storage-librarian-scheduler-lifecycle
