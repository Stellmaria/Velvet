name: package architecture branch helper

on:
  pull_request:

permissions:
  contents: write

jobs:
  generate-and-clean:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'fix/storage-librarian-bounded-chunking'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Generate canonical inventory and clean helper changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          python scripts/inventory_package_architecture.py \
            --write \
            --label p1-package-architecture-baseline
          python - <<'PY'
          from __future__ import annotations

          import json
          import re
          from pathlib import Path

          inventory = json.loads(
              Path("docs/package_architecture_inventory.json").read_text(encoding="utf-8")
          )
          production_loc = int(inventory["production_loc"])
          path = Path("tests/test_package_architecture_inventory.py")
          source = path.read_text(encoding="utf-8")
          updated, count = re.subn(
              r'self\.assertEqual\(\d+, self\.inventory\["production_loc"\]\)',
              f'self.assertEqual({production_loc}, self.inventory["production_loc"])',
              source,
              count=1,
          )
          if count != 1:
              raise SystemExit("production_loc assertion was not updated exactly once")
          path.write_text(updated, encoding="utf-8")
          print(f"production_loc={production_loc}")
          PY
          git show "${BASE_SHA}:.github/workflows/tests.yml" > .github/workflows/tests.yml
          rm .github/workflows/package-architecture-branch-helper.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            docs/package_architecture_inventory.json \
            docs/package_architecture_inventory.md \
            tests/test_package_architecture_inventory.py \
            .github/workflows/tests.yml \
            .github/workflows/package-architecture-branch-helper.yml
          git diff --cached --check
          git commit -m "Regenerate package architecture inventory"
          git push origin "HEAD:${HEAD_BRANCH}"
