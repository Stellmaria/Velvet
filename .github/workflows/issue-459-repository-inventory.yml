name: Issue 459 canonical repository inventory

on:
  pull_request:
    paths:
      - ".github/workflows/issue-459-repository-inventory.yml"

permissions:
  contents: write

concurrency:
  group: issue-459-repository-inventory-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  reconcile:
    if: >-
      github.repository == 'Stellmaria/Velvet' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/459-canonical-provider-adapters'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/459-canonical-provider-adapters
          fetch-depth: 0
          persist-credentials: true

      - name: Restore canonical repository inventory
        shell: bash
        run: |
          python scripts/inventory_repository_layout.py \
            --write \
            --label p3e-repository-layout-complete
          python -m unittest -v \
            tests.test_p2_stability_inventory \
            tests.test_p3e_repository_layout_inventory
          git diff --check

      - name: Remove one-time workflow
        run: rm -f .github/workflows/issue-459-repository-inventory.yml

      - name: Commit canonical baseline
        shell: bash
        run: |
          git config user.name "ChatGPT Codex Connector"
          git config user.email "chatgpt-codex-connector@users.noreply.github.com"
          git add -A
          test -n "$(git status --porcelain)"
          git commit -m "Restore canonical repository inventory"
          git push origin HEAD:fix/459-canonical-provider-adapters
