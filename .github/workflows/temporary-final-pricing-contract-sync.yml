name: temporary final pricing contract sync

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  sync:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/owner-cost-only-and-image-pricing'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Synchronize canonical counters and package baseline
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path("tests/test_canonical_docs_sync.py"): {
                  'Python files scanned: **638**': 'Python files scanned: **639**',
                  'Buttons: **1049**': 'Buttons: **1053**',
              },
              Path("tests/test_package_architecture_inventory.py"): {
                  'self.assertEqual(638, self.inventory["production_module_count"])':
                      'self.assertEqual(639, self.inventory["production_module_count"])',
                  'self.assertEqual(631, shared["production_python_files"])':
                      'self.assertEqual(639, shared["production_python_files"])',
                  'self.assertEqual(3_597, shared["function_count"])':
                      'self.assertEqual(3_660, shared["function_count"])',
                  'self.assertEqual(182, shared["private_contract_access_count"])':
                      'self.assertEqual(186, shared["private_contract_access_count"])',
                  'self.assertEqual(62, shared["exact_duplicate_group_count"])':
                      'self.assertEqual(64, shared["exact_duplicate_group_count"])',
                  'self.assertEqual(97, shared["normalized_duplicate_group_count"])':
                      'self.assertEqual(98, shared["normalized_duplicate_group_count"])',
                  'Production modules: **638**': 'Production modules: **639**',
              },
          }
          for path, mapping in replacements.items():
              text = path.read_text(encoding="utf-8")
              for old, new in mapping.items():
                  if old not in text:
                      raise SystemExit(f"missing expected text in {path}: {old}")
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding="utf-8")
          PY

          python scripts/inventory_package_architecture.py \
            --write \
            --bootstrap-exemptions \
            --label p1-package-architecture-baseline
          python scripts/inventory_package_architecture.py \
            --check \
            --label p1-package-architecture-baseline
          python scripts/telegram_navigation_inventory.py --root velvet_bot --check
          python -m compileall -q main.py velvet_bot scripts tests

      - name: Commit final synchronized contract and remove workflow
        shell: bash
        run: |
          rm -f .github/workflows/temporary-final-pricing-contract-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            .github/workflows/temporary-final-pricing-contract-sync.yml \
            docs/package_architecture_exemptions.json \
            docs/package_architecture_inventory.json \
            docs/package_architecture_inventory.md \
            tests/test_canonical_docs_sync.py \
            tests/test_package_architecture_inventory.py
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Contracts are already synchronized"
            exit 1
          fi
          git commit -m "Финально синхронизировать pricing contracts"
          git push origin HEAD:fix/owner-cost-only-and-image-pricing
