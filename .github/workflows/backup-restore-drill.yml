name: backup restore drill

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * 0"
  pull_request:
    paths:
      - "migrations/**"
      - "velvet_bot/database.py"
      - "velvet_bot/backup_restore_drill.py"
      - "scripts/backup_restore_drill.py"
      - "tests/test_backup_restore_drill.py"
      - "requirements.lock"
      - ".github/workflows/backup-restore-drill.yml"
  push:
    branches:
      - main
    paths:
      - "migrations/**"
      - "velvet_bot/database.py"
      - "velvet_bot/backup_restore_drill.py"
      - "scripts/backup_restore_drill.py"
      - "tests/test_backup_restore_drill.py"
      - "requirements.lock"
      - ".github/workflows/backup-restore-drill.yml"

permissions:
  contents: read

jobs:
  restore-drill:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: velvet_restore_source
          POSTGRES_USER: velvet
          POSTGRES_PASSWORD: velvet_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U velvet -d velvet_restore_source"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://velvet:velvet_test_password@localhost:5432/velvet_restore_source
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.16"
          enable-cache: true
          cache-dependency-glob: requirements.lock

      - name: Install dependencies and PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          uv pip install --system --require-hashes -r requirements.lock

      - name: Run helper unit tests
        run: python -m unittest discover -s tests -p "test_backup_restore_drill.py" -v

      - name: Create dump and restore into a fresh database
        run: python scripts/backup_restore_drill.py --source-dsn "$TEST_DATABASE_URL"
