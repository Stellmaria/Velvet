name: temporary package inventory generator

on:
  push:
    branches:
      - fix/storage-topic-integrity

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - name: Generate and commit package inventory
        shell: bash
        run: |
          set -euo pipefail
          python scripts/inventory_package_architecture.py --label p1-package-architecture-baseline --write
          if git diff --quiet -- docs/package_architecture_inventory.json docs/package_architecture_inventory.md; then
            echo "inventory already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/package_architecture_inventory.json docs/package_architecture_inventory.md
          git commit -m "Refresh package architecture inventory"
          git push origin HEAD:"$GITHUB_REF_NAME"
