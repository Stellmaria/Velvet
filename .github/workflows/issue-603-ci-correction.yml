name: issue 603 CI correction

on:
  push:
    branches:
      - feat/603-adaptive-ai-queue-wakeup
    paths:
      - .github/workflows/issue-603-ci-correction.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: issue-603-ci-correction
  cancel-in-progress: false

jobs:
  correct:
    if: github.repository == 'Stellmaria/Velvet' && github.ref_name == 'feat/603-adaptive-ai-queue-wakeup'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact feature head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/603-adaptive-ai-queue-wakeup
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'

      - name: Apply bounded correction and canonical inventories
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          rm -f .github/workflows/issue-603-ci-correction.yml

          python - <<'PY'
          from pathlib import Path

          path = Path('velvet_bot/workers/manager.py')
          text = path.read_text(encoding='utf-8')
          replacements = [
              ('from typing import Any, Protocol', 'from typing import Protocol'),
              (
                  'from velvet_bot.workers.adaptive import WorkerWaitSnapshot',
                  'from velvet_bot.workers.adaptive import (\n'
                  '    WorkerIterationOutcome,\n'
                  '    WorkerIterationResult,\n'
                  '    WorkerWaitSnapshot,\n'
                  ')',
              ),
              ('WorkerRunner = Callable[[], Awaitable[Any]]', 'WorkerRunner = Callable[[], Awaitable[object]]'),
              (
                  '        succeeded, _ = await self._execute_once(spec)\n'
                  '        return succeeded',
                  '        return await self._execute_once(spec)',
              ),
              (
                  '    async def _execute_once(self, spec: PeriodicWorkerSpec) -> tuple[bool, Any]:',
                  '    async def _execute_once(self, spec: PeriodicWorkerSpec) -> bool:\n'
                  '        """Run one iteration and preserve the historical boolean contract."""\n'
                  '        succeeded, _ = await self._execute_once_with_result(spec)\n'
                  '        return succeeded\n\n'
                  '    async def _execute_once_with_result(\n'
                  '        self,\n'
                  '        spec: PeriodicWorkerSpec,\n'
                  '    ) -> tuple[bool, object]:',
              ),
              (
                  '                if is_transient_connection_error(error):\n'
                  '                    await self._handle_transient_failure(\n'
                  '                        spec=spec,\n'
                  '                        error=error,\n'
                  '                        consecutive_failures=consecutive_failures,\n'
                  '                    )\n'
                  '                else:\n'
                  '                    logger.exception("Background worker failed name=%s", spec.name)\n'
                  '                return False, None',
                  '                if is_transient_connection_error(error):\n'
                  '                    await self._handle_transient_failure(\n'
                  '                        spec=spec,\n'
                  '                        error=error,\n'
                  '                        consecutive_failures=consecutive_failures,\n'
                  '                    )\n'
                  '                    outcome = WorkerIterationOutcome.TRANSIENT_FAILURE\n'
                  '                else:\n'
                  '                    logger.exception("Background worker failed name=%s", spec.name)\n'
                  '                    outcome = WorkerIterationOutcome.TERMINAL_FAILURE\n'
                  '                return False, WorkerIterationResult(outcome)',
              ),
              (
                  '                succeeded, result = await self._execute_once(spec)\n'
                  '                controller = spec.wait_controller\n'
                  '                if not succeeded or controller is None:\n'
                  '                    await asyncio.sleep(spec.interval_seconds)\n'
                  '                    continue\n'
                  '                delay = controller.delay_for(\n'
                  '                    result,\n'
                  '                    default_interval_seconds=spec.interval_seconds,\n'
                  '                )\n'
                  '                self._apply_wait_snapshot(\n'
                  '                    spec,\n'
                  '                    next_run_at=datetime.now(UTC) + timedelta(seconds=delay),\n'
                  '                )\n'
                  '                woke = await controller.wait(delay)\n'
                  '                self._apply_wait_snapshot(\n'
                  '                    spec,\n'
                  '                    next_run_at=datetime.now(UTC) if woke else None,\n'
                  '                )',
                  '                succeeded, result = await self._execute_once_with_result(spec)\n'
                  '                controller = spec.wait_controller\n'
                  '                if controller is None:\n'
                  '                    await asyncio.sleep(spec.interval_seconds)\n'
                  '                    continue\n'
                  '                delay = controller.delay_for(\n'
                  '                    result,\n'
                  '                    default_interval_seconds=spec.interval_seconds,\n'
                  '                )\n'
                  '                self._apply_wait_snapshot(\n'
                  '                    spec,\n'
                  '                    next_run_at=datetime.now(UTC) + timedelta(seconds=delay),\n'
                  '                )\n'
                  '                if not succeeded:\n'
                  '                    await asyncio.sleep(delay)\n'
                  '                    continue\n'
                  '                woke = await controller.wait(delay)\n'
                  '                self._apply_wait_snapshot(\n'
                  '                    spec,\n'
                  '                    next_run_at=datetime.now(UTC) if woke else None,\n'
                  '                )',
              ),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'manager correction mismatch: {old[:80]!r}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')

          test_path = Path('tests/test_ai_queue_adaptive_wakeup.py')
          tests = test_path.read_text(encoding='utf-8')
          marker = '    async def test_manager_exposes_adaptive_diagnostics_without_overlapping_runs(self) -> None:\n'
          addition = '''    async def test_jitter_stays_within_configured_bounds(self) -> None:\n        wakeup = _WakeupStub()\n        wait = AdaptiveQueueWait(wakeup, jitter_ratio=0.1)\n        empty = WorkerIterationResult(WorkerIterationOutcome.EMPTY)\n        with patch(\n            "velvet_bot.workers.adaptive.random.uniform",\n            side_effect=[-0.3, 0.5],\n        ):\n            self.assertEqual(2.7, wait.delay_for(empty, default_interval_seconds=3))\n            self.assertEqual(5.5, wait.delay_for(empty, default_interval_seconds=3))\n\n    async def test_manager_failure_is_typed_without_growing_empty_backoff(self) -> None:\n        async def runner() -> WorkerIterationResult:\n            raise ConnectionError("database unavailable")\n\n        wakeup = _WakeupStub()\n        manager = WorkerManager()\n        controller = AdaptiveQueueWait(\n            wakeup,\n            empty_delays_seconds=(0.01, 0.02),\n            jitter_ratio=0,\n        )\n        spec = PeriodicWorkerSpec(\n            name="adaptive-failure",\n            description="adaptive failure",\n            interval_seconds=0.01,\n            runner=runner,\n            wait_controller=controller,\n        )\n        manager.register(spec)\n        self.assertFalse(await manager._execute_once(spec))\n        succeeded, result = await manager._execute_once_with_result(spec)\n        self.assertFalse(succeeded)\n        self.assertEqual(\n            WorkerIterationOutcome.TRANSIENT_FAILURE,\n            result.outcome,  # type: ignore[attr-defined]\n        )\n        delay = controller.delay_for(result, default_interval_seconds=0.01)\n        self.assertEqual(0.01, delay)\n        snapshot = controller.snapshot()\n        self.assertEqual("transient_failure", snapshot.last_outcome)\n        self.assertEqual(0, snapshot.empty_runs)\n\n'''
          if tests.count(marker) != 1 or 'test_manager_failure_is_typed_without_growing_empty_backoff' in tests:
              raise SystemExit('focused test correction mismatch')
          test_path.write_text(tests.replace(marker, addition + marker), encoding='utf-8')

          exemptions_path = Path('docs/package_architecture_exemptions.json')
          import json
          exemptions = json.loads(exemptions_path.read_text(encoding='utf-8'))
          rows = list(exemptions['exceptions'])
          kept = [
              row for row in rows
              if not str(row['id']).startswith('typing-any-usage:velvet_bot/workers/manager.py:')
          ]
          if len(rows) - len(kept) != 1:
              raise SystemExit('expected one manager Any exemption')
          exemptions['exceptions'] = kept
          exemptions_path.write_text(
              json.dumps(exemptions, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          PY

          python scripts/inventory_architecture_layout.py \
            --write --label p3d-analytics-alias-retirement
          python scripts/inventory_architecture_layout.py \
            --check --label p3d-analytics-alias-retirement
          python scripts/inventory_repository_layout.py \
            --write --label p3e-repository-layout-complete
          python scripts/inventory_repository_layout.py \
            --check --label p3e-repository-layout-complete
          python scripts/shared_contract_inventory.py \
            --write-json docs/shared_contract_inventory.json \
            --write-markdown docs/shared_contract_inventory.md \
            --check
          python scripts/inventory_package_architecture.py \
            --write --label p1-package-architecture-baseline
          python scripts/inventory_package_architecture.py \
            --check --label p1-package-architecture-baseline
          python scripts/update_p2_stability_inventory.py \
            --label issue-603 --schema-version 79

          python - <<'PY'
          from pathlib import Path
          import json
          import re

          inventory = json.loads(Path('docs/package_architecture_inventory.json').read_text(encoding='utf-8'))
          shared = inventory['shared_contract_summary']
          path = Path('tests/test_package_architecture_inventory.py')
          text = path.read_text(encoding='utf-8')
          replacements = {
              r'self\.assertEqual\([\d_]+, self\.inventory\["production_module_count"\]\)':
                  f'self.assertEqual({inventory["production_module_count"]}, self.inventory["production_module_count"])',
              r'self\.assertEqual\([\d_]+, self\.inventory\["production_loc"\]\)':
                  f'self.assertEqual({inventory["production_loc"]}, self.inventory["production_loc"])',
              r'self\.assertEqual\([\d_]+, self\.inventory\["repository_module_count"\]\)':
                  f'self.assertEqual({inventory["repository_module_count"]}, self.inventory["repository_module_count"])',
              r'self\.assertEqual\([\d_]+, self\.inventory\["violation_count"\]\)':
                  f'self.assertEqual({inventory["violation_count"]}, self.inventory["violation_count"])',
              r'self\.assertEqual\([\d_]+, shared\["production_python_files"\]\)':
                  f'self.assertEqual({shared["production_python_files"]}, shared["production_python_files"])',
              r'self\.assertEqual\([\d_]+, shared\["function_count"\]\)':
                  f'self.assertEqual({shared["function_count"]}, shared["function_count"])',
              r'self\.assertIn\("Production modules: \*\*\d+\*\*", self\.markdown\)':
                  f'self.assertIn("Production modules: **{inventory["production_module_count"]}**", self.markdown)',
              r'self\.assertIn\("Production LOC: \*\*\d+\*\*", self\.markdown\)':
                  f'self.assertIn("Production LOC: **{inventory["production_loc"]}**", self.markdown)',
              r'self\.assertIn\("Registered package violations: \*\*\d+\*\*", self\.markdown\)':
                  f'self.assertIn("Registered package violations: **{inventory["violation_count"]}**", self.markdown)',
              r'self\.assertIn\("Registered exemptions: \*\*\d+\*\*", self\.markdown\)':
                  f'self.assertIn("Registered exemptions: **{len(json.loads(Path("docs/package_architecture_exemptions.json").read_text(encoding="utf-8"))["exceptions"])}**", self.markdown)',
          }
          for pattern, replacement in replacements.items():
              text, count = re.subn(pattern, replacement, text, count=1)
              if count != 1:
                  raise SystemExit(f'package test update mismatch: {pattern}')
          path.write_text(text, encoding='utf-8')

          repository = json.loads(Path('docs/repository_layout_inventory.json').read_text(encoding='utf-8'))
          path = Path('tests/test_p3e_repository_layout_inventory.py')
          text = path.read_text(encoding='utf-8')
          values = {
              'repository_module_count': repository['repository_module_count'],
              'domain': repository['layout_counts']['domain'],
              'infrastructure': repository['layout_counts']['infrastructure'],
          }
          patterns = {
              r'self\.assertEqual\(\d+, inventory\["repository_module_count"\]\)':
                  f'self.assertEqual({values["repository_module_count"]}, inventory["repository_module_count"])',
              r'self\.assertEqual\(\d+, inventory\["layout_counts"\]\["domain"\]\)':
                  f'self.assertEqual({values["domain"]}, inventory["layout_counts"]["domain"])',
              r'self\.assertEqual\(\d+, inventory\["layout_counts"\]\["infrastructure"\]\)':
                  f'self.assertEqual({values["infrastructure"]}, inventory["layout_counts"]["infrastructure"])',
          }
          for pattern, replacement in patterns.items():
              text, count = re.subn(pattern, replacement, text, count=1)
              if count != 1:
                  raise SystemExit(f'repository test update mismatch: {pattern}')
          path.write_text(text, encoding='utf-8')
          PY

          python -m compileall -q velvet_bot tests/test_ai_queue_adaptive_wakeup.py
          python -m unittest \
            tests.test_phase6_runtime \
            tests.test_ai_queue_adaptive_wakeup \
            tests.test_architecture_layout_inventory \
            tests.test_package_architecture_inventory \
            tests.test_p3e_repository_layout_inventory

          git add -- \
            .github/workflows/issue-603-ci-correction.yml \
            docs/architecture_layout_inventory.json \
            docs/architecture_layout_inventory.md \
            docs/package_architecture_exemptions.json \
            docs/package_architecture_inventory.json \
            docs/package_architecture_inventory.md \
            docs/p2_stability_inventory.json \
            docs/p2_stability_inventory.md \
            docs/repository_layout_inventory.json \
            docs/repository_layout_inventory.md \
            docs/shared_contract_inventory.json \
            docs/shared_contract_inventory.md \
            tests/test_ai_queue_adaptive_wakeup.py \
            tests/test_package_architecture_inventory.py \
            tests/test_p3e_repository_layout_inventory.py \
            velvet_bot/workers/manager.py

          python - <<'PY'
          from pathlib import Path
          import subprocess
          allowed = {
              '.github/workflows/issue-603-ci-correction.yml',
              'docs/architecture_layout_inventory.json',
              'docs/architecture_layout_inventory.md',
              'docs/package_architecture_exemptions.json',
              'docs/package_architecture_inventory.json',
              'docs/package_architecture_inventory.md',
              'docs/p2_stability_inventory.json',
              'docs/p2_stability_inventory.md',
              'docs/repository_layout_inventory.json',
              'docs/repository_layout_inventory.md',
              'docs/shared_contract_inventory.json',
              'docs/shared_contract_inventory.md',
              'tests/test_ai_queue_adaptive_wakeup.py',
              'tests/test_package_architecture_inventory.py',
              'tests/test_p3e_repository_layout_inventory.py',
              'velvet_bot/workers/manager.py',
          }
          actual = set(subprocess.check_output(
              ['git', 'diff', '--cached', '--name-only'], text=True
          ).splitlines())
          required = {
              '.github/workflows/issue-603-ci-correction.yml',
              'tests/test_ai_queue_adaptive_wakeup.py',
              'tests/test_package_architecture_inventory.py',
              'tests/test_p3e_repository_layout_inventory.py',
              'velvet_bot/workers/manager.py',
              'docs/package_architecture_exemptions.json',
          }
          if actual - allowed or required - actual:
              raise SystemExit(
                  f'correction path audit failed unexpected={sorted(actual - allowed)} '
                  f'missing={sorted(required - actual)}'
              )
          if Path('.github/workflows/issue-603-ci-correction.yml').exists():
              raise SystemExit('temporary workflow survived cleanup')
          PY

          git diff --cached --check
          test -z "$(git diff --name-only)"
          git config user.name 'Stellmaria'
          git config user.email 'aam.cheshire@gmail.com'
          git commit -m 'Fix adaptive worker compatibility and canonical inventories for #603'
          git push origin HEAD:feat/603-adaptive-ai-queue-wakeup
