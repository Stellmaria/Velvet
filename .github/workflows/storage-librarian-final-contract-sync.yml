name: storage librarian final contract sync

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  sync:
    if: github.head_ref == 'agent/storage-librarian'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Generate exact CI inventories
        run: |
          python scripts/inventory_package_architecture.py --label p1-package-architecture-baseline --write
          python scripts/inventory_repository_layout.py --label p3e-repository-layout-complete --write
          python scripts/update_p2_stability_inventory.py --label storage-librarian --schema-version 76
          python scripts/telegram_navigation_inventory.py --root velvet_bot --markdown docs/generated/telegram_navigation_inventory.md

      - name: Synchronize hard contracts and canonical docs
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          root = Path('.')
          docs = root / 'docs'
          package = json.loads((docs / 'package_architecture_inventory.json').read_text(encoding='utf-8'))
          repositories = json.loads((docs / 'repository_layout_inventory.json').read_text(encoding='utf-8'))
          stability = json.loads((docs / 'p2_stability_inventory.json').read_text(encoding='utf-8'))
          exemptions = json.loads((docs / 'package_architecture_exemptions.json').read_text(encoding='utf-8'))

          def replace_once(text: str, pattern: str, replacement: str, label: str) -> str:
              result, count = re.subn(pattern, replacement, text, count=1)
              if count != 1:
                  raise SystemExit(f'{label} replacement failed: {pattern}')
              return result

          package_test = root / 'tests/test_package_architecture_inventory.py'
          source = package_test.read_text(encoding='utf-8')
          for key in ('production_module_count', 'production_loc', 'root_module_count', 'root_unclassified_count', 'router_count', 'router_duplicate_count', 'repository_module_count', 'violation_count'):
              source = replace_once(
                  source,
                  rf'self\.assertEqual\([0-9_]+, self\.inventory\["{key}"\]\)',
                  f'self.assertEqual({int(package[key]):_}, self.inventory["{key}"])',
                  'package',
              )
          installer_count = len(package['installer_graph'])
          source = replace_once(source, r'self\.assertEqual\([0-9_]+, len\(self\.inventory\["installer_graph"\]\)\)', f'self.assertEqual({installer_count}, len(self.inventory["installer_graph"]))', 'package')
          source = replace_once(source, r'list\(range\(1, [0-9_]+\)\)', f'list(range(1, {installer_count + 1}))', 'package')
          shared = package['shared_contract_summary']
          for key in ('production_python_files', 'function_count', 'private_contract_access_count', 'blocking_private_contract_access_count', 'exact_duplicate_group_count', 'normalized_duplicate_group_count', 'semantic_near_duplicate_group_count'):
              source = replace_once(source, rf'self\.assertEqual\([0-9_]+, shared\["{key}"\]\)', f'self.assertEqual({int(shared[key]):_}, shared["{key}"])', 'package')
          for label, value in {
              'Production modules': package['production_module_count'],
              'Production LOC': package['production_loc'],
              'Startup installer stages': installer_count,
              'Registered package violations': package['violation_count'],
              'Registered exemptions': len(exemptions['exceptions']),
          }.items():
              source = replace_once(source, rf'"{re.escape(label)}: \*\*[0-9_ ]+\*\*"', f'"{label}: **{int(value)}**"', 'package markdown')
          package_test.write_text(source, encoding='utf-8')

          repo_test = root / 'tests/test_p3e_repository_layout_inventory.py'
          source = repo_test.read_text(encoding='utf-8')
          for pattern, replacement in {
              r'self\.assertEqual\([0-9_]+, inventory\["repository_module_count"\]\)': f'self.assertEqual({int(repositories["repository_module_count"]):_}, inventory["repository_module_count"])',
              r'self\.assertEqual\([0-9_]+, inventory\["layout_counts"\]\["domain"\]\)': f'self.assertEqual({int(repositories["layout_counts"]["domain"]):_}, inventory["layout_counts"]["domain"])',
              r'self\.assertEqual\([0-9_]+, inventory\["layout_counts"\]\["infrastructure"\]\)': f'self.assertEqual({int(repositories["layout_counts"]["infrastructure"]):_}, inventory["layout_counts"]["infrastructure"])',
              r'self\.assertEqual\([0-9_]+, inventory\["root_module_count"\]\)': f'self.assertEqual({int(repositories["root_module_count"]):_}, inventory["root_module_count"])',
          }.items():
              source = replace_once(source, pattern, replacement, 'repository')
          repo_test.write_text(source, encoding='utf-8')

          def spaced(value: int) -> str:
              return f'{value:,}'.replace(',', ' ')

          status_path = docs / 'development_status.md'
          status = status_path.read_text(encoding='utf-8')
          for pattern, replacement in {
              r'production modules package-wide: \*\*\d+\*\*;': f'production modules package-wide: **{package["production_module_count"]}**;',
              r'production LOC: \*\*[\d ]+\*\*;': f'production LOC: **{spaced(package["production_loc"])}**;',
              r'repository modules: \*\*\d+\*\*;': f'repository modules: **{repositories["repository_module_count"]}**;',
              r'domain repositories: \*\*\d+\*\*;': f'domain repositories: **{repositories["layout_counts"]["domain"]}**;',
              r'infrastructure PostgreSQL adapters: \*\*\d+\*\*;': f'infrastructure PostgreSQL adapters: **{repositories["layout_counts"]["infrastructure"]}**;',
          }.items():
              status = replace_once(status, pattern, replacement, 'status')
          status_path.write_text(status, encoding='utf-8')

          audit_path = docs / 'ARCHITECTURE_AUDIT.md'
          audit = audit_path.read_text(encoding='utf-8')
          layers = package['layer_counts']
          replacements = {
              r'все \d+ production Python modules под `velvet_bot`;': f'все {package["production_module_count"]} production Python modules под `velvet_bot`;',
              r'production modules: \*\*\d+\*\*;': f'production modules: **{package["production_module_count"]}**;',
              r'production LOC: \*\*[\d ]+\*\*;': f'production LOC: **{spaced(package["production_loc"])}**;',
              r'layer counts: .*?;': 'layer counts: ' + ', '.join(f'{name} {layers[name]}' for name in ('application','composition','core','domain','infrastructure','other','presentation','root','service','worker')) + ';',
              r'repository modules: \*\*\d+\*\*;': f'repository modules: **{repositories["repository_module_count"]}**;',
              r'domain repositories: \*\*\d+\*\*;': f'domain repositories: **{repositories["layout_counts"]["domain"]}**;',
              r'infrastructure PostgreSQL adapters: \*\*\d+\*\*;': f'infrastructure PostgreSQL adapters: **{repositories["layout_counts"]["infrastructure"]}**;',
              r'broad exception boundaries: \d+;': f'broad exception boundaries: {stability["broad_exception_total"]};',
              r'approved boundaries: \d+;': f'approved boundaries: {stability["broad_exception_approved"]};',
              r'unresolved boundaries: \d+;': f'unresolved boundaries: {stability["broad_exception_unresolved"]};',
              r'app/\s+bootstrap и \d+ composition modules/installers': f'app/                         bootstrap и {layers["composition"]} composition modules/installers',
              r'application/\s+\d+ transport-neutral use-case modules': f'application/                 {layers["application"]} transport-neutral use-case modules',
              r'core/\s+\d+ config/access/base contract modules': f'core/                        {layers["core"]} config/access/base contract modules',
              r'domains/\s+\d+ domain modules и \d+ repositories': f'domains/                     {layers["domain"]} domain modules и {repositories["layout_counts"]["domain"]} repositories',
              r'infrastructure/\s+\d+ PostgreSQL/provider/Telegram/filesystem adapters': f'infrastructure/              {layers["infrastructure"]} PostgreSQL/provider/Telegram/filesystem adapters',
              r'presentation/\s+\d+ Telegram presentation modules': f'presentation/                {layers["presentation"]} Telegram presentation modules',
              r'services/\s+\d+ integration/application service modules': f'services/                    {layers["service"]} integration/application service modules',
              r'workers/\s+\d+ worker boundary modules': f'workers/                     {layers["worker"]} worker boundary modules',
          }
          for pattern, replacement in replacements.items():
              audit = replace_once(audit, pattern, replacement, 'audit')
          audit_path.write_text(audit, encoding='utf-8')
          PY

      - name: Preserve generated files
        run: |
          mkdir -p /tmp/storage-librarian-final
          cp -- docs/package_architecture_inventory.json docs/package_architecture_inventory.md docs/repository_layout_inventory.json docs/repository_layout_inventory.md docs/p2_stability_inventory.json docs/p2_stability_inventory.md docs/generated/telegram_navigation_inventory.md docs/development_status.md docs/ARCHITECTURE_AUDIT.md tests/test_package_architecture_inventory.py tests/test_p3e_repository_layout_inventory.py /tmp/storage-librarian-final/

      - name: Commit to PR branch
        run: |
          git fetch origin agent/storage-librarian
          git checkout -B agent/storage-librarian origin/agent/storage-librarian
          cp -- /tmp/storage-librarian-final/package_architecture_inventory.json docs/package_architecture_inventory.json
          cp -- /tmp/storage-librarian-final/package_architecture_inventory.md docs/package_architecture_inventory.md
          cp -- /tmp/storage-librarian-final/repository_layout_inventory.json docs/repository_layout_inventory.json
          cp -- /tmp/storage-librarian-final/repository_layout_inventory.md docs/repository_layout_inventory.md
          cp -- /tmp/storage-librarian-final/p2_stability_inventory.json docs/p2_stability_inventory.json
          cp -- /tmp/storage-librarian-final/p2_stability_inventory.md docs/p2_stability_inventory.md
          cp -- /tmp/storage-librarian-final/telegram_navigation_inventory.md docs/generated/telegram_navigation_inventory.md
          cp -- /tmp/storage-librarian-final/development_status.md docs/development_status.md
          cp -- /tmp/storage-librarian-final/ARCHITECTURE_AUDIT.md docs/ARCHITECTURE_AUDIT.md
          cp -- /tmp/storage-librarian-final/test_package_architecture_inventory.py tests/test_package_architecture_inventory.py
          cp -- /tmp/storage-librarian-final/test_p3e_repository_layout_inventory.py tests/test_p3e_repository_layout_inventory.py
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/package_architecture_inventory.json docs/package_architecture_inventory.md docs/repository_layout_inventory.json docs/repository_layout_inventory.md docs/p2_stability_inventory.json docs/p2_stability_inventory.md docs/generated/telegram_navigation_inventory.md docs/development_status.md docs/ARCHITECTURE_AUDIT.md tests/test_package_architecture_inventory.py tests/test_p3e_repository_layout_inventory.py
          git commit -m 'Синхронизировать финальные контракты Storage Librarian'
          git push origin HEAD:agent/storage-librarian
