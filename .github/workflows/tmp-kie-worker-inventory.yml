name: temporary Kie worker inventory sync

on:
  push:
    branches:
      - fix/kie-worker-compat-export

permissions:
  contents: write

concurrency:
  group: temporary-kie-worker-inventory-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/kie-worker-compat-export
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Regenerate package architecture inventory
        run: |
          set -euo pipefail
          python scripts/inventory_package_architecture.py \
            --write \
            --label p1-package-architecture-baseline
          python scripts/inventory_package_architecture.py \
            --check \
            --label p1-package-architecture-baseline
          git diff --check

      - name: Commit deterministic inventory
        run: |
          set -euo pipefail
          git add -- \
            docs/package_architecture_inventory.json \
            docs/package_architecture_inventory.md
          if git diff --cached --quiet; then
            echo "Inventory already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: sync package architecture inventory [skip generator]"
          git push origin HEAD:fix/kie-worker-compat-export
