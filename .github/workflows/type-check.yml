name: type check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mypy-bounded:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.16"
          enable-cache: true
          cache-dependency-glob: requirements-dev.lock
          cache-suffix: type-check

      - name: Install development dependencies from hash lock
        run: uv pip install --system --require-hashes -r requirements-dev.lock

      - name: Type-check bounded scope
        shell: bash
        run: |
          set +e
          python -m mypy > mypy-output.txt 2>&1
          status=$?
          cat mypy-output.txt
          exit "$status"

      - name: Upload failed mypy output
        if: failure()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: mypy-output
          path: mypy-output.txt
          if-no-files-found: ignore
          retention-days: 7
