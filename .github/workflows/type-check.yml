name: type check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mypy-bounded:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.16"
          enable-cache: true
          prune-cache: true
          cache-dependency-glob: requirements-dev.lock
          cache-suffix: type-check

      - name: Install development dependencies from hash lock
        run: uv pip install --system --require-hashes -r requirements-dev.lock

      - name: Type-check bounded scope
        shell: bash
        run: |
          set +e
          python -m mypy > mypy-output.txt 2>&1
          status=$?
          cat mypy-output.txt
          exit "$status"

      - name: Upload failed mypy output
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mypy-output
          path: mypy-output.txt
          if-no-files-found: ignore
          retention-days: 7
