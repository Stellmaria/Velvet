name: type check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mypy-bounded:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.16"
          enable-cache: true
          cache-dependency-glob: |
            requirements.txt
            requirements-dev.txt
          cache-suffix: type-check

      - name: Install development dependencies
        run: uv pip install --system -r requirements-dev.txt

      - name: Type-check bounded scope
        shell: bash
        run: |
          set +e
          python -m mypy > mypy-output.txt 2>&1
          status=$?
          cat mypy-output.txt
          exit "$status"

      - name: Upload failed mypy output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mypy-output
          path: mypy-output.txt
          if-no-files-found: ignore
          retention-days: 7
