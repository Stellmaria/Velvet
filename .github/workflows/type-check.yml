name: type check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mypy-bounded:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact change head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve changed mypy surface
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          python scripts/ci_changed_surfaces.py \
            --event-name "$EVENT_NAME" \
            --base-sha "$BASE_SHA" \
            --base-ref "$BASE_REF" \
            --before-sha "$BEFORE_SHA" \
            --github-output "$GITHUB_OUTPUT"

      - name: Set up Python
        if: steps.changes.outputs.mypy == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Set up uv
        if: steps.changes.outputs.mypy == 'true'
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.16"
          enable-cache: true
          prune-cache: true
          cache-dependency-glob: requirements-dev.lock
          cache-suffix: type-check

      - name: Install development dependencies from hash lock
        if: steps.changes.outputs.mypy == 'true'
        run: uv pip install --system --require-hashes -r requirements-dev.lock

      - name: Type-check bounded scope
        if: steps.changes.outputs.mypy == 'true'
        shell: bash
        run: |
          set +e
          python -m mypy > mypy-output.txt 2>&1
          status=$?
          cat mypy-output.txt
          exit "$status"

      - name: Upload failed mypy output
        if: failure() && steps.changes.outputs.mypy == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mypy-output
          path: mypy-output.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Skip unchanged bounded type surface
        if: steps.changes.outputs.mypy != 'true'
        run: echo "No files in the bounded mypy scope changed."
