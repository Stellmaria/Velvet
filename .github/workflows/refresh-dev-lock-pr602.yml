name: temporary dev lock refresh for PR 602

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

concurrency:
  group: refresh-dev-lock-pr602-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  refresh:
    if: >-
      github.event.pull_request.number == 602 &&
      github.event.pull_request.head.ref == 'fix/ci-targeted-contract-dependencies' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.16"
          enable-cache: true
          cache-dependency-glob: requirements-dev.txt

      - name: Rebuild and verify canonical dev lock
        shell: bash
        run: |
          set -euo pipefail
          uv pip compile requirements-dev.txt \
            --python-version 3.13 \
            --generate-hashes \
            --no-annotate \
            --no-header \
            --output-file requirements-dev.lock
          actual_blob="$(git hash-object requirements-dev.lock)"
          printf 'generated_dev_lock_blob=%s\n' "$actual_blob"
          test "$actual_blob" = ef06eb4d2d1ffb2ab41cc6e800333586159ed7f4

      - name: Commit only canonical dev lock
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          mapfile -t changed < <(git status --short | awk '{print $2}' | sort)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = requirements-dev.lock
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- requirements-dev.lock
          git commit -m "build: refresh canonical dev dependency lock"
          git push origin "HEAD:${HEAD_REF}"
