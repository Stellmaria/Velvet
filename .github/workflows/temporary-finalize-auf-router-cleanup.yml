name: Temporary finalize Auf router cleanup

on:
  push:
    branches:
      - agent/final-auf-router-layer

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/final-auf-router-layer
          fetch-depth: 0

      - name: Repair storage contracts and photo dual-read
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent
          import re

          root = Path('.')
          workflow = root / '.github/workflows/temporary-finalize-auf-router-cleanup.yml'
          routers = root / 'velvet_bot/presentation/telegram/routers'

          def read(path: str) -> str:
              return (root / path).read_text(encoding='utf-8')

          def write(path: str, content: str) -> None:
              (root / path).write_text(content, encoding='utf-8')

          # Persistent SQL identifiers stay on the deployed schema in this phase.
          for path in (
              'velvet_bot/domains/auf_runtime/store.py',
              'velvet_bot/domains/auf_runtime/queue.py',
              'tests/test_meow_runtime_module.py',
          ):
              write(path, read(path).replace('workspace_auf_settings', 'workspace_meow_settings'))

          dispatcher_path = 'velvet_bot/app/dispatcher.py'
          dispatcher = read(dispatcher_path)
          dispatcher = dispatcher.replace(
              '        "auf_runtime_service": auf_runtime_service,\n'
              '        "auf_runtime_service": auf_runtime_service,',
              '        "auf_runtime_service": auf_runtime_service,\n'
              '        "meow_runtime_service": auf_runtime_service,',
          )
          write(dispatcher_path, dispatcher)

          # Exact legacy photo state name is retained only in the read-only boundary.
          legacy_path = 'velvet_bot/presentation/telegram/routers/workspace_auf_legacy.py'
          legacy = read(legacy_path)
          if 'class MeowPhotoForm' not in legacy:
              marker = '\n\nclass MeowRuntimeForm(StatesGroup):'
              photo_form = dedent('''

                  class MeowPhotoForm(StatesGroup):
                      """Exact state names used by photo flows before the Auf migration."""

                      collecting_input = State()
                      reviewing_input = State()
                      choosing_model = State()
                      choosing_resolution = State()
                      choosing_aspect_ratio = State()
                      confirming_generation = State()
              ''').rstrip()
              legacy = legacy.replace(marker, photo_form + marker)
              legacy = legacy.replace(
                  '    "MeowForm",\n',
                  '    "MeowForm",\n    "MeowPhotoForm",\n',
              )
          write(legacy_path, legacy)

          photo_path = 'velvet_bot/presentation/telegram/routers/workspace_auf_photo.py'
          photo = read(photo_path)
          photo = photo.replace('MeowPhotoForm', 'AufPhotoForm')
          photo = photo.replace(
              'handle_auf_action as handle_legacy_meow_action',
              'handle_auf_action',
          )
          photo = photo.replace('handle_legacy_meow_action', 'handle_auf_action')
          for old, new in (
              ('meow_input_mode', 'auf_input_mode'),
              ('meow_prompt', 'auf_prompt'),
              ('meow_references', 'auf_references'),
              ('meow_model', 'auf_model'),
              ('meow_resolution', 'auf_resolution'),
              ('meow_aspect_ratio', 'auf_aspect_ratio'),
          ):
              photo = photo.replace(old, new)
          photo = photo.replace('Мяу', 'Ауф').replace('мяу', 'ауф')
          helper = dedent('''

              def _state_value(data: Mapping[str, object], key: str) -> object:
                  if key in data:
                      return data[key]
                  legacy_key = key.replace("auf_", "meow_", 1)
                  return data.get(legacy_key)
          ''').rstrip()
          if 'def _state_value' not in photo:
              photo = photo.replace('\n\nasync def _session(', helper + '\n\nasync def _session(')
          for key in (
              'auf_workspace_id',
              'auf_prompt',
              'auf_references',
              'auf_model',
              'auf_resolution',
              'auf_aspect_ratio',
              'auf_input_mode',
          ):
              photo = photo.replace(f'data.get("{key}")', f'_state_value(data, "{key}")')
          photo = photo.replace('"AufPhotoForm",', '"AufPhotoForm",')
          write(photo_path, photo)

          # Historical import path delegates to canonical implementation and exact old state.
          write(
              'velvet_bot/presentation/telegram/routers/workspace_meow_photo.py',
              dedent('''
                  """Compatibility module for the retired workspace_meow_photo path."""

                  from velvet_bot.presentation.telegram.routers import workspace_auf_photo as _canonical
                  from velvet_bot.presentation.telegram.routers.workspace_auf_photo import *  # noqa: F403
                  from velvet_bot.presentation.telegram.routers.workspace_auf_legacy import MeowPhotoForm


                  def __getattr__(name: str):
                      direct = getattr(_canonical, name, None)
                      if direct is not None:
                          return direct
                      mapped = name.replace("Meow", "Auf").replace("meow", "auf")
                      return getattr(_canonical, mapped)
              ''').lstrip(),
          )

          installer_path = 'velvet_bot/app/auf_photo_ui_install.py'
          installer = read(installer_path)
          installer = installer.replace(
              'from aiogram.filters import Command',
              'from aiogram.filters import Command, or_f',
          )
          legacy_import = dedent('''
              from velvet_bot.presentation.telegram.routers.workspace_auf_legacy import MeowPhotoForm
          ''')
          marker = 'from velvet_bot.presentation.telegram.routers.workspace_auf_photo_adjustments import ('
          if 'workspace_auf_legacy import MeowPhotoForm' not in installer:
              installer = installer.replace(marker, legacy_import + marker)
          helper = dedent('''

              def _state_value(data, key: str):
                  if key in data:
                      return data[key]
                  return data.get(key.replace("auf_", "meow_", 1))
          ''').rstrip()
          if 'def _state_value' not in installer:
              installer = installer.replace('\n\ndef _copy_button(', helper + '\n\ndef _copy_button(')
          installer = installer.replace('controller.handle_scoped_meow_action', 'controller.handle_scoped_auf_action')
          installer = installer.replace('controller._require_meow_callback', 'controller._require_auf_callback')
          installer = installer.replace('controller._require_meow_message', 'controller._require_auf_message')
          installer = installer.replace('photo_router.MeowPhotoForm', 'photo_router.AufPhotoForm')
          installer = installer.replace('meow_wallet_service', 'auf_wallet_service')
          installer = installer.replace('meow_purchase_service', 'auf_purchase_service')
          installer = installer.replace('data.get("auf_workspace_id")', '_state_value(data, "auf_workspace_id")')
          installer = installer.replace('data.get("meow_model")', '_state_value(data, "auf_model")')
          installer = installer.replace('meow_aspect_ratio=ratio', 'auf_aspect_ratio=ratio')
          installer = installer.replace(
              '        for photo_state in (\n'
              '            photo_router.AufPhotoForm.collecting_input,\n'
              '            photo_router.AufPhotoForm.reviewing_input,\n'
              '        ):',
              '        for photo_state in (\n'
              '            or_f(\n'
              '                photo_router.AufPhotoForm.collecting_input,\n'
              '                MeowPhotoForm.collecting_input,\n'
              '            ),\n'
              '            or_f(\n'
              '                photo_router.AufPhotoForm.reviewing_input,\n'
              '                MeowPhotoForm.reviewing_input,\n'
              '            ),\n'
              '        ):',
          )
          write(installer_path, installer)

          wallet_installer_path = 'velvet_bot/app/auf_wallet_ui_install.py'
          wallet_installer = read(wallet_installer_path).replace(
              'controller.handle_scoped_meow_action',
              'controller.handle_scoped_auf_action',
          )
          write(wallet_installer_path, wallet_installer)

          workspace_installer_path = 'velvet_bot/app/auf_workspace_ui_install.py'
          workspace_installer = read(workspace_installer_path)
          workspace_installer = re.sub(
              r'    state_prefixes = list\(policy\.WORKSPACE_MEMBER_FSM_STATE_PREFIXES\)\n'
              r'    for prefix in \(.*?\n'
              r'    policy\.WORKSPACE_MEMBER_FSM_STATE_PREFIXES = tuple\(state_prefixes\)',
              dedent('''
                  state_prefixes = list(policy.WORKSPACE_MEMBER_FSM_STATE_PREFIXES)
                  for prefix in (
                      "AufRuntimeForm:",
                      "AufForm:",
                      "AufVideoForm:",
                      "AufPhotoForm:",
                      "MeowRuntimeForm:",
                      "MeowForm:",
                      "MeowVideoForm:",
                      "MeowPhotoForm:",
                  ):
                      if prefix not in state_prefixes:
                          state_prefixes.append(prefix)
                  policy.WORKSPACE_MEMBER_FSM_STATE_PREFIXES = tuple(state_prefixes)
              ''').rstrip(),
              workspace_installer,
              flags=re.S,
          )
          write(workspace_installer_path, workspace_installer)

          write(
              'tests/test_auf_runtime_brand_boundary.py',
              dedent('''
                  from __future__ import annotations

                  from pathlib import Path


                  ROOT = Path(__file__).resolve().parents[1]


                  def _read(relative: str) -> str:
                      return (ROOT / relative).read_text(encoding="utf-8")


                  def test_application_installs_only_canonical_auf_entrypoints() -> None:
                      source = _read("velvet_bot/app/__init__.py")
                      assert "install_auf_cancel_ui" in source
                      assert "install_auf_runtime_dispatcher" in source
                      assert "install_auf_workspace_ui" in source
                      assert "install_meow_cancel_ui" not in source
                      assert "install_meow_runtime_dispatcher" not in source
                      assert "install_meow_workspace_ui" not in source


                  def test_legacy_installers_are_thin_compatibility_shims() -> None:
                      expected = {
                          "velvet_bot/app/meow_cancel_ui_install.py": "install_meow_cancel_ui",
                          "velvet_bot/app/meow_runtime_install.py": "install_meow_runtime_dispatcher",
                          "velvet_bot/app/meow_workspace_ui_install.py": "install_meow_workspace_ui",
                      }
                      for path, legacy_name in expected.items():
                          source = _read(path)
                          assert "Compatibility shim" in source
                          assert legacy_name in source
                          assert len(source.splitlines()) <= 14


                  def test_legacy_runtime_modules_are_only_compatibility_shims() -> None:
                      expected = {
                          "velvet_bot/domains/meow_runtime/models.py": "AufProvider",
                          "velvet_bot/domains/meow_runtime/store.py": "AufRuntimeRepository",
                          "velvet_bot/domains/meow_runtime/service.py": "AufRuntimeService",
                          "velvet_bot/domains/meow_runtime/queue.py": "ProviderAufTaskQueueService",
                          "velvet_bot/domains/meow_runtime/dispatcher.py": "AufGenerationDispatcher",
                          "velvet_bot/domains/meow_runtime/cancellable_worker.py": "AufCancellationRequested",
                      }
                      for path, canonical_name in expected.items():
                          source = _read(path)
                          assert "Compatibility alias" in source
                          assert canonical_name in source
                          assert len(source.splitlines()) <= 25


                  def test_canonical_runtime_does_not_import_retired_package() -> None:
                      paths = (
                          "velvet_bot/domains/auf_runtime/__init__.py",
                          "velvet_bot/domains/auf_runtime/models.py",
                          "velvet_bot/domains/auf_runtime/store.py",
                          "velvet_bot/domains/auf_runtime/service.py",
                          "velvet_bot/domains/auf_runtime/queue.py",
                          "velvet_bot/domains/auf_runtime/dispatcher.py",
                          "velvet_bot/domains/auf_runtime/cancellable_worker.py",
                          "velvet_bot/app/auf_runtime_install.py",
                      )
                      for path in paths:
                          source = _read(path)
                          assert "velvet_bot.domains.meow_runtime" not in source, path
                          assert "class Meow" not in source, path
                          assert "ProviderMeow" not in source, path


                  def test_primary_auf_screens_have_no_retired_russian_brand() -> None:
                      paths = (
                          "velvet_bot/app/auf_runtime_install.py",
                          "velvet_bot/app/auf_workspace_ui_install.py",
                          "velvet_bot/presentation/telegram/routers/workspace_auf_root.py",
                          "velvet_bot/presentation/telegram/routers/workspace_auf_runtime.py",
                          "velvet_bot/presentation/telegram/routers/workspace_auf_photo.py",
                          "velvet_bot/presentation/telegram/workspace_home_presentation.py",
                          "velvet_bot/domains/auf_runtime/service.py",
                          "velvet_bot/domains/auf_runtime/store.py",
                      )
                      for path in paths:
                          source = _read(path)
                          assert "Мяу" not in source, path
                          assert "мяу" not in source, path


                  def test_legacy_storage_and_callback_keys_are_centralized() -> None:
                      canonical = _read("velvet_bot/domains/auf_runtime/__init__.py")
                      home = _read("velvet_bot/presentation/telegram/workspace_home_presentation.py")
                      assert 'AUF_MODULE_KEY = "meow"' in canonical
                      assert 'AUF_WORKSPACE_ACTION = "auf"' in canonical
                      assert 'LEGACY_AUF_WORKSPACE_ACTION = "meow"' in canonical
                      assert 'item.module_key == "meow"' not in home
                      assert 'workspace_callback("meow"' not in home


                  def test_dispatcher_exposes_canonical_and_legacy_di_keys() -> None:
                      source = _read("velvet_bot/app/dispatcher.py")
                      assert '"auf_runtime_service": auf_runtime_service' in source
                      assert '"meow_runtime_service": auf_runtime_service' in source
                      assert "from velvet_bot.domains.auf_runtime" in source
              ''').lstrip(),
          )

          wallet_test_path = 'tests/test_auf_wallet_brand_boundary.py'
          wallet_test = read(wallet_test_path).replace(
              'velvet_bot/presentation/telegram/routers/workspace_auf_wallet.py": 10',
              'velvet_bot/presentation/telegram/routers/workspace_meow_wallet.py": 10',
          )
          write(wallet_test_path, wallet_test)

          # Strengthen the router contract around photo FSM/data and persistent SQL names.
          router_test_path = 'tests/test_auf_router_brand_boundary.py'
          router_test = read(router_test_path)
          addition = dedent('''

              def test_photo_flow_writes_auf_state_and_dual_reads_legacy_data() -> None:
                  photo = _read(ROUTERS / "workspace_auf_photo.py")
                  installer = _read(ROOT / "velvet_bot/app/auf_photo_ui_install.py")
                  legacy = _read(ROUTERS / "workspace_auf_legacy.py")
                  assert "class AufPhotoForm(StatesGroup)" in photo
                  assert "class MeowPhotoForm(StatesGroup)" in legacy
                  assert 'key.replace("auf_", "meow_", 1)' in photo
                  assert "meow_prompt=" not in photo
                  assert "controller._require_meow" not in installer
                  assert "controller.handle_scoped_meow_action" not in installer


              def test_runtime_keeps_deployed_storage_identifiers() -> None:
                  store = _read(ROOT / "velvet_bot/domains/auf_runtime/store.py")
                  queue = _read(ROOT / "velvet_bot/domains/auf_runtime/queue.py")
                  assert "workspace_meow_settings" in store
                  assert "workspace_meow_settings" in queue
                  assert "workspace_auf_settings" not in store
                  assert "workspace_auf_settings" not in queue
          ''').rstrip()
          if 'test_photo_flow_writes_auf_state' not in router_test:
              router_test += addition + '\n'
          write(router_test_path, router_test)

          workflow.unlink()
          PY

          python scripts/inventory_architecture_layout.py \
            --write \
            --label p3d-analytics-alias-retirement
          python scripts/update_p2_stability_inventory.py \
            --label p2-auf-router-protocol-migration \
            --schema-version 68
          python scripts/telegram_navigation_inventory.py \
            --root velvet_bot \
            --markdown docs/generated/telegram_navigation_inventory.md

      - name: Commit final router cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Завершить dual-read и photo-flow Ауф"
          git push origin HEAD:agent/final-auf-router-layer
