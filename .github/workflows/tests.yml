name: tests

on:
  push:
    branches:
      - feat/505-hybrid-ai-contracts

permissions:
  contents: write

concurrency:
  group: main-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync-main:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/505-hybrid-ai-contracts
          fetch-depth: 0

      - name: Merge current main and resolve generated baselines
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main \
            +refs/heads/feat/505-hybrid-ai-contracts:refs/remotes/origin/feat/505-hybrid-ai-contracts

          set +e
          git merge --no-ff --no-commit origin/main
          merge_status=$?
          set -e

          if [ "$merge_status" -ne 0 ]; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            for path in "${conflicts[@]}"; do
              case "$path" in
                docs/package_architecture_inventory.json|\
                docs/package_architecture_inventory.md|\
                docs/package_architecture_exemptions.json|\
                tests/test_package_architecture_inventory.py)
                  git checkout --ours -- "$path"
                  git add "$path"
                  ;;
                .github/workflows/tests.yml)
                  git checkout --theirs -- "$path"
                  git add "$path"
                  ;;
                *)
                  echo "Unexpected merge conflict: $path" >&2
                  exit 1
                  ;;
              esac
            done
          fi

          git show origin/main:.github/workflows/tests.yml > .github/workflows/tests.yml
          git add .github/workflows/tests.yml

          if git diff --name-only --diff-filter=U | grep -q .; then
            echo "Unresolved merge conflicts remain." >&2
            git status --short
            exit 1
          fi

          git commit -m "Синхронизировать PR #506 с актуальным main"
          git push origin HEAD:feat/505-hybrid-ai-contracts
