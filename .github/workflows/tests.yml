name: tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  CI_TEST_SHARDS: "4"

jobs:
  sync-afk-repository-layout:
    name: sync-afk-repository-layout
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 549
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/storage-librarian-afk-guardrails
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Generate repository layout and synchronize contracts
        run: |
          python scripts/inventory_repository_layout.py \
            --write \
            --label p3e-repository-layout-complete
          python - <<'PY'
          from pathlib import Path

          test_path = Path('tests/test_p3e_repository_layout_inventory.py')
          text = test_path.read_text(encoding='utf-8')
          replacements = {
              'self.assertEqual(42, inventory["repository_module_count"])':
                  'self.assertEqual(43, inventory["repository_module_count"])',
              'self.assertEqual(35, inventory["layout_counts"]["domain"])':
                  'self.assertEqual(36, inventory["layout_counts"]["domain"])',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing expected contract: {old}')
              text = text.replace(old, new, 1)
          test_path.write_text(text, encoding='utf-8')

          worklog_path = Path(
              'docs/worklog/2026-08-02-storage-librarian-afk-guardrails.md'
          )
          worklog = worklog_path.read_text(encoding='utf-8')
          old_status = '- Статус: `проверка`'
          if old_status not in worklog:
              raise SystemExit('expected worklog status marker is missing')
          worklog_path.write_text(
              worklog.replace(old_status, '- Статус: `частично`', 1),
              encoding='utf-8',
          )
          PY
          python scripts/inventory_repository_layout.py \
            --check \
            --label p3e-repository-layout-complete

      - name: Restore standard workflow and commit
        run: |
          git fetch origin main
          git checkout origin/main -- .github/workflows/tests.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- \
            .github/workflows/tests.yml \
            docs/repository_layout_inventory.json \
            docs/repository_layout_inventory.md \
            docs/worklog/2026-08-02-storage-librarian-afk-guardrails.md \
            tests/test_p3e_repository_layout_inventory.py
          git commit -m 'chore: sync Librarian AFK repository inventory'
          git push origin HEAD:feat/storage-librarian-afk-guardrails

  preflight:
    name: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Verify test shard plan
        run: python scripts/ci_test_shard.py --total "$CI_TEST_SHARDS" --verify

      - name: Compile Python sources
        run: python -m compileall -q main.py velvet_bot scripts tests

      - name: Run fast architecture contracts
        shell: bash
        run: |
          set -o pipefail
          python scripts/ci_preflight.py 2>&1 | tee preflight-output.txt

      - name: Upload preflight output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: preflight-output
          path: preflight-output.txt
          if-no-files-found: ignore
          retention-days: 7

  test-shards:
    name: test-shard-${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: true
      matrix:
        shard: [0, 1, 2, 3]
    env:
      TEST_DATABASE_URL: postgresql://velvet:velvet_test_password@localhost:5432/velvet_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.16"
          enable-cache: true
          cache-dependency-glob: requirements.txt
          save-cache: ${{ matrix.shard == 0 }}

      - name: Start native PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          sudo systemctl start postgresql.service
          sudo -u postgres psql --set=ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'velvet') THEN
              CREATE ROLE velvet LOGIN SUPERUSER PASSWORD 'velvet_test_password';
            ELSE
              ALTER ROLE velvet WITH LOGIN SUPERUSER PASSWORD 'velvet_test_password';
            END IF;
          END
          $$;
          SELECT 'CREATE DATABASE velvet_test OWNER velvet'
          WHERE NOT EXISTS (
            SELECT 1 FROM pg_database WHERE datname = 'velvet_test'
          )\gexec
          ALTER DATABASE velvet_test OWNER TO velvet;
          SQL
          pg_isready -h localhost -p 5432 -U velvet -d velvet_test

      - name: Install dependencies
        run: uv pip install --system -r requirements.txt

      - name: Run test shard
        shell: bash
        run: |
          set -o pipefail
          python scripts/ci_test_shard.py \
            --index "${{ matrix.shard }}" \
            --total "$CI_TEST_SHARDS" \
            --failfast \
            --durations 30 \
            2>&1 | tee "unit-test-output-${{ matrix.shard }}.txt"

      - name: Upload failed shard output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-output-shard-${{ matrix.shard }}
          path: unit-test-output-${{ matrix.shard }}.txt
          if-no-files-found: ignore
          retention-days: 7

  unit-tests:
    name: unit-tests
    if: always()
    needs:
      - preflight
      - test-shards
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify required test jobs
        env:
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          SHARDS_RESULT: ${{ needs.test-shards.result }}
        run: |
          test "$PREFLIGHT_RESULT" = "success"
          test "$SHARDS_RESULT" = "success"
