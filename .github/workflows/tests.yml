name: tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  CI_TEST_SHARDS: "4"

jobs:
  sync-afk-package-inventories:
    name: sync-afk-package-inventories
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 549
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/storage-librarian-afk-guardrails
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Generate package and P2 contracts
        run: |
          python scripts/inventory_package_architecture.py \
            --write \
            --bootstrap-exemptions \
            --label p1-package-architecture-baseline
          python scripts/update_p2_stability_inventory.py \
            --label storage-librarian-afk-guardrails \
            --schema-version 78
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          data = json.loads(
              Path('docs/package_architecture_inventory.json').read_text(
                  encoding='utf-8'
              )
          )
          path = Path('tests/test_package_architecture_inventory.py')
          text = path.read_text(encoding='utf-8')
          keys = (
              'production_module_count',
              'production_loc',
              'root_module_count',
              'router_count',
              'repository_module_count',
              'violation_count',
          )
          for key in keys:
              pattern = rf'self\.assertEqual\(\d[\d_]*, self\.inventory\["{key}"\]\)'
              replacement = (
                  f'self.assertEqual({int(data[key]):_}, '
                  f'self.inventory["{key}"])'
              )
              text, count = re.subn(pattern, replacement, text, count=1)
              if count != 1:
                  raise SystemExit(f'expected one assertion for {key}, found {count}')
          pattern = (
              r'self\.assertEqual\(\d[\d_]*, '
              r'len\(self\.inventory\["installer_graph"\]\)\)'
          )
          replacement = (
              f'self.assertEqual({len(data["installer_graph"]):_}, '
              'len(self.inventory["installer_graph"]))'
          )
          text, count = re.subn(pattern, replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'expected one installer assertion, found {count}')
          path.write_text(text, encoding='utf-8')
          PY
          python scripts/inventory_package_architecture.py \
            --check \
            --label p1-package-architecture-baseline

      - name: Restore standard workflow and commit
        run: |
          git fetch origin main
          git checkout origin/main -- .github/workflows/tests.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- \
            .github/workflows/tests.yml \
            docs/package_architecture_inventory.json \
            docs/package_architecture_inventory.md \
            docs/package_architecture_exemptions.json \
            docs/p2_stability_inventory.json \
            docs/p2_stability_inventory.md \
            tests/test_package_architecture_inventory.py
          git commit -m 'chore: sync final Librarian AFK package inventories'
          git push origin HEAD:feat/storage-librarian-afk-guardrails

  preflight:
    name: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Verify test shard plan
        run: python scripts/ci_test_shard.py --total "$CI_TEST_SHARDS" --verify

      - name: Compile Python sources
        run: python -m compileall -q main.py velvet_bot scripts tests

      - name: Run fast architecture contracts
        shell: bash
        run: |
          set -o pipefail
          python scripts/ci_preflight.py 2>&1 | tee preflight-output.txt

      - name: Upload preflight output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: preflight-output
          path: preflight-output.txt
          if-no-files-found: ignore
          retention-days: 7

  test-shards:
    name: test-shard-${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: true
      matrix:
        shard: [0, 1, 2, 3]
    env:
      TEST_DATABASE_URL: postgresql://velvet:velvet_test_password@localhost:5432/velvet_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.16"
          enable-cache: true
          cache-dependency-glob: requirements.txt
          save-cache: ${{ matrix.shard == 0 }}

      - name: Start native PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          sudo systemctl start postgresql.service
          sudo -u postgres psql --set=ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'velvet') THEN
              CREATE ROLE velvet LOGIN SUPERUSER PASSWORD 'velvet_test_password';
            ELSE
              ALTER ROLE velvet WITH LOGIN SUPERUSER PASSWORD 'velvet_test_password';
            END IF;
          END
          $$;
          SELECT 'CREATE DATABASE velvet_test OWNER velvet'
          WHERE NOT EXISTS (
            SELECT 1 FROM pg_database WHERE datname = 'velvet_test'
          )\gexec
          ALTER DATABASE velvet_test OWNER TO velvet;
          SQL
          pg_isready -h localhost -p 5432 -U velvet -d velvet_test

      - name: Install dependencies
        run: uv pip install --system -r requirements.txt

      - name: Run test shard
        shell: bash
        run: |
          set -o pipefail
          python scripts/ci_test_shard.py \
            --index "${{ matrix.shard }}" \
            --total "$CI_TEST_SHARDS" \
            --failfast \
            --durations 30 \
            2>&1 | tee "unit-test-output-${{ matrix.shard }}.txt"

      - name: Upload failed shard output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-output-shard-${{ matrix.shard }}
          path: unit-test-output-${{ matrix.shard }}.txt
          if-no-files-found: ignore
          retention-days: 7

  unit-tests:
    name: unit-tests
    if: always()
    needs:
      - preflight
      - test-shards
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify required test jobs
        env:
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          SHARDS_RESULT: ${{ needs.test-shards.result }}
        run: |
          test "$PREFLIGHT_RESULT" = "success"
          test "$SHARDS_RESULT" = "success"
