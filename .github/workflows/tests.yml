name: tests

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  CI_TEST_SHARDS: "4"

jobs:
  changes:
    name: resolve-test-surfaces
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      tests_full: ${{ steps.changes.outputs.tests_full }}
      tests_targeted: ${{ steps.changes.outputs.tests_targeted }}
      tests_ci: ${{ steps.changes.outputs.tests_ci }}
      tests_hermes: ${{ steps.changes.outputs.tests_hermes }}
      tests_krita: ${{ steps.changes.outputs.tests_krita }}
      tests_docs_only: ${{ steps.changes.outputs.tests_docs_only }}
    steps:
      - name: Checkout exact change head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve changed test surfaces
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          python scripts/ci_changed_surfaces.py \
            --event-name "$EVENT_NAME" \
            --base-sha "$BASE_SHA" \
            --base-ref "$BASE_REF" \
            --before-sha "$BEFORE_SHA" \
            --github-output "$GITHUB_OUTPUT" \
            --changed-files changed-test-files.txt

      - name: Show selected test plan
        shell: bash
        env:
          TESTS_FULL: ${{ steps.changes.outputs.tests_full }}
          TESTS_TARGETED: ${{ steps.changes.outputs.tests_targeted }}
          TESTS_CI: ${{ steps.changes.outputs.tests_ci }}
          TESTS_HERMES: ${{ steps.changes.outputs.tests_hermes }}
          TESTS_KRITA: ${{ steps.changes.outputs.tests_krita }}
          TESTS_DOCS_ONLY: ${{ steps.changes.outputs.tests_docs_only }}
        run: |
          printf '%s\n' \
            "tests_full=$TESTS_FULL" \
            "tests_targeted=$TESTS_TARGETED" \
            "tests_ci=$TESTS_CI" \
            "tests_hermes=$TESTS_HERMES" \
            "tests_krita=$TESTS_KRITA" \
            "tests_docs_only=$TESTS_DOCS_ONLY"

  preflight:
    name: preflight
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Verify test shard plan
        run: python scripts/ci_test_shard.py --total "$CI_TEST_SHARDS" --verify

      - name: Compile Python sources
        run: python -m compileall -q main.py velvet_bot scripts tests

      - name: Generate repository layout diagnostic
        run: python scripts/inventory_repository_layout.py --write --label p3e-repository-layout-complete

      - name: Commit generated repository layout
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.actor != 'github-actions[bot]'
        shell: bash
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/repository_layout_inventory.json docs/repository_layout_inventory.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/repository_layout_inventory.json docs/repository_layout_inventory.md
          git commit -m "Refresh repository layout inventory"
          git push origin "HEAD:${HEAD_REF}"

      - name: Run fast architecture contracts
        shell: bash
        run: |
          set -o pipefail
          python scripts/ci_preflight.py 2>&1 | tee preflight-output.txt

      - name: Upload preflight output
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: preflight-output
          path: preflight-output.txt
          if-no-files-found: ignore
          retention-days: 7

  targeted-contracts:
    name: targeted-contracts
    needs: changes
    if: >-
      needs.changes.outputs.tests_full != 'true' &&
      needs.changes.outputs.tests_targeted == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.16"
          enable-cache: true
          cache-dependency-glob: requirements.lock
          save-cache: false

      - name: Install dependencies from hash lock
        run: uv pip install --system --require-hashes -r requirements.lock

      - name: Run selected contract tests
        env:
          TESTS_CI: ${{ needs.changes.outputs.tests_ci }}
          TESTS_HERMES: ${{ needs.changes.outputs.tests_hermes }}
          TESTS_KRITA: ${{ needs.changes.outputs.tests_krita }}
        run: |
          python - <<'PY'
          from __future__ import annotations
          import os, unittest
          from pathlib import Path
          root = Path("tests")
          patterns: list[str] = []
          if os.environ["TESTS_CI"] == "true":
              patterns.extend(["test_ci_*.py", "test_*workflow_contract.py", "test_security_gate_contract.py"])
          if os.environ["TESTS_HERMES"] == "true": patterns.append("test_hermes_*.py")
          if os.environ["TESTS_KRITA"] == "true": patterns.append("test_krita_*.py")
          files = sorted({path for pattern in patterns for path in root.glob(pattern) if path.is_file()})
          if not files: raise SystemExit("No targeted contract tests matched the selected surfaces")
          loader = unittest.TestLoader(); suite = unittest.TestSuite()
          for path in files: suite.addTests(loader.loadTestsFromName(path.with_suffix("").as_posix().replace("/", ".")))
          result = unittest.TextTestRunner(verbosity=2, failfast=True, durations=30).run(suite)
          raise SystemExit(0 if result.wasSuccessful() else 1)
          PY

  test-shards:
    name: test-shard-${{ matrix.shard }}
    needs: changes
    if: needs.changes.outputs.tests_full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: true
      matrix:
        shard: [0, 1, 2, 3]
    env:
      TEST_DATABASE_URL: postgresql://velvet:velvet_test_password@localhost:5432/velvet_test
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.16"
          enable-cache: true
          cache-dependency-glob: requirements.lock
          save-cache: ${{ matrix.shard == 0 }}
      - name: Start native PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          sudo systemctl start postgresql.service
          sudo -u postgres psql --set=ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'velvet') THEN
              CREATE ROLE velvet LOGIN SUPERUSER PASSWORD 'velvet_test_password';
            ELSE
              ALTER ROLE velvet WITH LOGIN SUPERUSER PASSWORD 'velvet_test_password';
            END IF;
          END
          $$;
          SELECT 'CREATE DATABASE velvet_test OWNER velvet' WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = 'velvet_test')\gexec
          ALTER DATABASE velvet_test OWNER TO velvet;
          SQL
          pg_isready -h localhost -p 5432 -U velvet -d velvet_test
      - name: Install dependencies from hash lock
        run: uv pip install --system --require-hashes -r requirements.lock
      - name: Run test shard
        shell: bash
        run: |
          set -o pipefail
          python scripts/ci_test_shard.py --index "${{ matrix.shard }}" --total "$CI_TEST_SHARDS" --failfast --durations 30 2>&1 | tee "unit-test-output-${{ matrix.shard }}.txt"
      - name: Upload failed shard output
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-test-output-shard-${{ matrix.shard }}
          path: unit-test-output-${{ matrix.shard }}.txt
          if-no-files-found: ignore
          retention-days: 7

  unit-tests:
    name: unit-tests
    if: always()
    needs: [changes, preflight, targeted-contracts, test-shards]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify selected test jobs
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          TARGETED_RESULT: ${{ needs.targeted-contracts.result }}
          SHARDS_RESULT: ${{ needs.test-shards.result }}
          FULL_REQUIRED: ${{ needs.changes.outputs.tests_full }}
          TARGETED_REQUIRED: ${{ needs.changes.outputs.tests_targeted }}
        run: |
          set -euo pipefail
          test "$CHANGES_RESULT" = "success"
          test "$PREFLIGHT_RESULT" = "success"
          if test "$FULL_REQUIRED" = "true"; then
            test "$SHARDS_RESULT" = "success"
            test "$TARGETED_RESULT" = "skipped"
          else
            test "$SHARDS_RESULT" = "skipped"
            if test "$TARGETED_REQUIRED" = "true"; then test "$TARGETED_RESULT" = "success"; else test "$TARGETED_RESULT" = "skipped"; fi
          fi
