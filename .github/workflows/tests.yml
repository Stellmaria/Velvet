name: tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  synchronize-main:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout helper branch
        uses: actions/checkout@v4
        with:
          ref: agent/shared-telegram-helpers
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Merge current main safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e
          if [ "$merge_status" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            allowed="docs/generated/telegram_navigation_inventory.md
tests/test_auf_active_delivery_fix.py
velvet_bot/app/auf_active_delivery_fix.py"
            unexpected="$(comm -23 <(printf '%s\n' "$conflicts" | sort) <(printf '%s\n' "$allowed" | sort))"
            if [ -n "$unexpected" ]; then
              echo "Unexpected merge conflicts:"
              echo "$unexpected"
              exit 1
            fi
            while IFS= read -r path; do
              [ -z "$path" ] && continue
              git checkout --ours -- "$path"
              git add "$path"
            done <<< "$conflicts"
          fi
          python scripts/inventory_telegram_helpers.py \
            --write-json docs/shared_contract_inventory.json \
            --write-markdown docs/shared_contract_inventory.md
          python scripts/update_p2_stability_inventory.py \
            --label p3-package-shared-contracts \
            --schema-version 74
          python scripts/inventory_architecture_layout.py \
            --write \
            --label p3d-analytics-alias-retirement
          python scripts/telegram_navigation_inventory.py \
            --root velvet_bot \
            --markdown docs/generated/telegram_navigation_inventory.md
          python scripts/inventory_telegram_helpers.py --check
          git add -A
          git commit -m "Merge current main into shared contract branch"
          git push origin HEAD:agent/shared-telegram-helpers

  unit-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: velvet_test
          POSTGRES_USER: velvet
          POSTGRES_PASSWORD: velvet_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U velvet -d velvet_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://velvet:velvet_test_password@localhost:5432/velvet_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run unit tests
        shell: bash
        run: |
          set +e
          python -m unittest discover -s tests -v > unit-test-output.txt 2>&1
          status=$?
          cat unit-test-output.txt
          exit "$status"

      - name: Upload unit test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-output
          path: unit-test-output.txt
          if-no-files-found: error
          retention-days: 7
