name: tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  CI_TEST_SHARDS: "4"

jobs:
  inventory-refresh:
    name: inventory-refresh
    if: >-
      github.event_name == 'pull_request' &&
      github.head_ref == 'feat/auf-pricing-economy-hardening' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/auf-pricing-economy-hardening
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Patch pricing and refresh canonical architecture inventory
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import json
          import subprocess
          import sys
          from pathlib import Path

          pricing_path = Path("velvet_bot/domains/auf_wallet/pricing.py")
          source = pricing_path.read_text(encoding="utf-8")
          old = '''        async with self._database.acquire() as connection:
              minimum_markup = await connection.fetchval(
                  """
                  SELECT minimum_user_markup_percent
                  FROM auf_economy_settings
                  WHERE singleton_id = 1
                  """
              )
              if minimum_markup is None:
                  raise RuntimeError("Настройки экономики Ауф не инициализированы.")
              minimum_normalized = _validate_markup_percent(Decimal(minimum_markup))
          '''
          new = '''        async with self._database.acquire() as connection:
              current_policy = await _load_user_markup_policy(connection, int(user_id))
              minimum_normalized = current_policy.minimum_user_markup_percent
          '''
          if source.count(old) != 1:
              raise SystemExit("expected unique set_user_markup SQL block")
          pricing_path.write_text(source.replace(old, new), encoding="utf-8")

          inventory_path = Path("docs/package_architecture_inventory.json")
          current_inventory = json.loads(inventory_path.read_text(encoding="utf-8"))
          label = str(current_inventory.get("generated_from") or "working-tree")

          sys.path.insert(0, str(Path.cwd()))
          from scripts.inventory_package_architecture import build_inventory

          data = build_inventory(label=label)
          prefix = "sql-outside-persistence:velvet_bot/domains/auf_wallet/pricing.py:"
          matches = [
              str(row["id"])
              for row in data["violations"]
              if str(row["id"]).startswith(prefix)
          ]
          if len(matches) != 1:
              raise SystemExit(f"expected one pricing SQL violation, got {matches!r}")

          exemptions_path = Path("docs/package_architecture_exemptions.json")
          exemptions = json.loads(exemptions_path.read_text(encoding="utf-8"))
          changed = 0
          for row in exemptions.get("exceptions", []):
              if str(row.get("id", "")).startswith(prefix):
                  row["id"] = matches[0]
                  changed += 1
          if changed != 1:
              raise SystemExit(f"expected one pricing exemption, changed {changed}")
          exemptions_path.write_text(
              json.dumps(exemptions, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          subprocess.run(
              [
                  sys.executable,
                  "scripts/inventory_package_architecture.py",
                  "--label",
                  label,
                  "--write",
              ],
              check=True,
          )
          subprocess.run(
              [
                  sys.executable,
                  "scripts/inventory_package_architecture.py",
                  "--label",
                  label,
                  "--check",
              ],
              check=True,
          )
          PY

      - name: Restore workflow files and publish refresh
        shell: bash
        run: |
          set -euo pipefail
          git show origin/main:.github/workflows/tests.yml > .github/workflows/tests.yml
          git rm .github/workflows/tmp-auf-pricing-inventory.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/tests.yml \
            velvet_bot/domains/auf_wallet/pricing.py \
            docs/package_architecture_exemptions.json \
            docs/package_architecture_inventory.json \
            docs/package_architecture_inventory.md
          git commit -m "chore: refresh AUF pricing architecture inventory"
          git push origin HEAD:feat/auf-pricing-economy-hardening

  preflight:
    name: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Verify test shard plan
        run: python scripts/ci_test_shard.py --total "$CI_TEST_SHARDS" --verify

      - name: Compile Python sources
        run: python -m compileall -q main.py velvet_bot scripts tests

      - name: Run fast architecture contracts
        shell: bash
        run: |
          set -o pipefail
          python scripts/ci_preflight.py 2>&1 | tee preflight-output.txt

      - name: Upload preflight output
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: preflight-output
          path: preflight-output.txt
          if-no-files-found: ignore
          retention-days: 7

  test-shards:
    name: test-shard-${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: true
      matrix:
        shard: [0, 1, 2, 3]
    env:
      TEST_DATABASE_URL: postgresql://velvet:velvet_test_password@localhost:5432/velvet_test
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.16"
          enable-cache: true
          cache-dependency-glob: requirements.lock
          save-cache: ${{ matrix.shard == 0 }}

      - name: Start native PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          sudo systemctl start postgresql.service
          sudo -u postgres psql --set=ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'velvet') THEN
              CREATE ROLE velvet LOGIN SUPERUSER PASSWORD 'velvet_test_password';
            ELSE
              ALTER ROLE velvet WITH LOGIN SUPERUSER PASSWORD 'velvet_test_password';
            END IF;
          END
          $$;
          SELECT 'CREATE DATABASE velvet_test OWNER velvet'
          WHERE NOT EXISTS (
            SELECT 1 FROM pg_database WHERE datname = 'velvet_test'
          )\gexec
          ALTER DATABASE velvet_test OWNER TO velvet;
          SQL
          pg_isready -h localhost -p 5432 -U velvet -d velvet_test

      - name: Install dependencies from hash lock
        run: uv pip install --system --require-hashes -r requirements.lock

      - name: Run test shard
        shell: bash
        run: |
          set -o pipefail
          python scripts/ci_test_shard.py \
            --index "${{ matrix.shard }}" \
            --total "$CI_TEST_SHARDS" \
            --failfast \
            --durations 30 \
            2>&1 | tee "unit-test-output-${{ matrix.shard }}.txt"

      - name: Upload failed shard output
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-test-output-shard-${{ matrix.shard }}
          path: unit-test-output-${{ matrix.shard }}.txt
          if-no-files-found: ignore
          retention-days: 7

  unit-tests:
    name: unit-tests
    if: always()
    needs:
      - preflight
      - test-shards
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify required test jobs
        env:
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          SHARDS_RESULT: ${{ needs.test-shards.result }}
        run: |
          test "$PREFLIGHT_RESULT" = "success"
          test "$SHARDS_RESULT" = "success"
