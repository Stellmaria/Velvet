name: tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  CI_TEST_SHARDS: "4"

jobs:
  refresh-merge-inventory:
    name: refresh-merge-inventory
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/auf-42-86-margin-packages'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout PR merge tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Generate inventory from tested tree
        run: |
          rm -rf /tmp/package-inventory
          python scripts/inventory_package_architecture.py \
            --write \
            --output-dir /tmp/package-inventory \
            --label p1-package-architecture-baseline
          cp tests/test_package_architecture_inventory.py /tmp/test_package_architecture_inventory.py
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          inventory = json.loads(
              Path('/tmp/package-inventory/package_architecture_inventory.json').read_text(encoding='utf-8')
          )
          path = Path('/tmp/test_package_architecture_inventory.py')
          text = path.read_text(encoding='utf-8')
          module_count = int(inventory['production_module_count'])
          loc = int(inventory['production_loc'])
          violations = int(inventory['violation_count'])
          text = re.sub(
              r'self\.assertEqual\([\d_]+, self\.inventory\["production_module_count"\]\)',
              f'self.assertEqual({module_count:_}, self.inventory["production_module_count"])',
              text,
              count=1,
          )
          text = re.sub(
              r'self\.assertEqual\([\d_]+, self\.inventory\["production_loc"\]\)',
              f'self.assertEqual({loc:_}, self.inventory["production_loc"])',
              text,
              count=1,
          )
          text = re.sub(
              r'self\.assertEqual\([\d_]+, self\.inventory\["violation_count"\]\)',
              f'self.assertEqual({violations:_}, self.inventory["violation_count"])',
              text,
              count=1,
          )
          text = re.sub(
              r'Production modules: \*\*[\d_]+\*\*',
              f'Production modules: **{module_count}**',
              text,
              count=1,
          )
          text = re.sub(
              r'Production LOC: \*\*[\d_]+\*\*',
              f'Production LOC: **{loc}**',
              text,
              count=1,
          )
          text = re.sub(
              r'Registered package violations: \*\*[\d_]+\*\*',
              f'Registered package violations: **{violations}**',
              text,
              count=1,
          )
          text = re.sub(
              r'Registered exemptions: \*\*[\d_]+\*\*',
              f'Registered exemptions: **{violations}**',
              text,
              count=1,
          )
          path.write_text(text, encoding='utf-8')
          PY

      - name: Apply generated files to feature branch
        run: |
          git fetch origin feat/auf-42-86-margin-packages
          git checkout -B feat/auf-42-86-margin-packages origin/feat/auf-42-86-margin-packages
          cp /tmp/package-inventory/package_architecture_inventory.json docs/package_architecture_inventory.json
          cp /tmp/package-inventory/package_architecture_inventory.md docs/package_architecture_inventory.md
          cp /tmp/test_package_architecture_inventory.py tests/test_package_architecture_inventory.py
          git checkout origin/main -- .github/workflows/tests.yml

      - name: Commit merge-tree inventory
        run: |
          git config user.name "Velvet CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "chore: align package inventory with PR merge tree"
          git push origin HEAD:feat/auf-42-86-margin-packages

  preflight:
    name: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Verify test shard plan
        run: python scripts/ci_test_shard.py --total "$CI_TEST_SHARDS" --verify

      - name: Compile Python sources
        run: python -m compileall -q main.py velvet_bot scripts tests

      - name: Run fast architecture contracts
        shell: bash
        run: |
          set -o pipefail
          python scripts/ci_preflight.py 2>&1 | tee preflight-output.txt

      - name: Upload preflight output
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: preflight-output
          path: preflight-output.txt
          if-no-files-found: ignore
          retention-days: 7

  test-shards:
    name: test-shard-${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: true
      matrix:
        shard: [0, 1, 2, 3]
    env:
      TEST_DATABASE_URL: postgresql://velvet:velvet_test_password@localhost:5432/velvet_test
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.16"
          enable-cache: true
          cache-dependency-glob: requirements.lock
          save-cache: ${{ matrix.shard == 0 }}

      - name: Start native PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          sudo systemctl start postgresql.service
          sudo -u postgres psql --set=ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'velvet') THEN
              CREATE ROLE velvet LOGIN SUPERUSER PASSWORD 'velvet_test_password';
            ELSE
              ALTER ROLE velvet WITH LOGIN SUPERUSER PASSWORD 'velvet_test_password';
            END IF;
          END
          $$;
          SELECT 'CREATE DATABASE velvet_test OWNER velvet'
          WHERE NOT EXISTS (
            SELECT 1 FROM pg_database WHERE datname = 'velvet_test'
          )\gexec
          ALTER DATABASE velvet_test OWNER TO velvet;
          SQL
          pg_isready -h localhost -p 5432 -U velvet -d velvet_test

      - name: Install dependencies from hash lock
        run: uv pip install --system --require-hashes -r requirements.lock

      - name: Run test shard
        shell: bash
        run: |
          set -o pipefail
          python scripts/ci_test_shard.py \
            --index "${{ matrix.shard }}" \
            --total "$CI_TEST_SHARDS" \
            --failfast \
            --durations 30 \
            2>&1 | tee "unit-test-output-${{ matrix.shard }}.txt"

      - name: Upload failed shard output
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-test-output-shard-${{ matrix.shard }}
          path: unit-test-output-${{ matrix.shard }}.txt
          if-no-files-found: ignore
          retention-days: 7

  unit-tests:
    name: unit-tests
    if: always()
    needs:
      - preflight
      - test-shards
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify required test jobs
        env:
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          SHARDS_RESULT: ${{ needs.test-shards.result }}
        run: |
          test "$PREFLIGHT_RESULT" = "success"
          test "$SHARDS_RESULT" = "success"
