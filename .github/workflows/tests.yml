name: tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  pricing-finalize:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Fix final pricing expectations
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/test_auf_retail_user_registry.py')
          text = path.read_text(encoding='utf-8')
          old = '''        self.assertEqual(20_000, quote.quoted_units)
        self.assertEqual(Decimal("2.0000"), quote.quoted_auf)
        self.assertEqual(Decimal("0.05"), quote.minimum_revenue_usd)'''
          new = '''        self.assertEqual(30_000, quote.quoted_units)
        self.assertEqual(Decimal("3.0000"), quote.quoted_auf)
        self.assertEqual(Decimal("0.075"), quote.minimum_revenue_usd)'''
          if text.count(old) != 1:
              raise SystemExit('Expected pricing assertion block not found exactly once')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Regenerate architecture contracts
        shell: bash
        run: |
          python scripts/inventory_package_architecture.py --write --bootstrap-exemptions

      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          git rm -f .github/workflows/tmp-pricing-finalize.yml || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tests/test_auf_retail_user_registry.py \
            docs/package_architecture_inventory.json \
            docs/package_architecture_inventory.md \
            docs/package_architecture_exemptions.json
          git commit -m "Завершить контракты политики цен [pricing-finalize]"
          git push origin HEAD:${{ github.head_ref }}

  unit-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: velvet_test
          POSTGRES_USER: velvet
          POSTGRES_PASSWORD: velvet_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U velvet -d velvet_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://velvet:velvet_test_password@localhost:5432/velvet_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run unit tests
        shell: bash
        run: |
          set +e
          python -m unittest discover -s tests -v > unit-test-output.txt 2>&1
          status=$?
          cat unit-test-output.txt
          exit "$status"

      - name: Upload unit test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-output
          path: unit-test-output.txt
          if-no-files-found: error
          retention-days: 7
