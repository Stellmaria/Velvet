name: tests

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: shared-fingerprint-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  synchronize:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/issue-511-media-delivery-boundaries
          fetch-depth: 0

      - name: Synchronize reviewed fingerprint
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path

          inventory = json.loads(
              Path("docs/package_architecture_inventory.json").read_text(encoding="utf-8")
          )
          path = Path("docs/package_architecture_exemptions.json")
          exemptions = json.loads(path.read_text(encoding="utf-8"))
          exemptions["shared_private_access_sha256"] = inventory[
              "shared_contract_summary"
          ]["private_access_sha256"]
          path.write_text(
              json.dumps(exemptions, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Restore canonical workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git show origin/main:.github/workflows/tests.yml > .github/workflows/tests.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/tests.yml \
            docs/package_architecture_exemptions.json
          git diff --cached --check
          git commit -m "Синхронизировать shared architecture fingerprint"
          git push origin HEAD:agent/issue-511-media-delivery-boundaries
