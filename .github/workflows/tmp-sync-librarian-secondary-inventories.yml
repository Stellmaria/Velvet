name: temporary sync Librarian secondary inventories

on:
  push:
    branches:
      - agent/storage-librarian-reports

permissions:
  contents: write

jobs:
  sync:
    if: github.event.head_commit.message != 'Синхронизировать вторичные inventory Librarian'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/storage-librarian-reports
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Generate navigation and P2 inventories
        run: |
          python scripts/telegram_navigation_inventory.py \
            --root velvet_bot \
            --markdown docs/generated/telegram_navigation_inventory.md
          python scripts/update_p2_stability_inventory.py \
            --label storage-librarian-reports \
            --schema-version 77

      - name: Remove temporary workflow and commit
        run: |
          git fetch origin agent/storage-librarian-reports
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/agent/storage-librarian-reports)"
          rm .github/workflows/tmp-sync-librarian-secondary-inventories.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            docs/generated/telegram_navigation_inventory.md \
            docs/p2_stability_inventory.json \
            docs/p2_stability_inventory.md \
            .github/workflows/tmp-sync-librarian-secondary-inventories.yml
          git commit -m 'Синхронизировать вторичные inventory Librarian'
          git push origin HEAD:agent/storage-librarian-reports
