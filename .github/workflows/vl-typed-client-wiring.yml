name: VL typed client wiring

on:
  pull_request:
    paths:
      - .github/workflows/vl-typed-client-wiring.yml

permissions:
  contents: write

concurrency:
  group: vl-typed-client-wiring-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  wire:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Wire cancellable quality client
        run: |
          python - <<'PY'
          from pathlib import Path

          workers = Path("velvet_bot/app/workers.py")
          text = workers.read_text(encoding="utf-8")
          old = "from velvet_bot.ai_quality import (\n    QualityVisionClient,\n    build_quality_vision_contract,\n)"
          new = "from velvet_bot.ai_quality import build_quality_vision_contract\nfrom velvet_bot.typed_quality_vision import TypedQualityVisionClient"
          if old not in text:
              raise SystemExit("workers import shape changed")
          text = text.replace(old, new, 1)
          if "client=QualityVisionClient(" not in text:
              raise SystemExit("quality worker client construction missing")
          text = text.replace("client=QualityVisionClient(", "client=TypedQualityVisionClient(", 1)
          workers.write_text(text, encoding="utf-8")

          controller = Path(
              "velvet_bot/presentation/telegram/routers/quality_operations_controllers/quality_operations.py"
          )
          text = controller.read_text(encoding="utf-8")
          old = "from velvet_bot.ai_quality import AIQualityRepository, AIQualitySummary, QualityVisionClient"
          new = "from velvet_bot.ai_quality import AIQualityRepository, AIQualitySummary\nfrom velvet_bot.typed_quality_vision import TypedQualityVisionClient"
          if old not in text:
              raise SystemExit("quality controller import shape changed")
          text = text.replace(old, new, 1)
          if "client = QualityVisionClient(" not in text:
              raise SystemExit("manual quality client construction missing")
          text = text.replace("client = QualityVisionClient(", "client = TypedQualityVisionClient(", 1)
          controller.write_text(text, encoding="utf-8")
          PY

      - name: Commit wiring and remove helper workflow
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote --heads origin "refs/heads/${HEAD_BRANCH}" | awk '{print $1}')"
          if [[ "$remote_head" != "$EXPECTED_HEAD_SHA" ]]; then
            echo "PR head moved: expected $EXPECTED_HEAD_SHA, actual $remote_head"
            exit 1
          fi
          rm .github/workflows/vl-typed-client-wiring.yml
          git add \
            velvet_bot/app/workers.py \
            velvet_bot/presentation/telegram/routers/quality_operations_controllers/quality_operations.py \
            .github/workflows/vl-typed-client-wiring.yml
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Wire cancellable VL quality client"
          git push origin "HEAD:refs/heads/${HEAD_BRANCH}"
