name: refresh GPT Image package baseline contract

on:
  push:
    branches:
      - feat/gpt-image-2-codex

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message, '[package-baseline-refreshed]') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/gpt-image-2-codex
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"

      - name: Refresh package baseline and assertions
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path
          from scripts import inventory_package_architecture as inventory

          label = "p1-package-architecture-baseline"
          data = inventory.build_inventory(label=label)
          exemptions_path = Path("docs/package_architecture_exemptions.json")
          previous = json.loads(exemptions_path.read_text(encoding="utf-8"))
          observed = {str(row["id"]): row for row in data["violations"]}
          previous_rows = {
              str(row["id"]): row
              for row in previous.get("exceptions", [])
              if str(row.get("id", "")) in observed
          }
          consumers = inventory._reverse_consumers(list(data["modules"]))
          rows = [
              previous_rows.get(row_id)
              or inventory._suggest_exception(violation, consumers)
              for row_id, violation in sorted(observed.items())
          ]
          exemptions = {
              **previous,
              "generated_from": label,
              "shared_private_access_sha256": data["shared_contract_summary"]["private_access_sha256"],
              "root_module_sha256": data["root_module_sha256"],
              "exceptions": rows,
          }
          Path("docs/package_architecture_inventory.json").write_text(
              json.dumps(data, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          exemptions_path.write_text(
              json.dumps(exemptions, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          Path("docs/package_architecture_inventory.md").write_text(
              inventory.render_markdown(data, exemptions),
              encoding="utf-8",
          )
          errors = inventory.validate(data, exemptions)
          if errors:
              raise SystemExit("\n".join(errors))

          test_path = Path("tests/test_package_architecture_inventory.py")
          text = test_path.read_text(encoding="utf-8")
          shared = data["shared_contract_summary"]
          replacements = {
              r'self\.assertEqual\(\d+, self\.inventory\["production_module_count"\]\)':
                  f'self.assertEqual({data["production_module_count"]}, self.inventory["production_module_count"])',
              r'self\.assertEqual\(\d+, self\.inventory\["production_loc"\]\)':
                  f'self.assertEqual({data["production_loc"]}, self.inventory["production_loc"])',
              r'self\.assertEqual\(\d+, self\.inventory\["root_module_count"\]\)':
                  f'self.assertEqual({data["root_module_count"]}, self.inventory["root_module_count"])',
              r'self\.assertEqual\(\d+, self\.inventory\["router_count"\]\)':
                  f'self.assertEqual({data["router_count"]}, self.inventory["router_count"])',
              r'self\.assertEqual\(\d+, self\.inventory\["repository_module_count"\]\)':
                  f'self.assertEqual({data["repository_module_count"]}, self.inventory["repository_module_count"])',
              r'self\.assertEqual\(\d+, len\(self\.inventory\["installer_graph"\]\)\)':
                  f'self.assertEqual({len(data["installer_graph"])}, len(self.inventory["installer_graph"]))',
              r'self\.assertEqual\(\d+, self\.inventory\["violation_count"\]\)':
                  f'self.assertEqual({data["violation_count"]}, self.inventory["violation_count"])',
              r'self\.assertEqual\(\d+, shared\["production_python_files"\]\)':
                  f'self.assertEqual({shared["production_python_files"]}, shared["production_python_files"])',
              r'self\.assertEqual\(\d+, shared\["function_count"\]\)':
                  f'self.assertEqual({shared["function_count"]}, shared["function_count"])',
              r'self\.assertEqual\(\d+, shared\["private_contract_access_count"\]\)':
                  f'self.assertEqual({shared["private_contract_access_count"]}, shared["private_contract_access_count"])',
              r'self\.assertEqual\(\d+, shared\["exact_duplicate_group_count"\]\)':
                  f'self.assertEqual({shared["exact_duplicate_group_count"]}, shared["exact_duplicate_group_count"])',
              r'self\.assertEqual\(\d+, shared\["normalized_duplicate_group_count"\]\)':
                  f'self.assertEqual({shared["normalized_duplicate_group_count"]}, shared["normalized_duplicate_group_count"])',
              r'self\.assertEqual\(\d+, shared\["semantic_near_duplicate_group_count"\]\)':
                  f'self.assertEqual({shared["semantic_near_duplicate_group_count"]}, shared["semantic_near_duplicate_group_count"])',
              r'self\.assertEqual\(list\(range\(1, \d+\)\), \[item\["order"\] for item in graph\]\)':
                  f'self.assertEqual(list(range(1, {len(data["installer_graph"]) + 1})), [item["order"] for item in graph])',
              r'self\.assertIn\("Production modules: \*\*\d+\*\*", self\.markdown\)':
                  f'self.assertIn("Production modules: **{data["production_module_count"]}**", self.markdown)',
              r'self\.assertIn\("Production LOC: \*\*\d+\*\*", self\.markdown\)':
                  f'self.assertIn("Production LOC: **{data["production_loc"]}**", self.markdown)',
              r'self\.assertIn\("Startup installer stages: \*\*\d+\*\*", self\.markdown\)':
                  f'self.assertIn("Startup installer stages: **{len(data["installer_graph"])}**", self.markdown)',
              r'self\.assertIn\("Registered package violations: \*\*\d+\*\*", self\.markdown\)':
                  f'self.assertIn("Registered package violations: **{data["violation_count"]}**", self.markdown)',
              r'self\.assertIn\("Registered exemptions: \*\*\d+\*\*", self\.markdown\)':
                  f'self.assertIn("Registered exemptions: **{len(rows)}**", self.markdown)',
          }
          for pattern, replacement in replacements.items():
              text, count = re.subn(pattern, replacement, text, count=1)
              if count != 1:
                  raise SystemExit(f"baseline assertion pattern not found: {pattern}")
          test_path.write_text(text, encoding="utf-8")
          PY

      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/refresh-gpt-image-package-baseline.yml
          git config user.name "Velvet Architecture Bot"
          git config user.email "velvet-architecture@users.noreply.github.com"
          git add docs/package_architecture_inventory.json \
                  docs/package_architecture_inventory.md \
                  docs/package_architecture_exemptions.json \
                  tests/test_package_architecture_inventory.py \
                  .github/workflows/refresh-gpt-image-package-baseline.yml
          git commit -m "chore: refresh package baseline contract [package-baseline-refreshed]"
          git push origin HEAD:feat/gpt-image-2-codex
