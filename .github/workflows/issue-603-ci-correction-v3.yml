name: issue 603 CI correction v3

on:
  push:
    branches:
      - feat/603-adaptive-ai-queue-wakeup
    paths:
      - .github/workflows/issue-603-ci-correction-v3.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: issue-603-ci-correction-v3
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  TEST_DATABASE_URL: postgresql://velvet:velvet_test_password@localhost:5432/velvet_test

jobs:
  correct:
    if: github.repository == 'Stellmaria/Velvet' && github.ref_name == 'feat/603-adaptive-ai-queue-wakeup'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact feature head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/603-adaptive-ai-queue-wakeup
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: '0.11.16'
          enable-cache: true
          cache-dependency-glob: requirements.lock
          save-cache: false

      - name: Start native PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          sudo systemctl start postgresql.service
          sudo -u postgres psql --set=ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'velvet') THEN
              CREATE ROLE velvet LOGIN SUPERUSER PASSWORD 'velvet_test_password';
            ELSE
              ALTER ROLE velvet WITH LOGIN SUPERUSER PASSWORD 'velvet_test_password';
            END IF;
          END
          $$;
          SELECT 'CREATE DATABASE velvet_test OWNER velvet'
          WHERE NOT EXISTS (
            SELECT 1 FROM pg_database WHERE datname = 'velvet_test'
          )\gexec
          ALTER DATABASE velvet_test OWNER TO velvet;
          SQL
          pg_isready -h localhost -p 5432 -U velvet -d velvet_test

      - name: Install hash-locked dependencies
        run: uv pip install --system --require-hashes -r requirements.lock

      - name: Execute corrected reviewed script
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/issue-603-ci-correction.yml').read_text(
              encoding='utf-8'
          )
          replacements = {
              '        wait = AdaptiveQueueWait(wakeup, jitter_ratio=0.1)\\n'
              '        empty = WorkerIterationResult(WorkerIterationOutcome.EMPTY)\\n'
              '        with patch(\\n'
              '            "velvet_bot.workers.adaptive.random.uniform",\\n'
              '            side_effect=[-0.3, 0.5],\\n'
              '        ):\\n'
              '            self.assertEqual(2.7, wait.delay_for(empty, default_interval_seconds=3))\\n'
              '            self.assertEqual(5.5, wait.delay_for(empty, default_interval_seconds=3))\\n':
              '        values = iter((0.0, 1.0))\\n'
              '        wait = AdaptiveQueueWait(\\n'
              '            wakeup,\\n'
              '            jitter_ratio=0.1,\\n'
              '            random_value=lambda: next(values),\\n'
              '        )\\n'
              '        empty = WorkerIterationResult(WorkerIterationOutcome.EMPTY)\\n'
              '        self.assertAlmostEqual(\\n'
              '            2.7, wait.delay_for(empty, default_interval_seconds=3)\\n'
              '        )\\n'
              '        self.assertAlmostEqual(\\n'
              '            5.5, wait.delay_for(empty, default_interval_seconds=3)\\n'
              '        )\\n',
              '            raise ConnectionError("database unavailable")\\n':
              '            raise ConnectionResetError("database unavailable")\\n',
          }
          for old, new in replacements.items():
              if source.count(old) != 1:
                  raise SystemExit(f'test correction source mismatch: {old[:80]!r}')
              source = source.replace(old, new)

          lines = source.splitlines()
          marker = '        run: |'
          start = lines.index(marker) + 1
          script_lines: list[str] = []
          for line in lines[start:]:
              if line and not line.startswith('          '):
                  raise SystemExit(f'unexpected YAML after correction script: {line!r}')
              script_lines.append(line[10:] if line else '')
          script = '\n'.join(script_lines) + '\n'
          script = script.replace(
              'rm -f .github/workflows/issue-603-ci-correction.yml\n',
              'rm -f .github/workflows/issue-603-ci-correction.yml\n'
              'rm -f .github/workflows/issue-603-ci-correction-v2.yml\n'
              'rm -f .github/workflows/issue-603-ci-correction-v3.yml\n',
              1,
          )
          script = script.replace(
              '  .github/workflows/issue-603-ci-correction.yml \\\n',
              '  .github/workflows/issue-603-ci-correction.yml \\\n'
              '  .github/workflows/issue-603-ci-correction-v2.yml \\\n'
              '  .github/workflows/issue-603-ci-correction-v3.yml \\\n',
              1,
          )
          script = script.replace(
              "    '.github/workflows/issue-603-ci-correction.yml',\n",
              "    '.github/workflows/issue-603-ci-correction.yml',\n"
              "    '.github/workflows/issue-603-ci-correction-v2.yml',\n"
              "    '.github/workflows/issue-603-ci-correction-v3.yml',\n",
              2,
          )
          script = script.replace(
              "if Path('.github/workflows/issue-603-ci-correction.yml').exists():\n"
              "    raise SystemExit('temporary workflow survived cleanup')\n",
              "if any(Path(item).exists() for item in (\n"
              "    '.github/workflows/issue-603-ci-correction.yml',\n"
              "    '.github/workflows/issue-603-ci-correction-v2.yml',\n"
              "    '.github/workflows/issue-603-ci-correction-v3.yml',\n"
              ")):\n"
              "    raise SystemExit('temporary workflow survived cleanup')\n",
              1,
          )
          Path('/tmp/issue-603-correction.sh').write_text(script, encoding='utf-8')
          PY
          bash -n /tmp/issue-603-correction.sh
          bash /tmp/issue-603-correction.sh
