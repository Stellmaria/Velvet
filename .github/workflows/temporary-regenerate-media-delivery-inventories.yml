name: temporary regenerate media delivery inventories

on:
  push:
    branches:
      - agent/issue-511-media-delivery-boundaries

permissions:
  contents: write

concurrency:
  group: temporary-media-delivery-inventories-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/issue-511-media-delivery-boundaries
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"

      - name: Regenerate and self-remove
        shell: bash
        run: |
          set -euo pipefail
          python scripts/update_p2_stability_inventory.py
          python scripts/inventory_package_architecture.py \
            --write \
            --label p1-package-architecture-baseline
          rm .github/workflows/temporary-regenerate-media-delivery-inventories.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/p2_stability_inventory.json \
            docs/p2_stability_inventory.md \
            docs/package_architecture_inventory.json \
            docs/package_architecture_inventory.md \
            .github/workflows/temporary-regenerate-media-delivery-inventories.yml
          git commit -m "Пересобрать media delivery inventories"
          git push origin HEAD:agent/issue-511-media-delivery-boundaries
