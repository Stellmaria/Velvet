name: storage librarian merge inventory

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    if: github.head_ref == 'agent/storage-librarian'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout PR merge ref
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Generate inventories on merge state
        run: |
          python scripts/inventory_package_architecture.py \
            --label storage-librarian \
            --write
          python scripts/inventory_repository_layout.py \
            --label storage-librarian \
            --write
          python scripts/update_p2_stability_inventory.py \
            --label storage-librarian \
            --schema-version 76

          python - <<'PY'
          import json
          import re
          from pathlib import Path

          docs = Path("docs")
          package = json.loads(
              (docs / "package_architecture_inventory.json").read_text(encoding="utf-8")
          )
          repositories = json.loads(
              (docs / "repository_layout_inventory.json").read_text(encoding="utf-8")
          )
          stability = json.loads(
              (docs / "p2_stability_inventory.json").read_text(encoding="utf-8")
          )

          def spaced(value: int) -> str:
              return f"{value:,}".replace(",", " ")

          status_path = docs / "development_status.md"
          status = status_path.read_text(encoding="utf-8")
          replacements = {
              r"production modules package-wide: \*\*\d+\*\*;": (
                  f"production modules package-wide: **{package['production_module_count']}**;"
              ),
              r"production LOC: \*\*[\d ]+\*\*;": (
                  f"production LOC: **{spaced(package['production_loc'])}**;"
              ),
              r"repository modules: \*\*\d+\*\*;": (
                  f"repository modules: **{repositories['repository_module_count']}**;"
              ),
              r"domain repositories: \*\*\d+\*\*;": (
                  f"domain repositories: **{repositories['layout_counts']['domain']}**;"
              ),
              r"infrastructure PostgreSQL adapters: \*\*\d+\*\*;": (
                  "infrastructure PostgreSQL adapters: "
                  f"**{repositories['layout_counts']['infrastructure']}**;"
              ),
          }
          for pattern, replacement in replacements.items():
              status, count = re.subn(pattern, replacement, status, count=1)
              if count != 1:
                  raise SystemExit(f"status replacement failed: {pattern}")
          status_path.write_text(status, encoding="utf-8")

          audit_path = docs / "ARCHITECTURE_AUDIT.md"
          audit = audit_path.read_text(encoding="utf-8")
          layers = package["layer_counts"]
          audit_replacements = {
              r"all \d+ production Python modules под `velvet_bot`;": (
                  f"all {package['production_module_count']} production Python modules "
                  "под `velvet_bot`;"
              ),
              r"production modules: \*\*\d+\*\*;": (
                  f"production modules: **{package['production_module_count']}**;"
              ),
              r"production LOC: \*\*[\d ]+\*\*;": (
                  f"production LOC: **{spaced(package['production_loc'])}**;"
              ),
              r"layer counts: .*?;": (
                  "layer counts: "
                  + ", ".join(
                      f"{name} {layers[name]}"
                      for name in (
                          "application",
                          "composition",
                          "core",
                          "domain",
                          "infrastructure",
                          "other",
                          "presentation",
                          "root",
                          "service",
                          "worker",
                      )
                  )
                  + ";"
              ),
              r"repository modules: \*\*\d+\*\*;": (
                  f"repository modules: **{repositories['repository_module_count']}**;"
              ),
              r"domain repositories: \*\*\d+\*\*;": (
                  f"domain repositories: **{repositories['layout_counts']['domain']}**;"
              ),
              r"infrastructure PostgreSQL adapters: \*\*\d+\*\*;": (
                  "infrastructure PostgreSQL adapters: "
                  f"**{repositories['layout_counts']['infrastructure']}**;"
              ),
              r"broad exception boundaries: \d+;": (
                  f"broad exception boundaries: {stability['broad_exception_total']};"
              ),
              r"approved boundaries: \d+;": (
                  f"approved boundaries: {stability['broad_exception_approved']};"
              ),
              r"unresolved boundaries: \d+;": (
                  f"unresolved boundaries: {stability['broad_exception_unresolved']};"
              ),
              r"app/\s+bootstrap и \d+ composition modules/installers": (
                  f"app/                         bootstrap и {layers['composition']} "
                  "composition modules/installers"
              ),
              r"application/\s+\d+ transport-neutral use-case modules": (
                  f"application/                 {layers['application']} "
                  "transport-neutral use-case modules"
              ),
              r"core/\s+\d+ config/access/base contract modules": (
                  f"core/                        {layers['core']} "
                  "config/access/base contract modules"
              ),
              r"domains/\s+\d+ domain modules и \d+ repositories": (
                  f"domains/                     {layers['domain']} domain modules и "
                  f"{repositories['layout_counts']['domain']} repositories"
              ),
              r"infrastructure/\s+\d+ PostgreSQL/provider/Telegram/filesystem adapters": (
                  f"infrastructure/              {layers['infrastructure']} "
                  "PostgreSQL/provider/Telegram/filesystem adapters"
              ),
              r"presentation/\s+\d+ Telegram presentation modules": (
                  f"presentation/                {layers['presentation']} "
                  "Telegram presentation modules"
              ),
              r"services/\s+\d+ integration/application service modules": (
                  f"services/                    {layers['service']} "
                  "integration/application service modules"
              ),
              r"workers/\s+\d+ worker boundary modules": (
                  f"workers/                     {layers['worker']} "
                  "worker boundary modules"
              ),
          }
          for pattern, replacement in audit_replacements.items():
              audit, count = re.subn(pattern, replacement, audit, count=1)
              if count != 1:
                  raise SystemExit(f"audit replacement failed: {pattern}")
          audit_path.write_text(audit, encoding="utf-8")
          PY

          mkdir -p /tmp/velvet-inventories
          cp -- \
            docs/package_architecture_inventory.json \
            docs/package_architecture_inventory.md \
            docs/repository_layout_inventory.json \
            docs/repository_layout_inventory.md \
            docs/p2_stability_inventory.json \
            docs/p2_stability_inventory.md \
            docs/development_status.md \
            docs/ARCHITECTURE_AUDIT.md \
            /tmp/velvet-inventories/

      - name: Commit merge-state inventories to PR branch
        run: |
          git fetch origin agent/storage-librarian
          git checkout -B agent/storage-librarian origin/agent/storage-librarian
          cp -- /tmp/velvet-inventories/* docs/
          if git diff --quiet -- \
            docs/package_architecture_inventory.json \
            docs/package_architecture_inventory.md \
            docs/repository_layout_inventory.json \
            docs/repository_layout_inventory.md \
            docs/p2_stability_inventory.json \
            docs/p2_stability_inventory.md \
            docs/development_status.md \
            docs/ARCHITECTURE_AUDIT.md
          then
            echo "Merge-state inventories already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            docs/package_architecture_inventory.json \
            docs/package_architecture_inventory.md \
            docs/repository_layout_inventory.json \
            docs/repository_layout_inventory.md \
            docs/p2_stability_inventory.json \
            docs/p2_stability_inventory.md \
            docs/development_status.md \
            docs/ARCHITECTURE_AUDIT.md
          git commit -m "Синхронизировать merge-state inventory Storage Librarian"
          git push origin HEAD:agent/storage-librarian
