name: temporary sync Librarian reports inventory

on:
  push:
    branches:
      - agent/storage-librarian-reports
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  sync:
    if: github.event.head_commit.message != 'Синхронизировать inventory отчётов Librarian'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/storage-librarian-reports
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Generate package architecture inventory
        run: |
          python scripts/inventory_package_architecture.py \
            --write \
            --label p1-package-architecture-baseline

      - name: Synchronize canonical inventory contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          inventory = json.loads(
              Path('docs/package_architecture_inventory.json').read_text(encoding='utf-8')
          )
          exemptions = json.loads(
              Path('docs/package_architecture_exemptions.json').read_text(encoding='utf-8')
          )
          shared = inventory['shared_contract_summary']

          path = Path('tests/test_package_architecture_inventory.py')
          text = path.read_text(encoding='utf-8')

          replacements = {
              r'self\.assertEqual\([\d_]+, self\.inventory\["production_module_count"\]\)':
                  f'self.assertEqual({int(inventory["production_module_count"]):_}, self.inventory["production_module_count"])',
              r'self\.assertEqual\([\d_]+, self\.inventory\["production_loc"\]\)':
                  f'self.assertEqual({int(inventory["production_loc"]):_}, self.inventory["production_loc"])',
              r'self\.assertEqual\([\d_]+, self\.inventory\["root_module_count"\]\)':
                  f'self.assertEqual({int(inventory["root_module_count"]):_}, self.inventory["root_module_count"])',
              r'self\.assertEqual\([\d_]+, self\.inventory\["root_unclassified_count"\]\)':
                  f'self.assertEqual({int(inventory["root_unclassified_count"]):_}, self.inventory["root_unclassified_count"])',
              r'self\.assertEqual\([\d_]+, self\.inventory\["router_count"\]\)':
                  f'self.assertEqual({int(inventory["router_count"]):_}, self.inventory["router_count"])',
              r'self\.assertEqual\([\d_]+, self\.inventory\["router_duplicate_count"\]\)':
                  f'self.assertEqual({int(inventory["router_duplicate_count"]):_}, self.inventory["router_duplicate_count"])',
              r'self\.assertEqual\([\d_]+, self\.inventory\["repository_module_count"\]\)':
                  f'self.assertEqual({int(inventory["repository_module_count"]):_}, self.inventory["repository_module_count"])',
              r'self\.assertEqual\([\d_]+, len\(self\.inventory\["installer_graph"\]\)\)':
                  f'self.assertEqual({len(inventory["installer_graph"]):_}, len(self.inventory["installer_graph"]))',
              r'self\.assertEqual\([\d_]+, self\.inventory\["violation_count"\]\)':
                  f'self.assertEqual({int(inventory["violation_count"]):_}, self.inventory["violation_count"])',
              r'self\.assertEqual\([\d_]+, shared\["production_python_files"\]\)':
                  f'self.assertEqual({int(shared["production_python_files"]):_}, shared["production_python_files"])',
              r'self\.assertEqual\([\d_]+, shared\["function_count"\]\)':
                  f'self.assertEqual({int(shared["function_count"]):_}, shared["function_count"])',
              r'self\.assertEqual\([\d_]+, shared\["private_contract_access_count"\]\)':
                  f'self.assertEqual({int(shared["private_contract_access_count"]):_}, shared["private_contract_access_count"])',
              r'self\.assertEqual\([\d_]+, shared\["blocking_private_contract_access_count"\]\)':
                  f'self.assertEqual({int(shared["blocking_private_contract_access_count"]):_}, shared["blocking_private_contract_access_count"])',
              r'self\.assertEqual\([\d_]+, shared\["exact_duplicate_group_count"\]\)':
                  f'self.assertEqual({int(shared["exact_duplicate_group_count"]):_}, shared["exact_duplicate_group_count"])',
              r'self\.assertEqual\([\d_]+, shared\["normalized_duplicate_group_count"\]\)':
                  f'self.assertEqual({int(shared["normalized_duplicate_group_count"]):_}, shared["normalized_duplicate_group_count"])',
              r'self\.assertEqual\([\d_]+, shared\["semantic_near_duplicate_group_count"\]\)':
                  f'self.assertEqual({int(shared["semantic_near_duplicate_group_count"]):_}, shared["semantic_near_duplicate_group_count"])',
              r'Production modules: \*\*[\d_]+\*\*':
                  f'Production modules: **{int(inventory["production_module_count"])}**',
              r'Production LOC: \*\*[\d_]+\*\*':
                  f'Production LOC: **{int(inventory["production_loc"])}**',
              r'Startup installer stages: \*\*[\d_]+\*\*':
                  f'Startup installer stages: **{len(inventory["installer_graph"])}**',
              r'Registered package violations: \*\*[\d_]+\*\*':
                  f'Registered package violations: **{int(inventory["violation_count"])}**',
              r'Registered exemptions: \*\*[\d_]+\*\*':
                  f'Registered exemptions: **{len(exemptions["exceptions"])}**',
          }

          for pattern, replacement in replacements.items():
              text, count = re.subn(pattern, replacement, text, count=1)
              if count != 1:
                  raise SystemExit(f'Could not update inventory contract: {pattern}')
          path.write_text(text, encoding='utf-8')

          loc_spaced = f'{int(inventory["production_loc"]):,}'.replace(',', ' ')
          for filename in ('docs/development_status.md', 'docs/ARCHITECTURE_AUDIT.md'):
              doc = Path(filename)
              content = doc.read_text(encoding='utf-8')
              content, count = re.subn(
                  r'(production LOC:\s*\*\*)[\d ]+(\*\*)',
                  rf'\g<1>{loc_spaced}\g<2>',
                  content,
              )
              if count < 1:
                  raise SystemExit(f'Could not update LOC in {filename}')
              doc.write_text(content, encoding='utf-8')
          PY

      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/tmp-sync-librarian-reports-inventory.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            docs/package_architecture_inventory.json \
            docs/package_architecture_inventory.md \
            docs/package_architecture_exemptions.json \
            docs/development_status.md \
            docs/ARCHITECTURE_AUDIT.md \
            tests/test_package_architecture_inventory.py \
            .github/workflows/tmp-sync-librarian-reports-inventory.yml
          git commit -m 'Синхронизировать inventory отчётов Librarian'
          git push origin HEAD:agent/storage-librarian-reports
