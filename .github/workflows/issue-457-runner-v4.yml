name: Run issue 457 maintenance v4

on:
  push:
    branches:
      - feat/457-retire-legacy-delivery-installers

permissions:
  contents: write

jobs:
  execute-maintenance:
    if: contains(github.event.head_commit.message, 'trigger issue 457 runner v4')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Execute maintenance and canonicalize contracts
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          import re
          import subprocess
          from pathlib import Path

          source_workflow = Path('.github/workflows/issue-457-branch-maintenance.yml')
          content = source_workflow.read_text(encoding='utf-8')
          strict_guard = """              if count != 1:\n                  raise SystemExit(f'{path}: expected one replacement, found {count}: {old[:80]!r}')\n"""
          relaxed_guard = """              if count < 1:\n                  raise SystemExit(f'{path}: expected a replacement, found {count}: {old[:80]!r}')\n"""
          if content.count(strict_guard) != 1:
              raise SystemExit('maintenance replacement guard not found exactly once')
          content = content.replace(strict_guard, relaxed_guard, 1)

          def extract_step(name: str) -> str:
              marker = f'      - name: {name}\n'
              start = content.find(marker)
              if start < 0:
                  raise SystemExit(f'missing maintenance step: {name}')
              run_marker = '        run: |\n'
              run_start = content.find(run_marker, start)
              if run_start < 0:
                  raise SystemExit(f'missing run block: {name}')
              body_start = run_start + len(run_marker)
              next_step = content.find('\n      - name: ', body_start)
              body_end = len(content) if next_step < 0 else next_step + 1
              raw = content[body_start:body_end]
              return '\n'.join(
                  line[10:] if line.startswith('          ') else line
                  for line in raw.splitlines()
              ).rstrip() + '\n'

          def run_step(index: int, name: str) -> None:
              script = Path(f'/tmp/issue457-v4-step-{index}.sh')
              script.write_text('set -euo pipefail\n' + extract_step(name), encoding='utf-8')
              print(f'Executing: {name}', flush=True)
              subprocess.run(['bash', str(script)], check=True)

          run_step(1, 'Retire legacy delivery ownership layers')

          friendly = Path('velvet_bot/domains/media_generation/friendly_worker.py')
          source = friendly.read_text(encoding='utf-8')
          if source.count('_INSTALLED = False\n') != 1:
              raise SystemExit('friendly worker sentinel not found exactly once')
          source = source.replace('_INSTALLED = False\n', '', 1)
          old_install = '''def install_friendly_media_worker() -> None:\n    """Install the provider-aware worker in the application composition root."""\n\n    global _INSTALLED\n    if _INSTALLED:\n        return\n    from velvet_bot.app.media_delivery_ui_install import install_media_delivery_ui\n\n    install_media_delivery_ui()\n    _INSTALLED = True\n'''
          new_install = '''def install_friendly_media_worker() -> None:\n    """Install the provider-aware worker in the application composition root."""\n\n    from velvet_bot.app.media_delivery_ui_install import install_media_delivery_ui\n\n    install_media_delivery_ui()\n'''
          if source.count(old_install) != 1:
              raise SystemExit('friendly worker installer block not found exactly once')
          friendly.write_text(source.replace(old_install, new_install, 1), encoding='utf-8')

          from scripts import inventory_package_architecture as inventory

          preview = inventory.build_inventory(label='p1-package-architecture-baseline')
          target_path = 'velvet_bot/domains/media_generation/friendly_worker.py'
          target = [
              row for row in preview['violations']
              if row['category'] == 'typing-any-usage' and row['path'] == target_path
          ]
          if len(target) != 1:
              raise SystemExit(f'expected one friendly-worker Any violation, found {len(target)}')

          exemptions_path = Path('docs/package_architecture_exemptions.json')
          exemptions = json.loads(exemptions_path.read_text(encoding='utf-8'))
          prefix = f'typing-any-usage:{target_path}:'
          old_rows = [
              row for row in exemptions['exceptions'] if str(row.get('id', '')).startswith(prefix)
          ]
          if len(old_rows) != 1:
              raise SystemExit(f'expected one previous friendly-worker Any exemption, found {len(old_rows)}')
          old_row = old_rows[0]
          new_row = dict(old_row)
          new_row['id'] = target[0]['id']
          exemptions['exceptions'] = [
              new_row if row is old_row else row for row in exemptions['exceptions']
          ]
          exemptions_path.write_text(
              json.dumps(exemptions, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )

          run_step(2, 'Regenerate architecture and stability inventories')
          subprocess.run(
              [
                  'python', 'scripts/inventory_package_architecture.py',
                  '--label', 'p1-package-architecture-baseline', '--write',
              ],
              check=True,
          )
          subprocess.run(
              [
                  'python', 'scripts/inventory_package_architecture.py',
                  '--label', 'p1-package-architecture-baseline', '--check',
              ],
              check=True,
          )

          inventory_path = Path('docs/package_architecture_inventory.json')
          data = json.loads(inventory_path.read_text(encoding='utf-8'))
          shared = data['shared_contract_summary']
          graph_count = len(data['installer_graph'])

          test_path = Path('tests/test_package_architecture_inventory.py')
          test_source = test_path.read_text(encoding='utf-8')

          replacements = {
              'self.assertEqual(659, self.inventory["production_module_count"])':
                  f'self.assertEqual({data["production_module_count"]}, self.inventory["production_module_count"])',
              'self.assertEqual(145345, self.inventory["production_loc"])':
                  f'self.assertEqual({data["production_loc"]}, self.inventory["production_loc"])',
              'self.assertEqual(113, self.inventory["root_module_count"])':
                  f'self.assertEqual({data["root_module_count"]}, self.inventory["root_module_count"])',
              'self.assertEqual(84, self.inventory["router_count"])':
                  f'self.assertEqual({data["router_count"]}, self.inventory["router_count"])',
              'self.assertEqual(46, self.inventory["repository_module_count"])':
                  f'self.assertEqual({data["repository_module_count"]}, self.inventory["repository_module_count"])',
              'self.assertEqual(25, len(self.inventory["installer_graph"]))':
                  f'self.assertEqual({graph_count}, len(self.inventory["installer_graph"]))',
              'self.assertEqual(537, self.inventory["violation_count"])':
                  f'self.assertEqual({data["violation_count"]}, self.inventory["violation_count"])',
              'self.assertEqual(659, shared["production_python_files"])':
                  f'self.assertEqual({shared["production_python_files"]}, shared["production_python_files"])',
              'self.assertEqual(3860, shared["function_count"])':
                  f'self.assertEqual({shared["function_count"]}, shared["function_count"])',
              'self.assertEqual(184, shared["private_contract_access_count"])':
                  f'self.assertEqual({shared["private_contract_access_count"]}, shared["private_contract_access_count"])',
              'self.assertEqual(68, shared["exact_duplicate_group_count"])':
                  f'self.assertEqual({shared["exact_duplicate_group_count"]}, shared["exact_duplicate_group_count"])',
              'self.assertEqual(98, shared["normalized_duplicate_group_count"])':
                  f'self.assertEqual({shared["normalized_duplicate_group_count"]}, shared["normalized_duplicate_group_count"])',
              'self.assertEqual(list(range(1, 26)), [item["order"] for item in graph])':
                  f'self.assertEqual(list(range(1, {graph_count + 1})), [item["order"] for item in graph])',
              'self.assertIn("Production modules: **659**", self.markdown)':
                  f'self.assertIn("Production modules: **{data["production_module_count"]}**", self.markdown)',
              'self.assertIn("Production LOC: **145345**", self.markdown)':
                  f'self.assertIn("Production LOC: **{data["production_loc"]}**", self.markdown)',
              'self.assertIn("Startup installer stages: **25**", self.markdown)':
                  f'self.assertIn("Startup installer stages: **{graph_count}**", self.markdown)',
              'self.assertIn("Registered package violations: **537**", self.markdown)':
                  f'self.assertIn("Registered package violations: **{data["violation_count"]}**", self.markdown)',
              'self.assertIn("Registered exemptions: **537**", self.markdown)':
                  f'self.assertIn("Registered exemptions: **{data["violation_count"]}**", self.markdown)',
          }
          for old, new in replacements.items():
              if test_source.count(old) != 1:
                  raise SystemExit(f'architecture test contract not found exactly once: {old}')
              test_source = test_source.replace(old, new, 1)
          test_path.write_text(test_source, encoding='utf-8')

          run_step(3, 'Update canonical status notes')
          run_step(4, 'Validate focused contracts')
          PY

      - name: Commit product and generated changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A velvet_bot tests docs
          git diff --cached --check
          git commit -m "refactor: retire legacy media delivery installers (#457)"
          git push origin HEAD:feat/457-retire-legacy-delivery-installers
