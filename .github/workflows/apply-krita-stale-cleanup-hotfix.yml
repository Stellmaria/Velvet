name: Apply Krita stale cleanup hotfix

on:
  push:
    branches:
      - hotfix/krita-stale-cleanup-warning

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v4
        with:
          ref: hotfix/krita-stale-cleanup-warning
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.16"
          enable-cache: true
          cache-dependency-glob: requirements.txt

      - name: Install dependencies
        run: uv pip install --system -r requirements.txt

      - name: Apply hotfix and refresh generated inventory
        run: PYTHONPATH=. python scripts/apply_krita_stale_cleanup_hotfix.py

      - name: Run focused regression tests
        run: |
          python -m unittest -v \
            tests.test_telegram_storage_krita_cleanup \
            tests.test_telegram_storage_deletion_policy \
            tests.test_telegram_storage_deletion_preflight \
            tests.test_package_architecture_inventory

      - name: Commit finalized hotfix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Исправить повторное предупреждение очистки Krita bridge"
          git push origin HEAD:hotfix/krita-stale-cleanup-warning
