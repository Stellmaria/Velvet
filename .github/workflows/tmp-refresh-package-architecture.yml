name: temporary package architecture refresh

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact change head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Generate canonical package architecture inventory
        run: python scripts/inventory_package_architecture_fast.py --write

      - name: Commit generated inventory to the PR branch
        env:
          HEAD_REF: ${{ github.head_ref }}
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/package_architecture_inventory.json docs/package_architecture_inventory.md; then
            echo "inventory already current"
            exit 0
          fi
          test -n "$HEAD_REF"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/package_architecture_inventory.json docs/package_architecture_inventory.md
          git commit -m "Refresh package architecture inventory after main sync"
          git push origin HEAD:"$HEAD_REF"
