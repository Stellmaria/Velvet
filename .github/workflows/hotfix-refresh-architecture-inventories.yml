name: hotfix refresh architecture inventories

on:
  push:
    branches:
      - fix/telegram-storage-backup-permission-isolation

permissions:
  contents: write

concurrency:
  group: hotfix-refresh-architecture-inventories
  cancel-in-progress: false

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/telegram-storage-backup-permission-isolation
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Refresh generated inventories and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          python scripts/inventory_repository_layout.py \
            --write \
            --label p3e-repository-layout-complete
          python scripts/inventory_package_architecture.py \
            --write \
            --label p1-package-architecture-baseline
          rm .github/workflows/hotfix-refresh-architecture-inventories.yml
          git diff --check

      - name: Commit exact generated result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            docs/repository_layout_inventory.json \
            docs/repository_layout_inventory.md \
            docs/package_architecture_inventory.json \
            docs/package_architecture_inventory.md \
            .github/workflows/hotfix-refresh-architecture-inventories.yml
          git diff --cached --check
          git commit -m "chore: refresh architecture inventories"
          git push origin HEAD:refs/heads/fix/telegram-storage-backup-permission-isolation
