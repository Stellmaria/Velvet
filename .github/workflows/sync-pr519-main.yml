name: sync PR 519 with main

on:
  push:
    branches:
      - feat/505-vision-runtime-gateway
    paths:
      - .github/workflows/sync-pr519-main.yml

permissions:
  contents: write

concurrency:
  group: sync-pr519-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/505-vision-runtime-gateway
          fetch-depth: 0

      - name: Merge current main and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main \
            +refs/heads/feat/505-vision-runtime-gateway:refs/remotes/origin/feat/505-vision-runtime-gateway
          git merge --no-ff origin/main -m "Синхронизировать PR #519 с актуальным main"
          git rm .github/workflows/sync-pr519-main.yml
          git commit -m "Удалить временный workflow синхронизации PR #519"
          git push origin HEAD:feat/505-vision-runtime-gateway
