name: temporary canonicalize auf portal

on:
  push:
    branches:
      - agent/final-auf-router-layer

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/final-auf-router-layer
          fetch-depth: 0

      - name: Replace retired Meow router imports
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("velvet_bot/app/auf_user_portal_install.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              "from velvet_bot.presentation.telegram.routers import workspace_meow_video_simple as video_router",
              "from velvet_bot.presentation.telegram.routers import workspace_auf_video_simple as video_router",
          )
          text = text.replace(
              "from velvet_bot.presentation.telegram.routers.workspace_meow import MeowCallback",
              "from velvet_bot.presentation.telegram.routers.workspace_auf import AufCallback",
          )
          text = text.replace("MeowCallback", "AufCallback")
          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit replacement
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add velvet_bot/app/auf_user_portal_install.py
          git commit -m "Перевести пользовательский портал на canonical Ауф роутеры"
          git push origin HEAD:agent/final-auf-router-layer
