name: hotfix legacy backup permissions

on:
  push:
    branches:
      - fix/legacy-backup-permissions

permissions:
  contents: write

concurrency:
  group: hotfix-legacy-backup-permissions
  cancel-in-progress: false

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/legacy-backup-permissions
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Apply reviewed permission repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          deploy_path = Path("deploy/server/deploy.sh")
          deploy = deploy_path.read_text(encoding="utf-8")
          function_needle = '''compose=(docker compose --env-file "$ENV_FILE" -f "$COMPOSE_FILE")

          if [[ -n "$(git status --porcelain --untracked-files=no)" ]]; then
          '''
          function_replacement = r'''compose=(docker compose --env-file "$ENV_FILE" -f "$COMPOSE_FILE")

          normalize_backup_permissions() {
            local backup_root="$1"
            local candidate
            local normalized=0

            while IFS= read -r -d '' candidate; do
              if ! chmod 0644 -- "$candidate"; then
                echo "Unable to make backup readable by the bot container: $candidate" >&2
                return 1
              fi
              normalized=$((normalized + 1))
            done < <(
              find "$backup_root" -maxdepth 1 -type f \
                \( -name '*.dump' -o -name '*.dump.json' \) \
                -print0
            )

            if (( normalized > 0 )); then
              echo "Normalized bot-readable permissions for $normalized backup artifact(s)."
            fi
          }

          if [[ -n "$(git status --porcelain --untracked-files=no)" ]]; then
          '''
          if deploy.count(function_needle) != 1:
              raise SystemExit("deploy function insertion point changed")
          deploy = deploy.replace(function_needle, function_replacement, 1)

          call_needle = '''chmod 0755 "$data_dir/runtime/supervisor"
          chmod 0700 "$docker_config"
          if [[ "$krita_server_enabled" == "1" ]]; then
          '''
          call_replacement = '''chmod 0755 "$data_dir/runtime/supervisor"
          chmod 0700 "$docker_config"
          normalize_backup_permissions "$data_dir/backups"
          if [[ "$krita_server_enabled" == "1" ]]; then
          '''
          if deploy.count(call_needle) != 1:
              raise SystemExit("deploy permission repair call insertion point changed")
          deploy = deploy.replace(call_needle, call_replacement, 1)
          deploy_path.write_text(deploy, encoding="utf-8")

          test_path = Path("tests/test_server_deployment_contract.py")
          test_source = test_path.read_text(encoding="utf-8")
          method_start = test_source.index(
              "    def test_predeploy_dump_is_readable_by_bot_container(self) -> None:\n"
          )
          method_end = test_source.index(
              "\n    def test_dump_verifier_uses_disposable_database_and_forced_cleanup",
              method_start,
          )
          indent = " " * 4
          body = " " * 8
          continuation = " " * 12
          test_replacement = "\n".join(
              (
                  f"{indent}def test_predeploy_dump_is_readable_by_bot_container(self) -> None:",
                  f'{body}source = Path("deploy/server/deploy.sh").read_text(encoding="utf-8")',
                  f'{body}self.assertIn(\'chmod 0644 "$backup_path"\', source)',
                  f'{body}self.assertNotIn(\'chmod 600 "$backup_path"\', source)',
                  f'{body}self.assertIn("normalize_backup_permissions()", source)',
                  f'{body}self.assertIn(\'find "$backup_root" -maxdepth 1 -type f\', source)',
                  f'{body}self.assertIn("-name \'*.dump\'", source)',
                  f'{body}self.assertIn("-name \'*.dump.json\'", source)',
                  f'{body}self.assertIn(\'chmod 0644 -- "$candidate"\', source)',
                  f'{body}self.assertIn("-print0", source)',
                  f"{body}self.assertLess(",
                  f'{continuation}source.index(\'normalize_backup_permissions "$data_dir/backups"\'),',
                  f'{continuation}source.index(\'if [[ "$target_sha" == "$previous_sha"\'),',
                  f"{body})",
                  "",
              )
          )
          test_source = (
              test_source[:method_start]
              + test_replacement
              + test_source[method_end:]
          )
          test_path.write_text(test_source, encoding="utf-8")
          PY

          bash -n deploy/server/deploy.sh
          python -m unittest tests.test_server_deployment_contract -v
          rm .github/workflows/hotfix-legacy-backup-permissions.yml
          git diff --check

      - name: Commit exact reviewed result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            deploy/server/deploy.sh \
            tests/test_server_deployment_contract.py \
            .github/workflows/hotfix-legacy-backup-permissions.yml
          git diff --cached --check
          git commit -m "fix: repair legacy backup permissions before deploy"
          git push origin HEAD:refs/heads/fix/legacy-backup-permissions
