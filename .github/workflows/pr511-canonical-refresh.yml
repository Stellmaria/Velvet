name: pr511 canonical refresh

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/harden-media-delivery-exceptions
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Refresh canonical documentation
        run: python scripts/pr511_canonical_refresh.py
      - name: Remove temporary automation and publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/pr511-canonical-refresh.yml
          rm scripts/pr511_canonical_refresh.py
          git add -A
          git commit -m "Синхронизировать canonical docs и navigation inventory"
          git push origin HEAD:agent/harden-media-delivery-exceptions
