name: temp local qwen package inventory final

on:
  push:
    branches:
      - agent/storage-librarian-local-qwen

permissions:
  contents: write

jobs:
  inventory:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/storage-librarian-local-qwen
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Generate and verify package inventory
        run: |
          python scripts/inventory_package_architecture.py \
            --label p1-package-architecture-baseline \
            --write
          python scripts/inventory_package_architecture.py \
            --label p1-package-architecture-baseline \
            --check
      - name: Commit generated inventory and remove this workflow
        run: |
          git rm .github/workflows/temp-local-qwen-package-inventory-final.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            docs/package_architecture_inventory.json \
            docs/package_architecture_inventory.md
          git commit -m 'Синхронизировать package architecture baseline'
          git push origin HEAD:agent/storage-librarian-local-qwen
