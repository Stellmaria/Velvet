name: shared contract inventory

on:
  pull_request:
    paths:
      - 'velvet_bot/app/**'
      - 'velvet_bot/application/**'
      - 'velvet_bot/domains/media_generation/**'
      - 'velvet_bot/presentation/telegram/**'
      - 'scripts/shared_contract_inventory.py'
      - 'scripts/inventory_telegram_helpers.py'
      - 'tests/test_telegram_shared_helpers.py'
      - '.github/workflows/apply-shared-helper-migration.yml'

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate package shared contracts
        run: python scripts/inventory_telegram_helpers.py --check
