name: shared contract inventory

on:
  pull_request:
    paths:
      - 'velvet_bot/app/**'
      - 'velvet_bot/application/**'
      - 'velvet_bot/domains/media_generation/**'
      - 'velvet_bot/presentation/telegram/**'
      - 'scripts/shared_contract_inventory.py'
      - 'scripts/inventory_telegram_helpers.py'
      - 'tests/test_telegram_shared_helpers.py'
      - '.github/workflows/apply-shared-helper-migration.yml'

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/shared-telegram-helpers
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Refresh versioned inventory
        run: |
          python scripts/inventory_telegram_helpers.py \
            --write-json docs/shared_contract_inventory.json \
            --write-markdown docs/shared_contract_inventory.md
          python scripts/inventory_telegram_helpers.py --check
      - name: Commit refreshed inventory
        run: |
          if git diff --quiet; then
            echo "Versioned inventory is current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/shared_contract_inventory.json docs/shared_contract_inventory.md
          git commit -m "P3: refresh package shared contract inventory"
          git push origin HEAD:agent/shared-telegram-helpers

  inventory:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate package shared contracts
        run: python scripts/inventory_telegram_helpers.py --check
