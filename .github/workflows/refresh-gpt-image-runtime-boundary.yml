name: refresh GPT Image runtime boundary inventory

on:
  push:
    branches:
      - feat/gpt-image-2-codex

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message, '[runtime-boundary-refreshed]') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/gpt-image-2-codex
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"

      - name: Refresh exact package baseline
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path
          from scripts import inventory_package_architecture as inventory

          label = "p1-package-architecture-baseline"
          data = inventory.build_inventory(label=label)
          exemptions_path = Path("docs/package_architecture_exemptions.json")
          previous = json.loads(exemptions_path.read_text(encoding="utf-8"))
          observed = {str(row["id"]): row for row in data["violations"]}
          previous_rows = {
              str(row["id"]): row
              for row in previous.get("exceptions", [])
              if str(row.get("id", "")) in observed
          }
          consumers = inventory._reverse_consumers(list(data["modules"]))
          rows = [
              previous_rows.get(row_id)
              or inventory._suggest_exception(violation, consumers)
              for row_id, violation in sorted(observed.items())
          ]
          exemptions = {
              **previous,
              "generated_from": label,
              "shared_private_access_sha256": data["shared_contract_summary"]["private_access_sha256"],
              "root_module_sha256": data["root_module_sha256"],
              "exceptions": rows,
          }
          Path("docs/package_architecture_inventory.json").write_text(
              json.dumps(data, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          exemptions_path.write_text(
              json.dumps(exemptions, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          Path("docs/package_architecture_inventory.md").write_text(
              inventory.render_markdown(data, exemptions),
              encoding="utf-8",
          )
          errors = inventory.validate(data, exemptions)
          if errors:
              raise SystemExit("\n".join(errors))

          test_path = Path("tests/test_package_architecture_inventory.py")
          text = test_path.read_text(encoding="utf-8")
          shared = data["shared_contract_summary"]
          scalar_values = {
              "production_module_count": data["production_module_count"],
              "production_loc": data["production_loc"],
              "root_module_count": data["root_module_count"],
              "router_count": data["router_count"],
              "repository_module_count": data["repository_module_count"],
              "violation_count": data["violation_count"],
          }
          for key, value in scalar_values.items():
              pattern = rf'self\.assertEqual\(\d+, self\.inventory\["{key}"\]\)'
              replacement = f'self.assertEqual({value}, self.inventory["{key}"])'
              text, count = re.subn(pattern, replacement, text, count=1)
              if count != 1:
                  raise SystemExit(f"missing package assertion {key}")
          text, count = re.subn(
              r'self\.assertEqual\(\d+, len\(self\.inventory\["installer_graph"\]\)\)',
              f'self.assertEqual({len(data["installer_graph"])}, len(self.inventory["installer_graph"]))',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit("missing installer graph assertion")
          for key in (
              "production_python_files",
              "function_count",
              "private_contract_access_count",
              "exact_duplicate_group_count",
              "normalized_duplicate_group_count",
              "semantic_near_duplicate_group_count",
          ):
              pattern = rf'self\.assertEqual\(\d+, shared\["{key}"\]\)'
              replacement = f'self.assertEqual({shared[key]}, shared["{key}"])'
              text, count = re.subn(pattern, replacement, text, count=1)
              if count != 1:
                  raise SystemExit(f"missing shared assertion {key}")
          text, count = re.subn(
              r'self\.assertEqual\(list\(range\(1, \d+\)\), \[item\["order"\] for item in graph\]\)',
              f'self.assertEqual(list(range(1, {len(data["installer_graph"]) + 1})), [item["order"] for item in graph])',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit("missing installer order assertion")
          markdown_values = {
              "Production modules": data["production_module_count"],
              "Production LOC": data["production_loc"],
              "Startup installer stages": len(data["installer_graph"]),
              "Registered package violations": data["violation_count"],
              "Registered exemptions": len(rows),
          }
          for label_text, value in markdown_values.items():
              pattern = rf'self\.assertIn\("{re.escape(label_text)}: \*\*\d+\*\*", self\.markdown\)'
              replacement = f'self.assertIn("{label_text}: **{value}**", self.markdown)'
              text, count = re.subn(pattern, replacement, text, count=1)
              if count != 1:
                  raise SystemExit(f"missing markdown assertion {label_text}")
          test_path.write_text(text, encoding="utf-8")
          PY

      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/refresh-gpt-image-runtime-boundary.yml
          git config user.name "Velvet Architecture Bot"
          git config user.email "velvet-architecture@users.noreply.github.com"
          git add docs/package_architecture_inventory.json \
                  docs/package_architecture_inventory.md \
                  docs/package_architecture_exemptions.json \
                  tests/test_package_architecture_inventory.py \
                  .github/workflows/refresh-gpt-image-runtime-boundary.yml
          git commit -m "chore: refresh runtime boundary inventory [runtime-boundary-refreshed]"
          git push origin HEAD:feat/gpt-image-2-codex
