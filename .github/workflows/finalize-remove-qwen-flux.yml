name: Finalize remove Qwen and FLUX hotfix

on:
  push:
    branches:
      - hotfix/remove-qwen-flux-generation-root-buttons
  pull_request:
    branches:
      - main

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"

jobs:
  finalize:
    if: github.event_name == 'push' || github.head_ref == 'hotfix/remove-qwen-flux-generation-root-buttons'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v4
        with:
          ref: hotfix/remove-qwen-flux-generation-root-buttons
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.16"
          enable-cache: true
          cache-dependency-glob: requirements.txt

      - name: Install dependencies
        run: uv pip install --system -r requirements.txt

      - name: Apply and validate hotfix
        run: PYTHONPATH=. python scripts/finalize_remove_qwen_flux_hotfix.py

      - name: Run focused regression tests
        run: |
          python -m unittest -v \
            tests.test_auf_generation_surface_policy \
            tests.test_auf_photo_model_modes

      - name: Commit finalized hotfix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Убрать Qwen и FLUX из активной генерации Ауф"
          git push origin HEAD:hotfix/remove-qwen-flux-generation-root-buttons
