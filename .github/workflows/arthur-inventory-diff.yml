name: arthur repository inventory fix

on:
  pull_request:
    paths:
      - ".github/workflows/arthur-inventory-diff.yml"

permissions:
  contents: write

jobs:
  regenerate:
    if: >-
      github.repository == 'Stellmaria/Velvet' &&
      github.event.pull_request.head.ref == 'fix/arthur-librarian-phase1' &&
      github.event.pull_request.user.login == 'Stellmaria'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout owned PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/arthur-librarian-phase1
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
          check-latest: false

      - name: Generate canonical repository layout inventory
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from scripts.inventory_repository_layout import build_inventory, render_markdown
          import json

          root = Path('.')
          inventory = build_inventory(label='p3e-repository-layout-complete')
          (root / 'docs/repository_layout_inventory.json').write_text(
              json.dumps(inventory, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          (root / 'docs/repository_layout_inventory.md').write_text(
              render_markdown(inventory),
              encoding='utf-8',
          )
          PY

      - name: Commit inventory and remove temporary workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/repository_layout_inventory.json \
            docs/repository_layout_inventory.md
          git rm .github/workflows/arthur-inventory-diff.yml
          git commit -m "docs: refresh Arthur repository layout inventory"
          git push origin HEAD:fix/arthur-librarian-phase1
