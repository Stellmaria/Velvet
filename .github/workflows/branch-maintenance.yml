name: branch maintenance

on:
  push:
    branches:
      - agent/workspace-owner-media-instant-retry-photo-routing

permissions:
  contents: write

concurrency:
  group: pr492-inventory-refresh
  cancel-in-progress: false

jobs:
  refresh-pr492:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/workspace-owner-media-instant-retry-photo-routing
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.16"
          enable-cache: true
          cache-dependency-glob: requirements.txt

      - name: Install dependencies
        run: uv pip install --system -r requirements.txt

      - name: Merge current main and restore workflow set
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags origin main
          git merge --no-ff --no-commit origin/main
          git checkout origin/main -- .github/workflows/branch-maintenance.yml
          rm -f .github/workflows/pr492-refresh.yml

      - name: Refresh generated inventories
        shell: bash
        run: |
          set -euo pipefail
          python scripts/update_p2_stability_inventory.py \
            --label p3-package-shared-contracts \
            --schema-version 74
          python scripts/inventory_repository_layout.py \
            --write \
            --label p3e-repository-layout-complete
          python scripts/telegram_navigation_inventory.py \
            --root velvet_bot \
            --markdown docs/generated/telegram_navigation_inventory.md
          python scripts/inventory_package_architecture.py \
            --write \
            --bootstrap-exemptions \
            --label p1-package-architecture-baseline

      - name: Refresh package architecture expectations
        shell: bash
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          inventory = json.loads(
              Path("docs/package_architecture_inventory.json").read_text(encoding="utf-8")
          )
          path = Path("tests/test_package_architecture_inventory.py")
          text = path.read_text(encoding="utf-8")
          module_count = int(inventory["production_module_count"])
          production_loc = int(inventory["production_loc"])
          violation_count = int(inventory["violation_count"])

          replacements = (
              (
                  r'self\.assertEqual\(\d+, self\.inventory\["production_module_count"\]\)',
                  f'self.assertEqual({module_count}, self.inventory["production_module_count"])',
              ),
              (
                  r'self\.assertEqual\([\d_]+, self\.inventory\["production_loc"\]\)',
                  f'self.assertEqual({production_loc:_}, self.inventory["production_loc"])',
              ),
              (
                  r'self\.assertEqual\(\d+, self\.inventory\["violation_count"\]\)',
                  f'self.assertEqual({violation_count}, self.inventory["violation_count"])',
              ),
              (
                  r'Production modules: \*\*\d+\*\*',
                  f'Production modules: **{module_count}**',
              ),
              (
                  r'Production LOC: \*\*\d+\*\*',
                  f'Production LOC: **{production_loc}**',
              ),
              (
                  r'Registered package violations: \*\*\d+\*\*',
                  f'Registered package violations: **{violation_count}**',
              ),
              (
                  r'Registered exemptions: \*\*\d+\*\*',
                  f'Registered exemptions: **{violation_count}**',
              ),
          )
          for pattern, replacement in replacements:
              text, count = re.subn(pattern, replacement, text, count=1)
              if count != 1:
                  raise SystemExit(
                      f"expected exactly one replacement for {pattern!r}, got {count}"
                  )
          path.write_text(text, encoding="utf-8")
          PY

      - name: Verify preflight and targeted regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q main.py velvet_bot scripts tests
          python scripts/ci_preflight.py
          python -m unittest -v \
            tests.test_p2_stability_inventory \
            tests.test_p2l_discussion_middleware_boundary \
            tests.test_p3e_repository_layout_inventory \
            tests.test_telegram_navigation_inventory \
            tests.test_package_architecture_inventory \
            tests.test_workspace_owner_generation_hotfix

      - name: Commit and push refreshed PR
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No changes were generated"
            exit 1
          fi
          git commit -m "Merge main and refresh generated inventories for PR 492"
          git push origin HEAD:refs/heads/agent/workspace-owner-media-instant-retry-photo-routing
