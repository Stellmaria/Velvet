name: temporary pricing PR sync

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  sync:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/owner-cost-only-and-image-pricing'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Execute prepared synchronization blocks
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          path = Path('.github/workflows/temporary-pricing-owner-sync.yml')
          lines = path.read_text(encoding='utf-8').splitlines()
          blocks: list[str] = []
          index = 0
          while index < len(lines):
              if lines[index] == '        run: |':
                  index += 1
                  collected: list[str] = []
                  while index < len(lines):
                      line = lines[index]
                      if line and not line.startswith('          '):
                          break
                      collected.append(line[10:] if line.startswith('          ') else '')
                      index += 1
                  blocks.append('\n'.join(collected).rstrip() + '\n')
                  continue
              index += 1

          if len(blocks) != 5:
              raise SystemExit(f'expected 5 prepared run blocks, found {len(blocks)}')
          for number, block in enumerate(blocks[:-1], start=1):
              print(f'Executing prepared block {number}')
              subprocess.run(
                  ['bash', '-euo', 'pipefail', '-c', block],
                  check=True,
              )
          PY

      - name: Commit synchronized result
        shell: bash
        run: |
          rm -f \
            .github/workflows/temporary-pricing-owner-sync.yml \
            .github/workflows/temporary-pricing-pr-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            .github/workflows/temporary-pricing-owner-sync.yml \
            .github/workflows/temporary-pricing-pr-sync.yml \
            docs/generated/telegram_navigation_inventory.md \
            docs/package_architecture_exemptions.json \
            docs/package_architecture_inventory.json \
            docs/package_architecture_inventory.md \
            docs/shared_contract_inventory.json \
            docs/shared_contract_inventory.md \
            tests/test_auf_owner_cost_only_pricing.py \
            tests/test_package_architecture_inventory.py \
            velvet_bot/app/auf_charged_queue_install.py \
            velvet_bot/app/auf_generation_price_privacy_install.py \
            velvet_bot/app/auf_owner_pricing_ui_install.py
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No synchronized changes"
            exit 1
          fi
          git commit -m "Синхронизировать цены и приватность экономики"
          git push origin HEAD:fix/owner-cost-only-and-image-pricing
