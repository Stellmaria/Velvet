name: temporary pricing PR sync

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  sync:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/owner-cost-only-and-image-pricing'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Regenerate and verify canonical inventories
        shell: bash
        run: |
          python scripts/shared_contract_inventory.py \
            --write-json docs/shared_contract_inventory.json \
            --write-markdown docs/shared_contract_inventory.md
          python scripts/telegram_navigation_inventory.py \
            --root velvet_bot \
            --markdown docs/generated/telegram_navigation_inventory.md
          python scripts/inventory_package_architecture.py \
            --write \
            --bootstrap-exemptions \
            --label pricing-owner-cost-only

          python - <<'PY'
          import json
          import re
          from pathlib import Path

          data = json.loads(
              Path("docs/package_architecture_inventory.json").read_text(encoding="utf-8")
          )
          path = Path("tests/test_package_architecture_inventory.py")
          text = path.read_text(encoding="utf-8")
          text = re.sub(
              r'self\.assertEqual\([\d_]+, self\.inventory\["production_loc"\]\)',
              f'self.assertEqual({data["production_loc"]:_}, self.inventory["production_loc"])',
              text,
              count=1,
          )
          text = re.sub(
              r'self\.assertEqual\([\d_]+, self\.inventory\["violation_count"\]\)',
              f'self.assertEqual({data["violation_count"]}, self.inventory["violation_count"])',
              text,
              count=1,
          )
          text = re.sub(
              r'Production LOC: \*\*\d+\*\*',
              f'Production LOC: **{data["production_loc"]}**',
              text,
              count=1,
          )
          text = re.sub(
              r'Registered package violations: \*\*\d+\*\*',
              f'Registered package violations: **{data["violation_count"]}**',
              text,
              count=1,
          )
          text = re.sub(
              r'Registered exemptions: \*\*\d+\*\*',
              f'Registered exemptions: **{data["violation_count"]}**',
              text,
              count=1,
          )
          path.write_text(text, encoding="utf-8")
          PY

          python -m compileall -q velvet_bot tests
          python scripts/inventory_package_architecture.py \
            --check \
            --label pricing-owner-cost-only
          python scripts/telegram_navigation_inventory.py --root velvet_bot --check

      - name: Commit synchronized result
        shell: bash
        run: |
          rm -f \
            .github/workflows/temporary-pricing-owner-sync.yml \
            .github/workflows/temporary-pricing-pr-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            .github/workflows/temporary-pricing-owner-sync.yml \
            .github/workflows/temporary-pricing-pr-sync.yml \
            docs/generated/telegram_navigation_inventory.md \
            docs/package_architecture_exemptions.json \
            docs/package_architecture_inventory.json \
            docs/package_architecture_inventory.md \
            docs/shared_contract_inventory.json \
            docs/shared_contract_inventory.md \
            tests/test_package_architecture_inventory.py
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No synchronized changes"
            exit 1
          fi
          git commit -m "Синхронизировать inventories цен генерации"
          git push origin HEAD:fix/owner-cost-only-and-image-pricing
