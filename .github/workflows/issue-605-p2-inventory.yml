name: Sync issue 605 P2 inventory

on:
  push:
    branches:
      - feat/issue-605-error-incident-batching-v2

permissions:
  contents: write

concurrency:
  group: issue-605-p2-inventory
  cancel-in-progress: false

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/issue-605-error-incident-batching-v2
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.11.16"
          enable-cache: true
          cache-dependency-glob: requirements.lock

      - name: Install locked dependencies
        run: uv pip install --system --require-hashes -r requirements.lock

      - name: Register boundaries and regenerate inventory
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('velvet_bot/error_center.py')
          source = path.read_text(encoding='utf-8')
          replacements = {
              'except Exception as error:\n                logger.warning("Pre-immediate aggregate flush failed: %s", error)':
                  'except Exception as error:  # p2-approved-boundary: preserve-critical-immediate-path\n                logger.warning("Pre-immediate aggregate flush failed: %s", error)',
              'except Exception:\n                recorded = await self._repository.record(captured)':
                  'except Exception:  # p2-approved-boundary: fallback-immediate-under-aggregate-pressure\n                recorded = await self._repository.record(captured)',
              'except Exception:\n            current = self._pending.get(fingerprint)':
                  'except Exception:  # p2-approved-boundary: restore-pending-after-batch-failure\n            current = self._pending.get(fingerprint)',
          }
          for old, new in replacements.items():
              if source.count(old) != 1:
                  raise RuntimeError(f'expected one boundary anchor, found {source.count(old)}: {old!r}')
              source = source.replace(old, new)
          path.write_text(source, encoding='utf-8')
          PY

          python scripts/update_p2_stability_inventory.py \
            --label issue-605-error-center-batching \
            --schema-version 81

          rm .github/workflows/issue-605-p2-inventory.yml

      - name: Verify generated contracts
        run: |
          python -m unittest \
            tests.test_p2_stability_inventory \
            tests.test_p2l_discussion_middleware_boundary \
            tests.test_error_incident_aggregation \
            -v
          test ! -e .github/workflows/issue-605-p2-inventory.yml
          git diff --check

      - name: Commit canonical inventory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: register issue 605 stability boundaries"
          git push origin HEAD:feat/issue-605-error-incident-batching-v2
