name: Issue 459 canonical package inventory

on:
  pull_request:
    paths:
      - ".github/workflows/issue-459-package-inventory.yml"

permissions:
  contents: write

concurrency:
  group: issue-459-package-inventory-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  reconcile:
    if: >-
      github.repository == 'Stellmaria/Velvet' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/459-canonical-provider-adapters'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/459-canonical-provider-adapters
          fetch-depth: 0
          persist-credentials: true

      - name: Set up canonical Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Restore canonical package inventory
        shell: bash
        run: |
          python scripts/inventory_package_architecture.py \
            --write \
            --bootstrap-exemptions \
            --label p1-package-architecture-baseline
          python scripts/inventory_package_architecture.py \
            --check \
            --label p1-package-architecture-baseline
          git diff --check

      - name: Remove one-time workflow
        run: rm -f .github/workflows/issue-459-package-inventory.yml

      - name: Commit canonical baseline
        shell: bash
        run: |
          git config user.name "ChatGPT Codex Connector"
          git config user.email "chatgpt-codex-connector@users.noreply.github.com"
          git add -A
          test -n "$(git status --porcelain)"
          git commit -m "Refresh Python 3.13 package architecture inventory"
          git push origin HEAD:fix/459-canonical-provider-adapters
