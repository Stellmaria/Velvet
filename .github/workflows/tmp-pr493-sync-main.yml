name: tmp PR 493 sync main

on:
  push:
    branches:
      - fix/owner-cost-and-public-attempt-privacy

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/owner-cost-and-public-attempt-privacy
          fetch-depth: 0
      - name: Merge current main and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-ff --no-commit origin/main
          rm .github/workflows/tmp-pr493-sync-main.yml
          git add -A
          git diff --cached --check
          git commit -m "chore: sync PR 493 with main"
          git push origin HEAD:fix/owner-cost-and-public-attempt-privacy
