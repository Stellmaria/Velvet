name: docker build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "Dockerfile"
      - "Dockerfile.krita-server"
      - "Dockerfile.server-supervisor-proxy"
      - "Dockerfile.vision-gateway"
      - "Dockerfile.vision-runtime"
      - ".dockerignore"
      - "docker-compose.yml"
      - "docker-compose.server.yml"
      - ".env.example"
      - ".env.server.example"
      - ".env.hermes.example"
      - ".env.vision-local.example"
      - "deploy/**"
      - "tools/krita/**"
      - "vision_gateway/**"
      - "requirements.txt"
      - "requirements.lock"
      - "requirements.vision-gateway.txt"
      - "main.py"
      - "velvet_bot/**"
      - "scripts/container_healthcheck.py"
      - "scripts/hermes_incident_monitor.py"
      - "scripts/krita_server_healthcheck.py"
      - "scripts/server_supervisor.py"
      - "scripts/server_supervisor_proxy.py"
      - "scripts/vision_runtime_entrypoint.sh"
      - "scripts/vision_model_loader.sh"
      - "scripts/benchmark_vision_gateway.py"
      - ".github/workflows/docker-build.yml"
      - ".github/workflows/deploy-production.yml"
  push:
    branches:
      - main
    paths:
      - "Dockerfile"
      - "Dockerfile.krita-server"
      - "Dockerfile.server-supervisor-proxy"
      - "Dockerfile.vision-gateway"
      - "Dockerfile.vision-runtime"
      - ".dockerignore"
      - "docker-compose.yml"
      - "docker-compose.server.yml"
      - ".env.example"
      - ".env.server.example"
      - ".env.hermes.example"
      - ".env.vision-local.example"
      - "deploy/**"
      - "tools/krita/**"
      - "vision_gateway/**"
      - "requirements.txt"
      - "requirements.lock"
      - "requirements.vision-gateway.txt"
      - "main.py"
      - "velvet_bot/**"
      - "scripts/container_healthcheck.py"
      - "scripts/hermes_incident_monitor.py"
      - "scripts/krita_server_healthcheck.py"
      - "scripts/server_supervisor.py"
      - "scripts/server_supervisor_proxy.py"
      - "scripts/vision_runtime_entrypoint.sh"
      - "scripts/vision_model_loader.sh"
      - "scripts/benchmark_vision_gateway.py"
      - ".github/workflows/docker-build.yml"
      - ".github/workflows/deploy-production.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Prepare minimal compose environment
        run: |
          cat > .env <<'EOF'
          BOT_TOKEN=test_token
          DATABASE_URL=postgresql://velvet:test_password@postgres:5432/velvet
          POSTGRES_DB=velvet
          POSTGRES_USER=velvet
          POSTGRES_PASSWORD=test_password
          ALLOWED_USER_IDS=1
          LOG_CHAT_ID=-1001
          ANALYTICS_CHANNEL_IDS=-1002
          AI_VISION_ENABLED=false
          AI_TEXT_ENABLED=false
          EOF
          cat > .env.server <<'EOF'
          VELVET_DATA_DIR=/tmp/velvet-data
          VELVET_IMAGE=velvet-bot:ci
          KRITA_SERVER_IMAGE=velvet-krita-server:ci
          SUPERVISOR_PROXY_IMAGE=velvet-server-supervisor-proxy:ci
          VISION_RUNTIME_IMAGE=velvet-vision-runtime:ci
          VISION_GATEWAY_IMAGE=velvet-vision-gateway:ci
          VISION_RUNTIME_BASE_IMAGE=alpine:3.21
          VISION_MODEL=qwen3-vl:8b-instruct-q4_K_M
          VISION_MODEL_EXPECTED_DIGEST=
          POSTGRES_IMAGE=postgres:16-alpine
          POSTGRES_DB=velvet
          POSTGRES_USER=velvet
          POSTGRES_PASSWORD=test_password
          DATABASE_URL=postgresql://velvet:test_password@postgres:5432/velvet
          BOT_TOKEN=test_token
          ALLOWED_USER_IDS=1
          SUPERVISOR_ENABLED=false
          SUPERVISOR_TOKEN=test_supervisor_token_at_least_32_chars
          SERVER_SUPERVISOR_SOCKET=/runtime/supervisor/velvet-server-supervisor.sock
          KRITA_WATERMARK_ENABLED=true
          KRITA_REMOTE_WORKER_ENABLED=false
          KRITA_BRIDGE_DIR=/app/runtime/krita
          EOF
          cp .env.hermes.example .env.hermes

      - name: Prepare Hermes Coder and router environment
        run: |
          set -Eeuo pipefail
          root="$PWD/.ci/hermes-coders"
          control="$PWD/.ci/hermes-operator"
          mkdir -p \
            "$root/secrets" \
            "$root/data/velvet" \
            "$root/data/max" \
            "$root/workspaces/velvet/.git" \
            "$root/workspaces/max/.git" \
            "$control/runtime"
          cat > "$root/secrets/velvet.env" <<'EOF'
          BYESU_HERMES_CODEX_API_KEY=test_coder_key
          BYESU_HERMES_GPT_PRO_API_KEY=test_pro_key
          TELEGRAM_BOT_TOKEN=test_velvet_telegram_token
          TELEGRAM_ALLOWED_USERS=1
          GH_TOKEN=ci_velvet_github_token_abcdefghijklmnopqrstuvwxyz
          API_SERVER_KEY=ci_velvet_api_server_key_abcdefghijklmnopqrstuvwxyz
          EOF
          cat > "$root/secrets/max.env" <<'EOF'
          BYESU_HERMES_CODEX_API_KEY=test_coder_key
          BYESU_HERMES_GPT_PRO_API_KEY=test_pro_key
          TELEGRAM_BOT_TOKEN=test_max_telegram_token
          TELEGRAM_ALLOWED_USERS=1
          GH_TOKEN=ci_max_github_token_abcdefghijklmnopqrstuvwxyz
          API_SERVER_KEY=ci_max_api_server_key_abcdefghijklmnopqrstuvwxyz
          EOF
          cat > "$root/secrets/velvet-db.env" <<'EOF'
          DATABASE_URL=postgresql://hermes_velvet_ro:test@postgres:5432/velvet
          EOF
          cat > "$root/secrets/max-db.env" <<'EOF'
          DATABASE_URL=postgresql://hermes_max_ro:test@postgres:5432/card_hunter
          EOF
          cat > "$control/operator.env" <<'EOF'
          HERMES_OPS_CLIENT_TOKEN=ci_client_token_abcdefghijklmnopqrstuvwxyz
          HERMES_OPS_HOST_TOKEN=ci_host_token_abcdefghijklmnopqrstuvwxyz
          VELVET_SUPERVISOR_TOKEN=ci_velvet_supervisor_token_abcdefghijklmnopqrstuvwxyz
          ROMATIC_SUPERVISOR_TOKEN=ci_max_supervisor_token_abcdefghijklmnopqrstuvwxyz
          VELVET_SUPERVISOR_BASE_URL=http://supervisor-proxy:8765
          ROMATIC_SUPERVISOR_BASE_URL=http://romatic-supervisor:8765
          HERMES_OPS_HOST_RUNTIME_DIR=/tmp/hermes-operator/runtime
          HERMES_OPS_HOST_SOCKET=/tmp/hermes-operator/runtime/start.sock
          HERMES_OPS_SOCKET_GID=10001
          EOF
          cat > "$control/coders.env" <<'EOF'
          HERMES_CODER_ROUTER_CLIENT_TOKEN=ci_client_token_abcdefghijklmnopqrstuvwxyz
          HERMES_CODER_VELVET_TOKEN=ci_velvet_api_server_key_abcdefghijklmnopqrstuvwxyz
          HERMES_CODER_MAX_TOKEN=ci_max_api_server_key_abcdefghijklmnopqrstuvwxyz
          HERMES_CODER_VELVET_BASE_URL=http://hermes-coder-velvet:8642
          HERMES_CODER_MAX_BASE_URL=http://hermes-coder-max:8642
          HERMES_CODER_ROUTER_HOST=0.0.0.0
          HERMES_CODER_ROUTER_PORT=8878
          EOF
          cp deploy/hermes-coders/config.yaml "$root/data/velvet/config.yaml"
          cp deploy/hermes-coders/config.yaml "$root/data/max/config.yaml"
          cp deploy/hermes-coders/SOUL.velvet.md "$root/data/velvet/SOUL.md"
          cp deploy/hermes-coders/SOUL.max.md "$root/data/max/SOUL.md"
          chmod 600 "$root/secrets/"*.env "$control/"*.env
          python deploy/hermes-orchestration/prepare_router_env.py \
            "$root/secrets/velvet.env" \
            "$root/secrets/max.env" \
            "$control/coders.env"

      - name: Validate deployment shell and Python
        run: |
          bash -n deploy/server/deploy.sh
          bash -n deploy/server/install-server-supervisor.sh
          bash -n deploy/server/install-krita-server.sh
          bash -n deploy/server/krita-smoke.sh
          bash -n deploy/server/wait-compose-health.sh
          bash -n deploy/krita-server/entrypoint.sh
          bash -n deploy/hermes-coders/install.sh
          bash -n deploy/hermes-orchestration/install.sh
          bash -n scripts/vision_runtime_entrypoint.sh
          bash -n scripts/vision_model_loader.sh
          python -m py_compile \
            scripts/server_supervisor.py \
            scripts/server_supervisor_proxy.py \
            scripts/hermes_incident_monitor.py \
            scripts/benchmark_vision_gateway.py \
            vision_gateway/app.py \
            deploy/hermes-coders/db_proxy.py \
            deploy/hermes-coders/preflight.py \
            deploy/hermes-operator/coder_router.py \
            deploy/hermes-operator/coderctl.py \
            deploy/hermes-orchestration/prepare_router_env.py

      - name: Validate Docker Compose
        run: |
          docker compose config --quiet
          docker compose --profile agent config --quiet
          docker compose --env-file .env.server -f docker-compose.server.yml config --quiet
          docker compose --env-file .env.server -f docker-compose.server.yml --profile watermark config --quiet
          docker compose --env-file .env.server -f docker-compose.server.yml --profile vision config --quiet
          docker compose --env-file .env.server -f docker-compose.server.yml --profile vision-bootstrap config --quiet
          HERMES_CODERS_ROOT="$PWD/.ci/hermes-coders" \
          HERMES_AGENT_CONTROL_NETWORK=hermes-agent-control \
            docker compose \
              --profile velvet \
              --profile max \
              -f deploy/hermes-coders/compose.yaml \
              config --quiet
          HERMES_OPS_ENV_FILE="$PWD/.ci/hermes-operator/operator.env" \
          HERMES_OPS_HOST_RUNTIME_DIR="$PWD/.ci/hermes-operator/runtime" \
          HERMES_SUPERVISOR_NETWORK=hermes-supervisor-control \
          VELVET_BACKEND_NETWORK=velvet_backend \
            docker compose -f deploy/hermes-operator/compose.yaml config --quiet
          HERMES_CODER_ROUTER_ENV_FILE="$PWD/.ci/hermes-operator/coders.env" \
          HERMES_AGENT_CONTROL_NETWORK=hermes-agent-control \
          VELVET_BACKEND_NETWORK=velvet_backend \
            docker compose -f deploy/hermes-orchestration/compose.yaml config --quiet

      - name: Build Velvet image
        run: docker build --tag velvet-bot:ci .

      - name: Build Server Supervisor proxy image
        run: |
          docker build \
            --file Dockerfile.server-supervisor-proxy \
            --tag velvet-server-supervisor-proxy:ci .

      - name: Build local VL images
        run: |
          docker build \
            --file Dockerfile.vision-gateway \
            --tag velvet-vision-gateway:ci .
          docker build \
            --file Dockerfile.vision-runtime \
            --build-arg VISION_RUNTIME_BASE_IMAGE=alpine:3.21 \
            --tag velvet-vision-runtime:ci .

      - name: Build Krita server image
        run: docker build --file Dockerfile.krita-server --tag velvet-krita-server:ci .

      - name: Build Hermes Coder images
        run: |
          HERMES_CODERS_ROOT="$PWD/.ci/hermes-coders" \
          HERMES_AGENT_CONTROL_NETWORK=hermes-agent-control \
            docker compose \
              --profile velvet \
              --profile max \
              -f deploy/hermes-coders/compose.yaml \
              build

      - name: Build Hermes operator and coder router image
        run: |
          docker build \
            --file deploy/hermes-operator/Dockerfile \
            --tag velvet-hermes-coder-router:ci .

      - name: Run Krita plugin smoke
        run: |
          set -Eeuo pipefail
          cleanup() {
            docker compose --env-file .env.server -f docker-compose.server.yml \
              --profile watermark logs --tail 200 krita || true
            docker compose --env-file .env.server -f docker-compose.server.yml \
              --profile watermark down --remove-orphans || true
          }
          trap cleanup EXIT
          sudo mkdir -p /tmp/velvet-data/runtime/krita/{sources,requests,responses,outputs,previews,assets}
          sudo chown -R 10001:10001 /tmp/velvet-data/runtime/krita
          docker compose --env-file .env.server -f docker-compose.server.yml \
            --profile watermark up -d --no-build krita
          VELVET_APP_DIR="$PWD" VELVET_ENV_FILE=.env.server \
            bash deploy/server/wait-compose-health.sh krita 36 5
          sudo env VELVET_APP_DIR="$PWD" VELVET_ENV_FILE=.env.server \
            bash deploy/server/krita-smoke.sh .env.server
