name: docker build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "Dockerfile"
      - "Dockerfile.krita-server"
      - "Dockerfile.server-supervisor-proxy"
      - ".dockerignore"
      - "docker-compose.yml"
      - "docker-compose.server.yml"
      - ".env.example"
      - ".env.server.example"
      - ".env.hermes.example"
      - "deploy/**"
      - "tools/krita/**"
      - "requirements.txt"
      - "main.py"
      - "velvet_bot/**"
      - "scripts/container_healthcheck.py"
      - "scripts/krita_server_healthcheck.py"
      - "scripts/server_supervisor.py"
      - "scripts/server_supervisor_proxy.py"
      - ".github/workflows/docker-build.yml"
      - ".github/workflows/deploy-production.yml"
  push:
    branches:
      - main
    paths:
      - "Dockerfile"
      - "Dockerfile.krita-server"
      - "Dockerfile.server-supervisor-proxy"
      - ".dockerignore"
      - "docker-compose.yml"
      - "docker-compose.server.yml"
      - ".env.example"
      - ".env.server.example"
      - ".env.hermes.example"
      - "deploy/**"
      - "tools/krita/**"
      - "requirements.txt"
      - "main.py"
      - "velvet_bot/**"
      - "scripts/container_healthcheck.py"
      - "scripts/krita_server_healthcheck.py"
      - "scripts/server_supervisor.py"
      - "scripts/server_supervisor_proxy.py"
      - ".github/workflows/docker-build.yml"
      - ".github/workflows/deploy-production.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare minimal compose environment
        run: |
          cat > .env <<'EOF'
          BOT_TOKEN=test_token
          DATABASE_URL=postgresql://velvet:test_password@postgres:5432/velvet
          POSTGRES_DB=velvet
          POSTGRES_USER=velvet
          POSTGRES_PASSWORD=test_password
          ALLOWED_USER_IDS=1
          LOG_CHAT_ID=-1001
          ANALYTICS_CHANNEL_IDS=-1002
          AI_VISION_ENABLED=false
          AI_TEXT_ENABLED=false
          EOF
          cat > .env.server <<'EOF'
          VELVET_DATA_DIR=/tmp/velvet-data
          VELVET_IMAGE=velvet-bot:ci
          KRITA_SERVER_IMAGE=velvet-krita-server:ci
          SUPERVISOR_PROXY_IMAGE=velvet-server-supervisor-proxy:ci
          POSTGRES_IMAGE=postgres:16-alpine
          POSTGRES_DB=velvet
          POSTGRES_USER=velvet
          POSTGRES_PASSWORD=test_password
          DATABASE_URL=postgresql://velvet:test_password@postgres:5432/velvet
          BOT_TOKEN=test_token
          ALLOWED_USER_IDS=1
          SUPERVISOR_ENABLED=false
          SUPERVISOR_TOKEN=test_supervisor_token_at_least_32_chars
          SERVER_SUPERVISOR_SOCKET=/runtime/supervisor/velvet-server-supervisor.sock
          KRITA_WATERMARK_ENABLED=true
          KRITA_REMOTE_WORKER_ENABLED=false
          KRITA_BRIDGE_DIR=/app/runtime/krita
          EOF
          cp .env.hermes.example .env.hermes

      - name: Prepare Hermes Coder compose environment
        run: |
          set -Eeuo pipefail
          root="$PWD/.ci/hermes-coders"
          mkdir -p \
            "$root/secrets" \
            "$root/data/velvet" \
            "$root/data/max" \
            "$root/workspaces/velvet" \
            "$root/workspaces/max"
          cat > "$root/secrets/velvet.env" <<'EOF'
          BYESU_HERMES_CODEX_API_KEY=test_coder_key
          BYESU_HERMES_GPT_PRO_API_KEY=test_pro_key
          TELEGRAM_BOT_TOKEN=test_velvet_telegram_token
          TELEGRAM_ALLOWED_USERS=1
          GH_TOKEN=test_velvet_github_token
          EOF
          cat > "$root/secrets/max.env" <<'EOF'
          BYESU_HERMES_CODEX_API_KEY=test_coder_key
          BYESU_HERMES_GPT_PRO_API_KEY=test_pro_key
          TELEGRAM_BOT_TOKEN=test_max_telegram_token
          TELEGRAM_ALLOWED_USERS=1
          GH_TOKEN=test_max_github_token
          EOF
          cat > "$root/secrets/velvet-db.env" <<'EOF'
          DATABASE_URL=postgresql://hermes_velvet_ro:test@postgres:5432/velvet
          EOF
          cat > "$root/secrets/max-db.env" <<'EOF'
          DATABASE_URL=postgresql://hermes_max_ro:test@postgres:5432/card_hunter
          EOF
          cp deploy/hermes-coders/config.yaml "$root/data/velvet/config.yaml"
          cp deploy/hermes-coders/config.yaml "$root/data/max/config.yaml"
          cp deploy/hermes-coders/SOUL.velvet.md "$root/data/velvet/SOUL.md"
          cp deploy/hermes-coders/SOUL.max.md "$root/data/max/SOUL.md"

      - name: Validate deployment shell and Python
        run: |
          bash -n deploy/server/deploy.sh
          bash -n deploy/server/install-server-supervisor.sh
          bash -n deploy/server/install-krita-server.sh
          bash -n deploy/server/krita-smoke.sh
          bash -n deploy/server/wait-compose-health.sh
          bash -n deploy/krita-server/entrypoint.sh
          bash -n deploy/hermes-coders/install.sh
          python -m py_compile \
            scripts/server_supervisor.py \
            scripts/server_supervisor_proxy.py \
            deploy/hermes-coders/db_proxy.py \
            deploy/hermes-coders/preflight.py

      - name: Validate Docker Compose
        run: |
          docker compose config --quiet
          docker compose --profile agent config --quiet
          docker compose --env-file .env.server -f docker-compose.server.yml config --quiet
          docker compose --env-file .env.server -f docker-compose.server.yml --profile watermark config --quiet
          HERMES_CODERS_ROOT="$PWD/.ci/hermes-coders" \
            docker compose \
              --profile velvet \
              --profile max \
              -f deploy/hermes-coders/compose.yaml \
              config --quiet

      - name: Build Velvet image
        run: docker build --tag velvet-bot:ci .

      - name: Build Server Supervisor proxy image
        run: |
          docker build \
            --file Dockerfile.server-supervisor-proxy \
            --tag velvet-server-supervisor-proxy:ci .

      - name: Build Krita server image
        run: docker build --file Dockerfile.krita-server --tag velvet-krita-server:ci .

      - name: Build Hermes Coder images
        run: |
          HERMES_CODERS_ROOT="$PWD/.ci/hermes-coders" \
            docker compose \
              --profile velvet \
              --profile max \
              -f deploy/hermes-coders/compose.yaml \
              build

      - name: Run Krita plugin smoke
        run: |
          set -Eeuo pipefail
          cleanup() {
            docker compose --env-file .env.server -f docker-compose.server.yml \
              --profile watermark logs --tail 200 krita || true
            docker compose --env-file .env.server -f docker-compose.server.yml \
              --profile watermark down --remove-orphans || true
          }
          trap cleanup EXIT
          sudo mkdir -p /tmp/velvet-data/runtime/krita/{sources,requests,responses,outputs,previews,assets}
          sudo chown -R 10001:10001 /tmp/velvet-data/runtime/krita
          docker compose --env-file .env.server -f docker-compose.server.yml \
            --profile watermark up -d --no-build krita
          VELVET_APP_DIR="$PWD" VELVET_ENV_FILE=.env.server \
            bash deploy/server/wait-compose-health.sh krita 36 5
          sudo env VELVET_APP_DIR="$PWD" VELVET_ENV_FILE=.env.server \
            bash deploy/server/krita-smoke.sh .env.server
