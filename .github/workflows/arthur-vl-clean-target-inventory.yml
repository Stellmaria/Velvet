name: arthur vl clean target inventory

on:
  push:
    branches:
      - ci/arthur-vl-inventory-helper-20260808
    paths:
      - .github/workflows/arthur-vl-clean-target-inventory.yml

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 3a9d677fc482ce224b03b4574bf35818df234246
          fetch-depth: 1
          persist-credentials: false

      - name: Use CI Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'

      - name: Compare full and fast package inventories on CI Python
        shell: bash
        run: |
          set -euo pipefail
          python --version
          python scripts/inventory_package_architecture.py --json --label p1-package-architecture-baseline > /tmp/full.json
          python scripts/inventory_package_architecture_fast.py --json --label p1-package-architecture-baseline > /tmp/fast.json
          python - <<'PY'
          import json
          from pathlib import Path

          full = json.loads(Path('/tmp/full.json').read_text(encoding='utf-8'))
          fast = json.loads(Path('/tmp/fast.json').read_text(encoding='utf-8'))
          stored = json.loads(Path('docs/package_architecture_inventory.json').read_text(encoding='utf-8'))

          def first_diff(a, b, path='$'):
              if type(a) is not type(b):
                  return path, a, b
              if isinstance(a, dict):
                  if set(a) != set(b):
                      return path + '.keys', sorted(a), sorted(b)
                  for key in a:
                      found = first_diff(a[key], b[key], f'{path}.{key}')
                      if found:
                          return found
                  return None
              if isinstance(a, list):
                  if len(a) != len(b):
                      return path + '.length', len(a), len(b)
                  for index, (left, right) in enumerate(zip(a, b)):
                      found = first_diff(left, right, f'{path}[{index}]')
                      if found:
                          return found
                  return None
              if a != b:
                  return path, a, b
              return None

          for label, left, right in (
              ('full_fast', full, fast),
              ('stored_full', stored, full),
              ('stored_fast', stored, fast),
          ):
              diff = first_diff(left, right)
              print(f'{label}_equal={diff is None}')
              if diff is not None:
                  path, a, b = diff
                  print(f'{label}_first_diff_path={path}')
                  print(f'{label}_left={a!r}')
                  print(f'{label}_right={b!r}')
          PY

      - name: Run exact CI fast check
        shell: bash
        run: |
          set -euo pipefail
          python scripts/inventory_package_architecture_fast.py --check --label p1-package-architecture-baseline
