name: Run issue 457 maintenance v5

on:
  push:
    branches:
      - feat/457-retire-legacy-delivery-installers

permissions:
  contents: write

jobs:
  execute-maintenance:
    if: contains(github.event.head_commit.message, 'trigger issue 457 runner v5')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Execute corrected v4 maintenance
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          workflow = Path('.github/workflows/issue-457-runner-v4.yml').read_text(encoding='utf-8')
          marker = '      - name: Execute maintenance and canonicalize contracts\n'
          start = workflow.find(marker)
          if start < 0:
              raise SystemExit('v4 maintenance step not found')
          run_marker = '        run: |\n'
          run_start = workflow.find(run_marker, start)
          if run_start < 0:
              raise SystemExit('v4 run block not found')
          body_start = run_start + len(run_marker)
          next_step = workflow.find('\n      - name: ', body_start)
          body_end = len(workflow) if next_step < 0 else next_step + 1
          raw = workflow[body_start:body_end]
          body = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in raw.splitlines()
          ).rstrip() + '\n'
          old = "content = source_workflow.read_text(encoding='utf-8')"
          new = (
              "content = source_workflow.read_text(encoding='utf-8').replace("
              "'issue-457-retire-legacy-delivery', "
              "'p1-package-architecture-baseline'"
              ")"
          )
          if body.count(old) != 1:
              raise SystemExit(f'expected one source workflow read, found {body.count(old)}')
          body = body.replace(old, new, 1)
          script = Path('/tmp/issue457-v5-maintenance.sh')
          script.write_text('set -euo pipefail\n' + body, encoding='utf-8')
          subprocess.run(['bash', str(script)], check=True)
          PY

      - name: Commit product and generated changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A velvet_bot tests docs
          git diff --cached --check
          git commit -m "refactor: retire legacy media delivery installers (#457)"
          git push origin HEAD:feat/457-retire-legacy-delivery-installers
