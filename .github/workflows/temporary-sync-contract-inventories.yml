name: Temporary sync contract inventories

on:
  push:
    branches:
      - agent/final-auf-wallet-layer

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/final-auf-wallet-layer
          fetch-depth: 0

      - name: Update router contracts and generated inventories
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          architecture = Path('tests/test_p3_architecture_organization.py')
          text = architecture.read_text(encoding='utf-8')
          marker = '    "velvet_bot.presentation.telegram.routers.workspace_guided_actions",\n'
          addition = marker + '    "velvet_bot.presentation.telegram.routers.workspace_member_home",\n'
          if 'workspace_member_home' not in text:
              text = text.replace(marker, addition)
          architecture.write_text(text, encoding='utf-8')

          publication = Path('tests/test_p3c_publication_controllers.py')
          text = publication.read_text(encoding='utf-8')
          text = text.replace(
              'self.assertEqual(52, source.count("router.include_router("))',
              'self.assertEqual(53, source.count("router.include_router("))',
          )
          publication.write_text(text, encoding='utf-8')

          audit = Path('tests/test_personal_archive_full_button_audit.py')
          text = audit.read_text(encoding='utf-8')
          text = text.replace('"🗂 Выбрать пространство"', '"🗂 Другие пространства"')
          audit.write_text(text, encoding='utf-8')

          Path('.github/workflows/temporary-sync-contract-inventories.yml').unlink()
          PY

          python scripts/inventory_architecture_layout.py \
            --write \
            --label p3d-analytics-alias-retirement
          python scripts/update_p2_stability_inventory.py \
            --label p2-auf-wallet-domain-migration \
            --schema-version 65
          python scripts/telegram_navigation_inventory.py \
            --root velvet_bot \
            --markdown docs/generated/telegram_navigation_inventory.md

      - name: Commit synchronized contracts
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Синхронизировать router contracts после переноса Ауф"
          git push origin HEAD:agent/final-auf-wallet-layer
