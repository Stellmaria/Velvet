name: PR 485 sync main

on:
  push:
    branches:
      - agent/fix-server-deployment-portability

permissions:
  contents: write

jobs:
  sync-main:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-server-deployment-portability
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Merge main and resolve generated inventory
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main

          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e

          if [ "$merge_status" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            unexpected="$(printf '%s\n' "$conflicts" | grep -Ev '^(docs/package_architecture_inventory\.json|docs/package_architecture_inventory\.md)$' || true)"
            if [ -n "$unexpected" ]; then
              printf 'Unexpected merge conflicts:\n%s\n' "$unexpected" >&2
              exit 1
            fi
            git checkout --theirs -- \
              docs/package_architecture_inventory.json \
              docs/package_architecture_inventory.md
            git add \
              docs/package_architecture_inventory.json \
              docs/package_architecture_inventory.md
          fi

          if git diff --name-only --diff-filter=U | grep -q .; then
            git diff --name-only --diff-filter=U >&2
            exit 1
          fi

          python scripts/inventory_package_architecture.py \
            --write \
            --label p1-package-architecture-baseline
          python scripts/inventory_package_architecture.py \
            --check \
            --label p1-package-architecture-baseline

          rm -f .github/workflows/pr485-sync-main.yml
          git add -A
          git commit -m "Merge main into deployment portability fix"
          git push origin HEAD:agent/fix-server-deployment-portability
