name: refresh Auf architecture inventory

on:
  push:
    branches:
      - feat/auf-margin-accounting

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/auf-margin-accounting
          fetch-depth: 0
      - name: Set up contract Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Generate reviewed architecture baseline
        run: >-
          python scripts/inventory_package_architecture.py
          --label "$GITHUB_SHA"
          --write
          --bootstrap-exemptions
      - name: Commit generated inventory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/package_architecture_inventory.json \
                  docs/package_architecture_inventory.md \
                  docs/package_architecture_exemptions.json
          if git diff --cached --quiet; then
            echo "Architecture inventory already current"
            exit 0
          fi
          git commit -m "docs: refresh package architecture inventory"
          git push origin HEAD:feat/auf-margin-accounting
