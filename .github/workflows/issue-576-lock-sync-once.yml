name: issue 576 lock sync once

on:
  push:
    branches:
      - fix/issue-576-tier-aware-routing

permissions:
  contents: write

concurrency:
  group: issue-576-lock-sync-once
  cancel-in-progress: false

env:
  UV_VERSION: "0.11.16"

jobs:
  sync-locks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/issue-576-tier-aware-routing
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false

      - name: Rebuild and commit canonical locks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p generated-locks
          uv pip compile requirements.txt \
            --python-version 3.13 \
            --generate-hashes \
            --no-annotate \
            --no-header \
            --output-file generated-locks/requirements.lock
          uv pip compile requirements-dev.txt \
            --python-version 3.13 \
            --generate-hashes \
            --no-annotate \
            --no-header \
            --output-file generated-locks/requirements-dev.lock
          cp generated-locks/requirements.lock requirements.lock
          cp generated-locks/requirements-dev.lock requirements-dev.lock
          if git diff --quiet -- requirements.lock requirements-dev.lock; then
            echo "Canonical locks already match."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add requirements.lock requirements-dev.lock
          git commit -m "build: refresh canonical dependency locks"
          git push origin HEAD:fix/issue-576-tier-aware-routing
