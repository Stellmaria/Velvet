name: Run issue 457 maintenance v2

on:
  push:
    branches:
      - feat/457-retire-legacy-delivery-installers

permissions:
  contents: write

jobs:
  execute-maintenance:
    if: contains(github.event.head_commit.message, 'run issue 457 maintenance v2')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Execute corrected maintenance sections
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import subprocess
          from pathlib import Path

          workflow = Path('.github/workflows/issue-457-branch-maintenance.yml')
          content = workflow.read_text(encoding='utf-8')
          old = """              if count != 1:\n                  raise SystemExit(f'{path}: expected one replacement, found {count}: {old[:80]!r}')\n"""
          new = """              if count < 1:\n                  raise SystemExit(f'{path}: expected a replacement, found {count}: {old[:80]!r}')\n"""
          if content.count(old) != 1:
              raise SystemExit('legacy maintenance guard not found exactly once')
          content = content.replace(old, new, 1)

          def extract_step(name: str) -> str:
              marker = f'      - name: {name}\n'
              start = content.find(marker)
              if start < 0:
                  raise SystemExit(f'missing maintenance step: {name}')
              run_marker = '        run: |\n'
              run_start = content.find(run_marker, start)
              if run_start < 0:
                  raise SystemExit(f'missing run block: {name}')
              body_start = run_start + len(run_marker)
              next_step = content.find('\n      - name: ', body_start)
              body_end = len(content) if next_step < 0 else next_step + 1
              raw = content[body_start:body_end]
              lines = raw.splitlines()
              return '\n'.join(
                  line[10:] if line.startswith('          ') else line
                  for line in lines
              ).rstrip() + '\n'

          def run_step(index: int, name: str) -> None:
              script = Path(f'/tmp/issue457-step-{index}.sh')
              script.write_text('set -euo pipefail\n' + extract_step(name), encoding='utf-8')
              print(f'Executing: {name}', flush=True)
              subprocess.run(['bash', str(script)], check=True)

          run_step(1, 'Retire legacy delivery ownership layers')

          friendly = Path('velvet_bot/domains/media_generation/friendly_worker.py')
          source = friendly.read_text(encoding='utf-8')

          def replace_exact(old_text: str, new_text: str) -> None:
              global source
              if source.count(old_text) != 1:
                  raise SystemExit(
                      f'friendly_worker cleanup expected one match, found '
                      f'{source.count(old_text)}: {old_text[:80]!r}'
                  )
              source = source.replace(old_text, new_text, 1)

          replace_exact('from typing import Any\n\n', '')
          replace_exact(
              'from aiogram.exceptions import TelegramAPIError, TelegramBadRequest\n',
              'from aiogram import Bot\nfrom aiogram.exceptions import TelegramAPIError, TelegramBadRequest\n',
          )
          replace_exact(
              'from velvet_bot.domains.ai_usage import AITask\n',
              'from velvet_bot.domains.ai_usage import AIRequestExecutor, AITask\n',
          )
          replace_exact(
              'from velvet_bot.infrastructure.media_delivery_runtime import (\n',
              'from velvet_bot.infrastructure.ai import KieClient\n'
              'from velvet_bot.infrastructure.media_delivery_runtime import (\n',
          )
          replace_exact(
              'from .models import KieGenerationRequest, KieModelAlias, KieTaskRecord\n',
              'from .models import (\n'
              '    KieGenerationRequest,\n'
              '    KieModelAlias,\n'
              '    KiePricing,\n'
              '    KieTaskRecord,\n'
              ')\n'
              'from .task_queue import KieTaskQueueService\n',
          )
          replace_exact('_INSTALLED = False\n', '')
          replace_exact(
              '''    def __init__(\n        self,\n        *,\n        media_delivery_runtime: MediaDeliveryRuntime | None = None,\n        **kwargs: Any,\n    ) -> None:\n        super().__init__(**kwargs)\n''',
              '''    def __init__(\n        self,\n        *,\n        bot: Bot,\n        queue: KieTaskQueueService,\n        client: KieClient,\n        executor: AIRequestExecutor[KieTaskRecord],\n        pricing: KiePricing,\n        usd_to_rub: Decimal,\n        worker_id: str = "kie-media-generation",\n        heartbeat_seconds: int = 60,\n        media_delivery_runtime: MediaDeliveryRuntime | None = None,\n    ) -> None:\n        super().__init__(\n            bot=bot,\n            queue=queue,\n            client=client,\n            executor=executor,\n            pricing=pricing,\n            usd_to_rub=usd_to_rub,\n            worker_id=worker_id,\n            heartbeat_seconds=heartbeat_seconds,\n        )\n''',
          )
          replace_exact(
              '''def install_friendly_media_worker() -> None:\n    """Install the provider-aware worker in the application composition root."""\n\n    global _INSTALLED\n    if _INSTALLED:\n        return\n    from velvet_bot.app.media_delivery_ui_install import install_media_delivery_ui\n\n    install_media_delivery_ui()\n    _INSTALLED = True\n''',
              '''def install_friendly_media_worker() -> None:\n    """Install the provider-aware worker in the application composition root."""\n\n    from velvet_bot.app.media_delivery_ui_install import install_media_delivery_ui\n\n    install_media_delivery_ui()\n''',
          )
          friendly.write_text(source, encoding='utf-8')

          run_step(2, 'Regenerate architecture and stability inventories')
          run_step(3, 'Update canonical status notes')
          run_step(4, 'Validate focused contracts')
          PY

      - name: Commit product and generated changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A velvet_bot tests docs
          git diff --cached --check
          git commit -m "refactor: retire legacy media delivery installers (#457)"
          git push origin HEAD:feat/457-retire-legacy-delivery-installers
