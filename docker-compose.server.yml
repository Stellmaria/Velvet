name: velvet

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    restart: unless-stopped
    env_file:
      - .env.server
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - ${VELVET_DATA_DIR:-./server-data}/postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    stop_grace_period: 60s
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

  # The proxy has no Docker socket, repository checkout, systemd access or
  # production secrets. It only forwards the authenticated HTTP contract from
  # the private Compose network to the host Supervisor Unix socket. The socket
  # is mounted from a dedicated control directory that bot/Krita/Hermes never see.
  supervisor-proxy:
    image: ${SUPERVISOR_PROXY_IMAGE:-velvet-server-supervisor-proxy:local}
    build:
      context: .
      dockerfile: Dockerfile.server-supervisor-proxy
    restart: unless-stopped
    user: "${SERVER_SUPERVISOR_CLIENT_UID:-10001}:${SERVER_SUPERVISOR_CLIENT_GID:-10001}"
    environment:
      SERVER_SUPERVISOR_SOCKET: ${SERVER_SUPERVISOR_SOCKET:-/run/velvet-supervisor/velvet-server-supervisor.sock}
      SERVER_SUPERVISOR_PROXY_HOST: 0.0.0.0
      SERVER_SUPERVISOR_PROXY_PORT: 8765
    volumes:
      - ${VELVET_DATA_DIR:-./server-data}/control/supervisor:/run/velvet-supervisor:ro
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import socket; s=socket.create_connection(('127.0.0.1',8765),2); s.close()
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
    mem_limit: ${SUPERVISOR_PROXY_MEMORY_LIMIT:-128m}
    cpus: ${SUPERVISOR_PROXY_CPU_LIMIT:-0.25}
    pids_limit: 64
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

  bot:
    image: ${VELVET_IMAGE:-velvet-bot:local}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    user: "10001:10001"
    env_file:
      - .env.server
    depends_on:
      postgres:
        condition: service_healthy
      supervisor-proxy:
        condition: service_started
    volumes:
      - ${VELVET_DATA_DIR:-./server-data}/backups:/app/backups
      - ${VELVET_DATA_DIR:-./server-data}/logs:/app/logs
      - ${VELVET_DATA_DIR:-./server-data}/runtime:/app/runtime
    tmpfs:
      - /tmp:size=256m,mode=1777
    healthcheck:
      test: ["CMD", "python", "scripts/container_healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    stop_grace_period: 45s
    mem_limit: ${VELVET_BOT_MEMORY_LIMIT:-4g}
    cpus: ${VELVET_BOT_CPU_LIMIT:-2.0}
    pids_limit: 512
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

  # Серверная Krita запускается отдельным профилем и не имеет сети. Бот и
  # Krita обмениваются только файлами внутри общего runtime/krita bridge.
  krita:
    image: ${KRITA_SERVER_IMAGE:-velvet-krita-server:local}
    profiles: ["watermark"]
    build:
      context: .
      dockerfile: Dockerfile.krita-server
    restart: unless-stopped
    init: true
    user: "10001:10001"
    environment:
      KRITA_BRIDGE_DIR: ${KRITA_BRIDGE_DIR:-/app/runtime/krita}
      KRITA_XVFB_SCREEN: ${KRITA_XVFB_SCREEN:-1920x1080x24}
    volumes:
      - ${VELVET_DATA_DIR:-./server-data}/runtime:/app/runtime
    tmpfs:
      - /tmp:size=512m,mode=1777
    healthcheck:
      test: ["CMD", "python3", "/usr/local/bin/krita_server_healthcheck.py"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 45s
    stop_grace_period: 45s
    mem_limit: ${KRITA_SERVER_MEMORY_LIMIT:-3g}
    cpus: ${KRITA_SERVER_CPU_LIMIT:-1.5}
    pids_limit: 512
    shm_size: 512m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    network_mode: none

  # Запускается только после отдельного smoke-test:
  # docker compose --env-file .env.server -f docker-compose.server.yml \
  #   --profile agent up -d hermes
  # Hermes не получает production .env, docker.sock, PostgreSQL volume или
  # рабочий каталог запущенного бота.
  hermes:
    image: ${HERMES_IMAGE:-nousresearch/hermes-agent:latest}
    profiles: ["agent"]
    restart: unless-stopped
    # Official Hermes uses s6-overlay /init as PID 1. Docker init/tini must not
    # be inserted in front of it, otherwise the container exits before Hermes.
    command: ["gateway", "run"]
    env_file:
      - .env.hermes
    ports:
      - "127.0.0.1:${HERMES_LOOPBACK_PORT:-8642}:8642"
    volumes:
      - ${VELVET_DATA_DIR:-./server-data}/hermes:/opt/data
    tmpfs:
      - /tmp:size=256m,mode=1777
    mem_limit: ${HERMES_MEMORY_LIMIT:-4g}
    cpus: ${HERMES_CPU_LIMIT:-2.0}
    pids_limit: 256
    shm_size: 1gb
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8642/health', timeout=3).read()
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    # s6-overlay starts as root only long enough to remap the hermes UID/GID,
    # chown /opt/data and drop privileges. Keep every other capability removed.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

networks:
  backend:
    driver: bridge
