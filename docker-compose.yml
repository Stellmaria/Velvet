services:
  postgres:
    image: postgres:16-alpine
    container_name: velvet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-velvet}
      POSTGRES_USER: ${POSTGRES_USER:-velvet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - velvet_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: velvet-bot
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-velvet}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-velvet}
      BACKUP_DIR: /app/backups
      PG_DUMP_PATH: pg_dump
      PG_RESTORE_PATH: pg_restore
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backups:/app/backups
      - ./logs:/app/logs
      - ./runtime:/app/runtime
    healthcheck:
      test: ["CMD", "python", "scripts/container_healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    security_opt:
      - no-new-privileges:true

  # Запускается отдельно: docker compose --profile agent up -d hermes
  # Hermes не получает docker.sock, production .env или каталог приложения.
  # Он клонирует репозиторий в собственный persistent volume и создаёт PR
  # вместо прямой правки запущенного контейнера.
  hermes:
    image: nousresearch/hermes-agent:latest
    container_name: velvet-hermes
    profiles: ["agent"]
    restart: unless-stopped
    init: true
    command: ["gateway", "run"]
    env_file:
      - .env.hermes
    volumes:
      - velvet_hermes_data:/opt/data
    mem_limit: 4g
    cpus: 2.0
    pids_limit: 256
    shm_size: 1gb
    security_opt:
      - no-new-privileges:true

volumes:
  velvet_postgres_data:
  velvet_hermes_data:
